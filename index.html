/* ============================================================
   PROTOCOLE DE CAT : niveaux d'aliments, portions par repas,
   calories par repas (sans objectif de régime), leviers de poids,
   réintroduction progressive après 90 jours
   ============================================================ */
const num = v => parseFloat(String(v == null ? "" : v).replace(",", ".")) || 0;
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const diffDays = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
const fmtDate = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "";

/* ---------- portions par repas (poids cuits) ---------- */
const PORTIONS = { b: { f: [60, 100], fr: [25, 35], p: [40, 60] }, l: { f: [120, 150], fr: [20, 40], p: [80, 100] }, d: { f: [120, 150], fr: [20, 40], p: [80, 100] } };
const RAW_STARCH = ["riz cru", "flocons d'avoine", "avoine", "farine de sarrasin", "flocons de sarrasin"];
const SOLID_PROT = ["tofu ferme", "tofu", "tofu soyeux", "tofu fume", "blanc de poulet", "cuisse de poulet", "poulet", "sardine", "cabillaud", "blanc de dinde"];
const isQty = i => num(i.q) > 0 && unitKind(i.u) === "g";
function starchItems(m){ return (m.ing || []).filter(i => { const e = lookup(i.n); return e && e.a === "Féculents" && isQty(i); }); }
function starchSplit(m){ let c = 0, r = 0; starchItems(m).forEach(i => { const e = lookup(i.n); if (RAW_STARCH.indexOf(e.k) >= 0) r += num(i.q); else c += num(i.q); }); return { c, r }; }
function protItems(m){ return (m.ing || []).filter(i => { const e = lookup(i.n); return e && SOLID_PROT.indexOf(e.k) >= 0 && isQty(i); }); }
/* ---------- protéines du repas : poids des aliments protéinés (bornes du protocole) et réglage ----------
   protFoodG = protéines solides pesées + œufs (50 g pièce) + protéine texturée (3 fois son poids sec).
   Réglable (par pas de 5 g, ou 1 œuf) quand le repas n'a qu'une seule source de protéine, dans les bornes du protocole. */
const TEXT_PROT = ["proteine de pois texturee", "proteine de soja texturee"];
function protFoodG(m){ let g = 0;
  (m.ing || []).forEach(i => { const e = lookup(i.n); if (!e) return; const q = num(i.q); if (!(q > 0)) return;
    if (SOLID_PROT.indexOf(e.k) >= 0 && isQty(i)) g += q;
    else if (e.a === "Œufs" && unitKind(i.u) !== "g") g += q * 50;
    else if (TEXT_PROT.indexOf(e.k) >= 0 && isQty(i)) g += q * 3; });
  return Math.round(g); }
/* protéines RÉELLES du repas (g de protéines, pas le poids des aliments) : quantité x protéines pour 100 g de la base (PROT_DB) */
function ingProt(i){
  const q = num(i.q); if (!(q > 0)) return 0;
  const e = lookup(i.n); if (!e || e.pr == null) return 0;
  switch (unitKind(i.u)) {
    case "g": return e.pr * q / 100;
    case "kg": return e.pr * q * 10;
    case "cl": return e.pr * q / 10;
    case "l": return e.pr * q * 10;
    case "c": return e.pc != null ? e.pc * q : e.pr * q * 5 / 100;
    case "s": return e.pc != null ? e.pc * 3 * q : e.pr * q * 15 / 100;
    case "p": return e.pp != null ? e.pp * q : 0;
    default: return 0; } }
const protNutri = m => Math.round((m.ing || []).reduce((s, i) => s + ingProt(i), 0));
function protSlot(o, t){ if (t && t.s) return t.s; return /Petit/.test(o.st || "") ? "b" : (o.cat === "Collation" || o.st === "Collation") ? "c" : "l"; }
function protRange(slot){ return slot === "c" || slot === "b" ? [20, 100] : (PORTIONS[slot] || PORTIONS.l).p; }
function protEdit(o, slot){
  /* les bornes du protocole valent pour le TOTAL du repas : l'élément réglé garde ce qui reste une fois les autres protéines comptées */
  const r = protRange(slot), items = protItems(o), tot = protFoodG(o);
  if (items.length === 1) { const q = num(items[0].q), other = tot - q, lo = Math.max(5, r[0] - other), hi = r[1] - other;
    return hi > lo ? { item: items[0], step: 5, lo, hi, unit: "g" } : null; }
  const eggs = (o.ing || []).filter(i => { const e = lookup(i.n); return e && e.a === "Œufs" && unitKind(i.u) !== "g" && num(i.q) > 0; });
  if (!items.length && eggs.length === 1) { const lo = Math.max(1, Math.ceil(r[0] / 50)), hi = Math.floor(r[1] / 50); return hi > lo ? { item: eggs[0], step: 1, lo, hi, unit: "œuf" } : null; }
  return null; }
const starchKcal = m => starchItems(m).reduce((s, i) => s + ingKcal(i), 0);
const ingTotal = m => (m.ing || []).reduce((s, i) => s + ingKcal(i), 0);
function scaleStarch(m, f){
  starchItems(m).forEach(i => { i.q = Math.max(5, Math.round(num(i.q) * f / 5) * 5); });
  m.adj = Math.round((m.adj || 1) * f * 100) / 100;
}
const kT = k => S.kcalT && num(S.kcalT[k]) > 0 ? Math.round(num(S.kcalT[k])) : null;
const lvlF = m => (m.lf || 0);   /* grammes de féculents ajoutés par le levier 1 (jamais plus de 30 g) */

/* met un repas aux portions du protocole, puis le rapproche de sa cible de calories si elle existe.
   Les protéines ne descendent jamais sous le minimum du repas. */
function protoAdaptMeal(m, k, target){
  if (!m || !m.ing || k === "c") return false; const R = PORTIONS[k] || PORTIONS.l;   /* collation : portions de la recette, jamais adaptées */ let changed = false;
  const sp = starchSplit(m), raw = sp.c === 0 && sp.r > 0, cur = raw ? sp.r : sp.c;
  if (cur > 0) {
    const lo = raw ? R.fr[0] : R.f[0], hi = (raw ? R.fr[1] : R.f[1]) + lvlF(m);
    let x = 1;
    if (target) { const sc = starchKcal(m), tot = ingTotal(m); if (sc > 0) x = (target - (tot - sc)) / sc; }
    let want = Math.max(lo, Math.min(hi, cur * x)); if (!target) want = Math.max(lo, Math.min(hi, cur));
    const f = want / cur; if (Math.abs(f - 1) > .02) { scaleStarch(m, f); changed = true; }
  }
  protItems(m).forEach(i => { const q = num(i.q), tot = protFoodG(m), other = tot - q, lo = Math.max(5, R.p[0] - other), hi = R.p[1] - other;
    if (protItems(m).length === 1 && (q < lo || q > hi) && hi >= lo) { i.q = Math.max(lo, Math.min(hi, q)); changed = true; } });
  return changed;
}
function adaptDay(day, force){
  let n = 0; SLOTS.forEach(sl => { const m = day.meals[sl.k]; if (m && protoAdaptMeal(m, sl.k, kT(sl.k))) n++; }); return n > 0;
}
function slotTarget(t){ return kT(t.s); }
const adaptHint = d => SLOTS.some(sl => { const m = d.meals[sl.k]; if (!m) return false; const c = clone(m); return protoAdaptMeal(c, sl.k, kT(sl.k)); });
function kcalBar(d){
  const k = dayKcal(d); if (!k) return "";
  const ts = SLOTS.filter(sl => sl.k !== "c").map(sl => kT(sl.k)); const all = ts.every(x => x);
  const tg = all ? ts.reduce((a, b) => a + b, 0) : 0, kMain = k - (d.meals.c ? kcalOf(d.meals.c) : 0);
  const diff = kMain - tg, cls = !all ? "" : Math.abs(diff) <= tg * .08 ? "ok" : diff > 0 ? "hi" : "lo";
  return `<div class="kbar ${cls}"><div class="kb-top"><span class="kb-v">≈ ${fmtK(k)} kcal par jour</span>${all ? `<span class="kb-t">cible ${fmtK(tg)}</span>` : ""}</div>${all ? `<span class="kb-d">${Math.abs(diff) <= tg * .08 ? "dans la cible" : (diff > 0 ? "+" : "−") + Math.abs(diff) + " kcal"}</span>` : ""}</div>`;
}
const dayTarget = () => SLOTS.reduce((s, sl) => s + (kT(sl.k) || 0), 0);

/* ---------- contrôle du protocole ---------- */
const L3_RE = /\b(ail|oignons?|echalotes?|poivre|piment|vinaigre|citron|moutarde|pois chiches?|lentilles?|haricots? (?:blancs?|rouges?|secs?)|falafels?|fritur\w*|fruits? a coque brut)\b/;
const RAW_RE = /\b(salade|concombre|radis|crudites?|tomates?|carottes? rapees?)\b/;
function reintOK(key){ const f = S.reint && S.reint.foods && S.reint.foods[key]; return !!f && (f.st === "ok" || f.st === "test"); }
function protoCheck(o){
  const bad = [], warn = [];
  (o.ing || []).forEach(i => {
    const nm = String(i.n || "").trim(); if (!nm) return; const n = norm(nm), q = num(i.q), e = lookup(nm);
    if (L3_RE.test(n)) { bad.push({ n: nm, why: "exclu par le protocole (niveau 3)" }); return; }
    if (RAW_RE.test(n)) { warn.push({ n: nm, why: "cru : à éviter, cuire doucement" }); return; }
    if (!e) return;
    if (e.n === "r") warn.push({ n: nm, why: "non listé dans le protocole : à réintroduire" });
    else if ((e.n === "p2" || e.n === "p3") && !reintOK(e.k)) warn.push({ n: nm, why: "palier de réintroduction : pas encore débloqué" });
    if (e.k === "avocat" && q > 30) warn.push({ n: nm, why: "1/8 d'avocat maximum par repas (30 g)" });
    if (e.k === "sardine") { if (S.sensible) warn.push({ n: nm, why: "phase de sensibilité aiguë : sardines à éviter" }); else warn.push({ n: nm, why: "occasionnelle, de préférence le midi" , soft: true }); }
    if (e.k === "haricots verts" && q > 75) warn.push({ n: nm, why: "75 g maximum cuits (seuil low-FODMAP)" });
    if (e.k === "courgette" && q > 60) warn.push({ n: nm, why: "60 g maximum épluchée (seuil low-FODMAP)" });
    if (e.w && /FODMAP/.test(e.w) && q > 75 && e.k !== "haricots verts" && e.k !== "courgette") warn.push({ n: nm, why: e.w });
  });
  return { bad, warn: warn.filter(w => !w.soft || !S.hideSoft), ok: !bad.length && !warn.some(w => !w.soft) };
}
function protoBanner(o){
  const c = protoCheck(o); if (c.ok && !c.warn.length) return "";
  const li = a => a.map(x => `<li><strong>${esc(x.n)}</strong> : ${esc(x.why)}</li>`).join("");
  return `<div class="pc ${c.bad.length ? "bad" : "warn"}"><p class="pc-h">${ic(c.bad.length ? "x" : "gauge")} ${c.bad.length ? "Ne respecte pas le protocole de Cat" : "À surveiller avec le protocole"}</p><ul>${li(c.bad)}${li(c.warn)}</ul></div>`;
}
function protoDot(m){ const c = protoCheck(m); return c.bad.length ? `<span class="mb bad">hors protocole</span>` : c.warn.some(w => !w.soft) ? `<span class="mb warn">à vérifier</span>` : ""; }

/* ---------- leviers de poids (jamais de légumes en plus) ---------- */
function lever1(m){
  if (!m || (m.lf || 0) >= 30) return false; const add = Math.min(20, 30 - (m.lf || 0)), items = starchItems(m); if (!items.length) return false;
  const main = items.slice().sort((a, b) => num(b.q) - num(a.q))[0]; main.q = num(main.q) + add; m.lf = (m.lf || 0) + add; return true;
}
function lever2(m){
  if (!m || (m.lo || 0) >= .5) return false; const oil = (m.ing || []).find(i => /^huile/.test(norm(i.n)) && unitKind(i.u) === "c");
  if (!oil) return false; oil.q = num(oil.q) + .5; m.lo = (m.lo || 0) + .5; return true;
}
function defineLevers(){
  const run = (title, fn) => { const w = curWeek(); if (!w) return; snapshot(); const b = weekSnap(w); let n = 0;
    w.days.forEach(d => SLOTS.forEach(sl => { if (fn(d.meals[sl.k])) n++; })); save();
    if (n) { render(); reportWeek(title, w, b); } else toast("Rien à ajouter : le plafond du levier est déjà atteint pour tous les repas"); };
  A.lever1 = () => ask("Poids en baisse : ajouter 20 g de féculents cuits à chaque repas de la semaine affichée ? (30 g maximum au total par repas, les légumes ne changent pas)", "Ajouter 20 g", () => run("Levier 1 : +20 g de féculents par repas", lever1));
  A.lever2 = () => ask("Poids en baisse : ajouter une demi-cuillère à café d'huile d'olive crue à chaque repas de la semaine affichée ? (0,5 c. à café maximum au total par repas)", "Ajouter l'huile", () => run("Levier 2 : +0,5 c. à café d'huile à cru par repas", lever2));
}
function leversCard(){
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date)); let tip = "";
  if (ws.length >= 2) { const d = ws[ws.length - 1].kg - ws[ws.length - 2].kg; tip = d < -0.2 ? `<p class="pc warn-s">Ta dernière pesée est en baisse (${fmtN(d)} kg) : tu peux appliquer les leviers ci-dessous, dans l'ordre.</p>` : ""; }
  return `<section class="lev"><h2 class="group-title">Si le poids baisse</h2>
    <p class="muted">Ne jamais réduire les protéines (200 g de tofu ou de poulet par jour au minimum) et ne jamais augmenter les légumes. Les leviers s'appliquent à la semaine affichée dans le planning et se défont avec « Annuler ».</p>${tip}
    <div class="wa-grid"><button class="wa" data-act="lever1">${ic("plus")}<span><strong>Levier 1 : féculents</strong><em>+20 g cuits à chaque repas (30 g maximum)</em></span></button>
    <button class="wa" data-act="lever2">${ic("plus")}<span><strong>Levier 2 : huile à cru</strong><em>+0,5 c. à café d'huile d'olive par repas</em></span></button></div></section>`;
}

/* ---------- réintroduction progressive ---------- */
const REINT_FOODS = [
  { key: "peche", palier: 2, n: "Compote de pêche ou nectarine maison", ing: "peche", normal: 100, u: "g", note: "fruits épluchés, cuits à la vapeur" },
  { key: "graines de chia", palier: 3, n: "Graines de chia moulues", ing: "graines de chia moulues", normal: 10, u: "g", note: "moulues finement, bien hydratées" }
];
const REINT_P1 = ["Aubergine pelée", "Courge butternut", "Têtes de brocoli vapeur", "Pâtisson"];
const reint = () => (S.reint = S.reint || { start: null, foods: {}, current: null });
const reintDay = () => { const r = reint(); return r.start ? diffDays(r.start, todayISO()) + 1 : 0; };
const reintOpen = () => reintDay() > 90;
function foodPortion(f, day){ const q = day === 1 ? Math.max(1, Math.round(f.normal / 4)) : Math.round(f.normal / 2); return q; }
function viewReint(){
  const r = reint(), day = reintDay(), cur = r.current && r.foods[r.current], head = `<header class="pagehead"><div><h1 class="display">Réintroduction</h1><p class="muted">Après 90 jours de protocole, on réintroduit un seul nouvel aliment tous les 3 jours, avec un journal des symptômes.</p></div></header>`;
  if (!r.start) return head + `<section class="ri-card"><h2 class="display-s">Les 90 jours n'ont pas commencé</h2>
      <p>Le compteur démarre quand tu lances le protocole. Pendant 90 jours, on reste sur la base sûre : aucun aliment à tester. L'algorithme de réintroduction se débloque ensuite tout seul.</p>
      <div class="ri-row"><label class="field"><span>Premier jour du protocole</span><input type="date" id="riStart" value="${todayISO()}"></label><button class="btn primary" data-act="riStart">Démarrer les 90 jours</button></div></section>${riCatalog(false)}`;

}
A.swapMeal = ds => {
  const t = T(ds), old = getMeal(t); if (!old) return;
  const nm = swapCandidate(t); if (!nm) return toast("Pas d'autre idée qui respecte tes règles pour ce repas");
  snapshot(); nm.id = old.id; setMeal(t, nm);
  if (S.autoVeg !== false && t.s !== "b" && t.s !== "c") autoSide(nm);
  if (S.autoAdapt !== false) protoAdaptMeal(nm, t.s, kT(t.s));
  save(); render(); toast("Remplacé par « " + nm.name + " »", true);
};


/* ---------- sauvegarde sur le compte (version 14) ----------
   Seulement quand la page est ouverte comme artefact Claude (window.claude) : sinon rien ne change.
   - Chaque enregistrement local est recopié sur le compte (capacité « db », découpé en morceaux), après 1,5 s de calme.
   - Au premier lancement (navigateur vide) : les données du compte sont restaurées ; sinon un message explique comment importer l'ancienne sauvegarde.
   - Jamais de donnée locale écrasée par une version plus ancienne du compte (comparaison de S.savedAt) ;
     avant de remplacer des données locales par une version plus récente du compte, une copie reste dans le navigateur.
   - La sauvegarde par fichier (Réglages) reste disponible. */
const SYNC = { booting: true, started: false, edited: false, col: null, timer: null, busy: false, again: false, n: 0 };
const SYNC_FRESH = (() => { try { return !localStorage.getItem(LS_KEY); } catch (e) { return true; } })();
const SYNC_CHUNK = 70000;
function syncMark(txt, bad){
  let el = document.getElementById("syncMark");
  if (!el) { el = document.createElement("span"); el.id = "syncMark"; el.className = "sync-mark"; (document.querySelector(".top-in") || document.body).appendChild(el); }
  el.textContent = txt; el.dataset.bad = bad ? "1" : "";
}
function syncCut(str, from){ let to = Math.min(str.length, from + SYNC_CHUNK); if (to < str.length) { const c = str.charCodeAt(to - 1); if (c >= 0xD800 && c <= 0xDBFF) to--; } return to; }
async function syncPush(){
  if (!SYNC.col) return;
  if (SYNC.busy) { SYNC.again = true; return; }
  SYNC.busy = true; syncMark("Enregistrement…");
  try {
    const str = JSON.stringify(S), at = S.savedAt || Date.now(); let from = 0, n = 0;
    while (from < str.length || n === 0) { const to = syncCut(str, from); await SYNC.col.doc("table-" + n).set({ s: str.slice(from, to) }); from = to; n++; if (to >= str.length) break; }
    await SYNC.col.doc("table-meta").set({ savedAt: at, n, v: S.v });
    for (let i = n; i < SYNC.n; i++) { try { await SYNC.col.doc("table-" + i).delete(); } catch (e) {} }
    SYNC.n = n; syncMark("Enregistré sur ton compte");
  } catch (e) { syncMark("Sauvegarde du compte impossible", true); }
  SYNC.busy = false; if (SYNC.again) { SYNC.again = false; syncPush(); }
}
const _syncSave0 = save;
save = function(){
  if (SYNC.booting) { if (SYNC.started) SYNC.edited = true; _syncSave0(); return; }      /* pendant la vérification du compte : on n'écrit rien dessus */
  S.savedAt = Date.now(); _syncSave0();
  if (SYNC.col) { clearTimeout(SYNC.timer); SYNC.timer = setTimeout(syncPush, 1500); }
};
const _syncImport = importText;
importText = function(txt){ _syncImport(txt); if (MODAL && MODAL.kind === "welcome") closeModal(); };
function syncWelcome(){
  MODAL = { kind: "welcome" };
  openModal(`<p class="eyebrow">Bienvenue</p><h2 class="display-s">Retrouver tes données</h2>
    <p class="muted">Si tu utilisais déjà La Table de Cat sur l'ancien lien, tes repas, tes recettes et tes pesées peuvent être repris ici.</p>
    <ol class="welcome-steps"><li>Ouvre l'ancien lien, puis touche <b>Réglages</b> et <b>Exporter</b> (ou <b>Copier le texte</b>).</li>
    <li>Reviens ici, touche <b>Réglages</b> puis <b>Importer</b>, ou utilise les boutons ci-dessous.</li></ol>
    <p class="muted small">Ensuite, tout est gardé automatiquement sur ton compte : tu retrouveras ton planning à chaque ouverture.</p>
    <div class="sheet-foot"><button class="btn ghost" data-act="close">Commencer à zéro</button><button class="btn" data-act="importPaste">Coller le texte</button>
    <label class="btn primary file push">Choisir le fichier<input type="file" accept="application/json,.json" data-bind="importFile" hidden></label></div>`);
}
async function syncInit(){
  if (!window.claude || !window.claude.use) { SYNC.booting = false; return; }
  let welcome = false;
  try {
    const db = await claude.use("db"), user = await claude.use("user"); if (!db || !user) throw 0;
    const id = await user.id(); if (!id) throw 0;
    SYNC.col = db.collection("data/users/" + id);
    const meta = await SYNC.col.doc("table-meta").get(), local = S.savedAt || 0;
    if (meta.exists) {
      const m = meta.data(); SYNC.n = m.n || 0;
      const mayRestore = m.savedAt > local && (local > 0 || SYNC_FRESH);
      if (mayRestore) {
        const parts = [];
        for (let i = 0; i < m.n; i++) { const d = await SYNC.col.doc("table-" + i).get(); if (!d.exists) throw 0; parts.push(d.data().s); }
        const d2 = JSON.parse(parts.join(""));
        if (d2 && d2.weeks && d2.recipes) {
          try { localStorage.setItem(LS_KEY + "-avant-restauration", JSON.stringify(S)); } catch (e) {}
          S = d2; S.savedAt = m.savedAt; ensureDefaults(); migrateAll(); applyFont(); _syncSave0(); render(); resumeOpen(); toast("Tes données ont été retrouvées sur ton compte");
        }
      } else if (m.savedAt < local) { SYNC.booting = false; await syncPush(); }
    } else if (SYNC_FRESH && !SYNC.edited && !(S.ui && S.ui.welcomed)) welcome = true;
    else if (local > 0 || SYNC.edited) { SYNC.booting = false; S.savedAt = Date.now(); _syncSave0(); await syncPush(); }
    SYNC.booting = false; syncMark("Enregistré sur ton compte");
  } catch (e) { SYNC.booting = false; syncMark("Sauvegarde du compte indisponible", true); }
  if (welcome) { S.ui.welcomed = true; _syncSave0(); syncWelcome(); }
}
setTimeout(() => { SYNC.started = true; }, 0);
setTimeout(syncInit, 60);


/* ---------- questions à Claude sur chaque étape de la fiche de cuisine (version 14) ----------
   Un bouton « Question » sous chaque étape ouvre un encart (questions rapides + champ libre), la réponse s'affiche sur place.
   Capacité « sample » des artefacts Claude : les boutons n'apparaissent que si Claude est joignable (sinon rien, aucune erreur).
   Texte envoyé : voir askPrompt (protocole de Cat, règles du Bamboo tirées de docs/bamboo.md pour tout ce qui touche au rice cooker). */

/* quantités dites en français : « 3 œufs », « 1 c. à café de mirin » */
function plNom(n, q){
  const m = String(n).match(/^(.+?)( (?:de|d'|du|à|au) .+)$/), head = m ? m[1] : String(n), tail = m ? m[2] : "";
  return (q > 1 && !/[sxz]$/i.test(head) ? head + "s" : head) + tail;
}
function qPhrase(n, ings){
  const k = norm(n), i = ings.filter(x => norm(x.n) === k)[0] || ings.filter(x => norm(x.n).indexOf(k) >= 0)[0]; if (!i) return "";
  const q = parseFloat(String(i.q).replace(",", "."));
  if (norm(i.u) === "piece" && q > 0) return String(i.q).replace(".", ",") + " " + plNom(i.n, q);
  return qtyStr(i);
}
function renderQ(txt, ings){
  return String(txt).replace(/\s*\(\{\{([^}]+)\}\}\)/g, (m, n) => { const q = qPhrase(n, ings); return q ? " (" + q + ")" : ""; })
    .replace(/\{\{([^}]+)\}\}/g, (m, n) => qPhrase(n, ings));
}
function qtyChip(i){
  const q = parseFloat(String(i.q).replace(",", "."));
  return norm(i.u) === "piece" && q > 0 ? `<b>${esc(String(i.q).replace(".", ","))}</b> ${esc(plNom(i.n, q))}` : `<b>${esc(qtyStr(i))}</b> ${esc(i.n)}`;
}

const ASK_PRESETS = ["Comment savoir si c'est cuit ?", "Explique le geste pas à pas", "Quelle erreur éviter ?", "Puis-je le faire à l'avance ?"];
const ASK_RULES = "N'utilise jamais : légumineuses (pois chiches, lentilles, haricots secs, falafels), ail, oignon, échalote, poivre, piment, vinaigre, citron, moutarde, tomate crue, fibres crues, fritures, cuissons à haute température (ni rissolage ni dorure forte). Les légumes sont toujours cuits, pelés, épépinés. Les plats sont servis tièdes. Huile d'olive ou de sésame grillé ajoutée à cru, au service.";
const ASK_BAMBOO = "Règles du rice cooker Yum Asia Bamboo : vapeur (STEAM) avec de l'eau chaude jusqu'au repère « 2-3 » de la cuve (au moins 360 ml), durée réglable jusqu'à 1 h par paliers de 5 ou 10 minutes ; ne jamais ouvrir le couvercle pendant un cycle (on enchaîne deux cycles au besoin) ; aliments de 3,5 cm d'épaisseur au plus ; papier sulfurisé percé sous les légumes, rien sous les viandes ; jamais de lait pour cuire l'avoine (cuire à l'eau, ajouter le lait chaud après) ; œufs à la casserole, pas dans le Bamboo ; pas de vinaigre ni de papier absorbant dans la cuve ; SLOW COOK de 2 à 8 heures seulement.";
const askCookerTopic = txt => /rice cooker|bamboo|cuiseur|vapeur|steam|slow cook|cuve|panier|programme|minuteur|couvercle/i.test(txt);
function askStepText(o, i){ return renderQ((o.steps || [])[i] || "", o.ing || []).replace(/\s*\[\[[^\]]*\]\]/g, "").replace(/\s*\[[^\]]*\]\s*$/, "").trim(); }
function askPrompt(o, title, stepTxt, q){
  const ings = (o.ing || []).filter(x => String(x.n).trim()).map(x => (hasQ(x) ? qtyStr(x) + " " : "") + x.n).join(", ");
  const cooker = askCookerTopic(stepTxt + " " + q);
  return "Tu aides Cat à cuisiner, pendant qu'elle est devant ses fourneaux.\nRecette : " + (o.n || o.name) + ".\nIngrédients : " + ings + ".\nÉtape en cours « " + title + " » : " + stepTxt +
    "\nQuestion de Cat : " + q + "\n\n" + ASK_RULES +
    (cooker ? "\n\n" + ASK_BAMBOO + "\nVoici le mode d'emploi complet de l'appareil :\n" + BAMBOO_DOC + "\nNe jamais inventer un réglage, un temps ou une quantité d'eau absents de ces règles ; en cas de doute, dis-le." : "") +
    "\n\nRéponds en français simple, sans jargon, en 4 à 7 phrases courtes et concrètes (gestes, temps, repères de couleur ou de texture). Pas de liste à puces, pas de titre, pas de mise en forme. Reste cohérent avec la recette.";
}
const ASK_EXCL = /\b(ail|oignons?|échalotes?|poivre|piment|vinaigre|citron|moutarde|pois chiches?|lentilles?|haricots secs|falafels?|friture|frire|tomates? crues?)\b/gi;
const ASK_NEG = /(sans|pas|jamais|éviter|evite|exclu|exclus|interdit|interdits|ni|aucun|aucune)[^.]{0,40}$/i;
function askGuard(txt){
  let bad = false; String(txt).replace(ASK_EXCL, (m, g, off) => { if (!ASK_NEG.test(String(txt).slice(Math.max(0, off - 45), off))) bad = true; return m; });
  return bad ? "\n\nAttention : cette réponse cite un aliment que ton protocole exclut. Ne l'ajoute pas à ton plat." : "";
}
const askStepBtn = () => `<button class="ask-btn" data-act="askStep" hidden>${ic("sparkle")} Question</button><div class="ask" hidden></div>`;
let ASK_SAMPLE = null;
const askSample = () => ASK_SAMPLE || (ASK_SAMPLE = (async () => { try { return window.claude && window.claude.use ? (await window.claude.use("sample")) || null : null; } catch (e) { return null; } })());
const askShow = on => document.querySelectorAll(".ask-btn").forEach(b => { b.hidden = !on; if (!on) { const bx = b.nextElementSibling; if (bx) bx.hidden = true; } });
(function(){
  const _oc = openCook;
  openCook = function(kind, ref){ _oc(kind, ref); askSample().then(s => { if (s) askShow(true); }); };
})();
A.askStep = (ds, el) => {
  const box = el.closest(".cs-body").querySelector(".ask");
  if (!box.hidden) { box.hidden = true; return; }
  box.hidden = false;
  if (!box.dataset.ready) {
    box.dataset.ready = "1";
    box.innerHTML = `<div class="ask-chips">${ASK_PRESETS.map(q => `<button class="chip" data-act="askGo" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
      <div class="ask-row"><input class="ask-in" type="text" placeholder="Ta question, ex. comment pocher un œuf ?" aria-label="Ta question à Claude"><button class="btn primary" data-act="askGo">Demander</button></div>
      <div class="ask-out" aria-live="polite"></div>`;
  }
  box.querySelector(".ask-in").focus();
};
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList && e.target.classList.contains("ask-in")) { e.preventDefault(); const b = e.target.closest(".ask").querySelector('.btn[data-act="askGo"]'); if (b) b.click(); } });
A.askGo = async (ds, el) => {
  const box = el.closest(".ask"), li = el.closest(".cstep"), inp = box.querySelector(".ask-in"), out = box.querySelector(".ask-out");
  const q = (ds.q || inp.value || "").trim(); if (!q) { inp.focus(); return; }
  inp.value = q; box._a = "";
  const o = edObj(); if (!o) return;
  const i = +li.querySelector(".chk").dataset.i, title = li.querySelector("h4").textContent, stepTxt = askStepText(o, i);
  const sample = await askSample(); if (!sample) { askShow(false); return; }
  out.textContent = "Claude réfléchit…"; box.querySelectorAll(".ask-save").forEach(b => b.remove());
  try {
    const r = await sample(askPrompt(o, title, stepTxt, q), { cache: false, modelTier: "quick", onText: ({ text }) => { out.textContent = text; } });
    const txt = ((r && r.text) || out.textContent || "").trim(); if (!txt || txt === "Claude réfléchit…") throw 0;
    box._a = txt + askGuard(txt); out.textContent = box._a;
    const b = document.createElement("button"); b.className = "btn ask-save"; b.dataset.act = "askSave"; b.textContent = "Ajouter à l'astuce du chef"; out.after(b);
  } catch (e) {
    out.textContent = e && e.code === "not_granted" ? "Autorisation refusée : tu peux réessayer et accepter la demande."
      : e && e.code === "rate_limited" ? "Trop de questions d'affilée, patiente quelques secondes." : "Claude n'a pas pu répondre pour l'instant. Réessaie dans un instant.";
  }
};
A.askSave = (ds, el) => {
  const box = el.closest(".ask"), li = el.closest(".cstep"), o = edObj(); if (!o || !box._a) return;
  const persist = MODAL.kind !== "temp"; if (persist) snapshot();
  o.tip = (o.tip ? o.tip + "\n\n" : "") + "À propos de « " + li.querySelector("h4").textContent + " » : " + box._a.replace(/\s+/g, " ").trim();
  if (persist) save(); refreshCook(null); toast(persist ? "Ajouté à l'astuce du chef" : "Ajouté à l'astuce (idée non enregistrée)", persist);
};

function viewInsp(){
  const mode = (S.ui && S.ui.insp) || "compose";
  const seg = `<div class="seg ins-mode" role="tablist">${[["compose","Composer"],["fridge","Avec mon frigo"]].map(([v, l]) => `<button class="seg-b" data-act="inspMode" data-v="${v}" aria-pressed="${mode === v}">${l}</button>`).join("")}</div>`;
  const sl = INSP.scope === "meal" ? `<div class="frow"><span class="flabel">Pour quel repas</span><div class="chips">${SLOTS.map(x => `<button class="chip" data-act="inspSlot" data-v="${x.k}" aria-pressed="${(INSP.to.s || "l") === x.k}">${x.label}</button>`).join("")}</div></div>` : "";
  return seg + (mode === "fridge" ? viewFridge() : sl + viewInspCompose());
}
A.inspSlot = ds => { INSP.to.s = ds.v; INSP.result = null; render(); };

/* ---------- démarrage ---------- */
load(); render(); resumeOpen();
