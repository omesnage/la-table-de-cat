});
const T = ds => ({ w: ds.w != null ? +ds.w : S.ui.week, d: +ds.d, s: ds.s });

A.undo = () => undo();
A.close = () => closeModal();
A.week = ds => { S.ui.week = +ds.i; save(); render(); };
A.goShop = () => { SHOP.w = S.ui.week; SHOP.days = null; S.ui.view = "shop"; render(); window.scrollTo(0, 0); };

/* repas */
A.openMeal = ds => openEditor("meal", T(ds));
A.createMeal = ds => {
  const t = T(ds), sl = SLOTS.find(s => s.k === t.s);
  MODAL = { kind: "create", t };
  openModal(`<p class="eyebrow">${esc(S.weeks[t.w].name)}, ${esc(S.weeks[t.w].days[t.d].name)}</p>
    <h2 class="display-s">${sl.create}</h2>
    <div class="choice-list">
      <button class="choice" data-act="pickRecipe" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Choisir dans le carnet</strong><span>Une des ${S.recipes.length} recettes déjà écrites.</span></button>
      <button class="choice" data-act="proposeMeal" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Me proposer des idées</strong><span>Six suggestions, renouvelables à volonté.</span></button>
      <button class="choice" data-act="freeMeal" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Créer un repas libre</strong><span>Nom, ingrédients, quantités et préparation à saisir.</span></button>
    </div>`);
};
A.freeMeal = ds => {
  const t = T(ds); snapshot();
  setMeal(t, { id: uid(), name: "", recipeId: null, cat: "", st: "", base: "", ing: [{ id: uid(), n: "", q: "", u: "g" }], steps: [], tip: "" });
  save(); openEditor("meal", t);
};
A.clearMeal = () => { const t = MODAL.t; snapshot(); setMeal(t, null); save(); closeModal(); toast("Repas retiré", true); };
A.resetMeal = () => { const t = MODAL.t, m = getMeal(t), r = recipeById(m.recipeId); snapshot(); const nm = mealFromRecipe(r); nm.id = m.id; setMeal(t, nm); save(); openEditor("meal", t); toast("Recette d'origine rétablie", true); };
A.mealToBook = () => {
  const m = getMeal(MODAL.t);
  const r = { id: "r-" + uid(), n: m.name || "Recette sans nom", cat: CATS.includes(m.cat) ? m.cat : (m.cat || "Tofu"), st: m.st || "Cocon & purées",
    base: m.base || "Aucun", t: m.t || "", d: m.d || 1, ing: m.ing.map(i => ({ id: uid(), n: i.n, q: i.q, u: i.u })), steps: [...m.steps], tip: m.tip || "", own: true };
  S.recipes.unshift(r); m.recipeId = r.id; save(); toast("Ajouté au carnet : " + r.n);
};
A.genVeg = () => { if (MODAL.kind === "temp") { TEMP = mealFromGen(swapGen(TEMP, "v")); openEditorEdit("temp", TEMP); return; } const t = MODAL.t, m = getMeal(t); snapshot(); const nm = mealFromGen(swapGen(m, "v")); nm.id = m.id; setMeal(t, nm); save(); openEditorEdit("meal", t); };

/* ingrédients */
A.ingAdd = () => { const o = edObj(); o.ing.push({ id: uid(), n: "", q: "", u: "g" }); if (MODAL.kind !== "draft") save(); refreshIng(true); };
A.ingDel = ds => { const o = edObj(); o.ing.splice(+ds.i, 1); if (MODAL.kind !== "draft") save(); refreshIng(); };
A.ingUp = ds => { const o = edObj(), i = +ds.i; if (i > 0) { [o.ing[i-1], o.ing[i]] = [o.ing[i], o.ing[i-1]]; if (MODAL.kind !== "draft") save(); refreshIng(); } };
A.ingDown = ds => { const o = edObj(), i = +ds.i; if (i < o.ing.length - 1) { [o.ing[i+1], o.ing[i]] = [o.ing[i], o.ing[i+1]]; if (MODAL.kind !== "draft") save(); refreshIng(); } };

/* jours et semaines */
A.newDay = () => { const w = curWeek(); snapshot(); w.days.push(emptyDay(DAY_NAMES[w.days.length % 7])); save(); render(); toast("Jour ajouté", true);
  const days = document.querySelectorAll(".day"); days[days.length - 1].scrollIntoView({ behavior: "smooth", block: "center" }); };
A.delDay = ds => { const w = curWeek(); snapshot(); w.days.splice(+ds.d, 1); save(); render(); toast("Jour supprimé", true); };
A.delWeek = () => { const w = curWeek(); ask(`Supprimer « ${w.name} » et ses ${w.days.length} jours ?`, "Supprimer", () => { snapshot(); S.weeks.splice(S.ui.week, 1); S.ui.week = Math.max(0, S.ui.week - 1); save(); render(); toast("Semaine supprimée", true); }); };
A.newWeek = () => {
  MODAL = { kind: "newWeek" };
  openModal(`<h2 class="display-s">Créer une nouvelle semaine</h2><p class="muted">7 jours, chacun avec un petit-déjeuner, un déjeuner et un dîner.</p>
    <div class="choice-list">
      <button class="choice" data-act="mkWeek" data-mode="auto"><strong>Semaine proposée</strong><span>Menus variés composés automatiquement, modifiables ensuite.</span></button>
      <button class="choice" data-act="mkWeek" data-mode="blank"><strong>Semaine vierge</strong><span>7 jours vides, à remplir depuis le carnet ou les idées.</span></button>
    </div>`);
};
A.mkWeek = ds => {
  snapshot(); const n = "Semaine " + (S.weeks.length + 1); let w;
  if (ds.mode === "auto") { w = { id: uid(), name: n, days: proposeWeek({}).map((p, i) => ({ id: uid(), name: DAY_NAMES[i], meals: p })) }; }
  else { w = { id: uid(), name: n, days: DAY_NAMES.map(dn => emptyDay(dn)) }; }
  S.weeks.push(w); S.ui.week = S.weeks.length - 1; S.ui.view = "plan"; save(); closeModal(); toast(n + " créée", true);
};
A.proposeDay = ds => { const w = curWeek(), d = w.days[+ds.d]; snapshot(); const p = proposeDay({}, weekUsed(w, +ds.d)); d.meals.l = p.l; d.meals.d = p.d; save(); render(); toast(`${d.name} : nouveaux déjeuner et dîner`, true); };
A.proposeWeek = () => { const w = curWeek(); snapshot(); const ps = proposeWeek({});
  w.days.forEach((d, i) => { const p = ps[i % 7]; d.meals.l = p.l; d.meals.d = p.d; });
  save(); render(); toast("Nouveaux menus pour " + w.name, true); };

/* carnet → planning */
let PICK = { t: null, q: "", cat: "" };
A.pickRecipe = ds => {
  const t = T(ds); PICK = { t, q: "", cat: "" }; MODAL = { kind: "pick", t };
  openModal(`<p class="eyebrow">${esc(S.weeks[t.w].name)}, ${esc(S.weeks[t.w].days[t.d].name)}, ${slotLabel(t.s).toLowerCase()}</p>
    <h2 class="display-s">Choisir dans le carnet</h2>
    <input class="search" data-bind="pickSearch" placeholder="Rechercher une recette ou un ingrédient" aria-label="Rechercher">
    <div class="chips" id="pickChips"></div><ul class="pick-list" id="pickList"></ul>`, { wide: true, focus: ".search" });
  renderPickList();
};
A.pickCat = ds => { PICK.cat = ds.v; renderPickList(); };
function recipeMatches(r, q){ if (!q) return true; const n = norm(q); return norm(r.n).includes(n) || r.ing.some(i => norm(i.n).includes(n)) || norm(r.st).includes(n); }
function renderPickList(){
  const cats = ["", ...CATS];
  $("#pickChips").innerHTML = cats.map(c => `<button class="chip" ${catSt(c)} data-act="pickCat" data-v="${esc(c)}" aria-pressed="${PICK.cat === c}">${c ? '<span class="dot"></span>' : ""}${c || "Toutes"}</button>`).join("");
  const list = S.recipes.filter(r => (!PICK.cat || r.cat === PICK.cat) && recipeMatches(r, PICK.q));
  $("#pickList").innerHTML = list.length ? list.map(r => `<li ${catSt(r.cat)}><button class="pick" data-act="choose" data-id="${r.id}">
    <span class="dish-name">${esc(r.n)}</span><span class="dish-meta">${catTag(r.cat)}<span>${esc(r.st)}, ≈ ${fmtK(kcalOf(r))} kcal</span></span></button></li>`).join("")
    : `<li class="muted">Aucune recette ne correspond. Essaie un autre mot ou une autre catégorie.</li>`;
}
A.choose = ds => { const t = PICK.t, r = recipeById(ds.id); snapshot(); setMeal(t, mealFromRecipe(r)); afterSelect(t); };

/* propositions pour un repas */
let PROP = { t: null, items: [], cats: [], bases: [], src: "mix" };
A.proposeMeal = ds => { const t = T(ds); PROP = { t, items: [], cats: [], bases: [], src: "mix" }; MODAL = { kind: "prop", t }; PROP.items = proposeMeals(6, PROP); renderPropModal(); };
function renderPropModal(){
  const t = PROP.t;
  openModal(`<p class="eyebrow">${esc(S.weeks[t.w].name)}, ${esc(S.weeks[t.w].days[t.d].name)}, ${slotLabel(t.s).toLowerCase()}</p>
    <h2 class="display-s">Idées pour ce ${slotLabel(t.s).toLowerCase()}</h2>
    ${filterBar("prop")}
    <div class="prop-grid">${PROP.items.map((m, i) => propCard(m, i, `<button class="btn primary" data-act="propChoose" data-i="${i}">Choisir</button>`)).join("")}</div>
    <div class="sheet-foot"><button class="btn" data-act="propMore">Autres propositions</button><button class="btn ghost push" data-act="close">Fermer</button></div>`, { wide: true });
}
A.propMore = () => { PROP.items = proposeMeals(6, PROP); renderPropModal(); };
A.propChoose = ds => { const t = PROP.t, m = PROP.items[+ds.i]; snapshot(); setMeal(t, copyMeal(m)); afterSelect(t); };
function propCard(m, i, actions){
  const ings = m.ing.filter(x => x.q !== "").slice(0, 5).map(x => x.n).join(", ");
  return `<article class="prop" ${catSt(m.cat)}><p class="prop-tag">${catTag(m.cat)}<span>${m.gen ? "Variation" : "Carnet"}, ${esc(m.st || "")}</span></p>
    <h4 class="dish-name">${esc(m.name)}</h4>${m.sub ? `<p class="dish-sub">${esc(m.sub)}</p>` : ""}
    <p class="muted small">${esc(ings)}…</p><p class="dish-meta">≈ ${fmtK(kcalOf(m))} kcal</p>
    <div class="prop-actions">${actions}</div></article>`;
}
function filterBar(ns){
  const st = ns === "prop" ? PROP : INSP;
  const chip = (group, v) => `<button class="chip" ${group === "cats" ? catSt(v) : ""} data-act="flt" data-ns="${ns}" data-g="${group}" data-v="${esc(v)}" aria-pressed="${st[group].includes(v)}">${group === "cats" ? '<span class="dot"></span>' : ""}${esc(v)}</button>`;
  return `<div class="filters">
    <div class="frow"><span class="flabel">Protéine</span><div class="chips">${CATS.map(c => chip("cats", c)).join("")}</div></div>
    <div class="frow"><span class="flabel">Féculent</span><div class="chips">${BASES.map(c => chip("bases", c)).join("")}</div></div>
    ${ns === "insp" ? `<div class="frow"><span class="flabel">Style</span><div class="chips">${STYLES.map(c => chip("styles", c)).join("")}</div></div>` : ""}
    <div class="frow"><span class="flabel">Source</span><div class="chips">
      ${[["mix","Carnet et variations"],["book","Carnet seulement"],["gen","Variations seulement"]].map(([v, l]) => `<button class="chip" data-act="src" data-ns="${ns}" data-v="${v}" aria-pressed="${st.src === v}">${l}</button>`).join("")}
    </div></div></div>`;
}
A.flt = ds => { const st = ds.ns === "prop" ? PROP : INSP; const arr = st[ds.g]; const i = arr.indexOf(ds.v); i >= 0 ? arr.splice(i, 1) : arr.push(ds.v);
  if (ds.ns === "prop") { PROP.items = proposeMeals(6, PROP); renderPropModal(); } else { INSP.result = null; render(); } };
A.src = ds => { const st = ds.ns === "prop" ? PROP : INSP; st.src = ds.v; if (ds.ns === "prop") { PROP.items = proposeMeals(6, PROP); renderPropModal(); } else { INSP.result = null; render(); } };

/* ---------- moteur de propositions (petit-déjeuner, déjeuner et dîner) ---------- */
function slotOf(f){ return f.slot || (f.t && f.t.s) || (f.to && f.to.s) || "l"; }
const okSens = r => !(S.sensible && (r.ing || []).some(i => /sardine/.test(norm(i.n))));
function catalogFor(f){
  const bk = slotOf(f) === "b";
  return S.recipes.filter(r => CATS.includes(r.cat) && r.st !== "Douceurs" && ((r.st === "Petit-déjeuner") === bk) && okSens(r) &&
    (!f.cats || !f.cats.length || f.cats.includes(r.cat)) && (!f.bases || !f.bases.length || f.bases.includes(r.base)) && (!f.styles || !f.styles.length || f.styles.includes(r.st)));
}
function oneProposal(f, avoid){
  avoid = avoid || new Set();
  const src = f.src || "mix", sl = slotOf(f), bk = sl === "b";
  for (let t = 0; t < 40; t++){
    const useBook = bk || src === "book" || (src === "mix" && Math.random() < 0.4);
    let m = null;
    if (useBook) { const list = catalogFor(f).filter(r => !avoid.has(r.n)); if (list.length) m = mealFromRecipe(pick(list)); else if (bk || src === "book") return null; }
    if (!m) { const g = randomGen({ cats: f.cats, bases: f.bases, styles: f.styles }); if (g) m = mealFromGen(g); }
    if (m && !avoid.has(m.name)) { if (S.autoVeg !== false && !bk) autoSide(m); if (S.autoAdapt !== false) protoAdaptMeal(m, sl, kT(sl)); return m; }
  }
  return null;
}
function proposeMeals(n, f){
  const out = [], seen = new Set();
  for (let i = 0; i < n * 3 && out.length < n; i++){ const m = oneProposal(f, seen); if (m && !seen.has(m.name)) { seen.add(m.name); out.push(m); } }
  return out;
}
function weekUsed(w, skip){ const s = new Set(); w.days.forEach((d, i) => { if (i !== skip) SLOTS.forEach(sl => d.meals[sl.k] && s.add(d.meals[sl.k].name)); }); return s; }
function proposeDay(f, avoid){
  avoid = new Set(avoid || []); const out = {};
  SLOTS.forEach(sl => {
    const bk = sl.k === "b";
    const m = oneProposal({ ...f, slot: sl.k }, avoid) || oneProposal({ src: bk ? "book" : "gen", slot: sl.k }, avoid) || oneProposal({ src: "mix", slot: sl.k }, new Set());
    out[sl.k] = m; if (m) avoid.add(m.name);
  });
  return out;
}
function proposeWeek(f){
  const days = [], avoid = new Set(), count = {};
  const limit = f.cats && f.cats.length ? 99 : 5;
  for (let i = 0; i < 7; i++){
    let best = null;
    for (let t = 0; t < 30; t++){
      const p = proposeDay(f, avoid);
      const ok = [p.l, p.d].every(m => !m || (count[m.cat] || 0) < limit);
      best = p; if (ok) break;
    }
    SLOTS.forEach(sl => { const m = best[sl.k]; if (!m) return; avoid.add(m.name); if (sl.k !== "b") count[m.cat] = (count[m.cat] || 0) + 1; });
    days.push(best);
  }
  return days;
}

function buildShop(){
  const w = S.weeks[SHOP.w], sel = shopDays(), map = new Map();
  w.days.forEach((d, i) => { if (!sel[i]) return; SLOTS.forEach(sl => { const m = d.meals[sl.k]; if (!m) return;
    m.ing.forEach(it => { if (!String(it.n).trim()) return; const e = lookup(it.n);
      const mergeByKey = e && ["Légumes","Volaille","Œufs","Féculents","Tofu & protéines végétales"].includes(e.a);
      const key = mergeByKey ? "k:" + e.k : "n:" + norm(it.n);
      if (!map.has(key)) map.set(key, { key, name: it.n, aisle: e ? e.a : "Divers", parts: {}, names: {} });
      const g = map.get(key); g.names[it.n] = (g.names[it.n] || 0) + 1;
      const q = parseFloat(String(it.q).replace(",", ".")); const uk = unitKind(it.u);
      if (!q || isNaN(q) || uk === "z") { g.parts.z = g.parts.z || { q: 0, u: it.u || "au goût" }; return; }
      const pk = uk === "p" ? "p:" + norm(it.u) : uk;
      g.parts[pk] = g.parts[pk] || { q: 0, u: uk === "c" ? "c. à café" : uk === "s" ? "c. à soupe" : uk === "g" ? (norm(it.u) === "ml" ? "ml" : "g") : it.u };
      g.parts[pk].q += q; }); }); });
  const items = [...map.values()].map(g => { g.name = Object.entries(g.names).sort((a, b) => b[1] - a[1])[0][0];
    const parts = Object.entries(g.parts).filter(([k]) => k !== "z").map(([, p]) => { const q = Math.round(p.q * 10) / 10;
      if (norm(p.u) === "piece" || norm(p.u) === "pieces") return "× " + fmtN(q);
      const pl = q > 1 && ["tranche","feuille","pot","tasse","pincee"].includes(norm(p.u)) ? "s" : ""; return fmtN(q) + " " + p.u + pl; });
    g.qty = parts.length ? parts.join(" + ") : "selon le goût"; return g; });
  (S.shopExtra || []).forEach(x => { const e = lookup(x.n); items.push({ key: "x:" + x.id, id: x.id, extra: true, name: x.n, aisle: e ? e.a : "Divers", qty: qtyStr(x) || "selon le besoin" }); });
  return items;
}

const FR_COMMON = {
  f: ["œufs","blanc de poulet","tofu ferme","carotte","courgette","potimarron","butternut","épinards","haricots verts","aubergine","brocoli","panais","persil","ciboulette","thym","bouillon","lait de riz"],
  g: ["riz basmati","pommes de terre","quinoa","millet","flocons d'avoine","farine de sarrasin","isolat de protéine de pois","okara d'amande","huile d'olive","huile de sésame grillé"]
};
let FR = { min: 0 };
const pantryHas = n => S.pantry.some(p => norm(p.n) === norm(n));
const KEY_GROUPS = [["riz cuit","riz cru","riz basmati","riz"],["oeuf","oeufs"],["quinoa cuit","quinoa"],["millet cuit","millet"],["tofu ferme","tofu"],
  ["isolat de proteine de pois","isolat","proteines de pois","isolat de pois"],["blanc de poulet","poulet"],["huile d'olive","huile"],["flocons d'avoine","avoine"]];
const canonKey = k => { for (let g = 0; g < KEY_GROUPS.length; g++) if (KEY_GROUPS[g].indexOf(k) >= 0) return "g" + g; return k; };
const DB_KEYS = new Set(ING_DB.map(e => e.k));
const hasWord = (hay, nd) => (" " + hay + " ").indexOf(" " + nd + " ") >= 0;
/* deux noms correspondent s'ils désignent le même produit ; un texte libre (« riz ») peut être contenu dans un nom connu (« riz cuit ») */
function keyMatch(a, b){
  if (!a || !b) return false; if (a === b || canonKey(a) === canonKey(b)) return true;
  if (DB_KEYS.has(a) && DB_KEYS.has(b)) return false;
  return (a.length >= 3 && hasWord(b, a)) || (b.length >= 3 && hasWord(a, b));
}
function essentialIng(i){
  const e = lookup(i.n), uk = unitKind(i.u);
  if (e) { if (e.k === "eau" || e.a === "Herbes & aromates") return false; if (e.a === "Épicerie" && (uk === "c" || uk === "s" || uk === "z")) return false; }
  else if (i.q === "" || i.q == null) return false;
  return !/\b(sel|poivre)\b/.test(norm(i.n));
}
function fridgeResults(){
  const keys = S.pantry.map(p => ingKey(p.n)); if (!keys.length) return [];
  return S.recipes.map(r => {
    const ess = r.ing.filter(essentialIng); if (!ess.length) return null;
    const have = [], miss = []; ess.forEach(i => (keys.some(k => keyMatch(k, ingKey(i.n))) ? have : miss).push(i));
    const st = seasonState(r);
    return { r, score: Math.round(have.length / ess.length * 100), have, miss, sea: !!(st && st.all) };
  }).filter(x => x && x.have.length).sort((a, b) => b.score - a.score || a.miss.length - b.miss.length || (b.sea - a.sea));
}

/* ============================================================
   PROTOCOLE DE CAT : niveaux d'aliments, portions par repas,
   calories par repas (sans objectif de régime), leviers de poids,
   réintroduction progressive après 90 jours
   ============================================================ */
const num = v => parseFloat(String(v == null ? "" : v).replace(",", ".")) || 0;
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const diffDays = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
const fmtDate = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "";

/* ---------- portions par repas (poids cuits) ---------- */
const PORTIONS = { b: { f: [80, 100], fr: [25, 35], p: [50, 60] }, l: { f: [120, 150], fr: [20, 40], p: [80, 100] }, d: { f: [120, 150], fr: [20, 40], p: [80, 100] } };
const RAW_STARCH = ["riz cru", "flocons d'avoine", "avoine", "farine de sarrasin", "flocons de sarrasin"];
const SOLID_PROT = ["tofu ferme", "tofu", "blanc de poulet", "poulet", "sardine"];
const isQty = i => num(i.q) > 0 && unitKind(i.u) === "g";
function starchItems(m){ return (m.ing || []).filter(i => { const e = lookup(i.n); return e && e.a === "Féculents" && isQty(i); }); }
function starchSplit(m){ let c = 0, r = 0; starchItems(m).forEach(i => { const e = lookup(i.n); if (RAW_STARCH.indexOf(e.k) >= 0) r += num(i.q); else c += num(i.q); }); return { c, r }; }
function protItems(m){ return (m.ing || []).filter(i => { const e = lookup(i.n); return e && SOLID_PROT.indexOf(e.k) >= 0 && isQty(i); }); }
const starchKcal = m => starchItems(m).reduce((s, i) => s + ingKcal(i), 0);
const ingTotal = m => (m.ing || []).reduce((s, i) => s + ingKcal(i), 0);
function scaleStarch(m, f){
  starchItems(m).forEach(i => { i.q = Math.max(5, Math.round(num(i.q) * f / 5) * 5); });
  m.adj = Math.round((m.adj || 1) * f * 100) / 100;
}
const kT = k => S.kcalT && num(S.kcalT[k]) > 0 ? Math.round(num(S.kcalT[k])) : null;
const lvlF = m => (m.lf || 0);   /* grammes de féculents ajoutés par le levier 1 (jamais plus de 30 g) */

/* met un repas aux portions du protocole, puis le rapproche de sa cible de calories si elle existe.
   Les protéines ne descendent jamais sous le minimum du repas. */
function protoAdaptMeal(m, k, target){
  if (!m || !m.ing) return false; const R = PORTIONS[k] || PORTIONS.l; let changed = false;
  const sp = starchSplit(m), raw = sp.c === 0 && sp.r > 0, cur = raw ? sp.r : sp.c;
  if (cur > 0) {
    const lo = raw ? R.fr[0] : R.f[0], hi = (raw ? R.fr[1] : R.f[1]) + lvlF(m);
    let x = 1;
    if (target) { const sc = starchKcal(m), tot = ingTotal(m); if (sc > 0) x = (target - (tot - sc)) / sc; }
    let want = Math.max(lo, Math.min(hi, cur * x)); if (!target) want = Math.max(lo, Math.min(hi, cur));
    const f = want / cur; if (Math.abs(f - 1) > .02) { scaleStarch(m, f); changed = true; }
  }
  protItems(m).forEach(i => { const q = num(i.q), lo = R.p[0], hi = R.p[1]; if (protItems(m).length === 1 && (q < lo || q > hi)) { i.q = Math.max(lo, Math.min(hi, q)); changed = true; } });
  return changed;
}
function adaptDay(day, force){
  let n = 0; SLOTS.forEach(sl => { const m = day.meals[sl.k]; if (m && protoAdaptMeal(m, sl.k, kT(sl.k))) n++; }); return n > 0;
}
function slotTarget(t){ return kT(t.s); }
const adaptHint = d => SLOTS.some(sl => { const m = d.meals[sl.k]; if (!m) return false; const c = clone(m); return protoAdaptMeal(c, sl.k, kT(sl.k)); });
function kcalBar(d){
  const k = dayKcal(d); if (!k) return "";
  const ts = SLOTS.map(sl => kT(sl.k)); const all = ts.every(x => x);
  const tg = all ? ts.reduce((a, b) => a + b, 0) : 0;
  const diff = k - tg, cls = !all ? "" : Math.abs(diff) <= tg * .08 ? "ok" : diff > 0 ? "hi" : "lo";
  return `<div class="kbar ${cls}"><div class="kb-top"><span class="kb-v">≈ ${fmtK(k)} kcal par jour</span>${all ? `<span class="kb-t">cible ${fmtK(tg)}</span>` : ""}</div>${all ? `<span class="kb-d">${Math.abs(diff) <= tg * .08 ? "dans la cible" : (diff > 0 ? "+" : "−") + Math.abs(diff) + " kcal"}</span>` : ""}</div>`;
}
const dayTarget = () => SLOTS.reduce((s, sl) => s + (kT(sl.k) || 0), 0);

/* ---------- contrôle du protocole ---------- */
const L3_RE = /\b(ail|oignons?|echalotes?|poivre|piment|vinaigre|citron|moutarde|pois chiches?|lentilles?|haricots? (?:blancs?|rouges?|secs?)|falafels?|fritur\w*|fruits? a coque brut)\b/;
const RAW_RE = /\b(salade|concombre|radis|crudites?|tomates?|carottes? rapees?)\b/;
function reintOK(key){ const f = S.reint && S.reint.foods && S.reint.foods[key]; return !!f && (f.st === "ok" || f.st === "test"); }
function protoCheck(o){
  const bad = [], warn = [];
  (o.ing || []).forEach(i => {
    const nm = String(i.n || "").trim(); if (!nm) return; const n = norm(nm), q = num(i.q), e = lookup(nm);
    if (L3_RE.test(n)) { bad.push({ n: nm, why: "exclu par le protocole (niveau 3)" }); return; }
    if (RAW_RE.test(n)) { warn.push({ n: nm, why: "cru : à éviter, cuire doucement" }); return; }
    if (!e) return;
    if (e.n === "r") warn.push({ n: nm, why: "non listé dans le protocole : à réintroduire" });
    else if ((e.n === "p2" || e.n === "p3") && !reintOK(e.k)) warn.push({ n: nm, why: "palier de réintroduction : pas encore débloqué" });
    if (e.k === "avocat" && q > 30) warn.push({ n: nm, why: "1/8 d'avocat maximum par repas (30 g)" });
    if (e.k === "sardine") { if (S.sensible) warn.push({ n: nm, why: "phase de sensibilité aiguë : sardines à éviter" }); else warn.push({ n: nm, why: "occasionnelle, de préférence le midi" , soft: true }); }
    if (e.k === "haricots verts" && q > 75) warn.push({ n: nm, why: "75 g maximum cuits (seuil low-FODMAP)" });
    if (e.k === "courgette" && q > 60) warn.push({ n: nm, why: "60 g maximum épluchée (seuil low-FODMAP)" });
    if (e.w && /FODMAP/.test(e.w) && q > 75 && e.k !== "haricots verts" && e.k !== "courgette") warn.push({ n: nm, why: e.w });
  });
  return { bad, warn: warn.filter(w => !w.soft || !S.hideSoft), ok: !bad.length && !warn.some(w => !w.soft) };
}
function protoBanner(o){
  const c = protoCheck(o); if (c.ok && !c.warn.length) return "";
  const li = a => a.map(x => `<li><strong>${esc(x.n)}</strong> : ${esc(x.why)}</li>`).join("");
  return `<div class="pc ${c.bad.length ? "bad" : "warn"}"><p class="pc-h">${ic(c.bad.length ? "x" : "gauge")} ${c.bad.length ? "Ne respecte pas le protocole de Cat" : "À surveiller avec le protocole"}</p><ul>${li(c.bad)}${li(c.warn)}</ul></div>`;
}
function protoDot(m){ const c = protoCheck(m); return c.bad.length ? `<span class="mb bad">hors protocole</span>` : c.warn.some(w => !w.soft) ? `<span class="mb warn">à vérifier</span>` : ""; }

/* ---------- leviers de poids (jamais de légumes en plus) ---------- */
function lever1(m){
  if (!m || (m.lf || 0) >= 30) return false; const add = Math.min(20, 30 - (m.lf || 0)), items = starchItems(m); if (!items.length) return false;
  const main = items.slice().sort((a, b) => num(b.q) - num(a.q))[0]; main.q = num(main.q) + add; m.lf = (m.lf || 0) + add; return true;
}
function lever2(m){
  if (!m || (m.lo || 0) >= .5) return false; const oil = (m.ing || []).find(i => /^huile/.test(norm(i.n)) && unitKind(i.u) === "c");
  if (!oil) return false; oil.q = num(oil.q) + .5; m.lo = (m.lo || 0) + .5; return true;
}
function defineLevers(){
  const run = (title, fn) => { const w = curWeek(); if (!w) return; snapshot(); const b = weekSnap(w); let n = 0;
    w.days.forEach(d => SLOTS.forEach(sl => { if (fn(d.meals[sl.k])) n++; })); save();
    if (n) { render(); reportWeek(title, w, b); } else toast("Rien à ajouter : le plafond du levier est déjà atteint pour tous les repas"); };
  A.lever1 = () => ask("Poids en baisse : ajouter 20 g de féculents cuits à chaque repas de la semaine affichée ? (30 g maximum au total par repas, les légumes ne changent pas)", "Ajouter 20 g", () => run("Levier 1 : +20 g de féculents par repas", lever1));
  A.lever2 = () => ask("Poids en baisse : ajouter une demi-cuillère à café d'huile d'olive crue à chaque repas de la semaine affichée ? (0,5 c. à café maximum au total par repas)", "Ajouter l'huile", () => run("Levier 2 : +0,5 c. à café d'huile à cru par repas", lever2));
}
function leversCard(){
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date)); let tip = "";
  if (ws.length >= 2) { const d = ws[ws.length - 1].kg - ws[ws.length - 2].kg; tip = d < -0.2 ? `<p class="pc warn-s">Ta dernière pesée est en baisse (${fmtN(d)} kg) : tu peux appliquer les leviers ci-dessous, dans l'ordre.</p>` : ""; }
  return `<section class="lev"><h2 class="group-title">Si le poids baisse</h2>
    <p class="muted">Ne jamais réduire les protéines (200 g de tofu ou de poulet par jour au minimum) et ne jamais augmenter les légumes. Les leviers s'appliquent à la semaine affichée dans le planning et se défont avec « Annuler ».</p>${tip}
    <div class="wa-grid"><button class="wa" data-act="lever1">${ic("plus")}<span><strong>Levier 1 : féculents</strong><em>+20 g cuits à chaque repas (30 g maximum)</em></span></button>
    <button class="wa" data-act="lever2">${ic("plus")}<span><strong>Levier 2 : huile à cru</strong><em>+0,5 c. à café d'huile d'olive par repas</em></span></button></div></section>`;
}

/* ---------- réintroduction progressive ---------- */
const REINT_FOODS = [
  { key: "banane", palier: 2, n: "Banane bien mûre", ing: "banane", normal: 100, u: "g", note: "écrasée, bien mûre (tachetée)" },
  { key: "myrtilles", palier: 2, n: "Myrtilles cuites", ing: "myrtilles", normal: 60, u: "g", note: "compotées doucement" },
  { key: "peche", palier: 2, n: "Compote de pêche ou nectarine maison", ing: "peche", normal: 100, u: "g", note: "fruits épluchés, cuits à la vapeur" },
  { key: "flocons de sarrasin", palier: 3, n: "Flocons de sarrasin", ing: "flocons de sarrasin", normal: 30, u: "g", note: "crus, cuits en porridge" },
  { key: "graines de chia", palier: 3, n: "Graines de chia moulues", ing: "graines de chia moulues", normal: 10, u: "g", note: "moulues finement, bien hydratées" }
];

const reint = () => (S.reint = S.reint || { start: null, foods: {}, current: null });
const reintDay = () => { const r = reint(); return r.start ? diffDays(r.start, todayISO()) + 1 : 0; };
const reintOpen = () => reintDay() > 90;
function foodPortion(f, day){ const q = day === 1 ? Math.max(1, Math.round(f.normal / 4)) : Math.round(f.normal / 2); return q; }
function viewReint(){
  const r = reint(), day = reintDay(), cur = r.current && r.foods[r.current], head = `<header class="pagehead"><div><h1 class="display">Réintroduction</h1><p class="muted">Après 90 jours de protocole, on réintroduit un seul nouvel aliment tous les 3 jours, avec un journal des symptômes.</p></div></header>`;
  if (!r.start) return head + `<section class="ri-card"><h2 class="display-s">Les 90 jours n'ont pas commencé</h2>

      <p>Il reste <strong>${90 - day + 1} jour${90 - day + 1 > 1 ? "s" : ""}</strong>. La réintroduction commencera le <strong>${fmtDate(addDays(r.start, 90))}</strong>.</p>
      <div class="ri-row"><label class="field"><span>Premier jour du protocole</span><input type="date" id="riStart" value="${r.start}"></label><button class="btn" data-act="riStart">Changer la date</button></div></section>${riCatalog(false)}`;
  return head + `<section class="ri-card"><p class="eyebrow">Réintroduction ouverte</p><h2 class="display-s">Jour ${day} du protocole</h2><p class="muted">Un seul aliment à la fois, un nouveau tous les 3 jours.</p></section>
    ${cur && cur.st === "test" ? riActive(r.current, cur) : ""}${riCatalog(true)}`;
}
function riActive(key, c){

  const title = ["", "Jour 1 : un quart de portion normale", "Jour 2 : portion moyenne", "Jour 3 : pause et observation"][step];

  return `<section class="ri-card now"><p class="eyebrow">En test · ${esc(f.n)}</p><h2 class="display-s">${title}</h2><p>${step === 3 ? "Observe, sans rien ajouter de nouveau." : "À intégrer au repas : <strong>" + esc(qty) + "</strong>."}</p>
    ${step < 3 ? `<div class="ri-row"><button class="btn" data-act="riAdd" data-s="l">Ajouter au déjeuner d'aujourd'hui</button><button class="btn" data-act="riAdd" data-s="d">Ajouter au dîner d'aujourd'hui</button></div>` : ""}

    ${(c.log || []).length ? `<ul class="ri-log">${c.log.map(l => `<li><strong>Jour ${l.step}</strong> · ${esc(fmtDate(l.d))} : ${l.sym ? "symptômes" : "aucun symptôme"}${l.note ? " · " + esc(l.note) : ""}</li>`).join("")}</ul>` : ""}
    <button class="link danger" data-act="riCancel">Abandonner ce test</button></section>`;

function riCatalog(open){

function defineReint(){
  A.riStart = () => { const v = ($("#riStart") || {}).value || todayISO(); reint().start = v; save(); render(); toast("Les 90 jours ont commencé le " + fmtDate(v)); };
  A.riTest = ds => { const r = reint(); if (r.current && r.foods[r.current] && r.foods[r.current].st === "test") return toast("Un test est déjà en cours.");
    r.foods[ds.k] = { st: "test", day: 1, started: todayISO(), log: [], last: null }; r.current = ds.k; save(); render(); toast("Test lancé : jour 1, un quart de portion"); };
  A.riCancel = () => ask("Abandonner ce test ? L'aliment redevient disponible pour un nouveau test.", "Abandonner", () => { const r = reint(); if (r.current) delete r.foods[r.current]; r.current = null; save(); render(); });
  A.riLog = ds => { const r = reint(), c = r.foods[r.current]; if (!c || c.last === todayISO()) return; const sym = ds.v === "1", note = ($("#riNote") || {}).value || "";
    c.log.push({ d: todayISO(), step: c.day, sym, note: note.trim() }); c.last = todayISO();
    if (sym) { c.st = "fail"; c.lockUntil = addDays(todayISO(), 30); r.current = null; save(); render(); toast("Test arrêté : l'aliment est verrouillé 30 jours"); return; }
    if (c.day >= 3) { c.st = "ok"; r.current = null; save(); render(); toast("Aliment validé : il passe au niveau 1"); return; }
    c.day++; save(); render(); toast("Bilan enregistré : passe au jour " + c.day + " demain"); };
  A.riAdd = ds => { const r = reint(), c = r.foods[r.current]; if (!c) return; const f = REINT_FOODS.find(x => x.key === r.current), w = curWeek(); if (!w) return;
    const di = Math.min(w.days.length - 1, (new Date().getDay() + 6) % 7), m = w.days[di].meals[ds.s];
    if (!m) return toast("Aucun " + (ds.s === "l" ? "déjeuner" : "dîner") + " prévu aujourd'hui : ajoute d'abord un repas au planning.");
    snapshot(); const q = foodPortion(f, c.day); const res = addIngredient(m, f.ing, q, f.u); save();
    toast(res === "exists" ? f.n + " est déjà dans ce repas" : f.n + " (" + q + " " + f.u + ") ajouté au " + (ds.s === "l" ? "déjeuner" : "dîner") + " d'aujourd'hui", res !== "exists"); };
}

/* ---------- réglages : calories par repas, interrupteurs ---------- */
function settingsBlock(){
  const f = (k, lab) => `<label class="field"><span>${lab}</span><input data-bind="kcalT" data-k="${k}" inputmode="numeric" placeholder="aucune" value="${kT(k) || ""}"></label>`;
  return `<h2 class="group-title">Calories par repas</h2>
    <p class="muted">Aucun objectif de régime : ces valeurs servent seulement à équilibrer chaque repas. Laisse vide pour garder les portions du protocole. Si tu en renseignes une, les féculents du repas s'ajustent pour s'en approcher, dans les fourchettes du protocole. Les protéines ne baissent jamais.</p>
    <div class="goalrow">${f("b", "Petit-déjeuner (kcal)")}${f("l", "Déjeuner (kcal)")}${f("d", "Dîner (kcal)")}</div>
    <label class="check sw"><input type="checkbox" data-bind="autoAdapt" ${S.autoAdapt !== false ? "checked" : ""}> Mettre automatiquement aux portions du protocole les repas que j'ajoute</label>
    <label class="check sw"><input type="checkbox" data-bind="autoVeg" ${S.autoVeg !== false ? "checked" : ""}> Compléter les repas avec un légume de saison quand il en manque</label>
    <label class="check sw"><input type="checkbox" data-bind="sensible" ${S.sensible ? "checked" : ""}> Phase de sensibilité aiguë (masque les sardines)</label>
    <h2 class="group-title">Légumes de saison</h2><p class="muted">En ${monthName()} : ${esc(seasonVegs({ ing: [] }, 14).map(k => VEGS[k].n).join(", "))}. Tous sont cuits, pelés, épépinés.</p>`;
}
function defineSettingsActions(){
  document.addEventListener("change", e => {
    const el = e.target, b = el.dataset ? el.dataset.bind : null; if (!b) return;
    if (b === "kcalT") { S.kcalT = S.kcalT || {}; const v = num(el.value); S.kcalT[el.dataset.k] = v >= 150 && v <= 1500 ? Math.round(v) : null; save(); render(); }
    if (b === "autoAdapt") { S.autoAdapt = el.checked; save(); }
    if (b === "autoVeg") { S.autoVeg = el.checked; save(); }
    if (b === "sensible") { S.sensible = el.checked; save(); }
  });
  document.addEventListener("input", e => {
    const el = e.target; if (!CR || !MODAL || MODAL.kind !== "creator") return;
    const d = el.dataset; if (!d) return;
    if (d.cr) {
      if (d.cr === "useM") return;
      if (d.cr === "n") { CR.f.n = el.value.replace(/\n/g, " "); el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
      else if (d.cr === "kcalM") CR.f.kcalM = parseFloat(String(el.value).replace(",", ".")) || 0;
      else CR.f[d.cr] = el.value;
    }
    if (d.cring) { CR.ing[+d.i][d.cring] = el.value; if (d.cring === "n" || d.cring === "q") crRefreshRow(+d.i); }
    if (d.crst) CR.steps[+d.i][d.crst] = el.value;
  });
  document.addEventListener("change", e => {
    const el = e.target, d = el.dataset; if (!CR || !MODAL || MODAL.kind !== "creator" || !d) return;
    if (d.cr === "useM") { CR.f.useM = el.checked; const w = $("#crMw"); if (w) w.hidden = !el.checked; }
    if (d.cr === "st") CR.f.st = el.value;
    if (d.cring === "u") { CR.ing[+d.i].u = el.value; crRefreshRow(+d.i); }
  });
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (e.target.id === "frNew") { e.preventDefault(); A.frAdd(); }
    if (e.target.id === "exNew") { e.preventDefault(); A.addExtra(); }
  });
}
defineCookActions(); defineCookEdit(); defineWeekActions(); defineFridgeActions(); defineShopActions(); defineCreatorActions(); defineSettingsActions(); defineLevers(); defineReint();

/* ---------- état par défaut et migration ---------- */
function ensureDefaults(){
  S.ui = S.ui || { view: "plan", week: 0 }; S.checked = S.checked || {}; S.weights = S.weights || [];
  if (S.goal == null) S.goal = 60;
  if (!S.kcalT || typeof S.kcalT !== "object") S.kcalT = { b: null, l: null, d: null };
  if (S.autoAdapt == null) S.autoAdapt = true;
  if (S.autoVeg == null) S.autoVeg = true;
  if (S.sensible == null) S.sensible = false;
  if (!Array.isArray(S.pantry)) S.pantry = [];
  if (!Array.isArray(S.shopExtra)) S.shopExtra = [];
  if (!S.cooked || typeof S.cooked !== "object") S.cooked = {};
  if (!S.reint || typeof S.reint !== "object") S.reint = { start: null, foods: {}, current: null };
  S.weeks.forEach(w => w.days.forEach(d => { d.meals = d.meals || {}; if (!("b" in d.meals)) d.meals.b = null; }));
  const ks = Object.keys(S.cooked); if (ks.length > 80) ks.slice(0, ks.length - 80).forEach(k => delete S.cooked[k]);
}
function migrateAll(){ if (!S.v || S.v < 2) migrateProto(); }
/* v2 : nouveau protocole. Le carnet fourni est remplacé par la version mise à jour ; les recettes créées par Cat sont conservées.
   Les repas du planning qui venaient de l'ancien carnet sont renouvelés, et un petit-déjeuner est ajouté là où il manque. */
function migrateProto(){
  const oldIds = new Set(S.recipes.filter(r => !r.own).map(r => r.id)), own = S.recipes.filter(r => r.own);
  S.recipes = DEFAULT_RECIPES.map(recipeToState).concat(own);
  const fresh = buildDefaultPlan(S.recipes);
  S.weeks.forEach((w, wi) => w.days.forEach((d, di) => {
    const src = fresh[wi % fresh.length].days[di % 7].meals;
    ["b", "l", "d"].forEach(k => { const m = d.meals[k]; if (!m || (m.recipeId && oldIds.has(m.recipeId))) d.meals[k] = copyMeal(src[k]); });
  }));
  S.v = 2;
}

/* ---------- confirmations et sauvegarde sans boîtes de dialogue du navigateur ---------- */
let ASK = null;
function ask(msg, label, fn){
  ASK = fn; MODAL = { kind: "ask" };
  openModal(`<h2 class="display-s">${esc(msg)}</h2><div class="sheet-foot"><button class="btn ghost" data-act="close">Annuler</button><button class="btn primary push" data-act="askYes">${esc(label || "Confirmer")}</button></div>`);
}
A.askYes = () => {
  const f = ASK; ASK = null; MODAL = null; const m = $("#modal"); m.classList.remove("open"); m.hidden = true; document.body.classList.remove("locked");
  if (f) f();
};
const saveName = () => "la-table-sauvegarde-" + new Date().toISOString().slice(0, 10) + ".json";
function showBackupText(){
  const json = JSON.stringify(S, null, 1); MODAL = { kind: "backup" };
  openModal(`<h2 class="display-s">Sauvegarde en texte</h2><p class="muted">Copie ce texte et garde-le dans une note ou un fichier « .json ». Pour restaurer : Réglages, Importer, « Coller le texte ».</p>
    <textarea id="bkText" rows="12" readonly>${esc(json)}</textarea>
    <div class="sheet-foot"><button class="btn ghost" data-act="close">Fermer</button><button class="btn primary push" data-act="copyBackup">Copier le texte</button></div>`);
}
A.copyBackup = () => {
  const ta = $("#bkText"), sel = () => { ta.focus(); ta.select(); toast("Texte sélectionné : copie-le avec ton clavier"); };
  try { navigator.clipboard.writeText(ta.value).then(() => toast("Sauvegarde copiée"), sel); } catch (e) { sel(); }
};
A.exportText = () => showBackupText();
A.export = () => {
  const json = JSON.stringify(S, null, 1), name = saveName();
  const classic = () => { const blob = new Blob([json], { type: "application/json" }), a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast("Sauvegarde téléchargée"); };
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(d => {
      if (!d) return showBackupText();
      d.save({ filename: name, data: json }).then(() => toast("Sauvegarde enregistrée"), e => { if (!e || e.code !== "declined") showBackupText(); });
    }, showBackupText);
  } else classic();
};
function importText(txt){
  try { const d = JSON.parse(txt); if (!d.weeks || !d.recipes) throw 0;
    snapshot(); S = d; ensureDefaults(); migrateAll(); applyFont(); save(); render(); toast("Données importées", true); }
  catch (e) { toast("Ce texte n'est pas une sauvegarde valide de La Table."); }
}
function importFile(f){ if (!f) return; const rd = new FileReader(); rd.onload = () => { importText(rd.result); closeIfOpen(); }; rd.readAsText(f); }
function closeIfOpen(){}
A.importPaste = () => {
  MODAL = { kind: "paste" };
  openModal(`<h2 class="display-s">Coller une sauvegarde</h2><p class="muted">Colle ici le texte d'une sauvegarde. Il remplacera tes données actuelles (annulable).</p>
    <textarea id="pasteBk" rows="10" placeholder="{ &quot;v&quot;: 4, ... }"></textarea>
    <div class="sheet-foot"><button class="btn ghost" data-act="close">Annuler</button><button class="btn primary push" data-act="pasteGo">Importer</button></div>`, { focus: "#pasteBk" });
};
A.pasteGo = () => { const t = $("#pasteBk").value.trim(); if (!t) return toast("Colle d'abord le texte de la sauvegarde."); MODAL = null; const m = $("#modal"); m.classList.remove("open"); m.hidden = true; document.body.classList.remove("locked"); importText(t); };

function viewInsp(){
  const mode = (S.ui && S.ui.insp) || "compose";
  const seg = `<div class="seg ins-mode" role="tablist">${[["compose","Composer"],["fridge","Avec mon frigo"]].map(([v, l]) => `<button class="seg-b" data-act="inspMode" data-v="${v}" aria-pressed="${mode === v}">${l}</button>`).join("")}</div>`;
  const sl = INSP.scope === "meal" ? `<div class="frow"><span class="flabel">Pour quel repas</span><div class="chips">${SLOTS.map(x => `<button class="chip" data-act="inspSlot" data-v="${x.k}" aria-pressed="${(INSP.to.s || "l") === x.k}">${x.label}</button>`).join("")}</div></div>` : "";
  return seg + (mode === "fridge" ? viewFridge() : sl + viewInspCompose());
}
A.inspSlot = ds => { INSP.to.s = ds.v; INSP.result = null; render(); };

/* ---------- démarrage ---------- */
load(); render();
