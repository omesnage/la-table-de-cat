  const meta = [m.st || "", kcalOf(m) ? "≈ " + fmtK(kcalOf(m)) + " kcal" : ""].filter(Boolean).join(", ");
  return `<div class="meal slot-${sl.k}${cls}" ${catSt(m.cat)}><div class="slot">${sl.label}</div>
    <button class="dish" data-act="openMeal" ${at}><span class="dish-name">${esc(m.name || "Repas sans nom")}</span>
    ${m.sub ? `<span class="dish-sub">${esc(m.sub)}</span>` : ""}<span class="dish-meta">${catTag(m.cat)}${seasonChip(m)}<span>${esc(meta)}</span></span>${mealBadges(m)}${protoDot(m)}${timesLine(m)}</button>
    ${mealTools(at)}</div>`;
}

/* ============ MODALE ============ */
let MODAL = null; // { target, kind }
function openModal(html, opts = {}){
  const m = $("#modal");
  m.querySelector(".sheet").className = "sheet" + (opts.wide ? " wide" : "");
  m.querySelector(".sheet-body").innerHTML = html;
  m.hidden = false; document.body.classList.add("locked");
  requestAnimationFrame(() => { m.classList.add("open"); fitTitle(); });
  if (opts.focus) { const f = m.querySelector(opts.focus); if (f) f.focus(); }
}
function closeModal(){
  const m = $("#modal"); m.classList.remove("open"); m.hidden = true; document.body.classList.remove("locked");
  if (MODAL && MODAL.kind === "meal") { const o = getMeal(MODAL.t); if (o && !o.name.trim()) o.name = "Repas sans nom"; }
  MODAL = null; save(); render();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });

function getMeal(t){ const w = S.weeks[t.w]; return w && w.days[t.d] ? w.days[t.d].meals[t.s] : null; }
function setMeal(t, m){ S.weeks[t.w].days[t.d].meals[t.s] = m; }
function slotLabel(k){ return SLOTS.find(s => s.k === k).label; }

/* ---------- ÉDITEUR (repas / recette / brouillon) ---------- */
function edObj(){
  if (!MODAL) return null;
  if (MODAL.kind === "meal") return getMeal(MODAL.t);
  if (MODAL.kind === "recipe") return recipeById(MODAL.id);
  if (MODAL.kind === "draft" || MODAL.kind === "temp") return MODAL.obj;
  return null;
}
function nameKey(){ return MODAL.kind === "meal" || MODAL.kind === "temp" ? "name" : "n"; }
const DIFF = ["Facile","Intermédiaire","Élaboré"];
/* met en valeur les repères, points de contrôle et erreurs à éviter */
const fmtStep = t => esc(t).replace(/(Repères|Point de contrôle|À éviter) :/g, '<span class="lab">$1&nbsp;:</span>');
function stepsHTML(steps, ings){
  if (!steps || !steps.length) return `<li class="muted">Aucune étape pour l'instant.</li>`;
  return steps.map(raw => { const p = parseStep(ings ? renderQ(raw, ings) : raw);
    return p.h ? `<li><span class="step-h">${esc(p.h)}</span><p>${fmtStep(p.body)}</p></li>` : `<li><p>${fmtStep(p.body)}</p></li>`; }).join("");
}
function metaLine(o){ return [o.t ? o.t + " min" : "", o.d ? DIFF[+o.d - 1] : ""].filter(Boolean).join(" · "); }

function openEditorEdit(kind, ref){
  MODAL = kind === "meal" ? { kind, t: ref } : kind === "recipe" ? { kind, id: ref } : { kind, obj: ref };
  const o = edObj(); if (!o) return; MODAL.mode = "edit";
  const isRecipe = kind === "recipe" || kind === "draft";
  const title = isRecipe ? o.n : o.name;
  const where = kind === "meal" ? `${esc(S.weeks[ref.w].name)}, ${esc(S.weeks[ref.w].days[ref.d].name)}, ${slotLabel(ref.s).toLowerCase()}`
    : kind === "draft" ? "Nouvelle recette" : kind === "temp" ? (o.gen ? "Idée proposée, à modifier librement avant de l'ajouter" : "Recette du carnet") : "Carnet de recettes";
  const withCur = (list, v) => v && !list.includes(v) ? [...list, v] : list;
  const sel = (key, list, val) => `<label class="field"><span>${{cat:"Catégorie",st:"Style",base:"Féculent"}[key]}</span>
    <select data-ed="${key}">${withCur(list, val).map(x => `<option ${x === val ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>`;
  const recipeFields = isRecipe ? `<div class="fields">
      ${sel("cat", CATS, o.cat)}${sel("st", STYLES, o.st)}${sel("base", [...BASES, "Aucun"], o.base)}
      <label class="field"><span>Temps (min)</span><input data-ed="t" inputmode="numeric" value="${esc(o.t || "")}"></label>
      <label class="field"><span>Difficulté</span><select data-ed="d">${[1,2,3].map(n => `<option value="${n}" ${+o.d === n ? "selected" : ""}>${DIFF[n-1]}</option>`).join("")}</select></label>
    </div>` : "";
  const variation = (kind === "meal" || kind === "temp") && o.gen ? genPanel(o.gen) : "";
  const footer = kind === "meal" ? `
      <button class="btn" data-act="proposeMeal" data-w="${ref.w}" data-d="${ref.d}" data-s="${ref.s}">Autres idées pour ce repas</button>
      <button class="btn" data-act="pickRecipe" data-w="${ref.w}" data-d="${ref.d}" data-s="${ref.s}">Choisir dans le carnet</button>
      <button class="btn" data-act="mealToBook">Enregistrer dans le carnet</button>
      ${o.recipeId && recipeById(o.recipeId) ? `<button class="btn ghost" data-act="resetMeal">Rétablir la recette d'origine</button>` : ""}
      <button class="btn ghost danger" data-act="clearMeal">Retirer ce repas</button>
      <button class="btn primary push" data-act="close">Terminé</button>`
    : kind === "recipe" ? `
      <button class="btn" data-act="recipeToPlan" data-id="${o.id}">Ajouter au planning</button>
      <button class="btn ghost danger" data-act="delRecipe" data-id="${o.id}">Supprimer la recette</button>
      <button class="btn primary push" data-act="close">Terminé</button>`
    : kind === "temp" ? `
      <button class="btn primary" data-act="tempPlace">Ajouter au planning</button>
      <button class="btn" data-act="tempSave">Enregistrer dans le carnet</button>
      <button class="btn ghost push" data-act="close">Fermer</button>`
    : `<button class="btn ghost" data-act="close">Annuler</button><button class="btn primary push" data-act="saveDraft">Enregistrer la recette</button>`;
  openModal(`<div id="edWrap" ${catSt(o.cat)}>
    <p class="eyebrow">${where}</p>
    ${kind !== "draft" ? `<p class="ed-modes"><button class="link" data-act="toCook">← Voir en mode cuisine</button>${kind === "recipe" && o.own ? ` <button class="link" data-act="toCreator">Ouvrir dans le panneau de création</button>` : ""}</p>` : ""}
    <textarea class="ed-title" data-ed="name" rows="1" placeholder="${isRecipe ? "Nom de la recette" : "Nom du repas"}" aria-label="Nom">${esc(title)}</textarea>
    ${o.sub ? `<p class="ed-sub">${esc(o.sub)}</p>` : ""}
    <div id="edPc">${protoBanner(o)}</div><p class="ed-kcal">${catTag(o.cat)} ${metaLine(o) ? `<span>${esc(metaLine(o))}</span><span class="sep"></span>` : ""}Environ <strong id="edKcal">${fmtK(kcalOf(o))}</strong> kcal <span class="muted">(indicatif, recalculé à chaque modification)</span></p>
    ${recipeFields}${variation}
    <section class="ed-sec"><h3>Ingrédients</h3><ol class="ing-list" id="ingList">${ingRows(o)}</ol>
      <button class="btn" data-act="ingAdd">＋ Ajouter un ingrédient</button></section>
    <section class="ed-sec"><div class="sec-head"><h3>Préparation</h3><button class="link" data-act="editSteps" id="stepsBtn">${o.steps && o.steps.length ? "Modifier la préparation" : "Voir la recette"}</button></div>
      <ol class="steps" id="stepsRead" ${o.steps && o.steps.length ? "" : "hidden"}>${stepsHTML(o.steps, o.ing)}</ol>
      <div id="stepsEditWrap" ${o.steps && o.steps.length ? "hidden" : ""}><p class="muted small">Une étape par ligne. Pour lui donner un titre : « Titre — texte ».</p>
      <textarea data-ed="steps" id="stepsEdit" rows="${Math.max(8, (o.steps || []).length * 2 + 2)}">${esc((o.steps || []).join("\n"))}</textarea></div></section>
    <section class="ed-sec"><h3>Astuce du chef</h3><textarea data-ed="tip" rows="2">${esc(o.tip || "")}</textarea></section>
    <div class="sheet-foot">${footer}</div>
    <datalist id="units">${UNITS.map(u => `<option value="${u}">`).join("")}</datalist></div>`, { focus: kind === "meal" && !o.name ? ".ed-title" : kind === "draft" ? ".ed-title" : null });
}
function fitTitle(){ const t = document.querySelector(".ed-title"); if (t && t.tagName === "TEXTAREA") { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; } }
function ingRows(o){
  if (!o.ing.length) return `<li class="ing-empty muted">Aucun ingrédient pour l'instant.</li>`;
  return o.ing.map((i, k) => `<li class="ing" data-i="${k}">
    <input class="ing-q" data-ing="q" value="${esc(i.q)}" inputmode="decimal" placeholder="Qté" aria-label="Quantité">
    <input class="ing-u" data-ing="u" value="${esc(i.u)}" list="units" placeholder="unité" aria-label="Unité">
    <input class="ing-n" data-ing="n" value="${esc(i.n)}" placeholder="Ingrédient" aria-label="Ingrédient">
    <span class="ing-tools">
      ${subBtn(o, k)}
      <button class="icon" data-act="ingUp" data-i="${k}" aria-label="Monter" ${k === 0 ? "disabled" : ""}>↑</button>
      <button class="icon" data-act="ingDown" data-i="${k}" aria-label="Descendre" ${k === o.ing.length - 1 ? "disabled" : ""}>↓</button>
      <button class="icon del" data-act="ingDel" data-i="${k}" aria-label="Supprimer">×</button>
    </span></li>${subPanel(o, k)}`).join("");
}
function refreshIng(focusLast){
  const o = edObj(); $("#ingList").innerHTML = ingRows(o); $("#edKcal").textContent = fmtK(kcalOf(o)); { const pc = $("#edPc"); if (pc) pc.innerHTML = protoBanner(o); }
  if (focusLast) { const r = [...document.querySelectorAll("#ingList .ing-n")].pop(); if (r) r.focus(); }
}
function genPanel(g){
  const f = FORMATS.find(x => x.id === g.f);
  const opt = (arr, cur, lab) => arr.map(k => `<option value="${k}" ${k === cur ? "selected" : ""}>${esc(lab(k))}</option>`).join("");
  return `<section class="gen-panel"><h3>Varier ce plat</h3><p class="muted small">Change un élément, le reste de la recette suit.</p>
    <div class="fields">
      <label class="field"><span>Format</span><select data-gen="f">${opt(FORMATS.map(x => x.id), g.f, k => FORMATS.find(x => x.id === k).n)}</select></label>
      <label class="field"><span>Protéine</span><select data-gen="p">${opt(formatProteins(f), g.p, k => cap(PROTEINS[k].n))}</select></label>
      <label class="field"><span>Féculent</span><select data-gen="s">${opt(f.s, g.s, k => cap(STARCHES[k].n))}</select></label>
      <label class="field"><span>Sauce</span><select data-gen="sa">${opt(f.sa, g.sa, k => cap(SAUCES[k].n))}</select></label>
    </div>
    <button class="link" data-act="genVeg">Changer les légumes</button></section>`;
}

/* saisie en direct dans l'éditeur et ailleurs */
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind === "weekName") { const w = curWeek(); w.name = el.value; saveSoon(); const t = document.querySelector(`.wtab[data-i="${S.ui.week}"]`); if (t) t.textContent = el.value; return; }
  if (el.dataset.bind === "dayName") { curWeek().days[+el.dataset.d].name = el.value; saveSoon(); return; }
  if (el.dataset.bind === "bookSearch") { BOOK.q = el.value; renderBookList(); return; }
  if (el.dataset.bind === "pickSearch") { PICK.q = el.value; renderPickList(); return; }
  if (!MODAL) return;
  const o = edObj(); if (!o) return;
  if (el.dataset.ing) {
    const k = +el.closest(".ing").dataset.i; o.ing[k][el.dataset.ing] = el.value;
    $("#edKcal").textContent = fmtK(kcalOf(o)); { const pc = $("#edPc"); if (pc) pc.innerHTML = protoBanner(o); } saveSoon(); return;
  }
  const key = el.dataset.ed; if (!key) return;
  if (key === "name") { if (/\n/.test(el.value)) el.value = el.value.replace(/\n/g, " "); o[nameKey()] = el.value; fitTitle(); }
  else if (key === "steps") o.steps = el.value.split("\n").map(s => s.trim()).filter(Boolean);
  else if (key === "t" || key === "d") o[key] = el.value;
  else o[key] = el.value;
  if (MODAL.kind !== "draft") saveSoon();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (MODAL && el.dataset.ed && el.tagName === "SELECT") { const o = edObj(); o[el.dataset.ed] = el.dataset.ed === "d" ? +el.value : el.value; if (MODAL.kind !== "draft") saveSoon();
    if (el.dataset.ed === "cat") { const w = $("#edWrap"); if (w) w.style.setProperty("--cc", catVar(el.value)); } }
  if (MODAL && el.dataset.gen && MODAL.kind === "temp") { TEMP = mealFromGen(swapGen(TEMP, el.dataset.gen, el.value)); openEditorEdit("temp", TEMP); return; }
  if (MODAL && el.dataset.gen) { const m = getMeal(MODAL.t); snapshot(); const nm = mealFromGen(swapGen(m, el.dataset.gen, el.value)); nm.id = m.id; setMeal(MODAL.t, nm); save(); openEditorEdit("meal", MODAL.t); toast("Plat modifié", true); }
  if (el.dataset.bind === "shopWeek") { SHOP.w = +el.value; SHOP.days = null; render(); }
  if (el.dataset.bind === "shopDay") { const ds = shopDays(); SHOP.days = ds.map((v, i) => i === +el.dataset.i ? el.checked : v); render(); }
  if (el.dataset.bind === "shopItem") { const w = S.weeks[SHOP.w]; S.checked[w.id] = S.checked[w.id] || {}; S.checked[w.id][el.dataset.key] = el.checked; save(); el.closest("li").classList.toggle("done", el.checked); }
  if (el.dataset.bind === "goal") { S.goal = parseFloat(el.value.replace(",", ".")) || S.goal; save(); render(); }
  if (el.dataset.bind === "importFile") importFile(el.files[0]);
  if (el.dataset.bind === "bookCat") { BOOK.cat = el.value; renderBookList(); }
  if (el.dataset.bind === "bookSt") { BOOK.st = el.value; renderBookList(); }
  if (el.dataset.bind === "bookBase") { BOOK.base = el.value; renderBookList(); }
});

/* ============ ACTIONS (clics) ============ */
const A = {};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { S.ui.view = nav.dataset.nav; save(); render(); window.scrollTo(0, 0); return; }
  if (e.target.id === "modal") { closeModal(); return; }
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return;
  const fn = A[a.dataset.act]; if (fn) { e.preventDefault(); fn(a.dataset, a); }
});
const T = ds => ({ w: ds.w != null ? +ds.w : S.ui.week, d: +ds.d, s: ds.s });

A.undo = () => undo();
A.close = () => closeModal();
A.week = ds => { S.ui.week = +ds.i; save(); render(); };
A.goShop = () => { SHOP.w = S.ui.week; SHOP.days = null; S.ui.view = "shop"; render(); window.scrollTo(0, 0); };

/* repas */
A.openMeal = ds => openEditor("meal", T(ds));
A.createMeal = ds => {
  const t = T(ds), sl = SLOTS.find(s => s.k === t.s);
  MODAL = { kind: "create", t };
  openModal(`<p class="eyebrow">${esc(S.weeks[t.w].name)}, ${esc(S.weeks[t.w].days[t.d].name)}</p>
    <h2 class="display-s">${sl.create}</h2>
    <div class="choice-list">
      <button class="choice" data-act="pickRecipe" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Choisir dans le carnet</strong><span>Une des ${S.recipes.length} recettes déjà écrites.</span></button>
      ${t.s === "l" || t.s === "d" ? `<button class="choice" data-act="krOpen" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Composer un repas coréen</strong><span>Du riz, un banchan à protéine et deux banchan de légumes.</span></button>` : ""}
      <button class="choice" data-act="proposeMeal" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Me proposer des idées</strong><span>Six suggestions, renouvelables à volonté.</span></button>
      <button class="choice" data-act="freeMeal" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Créer un repas libre</strong><span>Nom, ingrédients, quantités et préparation à saisir.</span></button>
    </div>`);
};
A.freeMeal = ds => {
  const t = T(ds); snapshot();
  setMeal(t, { id: uid(), name: "", recipeId: null, cat: "", st: "", base: "", ing: [{ id: uid(), n: "", q: "", u: "g" }], steps: [], tip: "" });
  save(); openEditor("meal", t);
};
A.clearMeal = () => { const t = MODAL.t; snapshot(); setMeal(t, null); save(); closeModal(); toast("Repas retiré", true); };
A.resetMeal = () => { const t = MODAL.t, m = getMeal(t), r = recipeById(m.recipeId); snapshot(); const nm = mealFromRecipe(r); nm.id = m.id; setMeal(t, nm); save(); openEditor("meal", t); toast("Recette d'origine rétablie", true); };
A.mealToBook = () => {
  const m = getMeal(MODAL.t);
  const r = { id: "r-" + uid(), n: m.name || "Recette sans nom", cat: CATS.includes(m.cat) ? m.cat : (m.cat || "Tofu"), st: m.st || "Cocon & purées",
    base: m.base || "Aucun", t: m.t || "", d: m.d || 1, ing: m.ing.map(i => ({ id: uid(), n: i.n, q: i.q, u: i.u })), steps: [...m.steps], tip: m.tip || "", own: true };
  S.recipes.unshift(r); m.recipeId = r.id; save(); toast("Ajouté au carnet : " + r.n);
};
A.genVeg = () => { if (MODAL.kind === "temp") { TEMP = mealFromGen(swapGen(TEMP, "v")); openEditorEdit("temp", TEMP); return; } const t = MODAL.t, m = getMeal(t); snapshot(); const nm = mealFromGen(swapGen(m, "v")); nm.id = m.id; setMeal(t, nm); save(); openEditorEdit("meal", t); };

/* ingrédients */
A.ingAdd = () => { const o = edObj(); o.ing.push({ id: uid(), n: "", q: "", u: "g" }); if (MODAL.kind !== "draft") save(); refreshIng(true); };
A.ingDel = ds => { const o = edObj(); o.ing.splice(+ds.i, 1); if (MODAL.kind !== "draft") save(); refreshIng(); };
A.ingUp = ds => { const o = edObj(), i = +ds.i; if (i > 0) { [o.ing[i-1], o.ing[i]] = [o.ing[i], o.ing[i-1]]; if (MODAL.kind !== "draft") save(); refreshIng(); } };
A.ingDown = ds => { const o = edObj(), i = +ds.i; if (i < o.ing.length - 1) { [o.ing[i+1], o.ing[i]] = [o.ing[i], o.ing[i+1]]; if (MODAL.kind !== "draft") save(); refreshIng(); } };

/* jours et semaines */
A.newDay = () => { const w = curWeek(); snapshot(); w.days.push(emptyDay(DAY_NAMES[w.days.length % 7])); save(); render(); toast("Jour ajouté", true);
  const days = document.querySelectorAll(".day"); days[days.length - 1].scrollIntoView({ behavior: "smooth", block: "center" }); };
A.delDay = ds => { const w = curWeek(); snapshot(); w.days.splice(+ds.d, 1); save(); render(); toast("Jour supprimé", true); };
A.delWeek = () => { const w = curWeek(); ask(`Supprimer « ${w.name} » et ses ${w.days.length} jours ?`, "Supprimer", () => { snapshot(); S.weeks.splice(S.ui.week, 1); S.ui.week = Math.max(0, S.ui.week - 1); save(); render(); toast("Semaine supprimée", true); }); };
A.newWeek = () => {
  MODAL = { kind: "newWeek" };
  openModal(`<h2 class="display-s">Créer une nouvelle semaine</h2><p class="muted">7 jours, chacun avec un petit-déjeuner, un déjeuner, une collation et un dîner.</p>
    <div class="choice-list">
      <button class="choice" data-act="mkWeek" data-mode="auto"><strong>Semaine proposée</strong><span>Menus variés composés automatiquement, modifiables ensuite.</span></button>
      <button class="choice" data-act="mkWeek" data-mode="blank"><strong>Semaine vierge</strong><span>7 jours vides, à remplir depuis le carnet ou les idées.</span></button>
    </div>`);
};
A.mkWeek = ds => {
  snapshot(); const n = "Semaine " + (S.weeks.length + 1); let w;
  if (ds.mode === "auto") { w = { id: uid(), name: n, days: proposeWeek({}).map((p, i) => ({ id: uid(), name: DAY_NAMES[i], meals: p })) }; }
  else { w = { id: uid(), name: n, days: DAY_NAMES.map(dn => emptyDay(dn)) }; }
  S.weeks.push(w); S.ui.week = S.weeks.length - 1; S.ui.view = "plan"; save(); closeModal(); toast(n + " créée", true);
};
A.proposeDay = ds => { const w = curWeek(), d = w.days[+ds.d]; snapshot(); const p = proposeDay({}, weekUsed(w, +ds.d)); d.meals.l = p.l; d.meals.d = p.d; save(); render(); toast(`${d.name} : nouveaux déjeuner et dîner`, true); };
A.proposeWeek = () => { const w = curWeek(); snapshot(); const ps = proposeWeek({});
  w.days.forEach((d, i) => { const p = ps[i % 7]; d.meals.l = p.l; d.meals.d = p.d; });
  save(); render(); toast("Nouveaux menus pour " + w.name, true); };

/* carnet → planning */
let PICK = { t: null, q: "", cat: "" };
A.pickRecipe = ds => {
  const t = T(ds); PICK = { t, q: "", cat: "" }; MODAL = { kind: "pick", t };
  openModal(`<p class="eyebrow">${esc(S.weeks[t.w].name)}, ${esc(S.weeks[t.w].days[t.d].name)}, ${slotLabel(t.s).toLowerCase()}</p>
    <h2 class="display-s">Choisir dans le carnet</h2>
    <input class="search" data-bind="pickSearch" placeholder="Rechercher une recette ou un ingrédient" aria-label="Rechercher">
    <div class="chips" id="pickChips"></div><ul class="pick-list" id="pickList"></ul>`, { wide: true, focus: ".search" });
  renderPickList();
};
A.pickCat = ds => { PICK.cat = ds.v; renderPickList(); };
function recipeMatches(r, q){ if (!q) return true; const n = norm(q); return norm(r.n).includes(n) || r.ing.some(i => norm(i.n).includes(n)) || norm(r.st).includes(n); }
function renderPickList(){
  const cats = ["", ...CATS];

/* ---------- moteur de propositions (petit-déjeuner, déjeuner et dîner) ---------- */
function slotOf(f){ return f.slot || (f.t && f.t.s) || (f.to && f.to.s) || "l"; }
const okSens = r => !(S.sensible && (r.ing || []).some(i => /sardine|miso|sauce soja/.test(norm(i.n))));
function catalogFor(f){
  const bk = slotOf(f) === "b";
  return S.recipes.filter(r => CATS.includes(r.cat) && r.st !== "Douceurs" && ((r.st === "Petit-déjeuner") === bk) && okSens(r) &&
    (!f.cats || !f.cats.length || f.cats.includes(r.cat)) && (!f.bases || !f.bases.length || f.bases.includes(r.base)) && (!f.styles || !f.styles.length || f.styles.includes(r.st)));
}
function oneProposal(f, avoid){
  avoid = avoid || new Set();
  if (f.slot === "c" || (f.t && f.t.s === "c") || (f.to && f.to.s === "c")) {   /* collation : une petite recette du carnet, jamais générée */
    const list = S.recipes.filter(r => r.cat === "Collation" && okSens(r) && !avoid.has(r.n) && (!f.pd || r.go === f.pd)); return list.length ? mealFromRecipe(pick(list)) : null;
  }
  const src = f.src || "mix", sl = slotOf(f), bk = sl === "b";
  if (bk && !f.pd) f = { ...f, pd: Math.random() < .7 ? "Sucré" : "Salé" };   /* petits-déjeuners : 70 % sucrés, 30 % salés */
  for (let t = 0; t < 40; t++){
    const useBook = bk || src === "book" || (src === "mix" && Math.random() < 0.4);
    let m = null;
    if (useBook) { const list = catalogFor(f).filter(r => !avoid.has(r.n)); if (list.length) m = mealFromRecipe(pick(list)); else if (bk || src === "book") return null; }
    if (!m) { const g = randomGen({ cats: f.cats, bases: f.bases, styles: f.styles }); if (g) m = mealFromGen(g); }
    if (m && !avoid.has(m.name)) { if (S.autoVeg !== false && !bk) autoSide(m); if (S.autoAdapt !== false) protoAdaptMeal(m, sl, kT(sl)); return m; }
  }
  return null;
}
function proposeMeals(n, f){
  const out = [], seen = new Set();
  for (let i = 0; i < n * 3 && out.length < n; i++){ const m = oneProposal(f, seen); if (m && !seen.has(m.name)) { seen.add(m.name); out.push(m); } }
  return out;
}
function weekUsed(w, skip){ const s = new Set(); w.days.forEach((d, i) => { if (i !== skip) SLOTS.forEach(sl => d.meals[sl.k] && s.add(d.meals[sl.k].name)); }); return s; }
function proposeDay(f, avoid){
  avoid = new Set(avoid || []); const out = {};
  SLOTS.forEach(sl => {
    const bk = sl.k === "b";
    const m = oneProposal({ ...f, slot: sl.k }, avoid) || oneProposal({ src: bk ? "book" : "gen", slot: sl.k }, avoid) || oneProposal({ src: "mix", slot: sl.k }, new Set());
    out[sl.k] = m; if (m) avoid.add(m.name);
  });
  return out;
}
function proposeWeek(f){
  const days = [], avoid = new Set(), count = {};
  const limit = f.cats && f.cats.length ? 99 : 5;
  for (let i = 0; i < 7; i++){
    let best = null;
    for (let t = 0; t < 30; t++){
      const p = proposeDay(f, avoid);
      const ok = [p.l, p.d].every(m => !m || (count[m.cat] || 0) < limit);
      best = p; if (ok) break;
    }
    SLOTS.forEach(sl => { const m = best[sl.k]; if (!m) return; avoid.add(m.name); if (sl.k !== "b") count[m.cat] = (count[m.cat] || 0) + 1; });
    days.push(best);
  }
  return days;
}

  const w = S.weeks[SHOP.w], sel = shopDays(), map = new Map();
  w.days.forEach((d, i) => { if (!sel[i]) return; SLOTS.forEach(sl => { const m = d.meals[sl.k]; if (!m) return;
    m.ing.forEach(it => { if (!String(it.n).trim()) return; const e = lookup(it.n);
      const mergeByKey = e && ["Légumes","Volaille","Œufs","Féculents","Tofu & protéines végétales"].includes(e.a);
      const key = mergeByKey ? "k:" + e.k : "n:" + norm(it.n);
      if (!map.has(key)) map.set(key, { key, name: it.n, aisle: e ? e.a : "Divers", parts: {}, names: {} });
      const g = map.get(key); g.names[it.n] = (g.names[it.n] || 0) + 1;
      const q = parseFloat(String(it.q).replace(",", ".")); const uk = unitKind(it.u);
      if (!q || isNaN(q) || uk === "z") { g.parts.z = g.parts.z || { q: 0, u: it.u || "au goût" }; return; }
      const pk = uk === "p" ? "p:" + norm(it.u) : uk;
      g.parts[pk] = g.parts[pk] || { q: 0, u: uk === "c" ? "c. à café" : uk === "s" ? "c. à soupe" : uk === "g" ? (norm(it.u) === "ml" ? "ml" : "g") : it.u };
      g.parts[pk].q += q; }); }); });
  const items = [...map.values()].map(g => { g.name = Object.entries(g.names).sort((a, b) => b[1] - a[1])[0][0];
    const parts = Object.entries(g.parts).filter(([k]) => k !== "z").map(([, p]) => { const q = Math.round(p.q * 10) / 10;
      if (norm(p.u) === "piece" || norm(p.u) === "pieces") return "× " + fmtN(q);
      const pl = q > 1 && ["tranche","feuille","pot","tasse","pincee"].includes(norm(p.u)) ? "s" : ""; return fmtN(q) + " " + p.u + pl; });
    g.qty = parts.length ? parts.join(" + ") : "selon le goût"; return g; });
  (S.shopExtra || []).forEach(x => { const e = lookup(x.n); items.push({ key: "x:" + x.id, id: x.id, extra: true, name: x.n, aisle: e ? e.a : "Divers", qty: qtyStr(x) || "selon le besoin" }); });
  return items;
}

function viewWeight(){
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date));
  const first = ws[0], last = ws[ws.length - 1];
  const today = new Date().toISOString().slice(0, 10);
  const stat = (v, l) => `<div class="stat"><span class="stat-v">${v}</span><span class="stat-l">${l}</span></div>`;
  return `<header class="pagehead"><div><h1 class="display">Suivi du poids</h1><p class="muted">Une pesée par semaine, le même jour et à la même heure, suffit pour suivre la tendance.</p></div></header>
    <div class="stats">${stat(first ? fmtN(first.kg) + " kg" : "—", "Départ")}${stat(last ? fmtN(last.kg) + " kg" : "—", "Actuel")}
      ${stat(first && last ? (last.kg - first.kg > 0 ? "+" : "") + fmtN(last.kg - first.kg) + " kg" : "—", "Évolution")}
      <div class="stat"><span class="stat-v"><input class="goal" data-bind="goal" value="${fmtN(S.goal)}" inputmode="decimal" aria-label="Objectif en kg"> kg</span><span class="stat-l">Objectif</span></div></div>
    <form class="weight-form" onsubmit="return false"><label class="field"><span>Date</span><input type="date" id="wDate" value="${today}"></label>
      <label class="field"><span>Poids (kg)</span><input id="wKg" inputmode="decimal" placeholder="78,0"></label><button class="btn primary" data-act="addWeight">Enregistrer la pesée</button></form>
    ${leversCard()}
    <div class="chart">${chartSvg(ws)}</div>
    ${ws.length ? `<ul class="wlist">${[...ws].reverse().map((x, i, arr) => { const prev = arr[i + 1]; const d = prev ? x.kg - prev.kg : null;
      return `<li><span>${new Date(x.date + "T12:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long", year: "numeric" })}</span><strong>${fmtN(x.kg)} kg</strong>
      <span class="muted">${d == null ? "" : (d > 0 ? "+" : "") + fmtN(d) + " kg"}</span><button class="icon del" data-act="delWeight" data-date="${x.date}" aria-label="Supprimer">×</button></li>`; }).join("")}</ul>` : ""}`;
}
function chartSvg(ws){
  if (ws.length < 2) return `<p class="muted center">La courbe apparaîtra à partir de deux pesées.</p>`;
  const W = 640, Hh = 220, p = 36, vals = ws.map(x => x.kg).concat([S.goal]);
  const min = Math.floor(Math.min(...vals) - 0.5), max = Math.ceil(Math.max(...vals) + 0.5);
  const t0 = new Date(ws[0].date).getTime(), t1 = new Date(ws[ws.length - 1].date).getTime() || t0 + 1;
  const X = d => p + (W - 2 * p) * ((new Date(d).getTime() - t0) / Math.max(1, t1 - t0));
  const Y = v => Hh - p + -(Hh - 2 * p) * (v - min) / Math.max(0.1, max - min);
  const pts = ws.map(x => `${X(x.date).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(" ");
  const ticks = []; for (let v = min; v <= max; v++) ticks.push(v);
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Courbe de poids">
    ${ticks.map(v => `<line x1="${p}" x2="${W - p}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${p - 8}" y="${Y(v) + 4}" class="axis" text-anchor="end">${v}</text>`).join("")}
    <line x1="${p}" x2="${W - p}" y1="${Y(S.goal)}" y2="${Y(S.goal)}" class="goal-line"/><text x="${W - p}" y="${Y(S.goal) - 6}" class="axis" text-anchor="end">objectif ${fmtN(S.goal)} kg</text>
    <polyline points="${pts}" class="curve"/>${ws.map(x => `<circle cx="${X(x.date)}" cy="${Y(x.kg)}" r="3.5" class="dot"/>`).join("")}</svg>`;
}
A.addWeight = () => { const d = $("#wDate").value, kg = parseFloat($("#wKg").value.replace(",", "."));
  if (!d || !kg || kg < 30 || kg > 250) return toast("Indique une date et un poids valides (ex. 77,4).");

const BAMBOO_DOC = "# Mode d'emploi du rice cooker Yum Asia Bamboo\n\nModèle **Bamboo, YUM-IH15/2/B**. Cuisson par induction (IH), logique floue « Umai ».\n\nCe fichier reprend le texte du mode d'emploi fourni par Olivier. Le texte anglais n'a pas été modifié. Seuls l'ordre des parties et les titres en français ont été ajoutés pour s'y retrouver. Le formulaire de questions et la visionneuse PDF du site Manuals+, qui entouraient le texte copié, ont été retirés.\n\n> **Contradictions dans le manuel lui-même.** Certaines durées par défaut ne sont pas les mêmes dans la section 3 et dans le tableau de la section 12. Les deux versions sont reproduites telles quelles. En cas de doute, l'écran de l'appareil fait foi.\n>\n> | Programme | Section 3 | Section 12 (tableau) |\n> |---|---|---|\n> | STEAM | 10 min par défaut, jusqu'à 1 h par paliers de **10 min** | 5 min par défaut, jusqu'à 1 h par paliers de **5 min** |\n> | PORRIDGE | 1 h 30 par défaut, de 1 à 3 h | 1 h par défaut, jusqu'à 3 h |\n> | SLOW COOK | 3 h par défaut, de 2 à 8 h | 2 h par défaut, jusqu'à 8 h |\n> | CAKE | 40 min par défaut, de 30 à 60 min | 50 min par défaut, de 30 min à 1 h 30 |\n>\n> Ce qui est commun aux deux versions : la vapeur dure au plus 1 h, le SLOW COOK dure de 2 à 8 h, et son temps est réglé en heures.\n\n## Sommaire\n1. [Programmes et boutons](#1-programmes-et-boutons)\n2. [Eau](#2-eau)\n3. [Durées](#3-durées)\n4. [Riz](#4-riz)\n5. [Vapeur (STEAM)](#5-vapeur-steam)\n6. [Slow cook et autres programmes](#6-slow-cook-et-autres-programmes)\n7. [Céréales et légumineuses](#7-céréales-et-légumineuses)\n8. [Précautions](#8-précautions)\n9. [Nettoyage et entretien](#9-nettoyage-et-entretien)\n10. [Dépannage](#10-dépannage)\n11. [Recettes du fabricant](#11-recettes-du-fabricant)\n12. [Caractéristiques, pièces et garantie](#12-caractéristiques-pièces-et-garantie)\n\n---\n\n## 1. Programmes et boutons\n\n### Description de l'appareil\nThe Bamboo Umai Induction Heating fuzzy logic rice cooker is a modern, multi-function cooking appliance built with high-quality manufacturing and years of expertise. It saves kitchen space by combining speciality rice cooking functions (white, short grain, brown, Yumami, GABA brown) with porridge, steam, slow cook, crust, and cake baking. The easy-to-use, state-of-the-art Korean Motouch control panel with adjustable timings simplifies cooking and produces delicious results.\n\n### Accessoires fournis\n- Rice spatula\n- Soup ladle\n- Measuring cup\n- Steam basket\n\n### Éléments principaux\n- Lid\n- Removable inner lid\n- Steam release\n- Gasket\n- Inner bowl\n- Control Panel\n- Outer body\n\n### Panneau de commande\nThe control panel features touch-sensitive buttons:\n\n- **START**: Press and hold for 2 seconds to activate the previously selected cooking program.\n- **CANCEL**: Press to cancel a program and return to standby mode. Press and hold for 2 seconds to turn the unit on/off when in standby.\n- **MENU**: Select from 10 automatic cooking programs (6 for rice). Each press cycles through the menu.\n- **QUICK COOK**: For quick white rice cooking only.\n- **KEEP WARM**: Press and hold for 2 seconds (when in standby) to activate Keep Warm mode. The button lights up, and a count-up clock appears.\n- **PRESET**: Allows setting a timer for delayed cooking up to 24 hours. Be cautious with perishable foods.\n- **HOURS / MINUTES**: Adjust cooking times for non-rice cooking menus and the preset function.\n\n### Utiliser les commandes\nThe unit features a touch-sensitive 'cool ice white' Motouch panel. The 'START', 'KEEP WARM', and 'CANCEL' buttons require a 2-second press and hold to activate, indicated by the button lighting up and a fan starting.\n\nTo turn off the unit when no program is selected, press and hold the 'CANCEL' button for 2 seconds. To switch the unit on, press the 'CANCEL' button.\n\n### Programmes de riz\n- **'WHITE'**: For long grain white rice (e.g., basmati, jasmine, Thai fragrant).\n- **'QUICK COOK'**: For white rice only, for faster cooking.\n- **'BROWN'**: For long or short grain brown rice.\n- **'SHORT GRAIN'**: For white short grain rice (e.g., pearl, sushi, Thai sticky rice). Refer to the table for water levels for sticky rice.\n- **'GABA'**: Soaks and 'activates' brown rice to release gamma-aminobutyric acid (GABA), known for health benefits.\n- **'YUMAMI'**: For any type of white rice. Enhances flavor by releasing sugars, making rice taste sweeter and 'moreish'.\n\n### Autres programmes\nPORRIDGE, STEAM, SLOW COOK, CRUST, CAKE (détails en sections 5 et 6).\n\n### Maintien au chaud (KEEP WARM)\nAfter cooking, the unit automatically switches to 'KEEP WARM'. You can activate it manually by pressing and holding 'KEEP WARM' for 2 seconds while in standby. The button lights up, and a count-up clock appears.\n\nThe 'Keep Warm' function lasts up to 24 hours, though rice may dry after 15 hours. You can extend freshness by adding a little water and stirring. To cancel 'KEEP WARM', press and hold 'CANCEL' for 2 seconds. If unplugged during Keep Warm, it will reactivate upon plugging back in; cancel it before selecting another setting.\n\n### Annuler un programme\nTo cancel a program, keep warm, or stop mid-cycle, press and hold the 'CANCEL' button for 2 seconds. The unit will switch to standby mode.\n\n### Départ différé (PRESET)\nThe 'PRESET' function allows you to set the appliance to have your rice or food ready at a specific time. It is available for all menu settings.\n\nTo set the timer:\n1. Press 'MENU' to select a cooking program (for non-rice programs, you can set the cooking time here).\n2. Press the 'PRESET' button; it will light up.\n3. Use 'Hr' and 'Min' buttons to select the desired ready time.\n4. Press and hold 'START'. The cooker will display the selected time, count down, and complete the cycle at the specified time.\n\nIf the preset time is set below the minimum stated, the cooking cycle will start immediately. This accounts for the default cooking time and fuzzy logic assessment time.\n\nSuggested timings for the 'PRESET' function:\n\n| Function | RICE | PORRIDGE | YUMAMI | STEAM | SLOW COOK | GABA |\n|---|---|---|---|---|---|---|\n| Preset timings | 70 mins to 24 hrs | 70 mins to 24 hrs | 70 mins to 24 hrs | 1 hr to 24 hrs | 130 mins to 24 hrs | 150 mins to 24 hrs |\n\nNote: Be aware that perishable foods should not be left for long periods when using the 'PRESET' function, as they may spoil.\n\nThe start time of the preset/timer is not exact; it may come on slightly earlier as Bamboo assesses the contents (rice/oats/water) and volume to calculate cooking time effectively.\n\n---\n\n## 2. Eau\n\n- **Riz** : fill to the corresponding water line for the amount/type of rice (repères gradués de la cuve).\n- **1 cup of rice**: use the measuring cup for water: 1 cup water for white rice, 1½ cups for brown rice.\n- **Précision** : The water amount significantly affects texture. For perfect rice, fill to the underside of the corresponding line on the inner bowl. For softer rice, fill to the top of the line; for harder rice, fill 2-3mm below the line.\n- **Ajustement** : If rice is too soft, reduce water by 3-4mm next time. If too hard, add 3-4mm more water.\n- **Riz gluant** (sticky or glutinous rice requires more water, use the short grain setting):\n\n| Cups of rice | 1 | 2 | 3 | 4 | 5 | 6 | 7 |\n|---|---|---|---|---|---|---|---|\n| Water level (short grain marks) | 1.5 | 2.5 | 3.5 | 4.5 | 5.5 | 6.5 | 7.5 |\n\n- **Vapeur seule** : Fill to the 2-3 water level mark for stand-alone steaming. / This appliance can be used as a stand-alone steamer (using 1.5-2 cups of water). / Ensure water is at least to the two cup mark. / Using hot water speeds up heating.\n- **Quinoa** : 1:1 ratio of quinoa to water (1:1.25 for black quinoa).\n- **Millet** : ¼ cup millet + 1 cup water per portion (e.g., 1 cup millet = 4 cups water).\n- **Couscous, lentilles, haricots, orge perlé** : follow water levels on the pack.\n- **Porridge d'avoine** : Do not use milk to cook oats; it can cause a 'boil over'. Only use water.\n\nLa « cup » est le gobelet fourni : **180 ml**, arasé.\n\n---\n\n## 3. Durées\n\n### Approximate Cooking Times (section 12)\n\n| FEATURE | CAPACITY (cups or litres) | APPROXIMATE COOKING TIMES |\n|---|---|---|\n| Quick cook rice | 1-8 cups/1.4l | 29 minutes |\n| White Long grain rice | 1-8 cups/1.4l | 35 minutes |\n| White Short grain rice | 1-8 cups/1.4l | 39 minutes |\n| Yumami (white) rice | 1-8 cups/1.4l | 66 minutes (1 hr, 6 minutes) |\n| Brown rice | 1-6 cups/0.9l | 63 minutes (1 hr, 3 minutes) |\n| GABA (brown) rice | 1-6 cups/0.9l | 145 minutes (2 hrs, 25 mins) |\n| Porridge (oat or rice) | 1 cup/0.18l | 1 hour, can be adjusted to 3 hours maximum |\n| Steam | Water to 2 cup rice mark | 5 minutes, can be adjusted up to 1 hour maximum in 5 mins intervals |\n| Slow Cook | 1.5 litres | 2 hours, can be adjusted to 8 hours maximum |\n| Crust | 1-8 cups/1.4l | 1.5 hours, can be adjusted down to 1 hour or up to 2 hours maximum |\n| Cake | 600g of all ingredients | 50 mins, can be adjusted down to 30 mins and up to 1.5 hours maximum in 5 mins intervals |\n\n### Durées indiquées en section 3\n\n| Programme | Texte du manuel |\n|---|---|\n| PORRIDGE | Default time is 1.5 hours, adjustable from 1 to 3 hours using 'Hr' or 'Min' buttons. |\n| STEAM | Default time is 10 minutes, adjustable up to 1 hour in 10-minute intervals. A countdown appears once water heats up. |\n| SLOW COOK | Default time is 3 hours, adjustable from 2 to 8 hours. |\n| CRUST | Default time is 1.5 hours, adjustable from 1 to 2 hours. |\n| CAKE | Default time is 40 minutes, adjustable from 30 to 60 minutes in 5-minute intervals. |\n\nProgrammes de riz (section 3) :\n\n| Rice Selected | 'WHITE' | 'QUICK COOK' | 'BROWN' | 'SHORT GRAIN' | 'GABA' | 'YUMAMI' |\n|---|---|---|---|---|---|---|\n| Time taken | 35 mins | 29 mins | 63 mins | 39 mins | 145 mins | 66 mins |\n\n---\n\n## 4. Riz\n\nNote: Maximum capacity is 8 cups (180ml) for WHITE rice and 6 cups (180ml) for BROWN rice.\n\nBamboo cooks rice using 7 distinct phases with IH Umai fuzzy logic for optimal nutrient retention and refined cooking, especially for GABA brown and Yumami settings.\n\nDuring cooking, a chasing lines pattern appears on the display, with a countdown in the last 10 minutes.\n\n### Première utilisation\n1. Unpack the appliance and remove all packaging materials.\n2. Remove accessories and the operating manual.\n3. Remove any promotional stickers and wipe the appliance with a damp cloth.\n4. Wash the inner bowl and lid in warm, soapy water with a soft sponge, then dry thoroughly.\n5. Cook 0.5 cup of rice (with water filled to the 1/2 mark on the measuring cup) and discard it to prepare the cooker.\n\n### Cuire le riz\n1. Measure rice using the provided cup, leveling it at the top (180ml).\n2. Clean rice if necessary. Place the inner bowl in the appliance, add rice, and fill to the corresponding water line for the amount/type of rice.\n3. Close the lid and select the desired rice setting.\n4. Press and hold 'START' to begin cooking.\n\nRefer to the 'Speedy Start Guide' on the warranty card for a step-by-step guide and page 13 for more detailed tips.\n\nFor 1 cup of rice, use the measuring cup for water: 1 cup water for white rice, 1½ cups for brown rice.\n\n### How to cook perfect rice\n- **Measure accurately**: Use only the provided 180ml measuring cup and level the rice.\n- **Rinse the rice**: Use a separate bowl or sieve. Stir loosely by hand and drain 2-3 times until the water runs clear. Avoid washing rice in the inner bowl to prevent scratches.\n- **Be accurate with water**: The water amount significantly affects texture. For perfect rice, fill to the underside of the corresponding line on the inner bowl. For softer rice, fill to the top of the line; for harder rice, fill 2-3mm below the line.\n- **Stir and loosen**: Once cooking is finished and the unit switches to 'KEEP WARM', stir and loosen the rice with the spatula to release excess moisture and achieve fluffy rice.\n\n### Our tips for rice cooking\n- Choose rice with few broken grains, as they make rice soggy and sticky.\n- Rice batches vary in water absorption and age. Newer rice may need less water.\n- If rice is too sticky, try rinsing less or not at all for certain varieties.\n- If rice is too soft, reduce water by 3-4mm next time. If too hard, add 3-4mm more water.\n- ❌ Do not use quick cook, partially cooked, or parboiled rice, as they are not suited for this type of rice cooker.\n\n### GABA brown\nThe GABA brown rice function uses specific timing and temperatures to allow brown rice to germinate. It soaks and activates the brown rice using the Umai fuzzy logic control, then phases into the cooking process. During this, the inner bowl and contents are kept at a specific temperature to enable the rice to 'sprout'. The full cooking time, including activation, is approximately 2 hours 25 minutes. This process enhances flavor and increases nutrients like gamma-aminobutyric acid (GABA), resulting in a softer texture and nuttier flavor.\n\nNutritional Value Comparison:\n- **WHITE RICE (DEAD)**: Nutritional Value: Carbohydrates. Components: Endosperm.\n- **BROWN RICE (ASLEEP)**: Nutritional Value: Dietary Fibre, Vitamins, Minerals. Components: Endosperm, Bran, Cereal Germ.\n- **GABA RICE (ALIVE)**: Nutritional Value: Rich in Gamma-Aminobutyric Acid (GABA), Band E Vitamins, Calcium, Potassium, Magnesium, and more. Components: Endosperm, Bran, Cereal Germ.\n\n### Yumami\nThe 'Yumami' or 'extra tasty' rice function enhances the flavor of any white rice using a specially designed cooking cycle. It involves soaking and steaming to release sugars, which are then reabsorbed into the rice, altering their chemical structure and attaching to the rice surface. This process activates Umami receptors on the tongue, resulting in more flavorful rice with improved texture and taste. The rice is typically fluffier, softer, and sweeter. The full cooking time for Yumami is 1 hour and 6 minutes.\n\n---\n\n## 5. Vapeur (STEAM)\n\n### Programme\nUse the provided steaming basket for various foods. Default time is 10 minutes, adjustable up to 1 hour in 10-minute intervals. A countdown appears once water heats up. Using hot water speeds up heating. Fill to the 2-3 water level mark for stand-alone steaming. See Section 5, page 14 for steaming guide.\n\n### Utilisation\nThis appliance can be used as a stand-alone steamer (using 1.5-2 cups of water) or to steam food while cooking rice. If steaming with rice, use the rice function for the rice and add the steaming basket above the rice in the inner bowl.\n\n### Guide des temps de cuisson vapeur\n\n| INGREDIENTS | AMOUNT | COOKING TIME | TIPS FOR STEAMING |\n|---|---|---|---|\n| Carrot | 200g/1 pc | 20 mins | Cut into bite-size pieces |\n| Broccoli | 200g | 15 mins | Cut into bite-size pieces |\n| Spinach | 100g | 15 mins | Cut into bite-size pieces |\n| Pumpkin | 250g | 20 mins | Cut into bite-size pieces |\n| Potato | 450g | 40 mins | Cut into bite-size pieces |\n| Sweet Potato | 300g | 35 mins | Cut into bite-size pieces |\n| Corn | 200g | 30 mins | Cut into bite-size pieces |\n| Chicken | 300g/1 fillet | 30 mins | Make cuts on side touching steam basket |\n| Fish (white fish & salmon) | 150g | 25 mins | Slice to less than 2cm and wrap in foil |\n| Prawn/Scallops | 15pcs/150g | 20 mins | Prawns - Steam without removing shells. Scallops - Remove from shell |\n| Refrigerated Meat Dumpling | 200g | 15 mins | Leave space between foods |\n| Frozen Meat Dumpling | 200g | 20 mins | Leave space between foods |\n\n**IMPORTANT: Do not steam food over 3.5cm thick.**\n\nIf combining rice and steaming, it's recommended to use a maximum of 3 cups of rice. Any more may cause the steaming basket to push into the lid.\n\nWhen cooking rice and steaming simultaneously, you can carefully open the lid mid-cycle to add the steaming basket, preventing vegetables from overcooking.\n\n---\n\n## 6. Slow cook et autres programmes\n\n### SLOW COOK\nFor stews, curries, dhal, etc. Default time is 3 hours, adjustable from 2 to 8 hours. Heats to 97°C, then 87°C for slow cooking. This function is more efficient than conventional slow cookers, cooking recipes in 3-4 hours that normally take 7-8 hours.\n\nSwitches to 'KEEP WARM' upon completion.\n\nCapacité : 4 litre slow cooker (spécifications) ; tableau des temps : 1.5 litres, 2 hours, can be adjusted to 8 hours maximum.\n\n### PORRIDGE\nSuitable for Asian rice porridge or oatmeal porridge. Default time is 1.5 hours, adjustable from 1 to 3 hours using 'Hr' or 'Min' buttons. Switches to 'KEEP WARM' upon completion.\n\n### CRUST\nFor Persian style 'Tahdig' rice. Default time is 1.5 hours, adjustable from 1 to 2 hours. You can open the lid after a period to add ingredients (butter, oil, spices). Switches to 'KEEP WARM' upon completion.\n\n### CAKE\nFor delicious, moist cakes. Default time is 40 minutes, adjustable from 30 to 60 minutes in 5-minute intervals. Switches to 'KEEP WARM' upon completion. See Section 6, page 15 for cake baking instructions.\n\nHow to bake cake:\n1. Grease the inner bowl lightly and evenly with butter or oil.\n2. Prepare the cake batter. Avoid using too much baking powder or soda, which can cause the cake to rise too high. The maximum weight for all ingredients is 600g.\n3. Place the inner bowl on a flat surface, add the cake mixture, and gently tap the underside of the bowl several times to release air bubbles.\n4. Place the inner bowl into the appliance and close the lid. Select the 'CAKE' setting. Adjust the cooking time from the default 40 minutes (30 to 60 minutes in 5-minute intervals). Press and hold 'START' for 2 seconds to begin.\n5. Once cooking is finished, the appliance switches to 'KEEP WARM'. Test the cake with a toothpick. If not cooked, cancel 'KEEP WARM' (hold 'CANCEL' for 2 seconds) and re-select 'CAKE' to cook longer.\n\nSee page 17 for cake recipes.\n\nNOTE: Do not place other cake pans or wax paper into the appliance or inner bowl, as this may cause malfunction or deform the bowl.\n\n---\n\n## 7. Céréales et légumineuses\n\nThis rice cooker can also prepare other grains and pulses. Here is a guide for cooking times/settings:\n\n- **QUINOA**: Rinse well in cold water. Use a 1:1 ratio of quinoa to water (1:1.25 for black quinoa). Use the 'Quick Cook' setting. Fluff and keep warm for 5-10 minutes after cooking.\n- **COUS COUS and GIANT COUS COUS**: Use water levels indicated on the packet and the 'Quick Cook' setting.\n- **MILLET**: For each portion, measure ¼ cup millet into the inner bowl and add 1 cup water (e.g., 1 cup millet = 4 cups water). Add a pinch of salt. Select the 'Porridge' cycle. Adjust timing for desired consistency or use the preset timer. Add flavorings after cooking.\n- **LENTILS and BEANS**: Use the 'Slow Cook' setting. Rinse beforehand and follow water levels on the pack. The 'Porridge' setting can also be used for lower temperatures.\n- **PEARL BARLEY**: Use the 'Slow Cook' setting. Rinse before cooking and follow water levels on the pack. A large batch for soup will cook within an hour.\n\n---\n\n## 8. Précautions\n\n### Avertissements d'ouverture\nATTENTION! Read these instructions carefully before use. They contain important safety information and recommendations for proper appliance use and maintenance.\n\n- Do not place electronics or objects susceptible to magnets near the rice cooker, as this may cause interference or erase magnetically recorded data.\n- ⚠️ Individuals with pacemakers should consult a doctor before using Induction Heating appliances, as this rice cooker may affect a pacemaker.\n- Do not place on or near an Induction Cooking Hob, as this may cause the Bamboo to malfunction or break.\n\n### Important safeguards\nTHESE WARNINGS AND CAUTIONS ARE INTENDED TO PREVENT PROPERTY DAMAGE OR PERSONAL INJURY TO YOU AND OTHERS.\n\n**Pendant la cuisson**\n- Do not open the lid or move the rice cooker during the cooking cycle, as the steam is very hot and may cause burns.\n- Do not touch the steam vent. Doing so may cause scalding or burns. Take special care with children.\n- Do not cover the main body of the rice cooker, especially the steam vent, while cooking.\n- Do not cook when the inner bowl is empty, as this may cause breakdown.\n- This rice cooker is for cooking rice and other dishes detailed in this manual. Do not use for unintended purposes. Always follow operating instructions and never cook: Foods packed in plastic; Dishes covered with paper towels or other lids (this may clog the steam vent).\n- Do not touch hot surfaces during or immediately after use. Be careful of steam when opening the lid and avoid touching the inner bowl while stirring. Touching hot surfaces with metal parts may cause burns.\n- Do not damage the inner bowl or inner lid; a deformed one will cause uneven cooking.\n- Ensure nothing is stuck to the heating element or the outside of the bowl, as this will cause uneven cooking.\n- Do not use any parts other than those supplied with this rice cooker.\n\n**Installation**\n- ♨️ Allow enough space next to walls, furniture, and under shelves for steam to escape.\n- Do not place or use this rice cooker on an uneven surface or a surface vulnerable to heat, as this may cause fire.\n- ⚠️ Do not use this rice cooker on a slide-out table or shelf with insufficient load capacity (minimum 18kg load-bearing capacity required). Doing so may cause the cooker to fall, resulting in injury or burns.\n- Do not cover the fan vents on the side and bottom.\n- Do not use on surfaces where air vents underneath could get blocked (e.g., paper, carpet, plastic).\n- Do not use this rice cooker where it may come into contact with water or other heat sources.\n- ☀️ Do not use the rice cooker in direct sunlight, as this may cause discolouration.\n- ⚠️ Do not use where steam may contact other appliances, as it may cause discolouration, malfunction, or fire.\n\n**Électricité et eau**\n- Do not modify this rice cooker; only a repair technician may disassemble or repair it.\n- Do not plug or unplug the power cord with wet hands, as this may cause electric shocks or injury.\n- Do not immerse the rice cooker in water or splash with water, as this may cause a short circuit or electric shocks.\n- Do not splash water on the rice cooker; this may cause breakdown, fire, or electric shock.\n- Do not put any metal objects in the air vents, as this may cause electric shocks or malfunction.\n- ❗ Insert the power plug completely and securely into the electrical socket.\n- ❗ A loosely inserted power plug may cause fire, electric shocks, short circuit, smoke, or fire. Use only an electrical outlet rated at 15 amperes minimum. If changing the power cord, use one with a similar rating (250v, 13A).\n- ❗ If the plug blades are dirty, wipe them clean. Debris on the blades can cause fire.\n- Do not use if the power cord or plug is damaged or loosely inserted. Doing so may cause electric shocks, short circuit, or fire.\n- Do not damage the power cord. Do not bend, twist, bundle, or attempt to modify the power cord. Do not place the cord on or near high-temperature surfaces, under heavy items, or between objects. A damaged power cord can cause electric shocks or fire.\n- Insert the power cord firmly into the rice cooker; otherwise, it may cause electric shocks, fire, or malfunction.\n- Always unplug the rice cooker by holding the power plug, not the cord.\n- Unplug the power cord from the electrical socket when not in use.\n- Allow the rice cooker to cool down before cleaning. Hot parts may cause burns.\n\n**Usage**\n- ⚠️ This device may be used by children aged 8 years and older, and by persons with reduced physical, sensory or mental capabilities or lacking experience and knowledge, if they have received supervision or instructions concerning safe use and understand the hazards involved.\n- ⚠️ Cleaning and maintenance by the user is not to be carried out by unsupervised children. Children must not play with the appliance.\n- ⚠️ This appliance is intended for household use only. Commercial use will void the warranty.\n\n**Stop using immediately if you notice ANY of the following:** The power plug or cord is very hot; the power cord is damaged or turns on/off when touched; the body is deformed or unusually hot; smoke or a burning smell is present; any part is cracked, loose, or unstable.\n\n**Rappels utiles aux recettes** (textes repris des autres sections)\n- Do not steam food over 3.5cm thick.\n- If combining rice and steaming, it's recommended to use a maximum of 3 cups of rice.\n- Do not place other cake pans or wax paper into the appliance or inner bowl, as this may cause malfunction or deform the bowl.\n- Do not pour vinegar into the inner bowl, as it will damage the ceramic coating.\n- Do not use milk to cook oats; it can cause a 'boil over'. Only use water.\n- Be aware that perishable foods should not be left for long periods when using the 'PRESET' function, as they may spoil.\n- Do not keep very small amounts of rice on 'KEEP WARM' for more than 12 hours.\n\n---\n\n## 9. Nettoyage et entretien\n\nAlways remove food remnants and clean immediately after use.\n\n- Do not use metal brushes, scrubbers, or harsh chemicals.\n- Do not immerse the appliance in water. Use a damp sponge or soft cloth for the outer case.\n- Do not wash rice in the inner bowl, as this can cause scratches and deteriorate the coating. Damage from washing rice in the bowl is not covered by warranty.\n- **IMPORTANT: Never put the inner bowl or inner lid into a dishwasher.** The chemicals and washing cycle are too harsh. Damage from dishwasher use is not covered by warranty.\n\n**Inner lid care** — The inner lid is removable. Push the lock release upwards to detach. Wash the lid with a sponge in soapy water after each use. To reattach, slide the bottom section behind the grooves and push the top until it clicks.\n\n**Important inner bowl care** — Use only the provided plastic accessories, or wooden or silicone ones. Never use metal, as it will damage the ceramic coating. If food is stuck, pre-soak with a little washing-up liquid. Do not pour vinegar into the inner bowl, as it will damage the ceramic coating.\n\nThe outside (underneath) of the inner bowl may discolour and scuff due to heat; this is normal. The ceramic coating may also change color over time, which is normal.\n\n**Steam cap care** — The steam cap on the lid is removable. Wash it regularly. It can be fully disassembled for thorough cleaning.\n\n**Condensation collector care** — The condensation collector on the back is removable. Pull the small handle straight out. Remove, empty, wash, dry, and reinstall.\n\n---\n\n## 10. Dépannage\n\n### Cooking rice\n\n| PROBLEM | POSSIBLE CAUSE |\n|---|---|\n| Rice cooks too hard or too soft | Appliance not on a flat surface. Rice processing varies (see section 5.3). 'PRESET' function used for too long. 'QUICK COOK' setting used. Inner bowl deformed. Rice not loosened after cooking (excess water). Something stuck to the cooker or inner bowl. Rice not washed enough (too much starch). Inner bowl deformed. Incorrect 'MENU' setting or water level. Steam vent cap not on. |\n| Rice is scorched/burnt | Inner bowl deformed. Check 'MENU' setting and water level. Steam vent cap not on. |\n| Boils over while cooking | Check 'MENU' setting and water level. Steam vent cap not on. |\n\n### Cake baking\n\n| PROBLEM | POSSIBLE CAUSE |\n|---|---|\n| Unable to start cooking or buttons won't respond | Power cord not fully inserted. 'START', 'KEEP WARM', 'CANCEL' buttons require 2-second press. |\n| A noise is heard during cooking or keep warm | All IH rice cookers have a fan to adjust temperature; this is normal. |\n| Steam comes out from between the outer lid and main body | Outer lid not fitting properly or deformed. Outer lid gasket is dirty (clean it). |\n| Cake is not cooked or doesn't rise | Cooking time too short. Egg whites not beaten to foamy consistency. Egg whites beaten too much (causes collapse). Inaccurate ingredient measurement. Over-mixing batter. Too many additional ingredients. Batter left too long before baking. Baking powder/soda added (can cause excessive rise, but lack of it can prevent rise). |\n| Cake rises too much | Too much baking powder or baking soda added. |\n| Cake is difficult to release from the inner bowl | Inner bowl not greased well. Cake not cooled completely. |\n| The cake breaks easily | Cake needs to cool completely before turning out. |\n| The cake is scorched/burnt | Inner bowl deformed. Cooking time too long. |\n\nNOTE: Do not place other cake pans or wax paper into the appliance or inner bowl, as this may cause malfunction or deform the bowl.\n\n### Steaming\n\n| PROBLEM | POSSIBLE CAUSE |\n|---|---|\n| Food does not steam | Insufficient water for steaming (ensure water is at least to the two cup mark). Too much food in the steaming basket (reduce amount or increase time). Food pieces too large (reduce size or increase time). |\n| Steamed food is too hard | Vegetables: Steaming time too short. Ensure enough water and continue steaming. Fish and meat: Steaming time too long. Reduce cooking time. |\n| Steamed food is cold | Too much time elapsed since cooking cycle ended. Remove immediately from appliance and eat. |\n\n### Keep warm\n- Do not keep very small amounts of rice on 'KEEP WARM' for more than 12 hours.\n- Rice type and water may cause yellowing. Was the spatula left in the inner bowl whilst on 'KEEP WARM'?\n- Rice not loosened immediately after cooking.\n\n---\n\n## 11. Recettes du fabricant\n\nExplore these recipes to get started. For more recipes like flavored rice, risotto, stews, and soups, visit our foodie blog at [www.greedy-panda.com](https://www.greedy-panda.com).\n\n> Ces recettes sont reproduites telles quelles. Plusieurs contiennent des ingrédients exclus du protocole de Cat (vinaigre, citron, wasabi, oignon nouveau…) : elles servent seulement de référence pour les réglages.\n\n### Rice porridge (congee)\nIngredients (4-5 servings): 1 cup of rice; 75g chicken thighs, chopped and parboiled; Pinch of salt; Ginger and spring onion (scallion), shredded – to taste.\n\n1. Wash rice, place in inner bowl, add water (follow inner bowl levels), then place chicken on top.\n2. Press 'MENU', select 'PORRIDGE', and press and hold 'START'.\n3. When the cooker switches to 'Keep Warm', add salt if desired and garnish with ginger and spring onions.\n\n### Oatmeal porridge\nIngredients (serves 4 – do not exceed quantities): 1 cup steel cut or high-quality large rolled oats (sieve and shake hard 3-4 times to dislodge sediment); 3 cups water (measured in provided cup); 1 cup milk (or coconut milk or other non-dairy milk); 3-4 spoons (or to taste) honey or brown sugar. Experiment with oat and water amounts for desired thickness.\n\n1. Place oats and water in the inner cooking pan.\n2. Place the pan in the cooker, plug in, select 'PORRIDGE', and adjust timing (longer = thicker, shorter = thinner). Press and hold 'START'.\n3. When it switches to keep warm, open the lid, stir, and add remaining ingredients. Soaking oats overnight using the Timer function softens texture.\n\nAdd dried or fresh fruit instead of sugar for a healthy option.\nDo not use milk to cook oats; it can cause a 'boil over'. Only use water.\n\n### Sushi rolls\nIngredients (4-5 servings): 3 cups of rice. For sushi seasoning (vinegar mix): 4 tbsp rice vinegar, 1 tbsp sugar, 1.5 tsp salt. Toppings: sashimi, prawns, pickles, natto, salmon roe, eel. Garnish: Seaweed, wasabi, soy sauce, pickled red ginger.\n\n1. Wash rice, place in inner bowl, add water (follow levels), use 'SHORT GRAIN' option.\n2. When it switches to 'Keep Warm', place rice in a clean, wet-cloth-wiped wooden container. Pour vinegar mix over rice, mixing while cooling with a fan.\n3. Wrap your chosen ingredient with nori (seaweed).\n\n### Rice pudding\nIngredients (cup measures are for the rice measuring cup, 4-6 servings): 2 cups arborio, short-grain, or sticky/glutinous rice; ½ cup evaporated milk; ½ cup coconut milk; 1 cup sweetened condensed milk; 1 cinnamon stick or pinch of ground cinnamon; 1 lemon zest, one large piece of lemon peel; ½ teaspoon nutmeg (or less if preferred); A sprinkle of ground cinnamon (to garnish).\n\n1. Measure short grain rice with the provided cup.\n2. Rinse rice in cold water, place rice and water (to correct line) in the cooker, select 'SHORT GRAIN'.\n3. Whisk evaporated milk, coconut milk, condensed milk, cinnamon, lemon zest, and nutmeg together.\n4. When rice is cooked and on 'Keep Warm', add the whisked milks to the rice, close lid. Check consistency after 30 minutes.\n5. Discard cinnamon stick (if used) and lemon zest.\n6. Serve in individual dishes, garnish with ground cinnamon and cream if desired.\n\n** Vegan adaptation: Omit evaporated and condensed milk. Use one whole tin of coconut milk and some non-dairy milk to loosen if needed after stage 5.\n\n### Cakes\nFor cakes, use a ready-made mix or follow the guidance on maximum ingredients for homemade batter.\n\n**Banana cake** — Ingredients: 3 eggs; 110g sugar; 110g melted butter; 200g very ripe bananas (weight without skin); 160g plain flour; 3/4 tsp baking powder; 3/4 tsp baking soda; A pinch of salt, less than 1/8 tsp; Butter for greasing the inner bowl.\n\n1. Sift flour, baking powder, soda, and salt. Melt butter and sugar, let cool. Mash bananas.\n2. Beat eggs into butter/sugar mixture.\n3. Add mashed bananas and mix.\n4. Fold in sifted flour mixture.\n5. Pour batter into greased bowl. Tap the bottom of the bowl several times to remove air bubbles.\n6. Select 'CAKE' and set time to at least 50 minutes. Test with a toothpick after the cycle. If not firm or mixture sticks, cook longer.\n7. Remove bowl and let cake cool. Invert onto a plate.\n8. Serve with whipped cream, ice cream, caramel sauce, or enjoy as is.\n\n**Fudge cheesecake** — Ingredients: 200g Cream cheese; 50g sugar; 30g sugar (for beating egg whites); 3 eggs (separate yolk from white); 30g all-purpose flour – sifted; 30ml fresh cream; 4 tsp lemon juice; Vanilla extract to taste; 20g butter, melted (for greasing inner bowl).\n\n1. Grease the inner bowl. Soften cream cheese (microwave for 30 seconds if needed).\n2. Mix cream cheese until smooth, add sugar.\n3. Add yolks one at a time. Blend in flour, cream, lemon juice, vanilla, and melted butter. Add fudge pieces.\n4. In a separate bowl, beat egg whites until foamy. Gradually add sugar to form meringue.\n5. Gently fold meringue into cream cheese mixture.\n6. Pour batter into the inner bowl. Tap the bottom several times to release air bubbles. Place bowl in cooker and close lid.\n7. Press 'MENU', select 'CAKE', set cooking time to 60 minutes, and press 'START'.\n8. When baking is complete, allow to cool, then carefully invert onto a pastry case or biscuit base.\n\n---\n\n## 12. Caractéristiques, pièces et garantie\n\n### Specifications\n\n| | |\n|---|---|\n| Model name and number | Bamboo, YUM-IH15/2/B |\n| Capacity | 1.5 litre (1 to 8 cups) rice cooker or 4 litre slow cooker |\n| Rating | AC 220-240V, 50-60Hz |\n| Electric consumption | 1110W |\n| Average power consumption on 'KEEP WARM' | 45W |\n| Cooking system | Induction Heating |\n| Country of manufacture | China |\n| Length of power cord | 1m |\n| External dimensions (approximate) | 37cm (length) x 27cm (width) x 24cm (height) |\n| Weight (approximate) | 5.5kg |\n\nModels: YUM-IH152, YUM-IH15B, YUM-IH15.\n\n### Replacement parts\nFor spare parts, contact Yum Asia via their website ([www.yum-asia.com](https://www.yum-asia.com)) or email (hello@yum-asia.com). Measuring cups are also available on the website.\n\n| Part Name | Part Number |\n|---|---|\n| Ceramic coated inner bowl | IB-IH15 |\n| Detachable inner lid | ILSS-IH15 |\n| Steaming basket | SB-IH15 |\n\n### Power cord wiring\nIMPORTANT! The wires in the mains power c const COOK_RE = /(plaque \d|\bfeu\b|\bfour\b|°C|mijot|bouill|frémi|vapeur|poêl|saisir|dorer|rôtir|griller|gratiner|frire|pocher)/i;

const FR_COMMON = {
  f: ["œufs","blanc de poulet","tofu ferme","carotte","courgette","potimarron","butternut","épinards","haricots verts","aubergine","brocoli","panais","persil","ciboulette","thym","bouillon","lait de riz"],
  g: ["riz basmati","pommes de terre","quinoa","soba","flocons d'avoine","farine de sarrasin","protéine de pois texturée","okara d'amande","huile d'olive","huile de sésame grillé"]
};
let FR = { min: 0 };
const pantryHas = n => S.pantry.some(p => norm(p.n) === norm(n));
const KEY_GROUPS = [["riz cuit","riz cru","riz basmati","riz"],["oeuf","oeufs"],["quinoa cuit","quinoa"],["soba cuites","soba"],["tofu ferme","tofu"],
  ["proteine de pois texturee","proteine de pois texturee (seche)"],["proteine de soja texturee","proteine de soja texturee (seche)"],["blanc de poulet","poulet"],["huile d'olive","huile"],["flocons d'avoine","avoine"]];
const canonKey = k => { for (let g = 0; g < KEY_GROUPS.length; g++) if (KEY_GROUPS[g].indexOf(k) >= 0) return "g" + g; return k; };
const DB_KEYS = new Set(ING_DB.map(e => e.k));
const hasWord = (hay, nd) => (" " + hay + " ").indexOf(" " + nd + " ") >= 0;
/* deux noms correspondent s'ils désignent le même produit ; un texte libre (« riz ») peut être contenu dans un nom connu (« riz cuit ») */
function keyMatch(a, b){
  if (!a || !b) return false; if (a === b || canonKey(a) === canonKey(b)) return true;
  if (DB_KEYS.has(a) && DB_KEYS.has(b)) return false;
  return (a.length >= 3 && hasWord(b, a)) || (b.length >= 3 && hasWord(a, b));
}
function essentialIng(i){
  const e = lookup(i.n), uk = unitKind(i.u);
  if (e) { if (e.k === "eau" || e.a === "Herbes & aromates") return false; if (e.a === "Épicerie" && (uk === "c" || uk === "s" || uk === "z")) return false; }
  else if (i.q === "" || i.q == null) return false;
  return !/\b(sel|poivre)\b/.test(norm(i.n));
}
function fridgeResults(){
  const keys = S.pantry.map(p => ingKey(p.n)); if (!keys.length) return [];
  return S.recipes.map(r => {
    const ess = r.ing.filter(essentialIng); if (!ess.length) return null;
    const have = [], miss = []; ess.forEach(i => (keys.some(k => keyMatch(k, ingKey(i.n))) ? have : miss).push(i));
    const st = seasonState(r);
    return { r, score: Math.round(have.length / ess.length * 100), have, miss, sea: !!(st && st.all) };
  }).filter(x => x && x.have.length).sort((a, b) => b.score - a.score || a.miss.length - b.miss.length || (b.sea - a.sea));
}
