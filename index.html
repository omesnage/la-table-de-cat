  "L'écrasé — Écraser grossièrement les pommes de terre à la fourchette avec l'huile d'olive crue ({{huile d'olive}}), la ciboulette ciselée ({{ciboulette}}, pointes vertes), une cuillère d'eau de la cuve et une pincée de sel. [[ecraser; ciseler]]",
  "Dressage — Écrasé de pommes de terre au centre de l'assiette creuse tiède, tranches de tofu fumé en éventail dessus, brocoli et pâtisson autour. [[dresser x3]]"],
 tip:"Le tofu fumé parfume tout le plat : une petite portion, une fois par semaine au plus."}),

RC({id:"l-veloute-celeri-tofu-soyeux", n:"Velouté de céleri-rave et pomme de terre, tofu soyeux & carottes fondantes", cat:"Tofu", st:"Cocon & purées", base:"Pommes de terre", d:1,
 ing:[["tofu soyeux",100,"g"],["pommes de terre",140,"g"],["céleri-rave",60,"g"],["carotte",100,"g"],["bouillon",200,"ml"],["huile d'olive",1,"c. à café"],["persil","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("un économe, une planche et un couteau, une petite casserole, un mixeur plongeant avec son verre, une assiette creuse tiède"),
  "Mise en place — Éplucher épais le céleri-rave ({{céleri-rave}}) et le couper en cubes de 2 cm. Éplucher les pommes de terre ({{pommes de terre}}) et la carotte ({{carotte}}) et les couper en cubes de 2 cm. Égoutter le tofu soyeux ({{tofu soyeux}}) et le couper en cubes de 2 cm à la cuillère. [[sortir; eplucher celeri-rave; couper celeri-rave; eplucher pommes de terre; couper pommes de terre; eplucher carotte; couper carotte; couper tofu soyeux]]",
  c1(30, "le céleri-rave, les pommes de terre et la carotte", "Tout s'écrase entre deux doigts."),
  "Le bouillon — Pendant le cycle, chauffer le bouillon ({{bouillon}}) dans la petite casserole sans le faire bouillir. [[// casserole; cuisson 4]]",
  "Le velouté — Mixer le céleri-rave, les pommes de terre et la moitié de la carotte avec le bouillon chaud et une pincée de sel jusqu'à un velouté épais et lisse. Y glisser les cubes de tofu soyeux 2 minutes pour qu'ils tiédissent. [[mixer; attente 2]]",
  "Dressage — Velouté dans l'assiette creuse tiède, cubes de tofu soyeux au centre, rondelles de carotte restantes autour, huile d'olive crue ({{huile d'olive}}) et persil ciselé ({{persil}}). [[ciseler; dresser x3]]"],
 tip:"Le tofu soyeux se réchauffe dans le velouté chaud : il reste fondant, sans jamais cuire."}),

RC({id:"l-pot-au-feu-tofu", n:"Pot-au-feu doux au bouillon de thym : tofu ferme, navet, panais & pommes de terre", cat:"Tofu", st:"Cocon & purées", base:"Pommes de terre", d:1,
 ing:[["tofu ferme",90,"g"],["pommes de terre",140,"g"],["navet",90,"g"],["panais",80,"g"],["bouillon",400,"ml"],["huile d'olive",1,"c. à café"],["thym","",HERBS],["persil","",HERBS],["sel","","1 pincée"]],
 steps:[
  introPoele("une planche et un couteau, un économe, du papier absorbant, une casserole avec couvercle, une louche, une assiette creuse tiède"),
  "Mise en place — Éplucher généreusement le navet ({{navet}}) et le couper en quartiers de 2 cm. Éplucher le panais ({{panais}}), retirer le cœur s'il est dur, et le couper en tronçons de 2 cm. Éplucher les pommes de terre ({{pommes de terre}}) et les couper en cubes de 2 cm. Éponger le tofu ({{tofu ferme}}) et le couper en gros cubes de 3 cm. [[sortir; eplucher navet; couper navet; eplucher panais; couper panais; eplucher pommes de terre; couper pommes de terre; presser tofu; couper tofu]]",
  "Le bouillon — Mettre les légumes dans la casserole avec le bouillon ({{bouillon}}) et une branche de thym ({{thym}}), porter à frémissement, couvrir et cuire 20 minutes à petit frémissement, jusqu'à ce que tout s'écrase à la fourchette. [[casserole; cuisson 20]]",
  "Le tofu — Ajouter le tofu dans le bouillon et laisser 5 minutes à feu très doux, sans bouillir. [[cuisson 5]]",
  "Dressage — À la louche, disposer légumes et tofu dans l'assiette creuse tiède, verser deux louches de bouillon, finir d'huile d'olive crue ({{huile d'olive}}), de persil ciselé ({{persil}}) et d'une pincée de sel. [[ciseler; dresser x3]]"],
 tip:"Les racines bien cuites dans le bouillon deviennent fondantes et sucrées : un plat réconfortant pour les soirs d'hiver."}),

RC({id:"l-papillote-tofu-basilic", n:"Papillote de tofu ferme au basilic, courgette, fenouil & carotte, quinoa tiède", cat:"Tofu", st:"Vapeur Bamboo", base:"Quinoa", d:1,
 ing:[["tofu ferme",90,"g"],["quinoa cuit",140,"g"],["courgette épluchée",55,"g"],["fenouil",60,"g"],["carotte",60,"g"],["huile d'olive",1,"c. à café"],["basilic","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("une feuille de papier sulfurisé de 35 cm, de la ficelle de cuisine, une planche et un couteau, un économe, du papier absorbant, un bol pour le quinoa, une assiette creuse tiède"),
  "Mise en place — Éplucher la carotte ({{carotte}}) et la couper en fins bâtonnets. Retirer les parties dures du fenouil ({{fenouil}}) et le couper en fines lamelles. Éplucher entièrement la courgette ({{courgette épluchée}}), retirer le cœur et la couper en dés de 1 cm. Éponger le tofu ({{tofu ferme}}) et le couper en tranches de 1 cm. [[sortir; eplucher carotte; couper carotte; couper fenouil; eplucher courgette; couper courgette; presser tofu; couper tofu]]",
  "La papillote — Sur la feuille de papier sulfurisé, poser la carotte et le fenouil, puis la courgette, les tranches de tofu et quelques feuilles de basilic ({{basilic}}). Saler très légèrement, refermer en plissant les bords et attacher d'un tour de ficelle. Elle doit rester plate, moins de 3,5 cm d'épaisseur. [[former x1]]",
  c1(20, "la papillote", "Le fenouil et la carotte sont fondants."),
  c2(10, "le quinoa cuit ({{quinoa cuit}}) mouillé d'une cuillère d'eau " + bol, "Il redevient moelleux."),
  "Dressage — Ouvrir la papillote au-dessus de l'assiette creuse tiède (attention à la vapeur), quinoa à côté, arrosé du jus de la papillote, filet d'huile d'olive crue ({{huile d'olive}}) et basilic frais ciselé. [[ciseler; dresser x2]]"],
 tip:"Le basilic cuit dans la papillote parfume le tofu ; un peu de basilic frais au service ravive le tout."}),

RC({id:"l-quinoa-tofu-soyeux-blettes", n:"Quinoa tiède, blettes & potimarron fondants, tofu soyeux et crème de soja à la ciboulette", cat:"Tofu", st:"Fraîcheur tiède", base:"Quinoa", d:1,
 ing:[["tofu soyeux",100,"g"],["quinoa cuit",140,"g"],["blettes",75,"g"],["potimarron",100,"g"],["crème de soja",1,"c. à soupe"],["huile d'olive",1,"c. à café"],["ciboulette","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("une planche et un couteau, un économe, une cuillère, une assiette creuse qui tient dans le panier, un petit bol, un bol pour le quinoa, une assiette creuse tiède"),
  "Mise en place — Couper le potimarron ({{potimarron}}) en quartiers, retirer les graines, l'éplucher et le couper en cubes de 2 cm. Laver les blettes ({{blettes}}), éplucher les fils des côtes et les couper en tronçons de 2 cm, couper les feuilles en rubans. Égoutter le tofu soyeux ({{tofu soyeux}}) et le poser entier dans l'assiette creuse. [[sortir; eplucher potimarron; couper potimarron; laver blettes; eplucher blettes; couper blettes]]",
  c1(20, "le potimarron et les côtes de blettes", "Le potimarron s'écrase à la fourchette."),
  c2(10, "les feuilles de blettes, l'assiette de tofu soyeux et le quinoa ({{quinoa cuit}}) mouillé d'une cuillère d'eau " + bol, "Les feuilles fondent, le tofu est chaud à cœur."),
  "La crème — Mélanger la crème de soja ({{crème de soja}}) avec la ciboulette ciselée ({{ciboulette}}, pointes vertes), une cuillère d'eau tiède et une pincée de sel. [[ciseler; delayer]]",
  "Dressage — Quinoa en couronne dans l'assiette creuse tiède, potimarron et blettes au centre, tofu soyeux coupé à la cuillère par-dessus, crème à la ciboulette en filet puis huile d'olive crue ({{huile d'olive}}). [[dresser x4]]"],
 tip:"Le tofu soyeux, chaud et tremblant, joue le rôle d'une sauce : on le mélange au quinoa à la fourchette."}),

RC({id:"l-vermicelles-bouillon-tofu", n:"Bouillon clair de vermicelles de patate douce, tofu ferme, pak choï & carotte", cat:"Tofu", st:"Cocon & purées", base:"Vermicelles", d:1,
 ing:[["vermicelles de patate douce cuits",140,"g"],["tofu ferme",90,"g"],["pak choï",75,"g"],["carotte",90,"g"],["bouillon",400,"ml"],["sauce soja",1,"c. à café"],["huile de sésame grillé",1,"c. à café"],["coriandre","",HERBS]],
 steps:[
  introPoele("une planche et un couteau, un économe, du papier absorbant, deux casseroles, une passoire, des ciseaux, une louche, un grand bol tiède"),
  "Mise en place — Éplucher la carotte ({{carotte}}) et la couper en fines rondelles de 3 mm. Rincer le pak choï ({{pak choï}}), couper les tiges en tronçons de 2 cm et garder les feuilles entières. Éponger le tofu ({{tofu ferme}}) et le couper en dés de 1,5 cm. [[sortir; eplucher carotte; couper carotte; laver pak choi; couper pak choi; presser tofu; couper tofu]]",
  "Le bouillon — Porter le bouillon ({{bouillon}}) à frémissement avec la carotte et les tiges de pak choï, et cuire 12 minutes à petit frémissement : la carotte s'écrase entre deux doigts. [[casserole; cuisson 12]]",
  "Les vermicelles — Pendant ce temps, cuire les vermicelles 8 minutes dans la seconde casserole d'eau frémissante, les égoutter et les couper aux ciseaux en tronçons de 10 cm. [[// casserole; cuisson 8; egoutter; couper vermicelles]]",
  "Le tofu — Ajouter le tofu et les feuilles de pak choï dans le bouillon, 3 minutes à feu très doux, puis la sauce soja ({{sauce soja}}). [[cuisson 3]]",
  "Dressage — Vermicelles ({{vermicelles de patate douce cuits}}) au fond du grand bol tiède, légumes et tofu dessus, bouillon versé à la louche, quelques gouttes d'huile de sésame grillé ({{huile de sésame grillé}}) et la coriandre ciselée ({{coriandre}}). [[ciseler; dresser x3]]"],
 tip:"Les vermicelles se cuisent à part pour que le bouillon reste clair."}),

RC({id:"l-gateau-pdt-tofu", n:"Gâteau vapeur de pomme de terre râpée au tofu & à l'aneth, haricots verts & courgette", cat:"Tofu", st:"Vapeur Bamboo", base:"Pommes de terre", d:2,
 ing:[["pommes de terre",140,"g"],["tofu ferme",90,"g"],["haricots verts",75,"g"],["courgette épluchée",55,"g"],["carotte",40,"g"],["huile d'olive",1,"c. à café"],["aneth","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("une balance, un économe, une râpe à gros trous, un torchon propre, une fourchette, du papier absorbant, un saladier, un ramequin de 12 cm garni de papier sulfurisé, une planche et un couteau, une assiette tiède"),
  "Mise en place — Peser 75 g de haricots verts ({{haricots verts}}) au maximum, les équeuter et les couper en tronçons de 3 cm. Éplucher la carotte ({{carotte}}) et la couper en rondelles de 5 mm. Éplucher entièrement la courgette ({{courgette épluchée}}), retirer le cœur et la couper en dés de 1 cm. [[sortir; peser haricots verts; couper haricots verts; eplucher carotte; couper carotte; eplucher courgette; couper courgette]]",
  "Le gâteau — Éplucher les pommes de terre ({{pommes de terre}}), les râper à gros trous et les presser fort dans le torchon pour retirer l'eau. Éponger le tofu ({{tofu ferme}}), l'écraser à la fourchette et le mélanger aux pommes de terre avec l'aneth ciselé ({{aneth}}) et une pincée de sel. Tasser dans le ramequin : 3 cm d'épaisseur au plus. [[eplucher pommes de terre; raper pommes de terre; presser pommes de terre; presser tofu; ecraser; ciseler; delayer; former x1]]",
  c1(25, "le ramequin, les haricots verts et la carotte", "Les haricots doivent être mous."),
  c2(10, "la courgette", "Le gâteau est pris et ferme au toucher, sans aucune coloration."),
  "Dressage — Démouler le gâteau tiède, le couper en deux, légumes autour, filet d'huile d'olive crue ({{huile d'olive}}) et aneth frais. [[couper; dresser x2]]"],
 tip:"Bien presser les pommes de terre râpées : l'amidon qui reste lie le gâteau sans œuf."}),

RC({id:"n-t-agedashi-dashi", n:"Tofu tendre dans son dashi ambré façon agedashi, sans huile chaude, carotte & épinards fondants, riz tiède", cat:"Tofu", st:"Vapeur Bamboo", base:"Riz", d:2,
 ing:[["tofu ferme",90,"g"],["farine de sarrasin",5,"g"],["riz cuit",140,"g"],["carotte",100,"g"],["épinards",70,"g"],["eau",250,"ml"],["kombu",2,"g"],["sauce soja",1,"c. à café"],["sirop d'érable",1,"c. à café"],["huile de sésame grillé",1,"c. à café"],["ciboulette","",HERBS]],
 steps:[
  intro("une casserole, un petit bol, une planche et un couteau, du papier absorbant, un bol creux tiède"),
  "Mise en place — Éplucher la carotte ({{carotte}}) et la couper en bâtonnets de 5 cm. Laver les épinards ({{épinards}}). Éponger le tofu ({{tofu ferme}}) et le couper en 4 cubes de 3 cm. [[sortir; eplucher carotte; couper carotte; laver epinards; presser tofu; couper tofu]]",
  c1(20, "les bâtonnets de carotte", "Ils s'écrasent sous la pointe d'un couteau."),
  "Le dashi — Pendant ce temps, verser l'eau ({{eau}}) dans la casserole avec le kombu ({{kombu}}) essuyé d'un linge humide et chauffer à feu doux 8 minutes, jusqu'aux premiers frémissements. Retirer le kombu avant l'ébullition (il devient amer), ajouter la sauce soja ({{sauce soja}}) et le sirop d'érable ({{sirop d'érable}}), puis garder tiède hors du feu. Repère : un bouillon ambré, à l'odeur de mer douce. [[// casserole; cuisson 8]]",
  "La peau veloutée — Rouler les cubes de tofu dans la farine de sarrasin ({{farine de sarrasin}}) en secouant l'excédent : elle forme une pellicule très fine qui accrochera le dashi. [[// former x4]]",
  c2(15, "le tofu fariné, les épinards et le riz ({{riz cuit}}) mouillé d'une cuillère d'eau " + bol, "Le tofu est chaud à cœur, sa pellicule est devenue veloutée ; les épinards s'affaissent."),
  "Dressage — Dans un bol creux tiède, poser les cubes de tofu, verser le dashi tiède autour sans les noyer, ajouter les carottes et les épinards pressés, un filet d'huile de sésame grillé ({{huile de sésame grillé}}) et les pointes vertes de ciboulette ({{ciboulette}}) ciselées ; servir le riz à côté. [[presser epinards; ciseler; verser; dresser x4]]"],
 tip:"Le tofu fariné puis cuit à la vapeur prend une peau veloutée qui accroche le dashi : on retrouve le contraste d'un tofu croustillant, sans huile chaude."}),

RC({id:"n-t-tofu-laque-potimarron", n:"Tofu laqué soja-érable à la vapeur, purée soyeuse de potimarron & épinards au sésame", cat:"Tofu", st:"Vapeur Bamboo", base:"Pommes de terre", d:2,
 ing:[["tofu ferme",90,"g"],["pommes de terre",130,"g"],["potimarron",120,"g"],["épinards",60,"g"],["sauce soja",1,"c. à café"],["sirop d'érable",1,"c. à café"],["lait de riz",30,"ml"],["huile d'olive",1,"c. à café"],["graines de sésame",1,"c. à café"]],
 steps:[
  intro("une petite casserole, un petit bol, une planche et un couteau, un économe, du papier absorbant, un presse-purée, une assiette creuse tiède"),
  "Mise en place — Éplucher les pommes de terre ({{pommes de terre}}), les couper en cubes de 3 cm. Éplucher le potimarron ({{potimarron}}), retirer les graines et le couper en cubes de 2 cm. Laver les épinards ({{épinards}}). Éponger le tofu ({{tofu ferme}}) et le couper en 4 tranches de 1,5 cm. [[sortir; eplucher pommes de terre; couper pommes de terre; eplucher potimarron; couper potimarron; laver epinards; presser tofu; couper tofu]]",
  c1(25, "les pommes de terre et le potimarron", "Les cubes s'écrasent sans résistance."),
  "La marinade — Pendant ce temps, mélanger la sauce soja ({{sauce soja}}), le sirop d'érable ({{sirop d'érable}}) et 2 cuillères à soupe d'eau dans le petit bol, y poser les tranches de tofu et les laisser 10 minutes en les retournant une fois : un tofu éponge boit la marinade. [[// delayer; attente 10]]",
  c2(10, "les tranches de tofu égouttées et les épinards", "Le tofu est chaud, les épinards s'affaissent."),
  "La laque — Chauffer la marinade restante 2 minutes à feu doux dans la petite casserole jusqu'à un sirop léger, y rouler le tofu 30 secondes, hors du feu. [[casserole; cuisson 2]]",
  "La purée — Écraser pommes de terre et potimarron au presse-purée avec le lait de riz ({{lait de riz}}) tiédi et l'huile d'olive crue ({{huile d'olive}}) : une purée orange, soyeuse et brillante. [[ecraser]]",
  "Dressage — Purée en nid dans l'assiette creuse tiède, tranches de tofu laqué en éventail, épinards pressés à côté et sésame ({{graines de sésame}}) en pluie. [[presser epinards; dresser x3]]"],
 tip:"Mariner le tofu éponge avant de le laquer : il boit le soja et l'érable au lieu de les laisser couler."}),

RC({id:"n-t-tofu-miso-courgette", n:"Tofu mijoté au miso doux, courgette & carotte fondantes, riz tiède au sésame", cat:"Tofu", st:"Cocon & purées", base:"Riz", d:1,
 ing:[["tofu ferme",90,"g"],["courgette",60,"g"],["carotte",100,"g"],["riz cuit",140,"g"],["eau",150,"ml"],["farine de sarrasin",5,"g"],["miso blanc",1,"c. à café"],["sirop d'érable",0.5,"c. à café"],["huile de sésame grillé",1,"c. à café"],["graines de sésame",1,"c. à café"]],
 steps:[
  introPoele("une casserole à couvercle, un fouet, une planche et un couteau, un économe, du papier absorbant, un bol large tiède"),
  "Mise en place — Éplucher la carotte ({{carotte}}) et la courgette ({{courgette}}), couper la carotte en demi-rondelles de 5 mm et la courgette en petits dés. Éponger le tofu ({{tofu ferme}}) et le couper en dés de 2 cm. [[sortir; eplucher carotte; couper carotte; eplucher courgette; couper courgette; presser tofu; couper tofu]]",
  "Le mijotage — Porter l'eau ({{eau}}) à frémissement dans la casserole, ajouter la carotte et cuire 6 minutes couvert, puis le tofu et la courgette 4 minutes. Repère : le bouillon fume à peine, il ne bout jamais. Contrôle : la carotte s'écrase sous la cuillère. [[casserole; cuisson 10]]",
  "Le riz — Pendant ce temps, réchauffer le riz cuit ({{riz cuit}}) avec une cuillère d'eau 3 minutes dans une petite casserole couverte. [[// rechauffer; cuisson 3]]",
  "La sauce — Délayer la farine de sarrasin ({{farine de sarrasin}}) dans une louche de bouillon froid, la verser dans la casserole et laisser épaissir 2 minutes à feu très doux. Hors du feu, délayer le miso ({{miso blanc}}) avec le sirop d'érable ({{sirop d'érable}}) dans une louche de sauce tiède, puis remettre : le miso ne doit jamais bouillir. Une sauce brune et nappante, comme une béchamel. [[delayer; cuisson 2]]",
  "Dressage — Riz dans le bol tiède, tofu et légumes avec leur sauce par-dessus, un filet d'huile de sésame grillé ({{huile de sésame grillé}}) et du sésame ({{graines de sésame}}). [[dresser x3]]"],
 tip:"Le miso délayé hors du feu garde tout son parfum ; la farine de sarrasin donne à la sauce un corps de béchamel sans beurre."}),

RC({id:"n-t-galette-courgette-tofu", n:"Galette moelleuse façon okonomiyaki à la vapeur : tofu, courgette, carotte & épinards, laque soja-érable", cat:"Tofu", st:"Vapeur Bamboo", base:"Sarrasin", d:2,
 ing:[["tofu ferme",90,"g"],["pommes de terre",130,"g"],["farine de sarrasin",15,"g"],["eau",40,"ml"],["courgette",60,"g"],["carotte",60,"g"],["épinards",40,"g"],["sauce soja",1,"c. à café"],["sirop d'érable",1,"c. à café"],["huile de sésame grillé",1,"c. à café"],["ciboulette","",HERBS]],
 steps:[
  intro("un grand bol, un fouet, une râpe fine, un bol creux ou un ramequin de 14 cm résistant à la vapeur, une petite casserole, du papier absorbant, une assiette tiède"),
  "Mise en place — Éplucher les pommes de terre ({{pommes de terre}}), la courgette ({{courgette}}) et la carotte ({{carotte}}), puis les râper finement et presser le tout dans un linge propre pour chasser l'eau. Laver les épinards ({{épinards}}) et les couper en rubans. Éponger le tofu ({{tofu ferme}}) et l'écraser à la fourchette. [[sortir; eplucher pommes de terre; eplucher courgette; eplucher carotte; raper pommes de terre; raper courgette; raper carotte; presser pommes de terre; laver epinards; couper epinards; presser tofu; ecraser]]",
  "La pâte — Fouetter la farine de sarrasin ({{farine de sarrasin}}) et l'eau ({{eau}}) en une pâte lisse, ajouter le tofu écrasé, les pommes de terre et les légumes râpés et la ciboulette ({{ciboulette}}) ciselée. Elle doit être épaisse et se tenir à la cuillère. Chemiser le bol de papier sulfurisé, y tasser la pâte sur 2 cm et couvrir d'un papier sulfurisé. [[delayer; ciseler; former]]",
  c1(25, "le bol de pâte", "Une lame plantée au centre ressort propre et le dessus est ferme au toucher."),
  "La laque — Pendant ce temps, chauffer la sauce soja ({{sauce soja}}), le sirop d'érable ({{sirop d'érable}}) et 2 cuillères à soupe d'eau 2 minutes à feu doux, jusqu'à un sirop léger. [[// casserole; cuisson 2]]",
  "Dressage — Laisser reposer la galette 5 minutes, la démouler, la couper en quartiers, napper de laque et finir d'un filet d'huile de sésame grillé ({{huile de sésame grillé}}). [[attente 5; couper; trancher; dresser x2]]"],
 tip:"La vapeur remplace la plaque : la galette reste moelleuse comme un flan et la laque lui donne l'éclat que la dorure lui donnerait."}),

RC({id:"n-t-ragout-potimarron-tofu", n:"Ragoût fondant de potimarron, tofu & épinards au thym, quinoa tiède", cat:"Tofu", st:"Cocon & purées", base:"Quinoa", d:1,
 ing:[["tofu ferme",90,"g"],["potimarron",120,"g"],["épinards",60,"g"],["quinoa cuit",140,"g"],["bouillon",150,"ml"],["thym","",HERBS],["huile d'olive",1,"c. à café"],["sel","","1 pincée"]],
 steps:[

/* ============ DÉJEUNERS ET DÎNERS : PROTÉINES TEXTURÉES, OKARA, SARDINES ============
   Protéine de pois texturée ou de soja texturée : 30 g secs par repas (comptés 90 g une fois réhydratés), dans quelques plats seulement.
   La réhydratation (10 minutes dans du bouillon chaud) est comptée dans la durée ; la mise en place se fait pendant ce temps. */

/* ============ DURÉES : barème par geste ============
   Chaque étape se termine par la liste de ses gestes entre [[ ]], par exemple
     "Mise en place — Éplucher la carotte… [[eplucher carotte; couper carotte]]"
   La durée affichée est calculée ici, à partir du geste et de la quantité de l'ingrédient (liste de la recette) :
   une même opération prend donc le même temps dans toutes les recettes.
   - geste actif : barème ci-dessous (minutes pour 100 g, ou par pièce, ou fixe), puis réduction de 30 % (REDUC) ;
   - « cuisson N » : temps de l'appareil ou de la casserole, jamais réduit (durées de docs/bamboo.md) ;
   - « attente N » : temps passif compté tel quel (réhydratation, repos, eau qui chauffe) ;
   - « // » en tête : étape faite pendant une cuisson, affichée « en parallèle » et non ajoutée au total.
   Le total de la recette (t) est la somme exacte des durées affichées des étapes, la cuisson (tc) la somme des cuissons. */
const REDUC = 0.7;
const BK_MAX = 10;   /* minutes, petit-déjeuner, étapes comprises */
const T100 = (tab, def, min) => (q, k) => Math.max(min, ((tab[k] != null ? tab[k] : def) * (q || 100)) / 100);
const GESTES = {
  sortir:     () => 1,                               /* réunir ingrédients et ustensiles sur le plan de travail */
  peser:      () => 0.3,                             /* par ingrédient pesé */
  laver:      (q, k) => /epinards|blettes|pak choi|herbe/.test(k) ? 1 : 0.3,
  rincer:     () => 1,                               /* riz, quinoa, nouilles : passoire sous l'eau */
  eplucher:   T100({ "carotte": 1, "pommes de terre": 1.5, "pomme de terre": 1.5, "panais": 1.2, "navet": 1.2, "courgette": 1, "potimarron": 2.5, "butternut": 2.5, "patate douce": 1.2,
                     "celeri-rave": 2, "aubergine": 1.2, "daikon": 1, "patisson": 2, "banane": 0.3 }, 1.2, 0.5),
  couper:     (q, k) => /tofu/.test(k) ? 0.5 : /poulet/.test(k) ? 1 : /courge spaghetti/.test(k) ? 1.5 : /banane/.test(k) ? 0.5
                 : T100({ "haricots verts": 2.5, "brocoli": 1.5, "fenouil": 1.5, "blettes": 1.5, "pak choi": 1, "epinards": 0.5 }, 1, 0.5)(q, k),
  emincer:    T100({}, 1.5, 0.5),
  raper:      T100({}, 1.5, 0.5),
  rubans:     T100({}, 1.5, 0.5),
  ciseler:    () => 0.5,
  presser:    (q, k) => /tofu/.test(k) ? 1 : 0.5,    /* éponger le tofu ; presser des légumes cuits */
  delayer:    () => 1,                               /* délayer, fouetter, mélanger une sauce ou une pâte */
  battre:     () => 1,
  ecraser:    () => 2,
  mixer:      () => 2,
  effilocher: () => 2,
  trancher:   () => 1,
  ecaler:     (q, k, n) => 0.5 * (n || 1),
  former:     (q, k, n) => 0.5 * (n || 1),           /* boulettes, galettes, rouleaux : par pièce */
  bamboo:     () => 1.5,                             /* remplir la cuve, poser le panier, programmer */
  ouvrir:     () => 1,                               /* au bip : ouvrir, ajouter, relancer */
  casserole:  () => 0.5,                             /* remplir et poser sur le feu */
  egoutter:   () => 0.5,
  assaisonner: () => 0.5,
  verser:     () => 0.5,
  rechauffer: () => 0.5,                             /* lancer un réchauffage (micro-ondes, casserole) */
  dresser:    (q, k, n) => 1 + 0.5 * (n || 2)        /* n = nombre d'éléments à disposer */
};
/* mots de la consigne et geste qui doit figurer dans la liste (contrôlé par validate.js : rien n'est oublié) */
const GESTE_MOTS = [[/[ée]plucher/i, "eplucher"], [/\b(couper(?! le feu)|tailler|d[ée]tailler)\b/i, "couper"], [/[ée]mincer/i, "emincer"], [/r[âa]per/i, "raper"],
[/\blaver\b/i, "laver|rincer"], [/\brincer\b/i, "rincer|laver"], [/\bciseler\b/i, "ciseler"], [/(?<!s')[ée]craser/i, "ecraser"], [/\bmixer\b/i, "mixer"],
  [/effilocher/i, "effilocher"], [/[ée]caler/i, "ecaler"], [/\bd[ée]layer\b|\bfouetter\b/i, "delayer"], [/\bbattre\b/i, "battre"], [/\bpeser\b/i, "peser"], [/\btrancher\b/i, "trancher"]];
function ingQty(r, ref){
  const k = norm(ref), i = r.ing.find(x => norm(x.n) === k) || r.ing.find(x => norm(x.n).indexOf(k) >= 0);
  if (!i) return null;
  const q = parseFloat(String(i.q).replace(",", ".")) || 0, u = norm(i.u || "");
  return { k, q: u === "g" || u === "ml" ? q : 0, n: u === "g" || u === "ml" ? 0 : q };

/* calcule une étape : { txt, act, wait, cook, par, err } */
function timeStep(r, raw){
  const m = String(raw).match(/\s*\[\[([^\]]*)\]\]\s*$/); if (!m) return { txt: raw, none: true };
  let spec = m[1].trim(), par = false, act = 0, wait = 0, cook = 0; const err = [], gs = [];
  if (spec.indexOf("//") === 0) { par = true; spec = spec.slice(2); }
  spec.split(";").map(x => x.trim()).filter(Boolean).forEach(g => {
    const w = g.split(/\s+/), v = w[0], rest = w.slice(1);
    if (v === "cuisson" || v === "attente") { const x = parseFloat(rest[0]); if (!(x > 0)) err.push("durée ? " + g); else if (v === "cuisson") cook += x; else wait += x; gs.push(v); return; }
    const f = GESTES[v]; if (!f) { err.push("geste inconnu : " + v); return; }
    let mult = 1; if (/^x\d+$/.test(rest[rest.length - 1] || "")) mult = +rest.pop().slice(1);
    const ref = rest.join(" "); let q = 0, k = "", n = mult;
    if (ref) { const iq = ingQty(r, ref); if (!iq) { err.push("ingrédient ? " + ref); return; } q = iq.q; k = iq.k; if (iq.n && mult === 1) n = iq.n; }
    act += f(q, k, n); gs.push(v);
  });
  const a = act > 0 ? Math.max(1, Math.round(act * REDUC)) : 0, p = a + Math.round(wait);
  const body = String(raw).slice(0, m.index);
  const tag = par ? "[en parallèle " + Math.max(1, p + cook) + " min]" : cook ? (p ? "[" + p + " min + cuisson " + cook + " min]" : "[cuisson " + cook + " min]") : "[" + Math.max(1, p) + " min]";
  return { txt: body + " " + tag, gs, par, prep: par ? 0 : (cook ? p : Math.max(1, p)), cook: par ? 0 : cook, err };
}
function timeRecipe(r){
  let t = 0, tc = 0; const err = [];
  r.steps = r.steps.map(s => { const x = timeStep(r, s); if (x.none) { if (!/^Avant de commencer/.test(s)) err.push("étape sans gestes : " + s.slice(0, 40)); return s; }
    t += x.prep + x.cook; tc += x.cook; x.err.forEach(e => err.push(e));
    const body = x.txt.replace(/\s*\[[^\]]*\]\s*$/, "");
    GESTE_MOTS.forEach(([re, g]) => { if (re.test(body) && !g.split("|").some(y => x.gs.indexOf(y) >= 0)) err.push("geste oublié (" + g + ") : " + body.slice(0, 40)); });
    return x.txt; });
  r.t = t; r.tc = tc; r.timeErr = err; return r;
}

function norm(s){
  return String(s||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/[’`]/g,"'")
    .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
}
function lookup(name){ const n = norm(name); return ING_DB.find(e => n.includes(e.k)) || null; }

function unitKind(u){
  const x = norm(u);
  if (!x) return "p";
  if (x === "g" || x === "gr" || x === "grammes") return "g";
  if (x === "kg") return "kg";
  if (x === "ml") return "g";
  if (x === "cl") return "cl";
  if (x === "l") return "l";
  if (/(c\.? ?a ?c|cafe|cac|cuillere a cafe)/.test(x)) return "c";
  if (/(c\.? ?a ?s|soupe|cas)/.test(x)) return "s";
  if (/(pincee|brins|quelques|au gout)/.test(x)) return "z";
  return "p"; // pièce, tranche, feuille, pot, tasse…
}
function ingKcal(i){
  const q = parseFloat(String(i.q).replace(",", "."));
  if (!q || isNaN(q)) return 0;
  const e = lookup(i.n); if (!e) return 0;
  switch (unitKind(i.u)) {
    case "g":  return e.g != null ? e.g * q / 100 : 0;
    case "kg": return e.g != null ? e.g * q * 10 : 0;
    case "cl": return e.g != null ? e.g * q / 10 : 0;
    case "l":  return e.g != null ? e.g * q * 10 : 0;
    case "c":  return e.c != null ? e.c * q : (e.g != null ? e.g * q * 5 / 100 : 0);
    case "s":  return e.c != null ? e.c * 3 * q : (e.g != null ? e.g * q * 15 / 100 : 0);
    case "p":  return e.p != null ? e.p * q : 0;
    default: return 0;
  }
}
function kcalOf(obj){ if (!obj || !obj.ing) return 0; if (obj.kcalM > 0) return Math.round(obj.kcalM / 10) * 10; return Math.round(obj.ing.reduce((s,i) => s + ingKcal(i), 0) / 10) * 10; }
function aisleOf(name){ const e = lookup(name); return e ? e.a : "Divers"; }

function combos(arr, k){
  if (k === 1) return arr.map(x => [x]);
  const out = []; for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++) out.push([arr[i],arr[j]]); return out;
}
/* légumes : au moins 150 g par repas, plafonds de portion (haricots verts 75 g, courgette 60 g), saison en priorité */
function vegCombos(f){
  return combos(f.v, f.k).filter(c => c.length === 1 ? !VEGS[c[0]].cap : c.reduce((t, k) => t + (VEGS[k].cap || 120), 0) >= 150);
}
function vegWeight(k){ const v = VEGS[k]; if (!v.ss) return 1; return v.ss.indexOf(curMonth()) >= 0 ? 4 : .08; }

  const cs = vegCombos(f).filter(c => !not || c.join() !== not.join()); if (!cs.length) return null;
  const ws = cs.map(c => c.reduce((p, k) => p * vegWeight(k), 1)); let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cs.length; i++) { r -= ws[i]; if (r <= 0) return cs[i]; }
  return cs[cs.length - 1];
}
function vegQty(V){
  const tot = V.length === 1 ? 170 : 180, q = V.map(() => 0); let rem = tot, free = V.length;
  V.forEach((v, i) => { if (v.cap) { q[i] = Math.min(v.cap, Math.round(tot / V.length / 5) * 5); rem -= q[i]; free--; } });
  V.forEach((v, i) => { if (!v.cap) q[i] = free > 0 ? Math.round(rem / free / 5) * 5 : 0; });
  return q;
}

function countVariations(){
  return FORMATS.reduce((t,f) => t + formatProteins(f).length * f.s.length * combos(f.v,f.k).length * f.sa.length, 0);
}

}

}

  const add = (arr, m) => arr.forEach(([n,q,u]) => {
    if (norm(n) === "sel") return;
    const ex = ing.find(i => norm(i.n) === norm(n) && norm(i.u) === norm(u) && q !== "");
    if (ex) ex.q = Math.round((parseFloat(ex.q) + parseFloat(q)) * 100) / 100;

  });
  add(P.ing, f.pm); add(S.ing); { const vq = vegQty(V); V.forEach((v, i) => add([[v.ing[0][0], vq[i], v.ing[0][2]]])); } add(Sa.ing); add(f.x);

    "L'assemblage — " + f.core,

}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function randomGen(filters = {}, tries = 80){
  const cats = filters.cats || [], bases = filters.bases || [], styles = filters.styles || [];
  for (let t = 0; t < tries; t++){
    const fl = FORMATS.filter(f => (!styles.length || styles.includes(f.st)) && f.s.some(s => !bases.length || bases.includes(STARCHES[s].base)));
    if (!fl.length) return null;
    const f = pick(fl);
    const ps = formatProteins(f).filter(p => !cats.length || cats.includes(PROTEINS[p].cat));
    const ss = f.s.filter(s => !bases.length || bases.includes(STARCHES[s].base));
    if (!ps.length || !ss.length) continue;
    const g = { f: f.id, p: pick(ps), s: pick(ss), v: pickVeg(f), sa: pick(f.sa) };
    const m = buildGen(g);

function swapGen(meal, key, value){
  const g = { ...meal.gen }; const f = FORMATS.find(x => x.id === g.f);
  if (key === "p") g.p = value; if (key === "s") g.s = value; if (key === "sa") g.sa = value;
  if (key === "f") {
    const nf = FORMATS.find(x => x.id === value); g.f = value;
    if (!formatProteins(nf).includes(g.p)) g.p = pick(formatProteins(nf));
    if (!nf.s.includes(g.s)) g.s = pick(nf.s);
    if (!nf.sa.includes(g.sa)) g.sa = pick(nf.sa);
    g.v = pickVeg(nf);
  }
  if (key === "v") g.v = pickVeg(f, g.v) || g.v;
  return buildGen(g);
}

      day.meals.b = put(take((w * 7 + d) % 2 ? [sa, sw] : [sw, sa], ok));
      ["l", "d"].forEach(sl => { const isMeat = k++ % 5 === 4 && meat.length; day.meals[sl] = put(take(isMeat ? [meat, veg] : [veg, meat], ok)); });
      days.push(day);
    }
    weeks.push({ id: uid(), name: "Semaine " + (w + 1), days });
  }
  return weeks;
}
function defaultState(){
  const recipes = DEFAULT_RECIPES.map(recipeToState);
  return { v: 10, font: "editorial", recipes, weeks: buildDefaultPlan(recipes), weights: [], goal: 60, checked: {}, ui: { view: "plan", week: 0 },
    kcalT: { b: null, l: null, d: null }, vegRatio: 80, autoAdapt: true, autoVeg: true, sensible: false, pantry: [], shopExtra: [], cooked: {}, reint: { start: null, foods: {}, current: null } };
}

/* ---------- persistance ---------- */
function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { S = JSON.parse(raw); if (!S || !S.weeks || !S.recipes) throw 0; }
    else S = defaultState();
  } catch (e) { S = defaultState(); }
  S.v = S.v || 1;
  ensureDefaults();
  migrateAll();
  applyFont();
  save();
}
function save(){
  clearTimeout(saveTimer);
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); STORAGE_OK = true; }
  catch (e) { STORAGE_OK = false; }
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
window.addEventListener("pagehide", save);

function snapshot(){ UNDO = JSON.stringify(S); }
function undo(){ if (!UNDO) return; S = JSON.parse(UNDO); UNDO = null; save(); render(); toast("Modification annulée"); }

/* ---------- calculs : déjeuner et dîner uniquement ---------- */
function dayKcal(day){ return SLOTS.reduce((s, sl) => s + (day.meals[sl.k] ? kcalOf(day.meals[sl.k]) : 0), 0); }
function weekAvg(week){ const ds = week.days.filter(d => d.meals.b || d.meals.l || d.meals.d); if (!ds.length) return 0; return Math.round(ds.reduce((s, d) => s + dayKcal(d), 0) / ds.length / 10) * 10; }
function curWeek(){ if (!S.weeks.length) return null; S.ui.week = Math.max(0, Math.min(S.ui.week, S.weeks.length - 1)); return S.weeks[S.ui.week]; }

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, withUndo){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${withUndo ? `<button class="link" data-act="undo">Annuler</button>` : ""}`;
  t.classList.add("show"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), withUndo ? 6000 : 2600);
}

/* ============ RENDU PRINCIPAL ============ */
function render(){
  document.querySelectorAll("[data-nav]").forEach(b => b.setAttribute("aria-current", b.dataset.nav === S.ui.view ? "page" : "false"));

}

/* ---------- moteur de propositions (petit-déjeuner, déjeuner et dîner) ---------- */
function slotOf(f){ return f.slot || (f.t && f.t.s) || (f.to && f.to.s) || "l"; }
const okSens = r => !(S.sensible && (r.ing || []).some(i => /sardine|miso|sauce soja/.test(norm(i.n))));
function catalogFor(f){
  const bk = slotOf(f) === "b";
  return S.recipes.filter(r => CATS.includes(r.cat) && r.st !== "Douceurs" && ((r.st === "Petit-déjeuner") === bk) && okSens(r) &&
    (!f.cats || !f.cats.length || f.cats.includes(r.cat)) && (!f.bases || !f.bases.length || f.bases.includes(r.base)) && (!f.styles || !f.styles.length || f.styles.includes(r.st)));
}
function oneProposal(f, avoid){
  avoid = avoid || new Set();
  const src = f.src || "mix", sl = slotOf(f), bk = sl === "b";
  for (let t = 0; t < 40; t++){
    const useBook = bk || src === "book" || (src === "mix" && Math.random() < 0.4);
    let m = null;
    if (useBook) { const list = catalogFor(f).filter(r => !avoid.has(r.n)); if (list.length) m = mealFromRecipe(pick(list)); else if (bk || src === "book") return null; }
    if (!m) { const g = randomGen({ cats: f.cats, bases: f.bases, styles: f.styles }); if (g) m = mealFromGen(g); }
    if (m && !avoid.has(m.name)) { if (S.autoVeg !== false && !bk) autoSide(m); if (S.autoAdapt !== false) protoAdaptMeal(m, sl, kT(sl)); return m; }
  }
  return null;
}
function proposeMeals(n, f){
  const out = [], seen = new Set();
  for (let i = 0; i < n * 3 && out.length < n; i++){ const m = oneProposal(f, seen); if (m && !seen.has(m.name)) { seen.add(m.name); out.push(m); } }
  return out;
}
function weekUsed(w, skip){ const s = new Set(); w.days.forEach((d, i) => { if (i !== skip) SLOTS.forEach(sl => d.meals[sl.k] && s.add(d.meals[sl.k].name)); }); return s; }
function proposeDay(f, avoid){
  avoid = new Set(avoid || []); const out = {};
  SLOTS.forEach(sl => {
    const bk = sl.k === "b";
    const m = oneProposal({ ...f, slot: sl.k }, avoid) || oneProposal({ src: bk ? "book" : "gen", slot: sl.k }, avoid) || oneProposal({ src: "mix", slot: sl.k }, new Set());
    out[sl.k] = m; if (m) avoid.add(m.name);
  });
  return out;
}
function proposeWeek(f){
  const days = [], avoid = new Set(), count = {};
  const limit = f.cats && f.cats.length ? 99 : 5;
  for (let i = 0; i < 7; i++){
    let best = null;
    for (let t = 0; t < 30; t++){
      const p = proposeDay(f, avoid);
      const ok = [p.l, p.d].every(m => !m || (count[m.cat] || 0) < limit);
      best = p; if (ok) break;
    }
    SLOTS.forEach(sl => { const m = best[sl.k]; if (!m) return; avoid.add(m.name); if (sl.k !== "b") count[m.cat] = (count[m.cat] || 0) + 1; });
    days.push(best);
  }
  return days;
}

    <div class="apply"><button class="btn primary" data-act="applyWeekNew">Créer une nouvelle semaine avec ces menus</button>
    <span>ou remplacer</span><select id="toWk">${S.weeks.map((x, i) => `<option value="${i}">${esc(x.name)}</option>`).join("")}</select>

let SHOP = { w: null, days: null, b: true };
function shopDays(){ const w = S.weeks[SHOP.w]; if (!SHOP.days || SHOP.days.length !== w.days.length) SHOP.days = w.days.map(() => true); return SHOP.days; }
function buildShop(){
  const w = S.weeks[SHOP.w], sel = shopDays(), map = new Map();
  w.days.forEach((d, i) => { if (!sel[i]) return; SLOTS.forEach(sl => { const m = d.meals[sl.k]; if (!m) return;
    m.ing.forEach(it => { if (!String(it.n).trim()) return; const e = lookup(it.n);
      const mergeByKey = e && ["Légumes","Volaille","Œufs","Féculents","Tofu & protéines végétales"].includes(e.a);
      const key = mergeByKey ? "k:" + e.k : "n:" + norm(it.n);
      if (!map.has(key)) map.set(key, { key, name: it.n, aisle: e ? e.a : "Divers", parts: {}, names: {} });
      const g = map.get(key); g.names[it.n] = (g.names[it.n] || 0) + 1;
      const q = parseFloat(String(it.q).replace(",", ".")); const uk = unitKind(it.u);
      if (!q || isNaN(q) || uk === "z") { g.parts.z = g.parts.z || { q: 0, u: it.u || "au goût" }; return; }
      const pk = uk === "p" ? "p:" + norm(it.u) : uk;
      g.parts[pk] = g.parts[pk] || { q: 0, u: uk === "c" ? "c. à café" : uk === "s" ? "c. à soupe" : uk === "g" ? (norm(it.u) === "ml" ? "ml" : "g") : it.u };
      g.parts[pk].q += q; }); }); });
  const items = [...map.values()].map(g => { g.name = Object.entries(g.names).sort((a, b) => b[1] - a[1])[0][0];
    const parts = Object.entries(g.parts).filter(([k]) => k !== "z").map(([, p]) => { const q = Math.round(p.q * 10) / 10;
      if (norm(p.u) === "piece" || norm(p.u) === "pieces") return "× " + fmtN(q);
      const pl = q > 1 && ["tranche","feuille","pot","tasse","pincee"].includes(norm(p.u)) ? "s" : ""; return fmtN(q) + " " + p.u + pl; });
    g.qty = parts.length ? parts.join(" + ") : "selon le goût"; return g; });
  (S.shopExtra || []).forEach(x => { const e = lookup(x.n); items.push({ key: "x:" + x.id, id: x.id, extra: true, name: x.n, aisle: e ? e.a : "Divers", qty: qtyStr(x) || "selon le besoin" }); });
  return items;
}
function viewShop(){

  const w = S.weeks[SHOP.w], sel = shopDays(), items = buildShop(), chk = S.checked[w.id] || {};
  const groups = AISLE_ORDER.map(a => ({ a, list: items.filter(i => i.aisle === a).sort((x, y) => x.name.localeCompare(y.name, "fr")) })).filter(g => g.list.length);

function viewWeight(){
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date));
  const first = ws[0], last = ws[ws.length - 1];
  const today = new Date().toISOString().slice(0, 10);
  const stat = (v, l) => `<div class="stat"><span class="stat-v">${v}</span><span class="stat-l">${l}</span></div>`;
  return `<header class="pagehead"><div><h1 class="display">Suivi du poids</h1><p class="muted">Une pesée par semaine, le même jour et à la même heure, suffit pour suivre la tendance.</p></div></header>
    <div class="stats">${stat(first ? fmtN(first.kg) + " kg" : "—", "Départ")}${stat(last ? fmtN(last.kg) + " kg" : "—", "Actuel")}
      ${stat(first && last ? (last.kg - first.kg > 0 ? "+" : "") + fmtN(last.kg - first.kg) + " kg" : "—", "Évolution")}
      <div class="stat"><span class="stat-v"><input class="goal" data-bind="goal" value="${fmtN(S.goal)}" inputmode="decimal" aria-label="Objectif en kg"> kg</span><span class="stat-l">Objectif</span></div></div>
    <form class="weight-form" onsubmit="return false"><label class="field"><span>Date</span><input type="date" id="wDate" value="${today}"></label>
      <label class="field"><span>Poids (kg)</span><input id="wKg" inputmode="decimal" placeholder="78,0"></label><button class="btn primary" data-act="addWeight">Enregistrer la pesée</button></form>
    ${leversCard()}
    <div class="chart">${chartSvg(ws)}</div>
    ${ws.length ? `<ul class="wlist">${[...ws].reverse().map((x, i, arr) => { const prev = arr[i + 1]; const d = prev ? x.kg - prev.kg : null;
      return `<li><span>${new Date(x.date + "T12:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long", year: "numeric" })}</span><strong>${fmtN(x.kg)} kg</strong>
      <span class="muted">${d == null ? "" : (d > 0 ? "+" : "") + fmtN(d) + " kg"}</span><button class="icon del" data-act="delWeight" data-date="${x.date}" aria-label="Supprimer">×</button></li>`; }).join("")}</ul>` : ""}`;
}
function chartSvg(ws){
  if (ws.length < 2) return `<p class="muted center">La courbe apparaîtra à partir de deux pesées.</p>`;
  const W = 640, Hh = 220, p = 36, vals = ws.map(x => x.kg).concat([S.goal]);
  const min = Math.floor(Math.min(...vals) - 0.5), max = Math.ceil(Math.max(...vals) + 0.5);
  const t0 = new Date(ws[0].date).getTime(), t1 = new Date(ws[ws.length - 1].date).getTime() || t0 + 1;
  const X = d => p + (W - 2 * p) * ((new Date(d).getTime() - t0) / Math.max(1, t1 - t0));
  const Y = v => Hh - p + -(Hh - 2 * p) * (v - min) / Math.max(0.1, max - min);
  const pts = ws.map(x => `${X(x.date).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(" ");
  const ticks = []; for (let v = min; v <= max; v++) ticks.push(v);
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Courbe de poids">
    ${ticks.map(v => `<line x1="${p}" x2="${W - p}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${p - 8}" y="${Y(v) + 4}" class="axis" text-anchor="end">${v}</text>`).join("")}
    <line x1="${p}" x2="${W - p}" y1="${Y(S.goal)}" y2="${Y(S.goal)}" class="goal-line"/><text x="${W - p}" y="${Y(S.goal) - 6}" class="axis" text-anchor="end">objectif ${fmtN(S.goal)} kg</text>
    <polyline points="${pts}" class="curve"/>${ws.map(x => `<circle cx="${X(x.date)}" cy="${Y(x.kg)}" r="3.5" class="dot"/>`).join("")}</svg>`;
}
A.addWeight = () => { const d = $("#wDate").value, kg = parseFloat($("#wKg").value.replace(",", "."));
  if (!d || !kg || kg < 30 || kg > 250) return toast("Indique une date et un poids valides (ex. 77,4).");
  S.weights = S.weights.filter(x => x.date !== d); S.weights.push({ date: d, kg }); save(); render(); toast("Pesée enregistrée"); };
A.delWeight = ds => { snapshot(); S.weights = S.weights.filter(x => x.date !== ds.date); save(); render(); toast("Pesée supprimée", true); };

/* ---------- INSPIRATIONS : mon frigo ---------- */
const FR_COMMON = {
  f: ["œufs","blanc de poulet","tofu ferme","carotte","courgette","potimarron","butternut","épinards","haricots verts","aubergine","brocoli","panais","persil","ciboulette","thym","bouillon","lait de riz"],
  g: ["riz basmati","pommes de terre","quinoa","soba","flocons d'avoine","farine de sarrasin","protéine de pois texturée","okara d'amande","huile d'olive","huile de sésame grillé"]
};
let FR = { min: 0 };
const pantryHas = n => S.pantry.some(p => norm(p.n) === norm(n));
const KEY_GROUPS = [["riz cuit","riz cru","riz basmati","riz"],["oeuf","oeufs"],["quinoa cuit","quinoa"],["soba cuites","soba"],["tofu ferme","tofu"],
  ["proteine de pois texturee","proteine de pois texturee (seche)"],["proteine de soja texturee","proteine de soja texturee (seche)"],["blanc de poulet","poulet"],["huile d'olive","huile"],["flocons d'avoine","avoine"]];
const canonKey = k => { for (let g = 0; g < KEY_GROUPS.length; g++) if (KEY_GROUPS[g].indexOf(k) >= 0) return "g" + g; return k; };
const DB_KEYS = new Set(ING_DB.map(e => e.k));
const hasWord = (hay, nd) => (" " + hay + " ").indexOf(" " + nd + " ") >= 0;
/* deux noms correspondent s'ils désignent le même produit ; un texte libre (« riz ») peut être contenu dans un nom connu (« riz cuit ») */
function keyMatch(a, b){
  if (!a || !b) return false; if (a === b || canonKey(a) === canonKey(b)) return true;
  if (DB_KEYS.has(a) && DB_KEYS.has(b)) return false;
  return (a.length >= 3 && hasWord(b, a)) || (b.length >= 3 && hasWord(a, b));
}
function essentialIng(i){
  const e = lookup(i.n), uk = unitKind(i.u);
  if (e) { if (e.k === "eau" || e.a === "Herbes & aromates") return false; if (e.a === "Épicerie" && (uk === "c" || uk === "s" || uk === "z")) return false; }
  else if (i.q === "" || i.q == null) return false;
  return !/\b(sel|poivre)\b/.test(norm(i.n));
}
function fridgeResults(){
  const keys = S.pantry.map(p => ingKey(p.n)); if (!keys.length) return [];
  return S.recipes.map(r => {
    const ess = r.ing.filter(essentialIng); if (!ess.length) return null;
    const have = [], miss = []; ess.forEach(i => (keys.some(k => keyMatch(k, ingKey(i.n))) ? have : miss).push(i));
    const st = seasonState(r);
    return { r, score: Math.round(have.length / ess.length * 100), have, miss, sea: !!(st && st.all) };
  }).filter(x => x && x.have.length).sort((a, b) => b.score - a.score || a.miss.length - b.miss.length || (b.sea - a.sea));
}

const SOLID_PROT = ["tofu ferme", "tofu", "tofu soyeux", "tofu fume", "blanc de poulet", "cuisse de poulet", "poulet", "sardine"];
const isQty = i => num(i.q) > 0 && unitKind(i.u) === "g";
function starchItems(m){ return (m.ing || []).filter(i => { const e = lookup(i.n); return e && e.a === "Féculents" && isQty(i); }); }
function starchSplit(m){ let c = 0, r = 0; starchItems(m).forEach(i => { const e = lookup(i.n); if (RAW_STARCH.indexOf(e.k) >= 0) r += num(i.q); else c += num(i.q); }); return { c, r }; }
function protItems(m){ return (m.ing || []).filter(i => { const e = lookup(i.n); return e && SOLID_PROT.indexOf(e.k) >= 0 && isQty(i); }); }
const starchKcal = m => starchItems(m).reduce((s, i) => s + ingKcal(i), 0);
const ingTotal = m => (m.ing || []).reduce((s, i) => s + ingKcal(i), 0);
function scaleStarch(m, f){
  starchItems(m).forEach(i => { i.q = Math.max(5, Math.round(num(i.q) * f / 5) * 5); });
  m.adj = Math.round((m.adj || 1) * f * 100) / 100;
}
const kT = k => S.kcalT && num(S.kcalT[k]) > 0 ? Math.round(num(S.kcalT[k])) : null;
const lvlF = m => (m.lf || 0);   /* grammes de féculents ajoutés par le levier 1 (jamais plus de 30 g) */

/* met un repas aux portions du protocole, puis le rapproche de sa cible de calories si elle existe.
   Les protéines ne descendent jamais sous le minimum du repas. */
function protoAdaptMeal(m, k, target){
  if (!m || !m.ing) return false; const R = PORTIONS[k] || PORTIONS.l; let changed = false;
  const sp = starchSplit(m), raw = sp.c === 0 && sp.r > 0, cur = raw ? sp.r : sp.c;
  if (cur > 0) {
    const lo = raw ? R.fr[0] : R.f[0], hi = (raw ? R.fr[1] : R.f[1]) + lvlF(m);
    let x = 1;
    if (target) { const sc = starchKcal(m), tot = ingTotal(m); if (sc > 0) x = (target - (tot - sc)) / sc; }
    let want = Math.max(lo, Math.min(hi, cur * x)); if (!target) want = Math.max(lo, Math.min(hi, cur));
    const f = want / cur; if (Math.abs(f - 1) > .02) { scaleStarch(m, f); changed = true; }
  }
  protItems(m).forEach(i => { const q = num(i.q), lo = R.p[0], hi = R.p[1]; if (protItems(m).length === 1 && (q < lo || q > hi)) { i.q = Math.max(lo, Math.min(hi, q)); changed = true; } });
  return changed;
}
function adaptDay(day, force){
  let n = 0; SLOTS.forEach(sl => { const m = day.meals[sl.k]; if (m && protoAdaptMeal(m, sl.k, kT(sl.k))) n++; }); return n > 0;
}
function slotTarget(t){ return kT(t.s); }
const adaptHint = d => SLOTS.some(sl => { const m = d.meals[sl.k]; if (!m) return false; const c = clone(m); return protoAdaptMeal(c, sl.k, kT(sl.k)); });
function kcalBar(d){
  const k = dayKcal(d); if (!k) return "";
  const ts = SLOTS.map(sl => kT(sl.k)); const all = ts.every(x => x);
  const tg = all ? ts.reduce((a, b) => a + b, 0) : 0;
  const diff = k - tg, cls = !all ? "" : Math.abs(diff) <= tg * .08 ? "ok" : diff > 0 ? "hi" : "lo";
  return `<div class="kbar ${cls}"><div class="kb-top"><span class="kb-v">≈ ${fmtK(k)} kcal par jour</span>${all ? `<span class="kb-t">cible ${fmtK(tg)}</span>` : ""}</div>${all ? `<span class="kb-d">${Math.abs(diff) <= tg * .08 ? "dans la cible" : (diff > 0 ? "+" : "−") + Math.abs(diff) + " kcal"}</span>` : ""}</div>`;
}
const dayTarget = () => SLOTS.reduce((s, sl) => s + (kT(sl.k) || 0), 0);

/* ---------- contrôle du protocole ---------- */
const L3_RE = /\b(ail|oignons?|echalotes?|poivre|piment|vinaigre|citron|moutarde|pois chiches?|lentilles?|haricots? (?:blancs?|rouges?|secs?)|falafels?|fritur\w*|fruits? a coque brut)\b/;
const RAW_RE = /\b(salade|concombre|radis|crudites?|tomates?|carottes? rapees?)\b/;
function reintOK(key){ const f = S.reint && S.reint.foods && S.reint.foods[key]; return !!f && (f.st === "ok" || f.st === "test"); }
function protoCheck(o){
  const bad = [], warn = [];
  (o.ing || []).forEach(i => {
    const nm = String(i.n || "").trim(); if (!nm) return; const n = norm(nm), q = num(i.q), e = lookup(nm);
    if (L3_RE.test(n)) { bad.push({ n: nm, why: "exclu par le protocole (niveau 3)" }); return; }
    if (RAW_RE.test(n)) { warn.push({ n: nm, why: "cru : à éviter, cuire doucement" }); return; }
    if (!e) return;
    if (e.n === "r") warn.push({ n: nm, why: "non listé dans le protocole : à réintroduire" });
    else if ((e.n === "p2" || e.n === "p3") && !reintOK(e.k)) warn.push({ n: nm, why: "palier de réintroduction : pas encore débloqué" });
    if (e.k === "avocat" && q > 30) warn.push({ n: nm, why: "1/8 d'avocat maximum par repas (30 g)" });
    if (e.k === "sardine") { if (S.sensible) warn.push({ n: nm, why: "phase de sensibilité aiguë : sardines à éviter" }); else warn.push({ n: nm, why: "occasionnelle, de préférence le midi" , soft: true }); }
    if (e.k === "haricots verts" && q > 75) warn.push({ n: nm, why: "75 g maximum cuits (seuil low-FODMAP)" });
    if (e.k === "courgette" && q > 60) warn.push({ n: nm, why: "60 g maximum épluchée (seuil low-FODMAP)" });
    if (e.w && /FODMAP/.test(e.w) && q > 75 && e.k !== "haricots verts" && e.k !== "courgette") warn.push({ n: nm, why: e.w });
  });
  return { bad, warn: warn.filter(w => !w.soft || !S.hideSoft), ok: !bad.length && !warn.some(w => !w.soft) };
}
function protoBanner(o){
  const c = protoCheck(o); if (c.ok && !c.warn.length) return "";
  const li = a => a.map(x => `<li><strong>${esc(x.n)}</strong> : ${esc(x.why)}</li>`).join("");
  return `<div class="pc ${c.bad.length ? "bad" : "warn"}"><p class="pc-h">${ic(c.bad.length ? "x" : "gauge")} ${c.bad.length ? "Ne respecte pas le protocole de Cat" : "À surveiller avec le protocole"}</p><ul>${li(c.bad)}${li(c.warn)}</ul></div>`;
}
function protoDot(m){ const c = protoCheck(m); return c.bad.length ? `<span class="mb bad">hors protocole</span>` : c.warn.some(w => !w.soft) ? `<span class="mb warn">à vérifier</span>` : ""; }

/* ---------- leviers de poids (jamais de légumes en plus) ---------- */
function lever1(m){
  if (!m || (m.lf || 0) >= 30) return false; const add = Math.min(20, 30 - (m.lf || 0)), items = starchItems(m); if (!items.length) return false;
  const main = items.slice().sort((a, b) => num(b.q) - num(a.q))[0]; main.q = num(main.q) + add; m.lf = (m.lf || 0) + add; return true;
}
function lever2(m){
  if (!m || (m.lo || 0) >= .5) return false; const oil = (m.ing || []).find(i => /^huile/.test(norm(i.n)) && unitKind(i.u) === "c");
  if (!oil) return false; oil.q = num(oil.q) + .5; m.lo = (m.lo || 0) + .5; return true;
}
function defineLevers(){
  const run = (title, fn) => { const w = curWeek(); if (!w) return; snapshot(); const b = weekSnap(w); let n = 0;
    w.days.forEach(d => SLOTS.forEach(sl => { if (fn(d.meals[sl.k])) n++; })); save();
    if (n) { render(); reportWeek(title, w, b); } else toast("Rien à ajouter : le plafond du levier est déjà atteint pour tous les repas"); };
  A.lever1 = () => ask("Poids en baisse : ajouter 20 g de féculents cuits à chaque repas de la semaine affichée ? (30 g maximum au total par repas, les légumes ne changent pas)", "Ajouter 20 g", () => run("Levier 1 : +20 g de féculents par repas", lever1));
  A.lever2 = () => ask("Poids en baisse : ajouter une demi-cuillère à café d'huile d'olive crue à chaque repas de la semaine affichée ? (0,5 c. à café maximum au total par repas)", "Ajouter l'huile", () => run("Levier 2 : +0,5 c. à café d'huile à cru par repas", lever2));
}
function leversCard(){
  const ws = [...S.weights].sort((a, b) => a.date.localeCompare(b.date)); let tip = "";
  if (ws.length >= 2) { const d = ws[ws.length - 1].kg - ws[ws.length - 2].kg; tip = d < -0.2 ? `<p class="pc warn-s">Ta dernière pesée est en baisse (${fmtN(d)} kg) : tu peux appliquer les leviers ci-dessous, dans l'ordre.</p>` : ""; }
  return `<section class="lev"><h2 class="group-title">Si le poids baisse</h2>
    <p class="muted">Ne jamais réduire les protéines (200 g de tofu ou de poulet par jour au minimum) et ne jamais augmenter les légumes. Les leviers s'appliquent à la semaine affichée dans le planning et se défont avec « Annuler ».</p>${tip}
    <div class="wa-grid"><button class="wa" data-act="lever1">${ic("plus")}<span><strong>Levier 1 : féculents</strong><em>+20 g cuits à chaque repas (30 g maximum)</em></span></button>
    <button class="wa" data-act="lever2">${ic("plus")}<span><strong>Levier 2 : huile à cru</strong><em>+0,5 c. à café d'huile d'olive par repas</em></span></button></div></section>`;
}

function riActive(key, c){

function riCatalog(open){

function defineReint(){

}

/* ---------- état par défaut et migration ---------- */
function ensureDefaults(){
  S.ui = S.ui || { view: "plan", week: 0 }; S.checked = S.checked || {}; S.weights = S.weights || [];
  if (S.goal == null) S.goal = 60;
  if (!S.kcalT || typeof S.kcalT !== "object") S.kcalT = { b: null, l: null, d: null };
  if (S.autoAdapt == null) S.autoAdapt = true;
  if (S.autoVeg == null) S.autoVeg = true;
  if (S.sensible == null) S.sensible = false;
  if (!(S.vegRatio > 0)) S.vegRatio = 80;
  if (!Array.isArray(S.pantry)) S.pantry = [];
  if (!Array.isArray(S.shopExtra)) S.shopExtra = [];
  if (!S.cooked || typeof S.cooked !== "object") S.cooked = {};
  if (!S.reint || typeof S.reint !== "object") S.reint = { start: null, foods: {}, current: null };
  S.weeks.forEach(w => w.days.forEach(d => { d.meals = d.meals || {}; if (!("b" in d.meals)) d.meals.b = null; }));
  const ks = Object.keys(S.cooked); if (ks.length > 80) ks.slice(0, ks.length - 80).forEach(k => delete S.cooked[k]);
}
function migrateAll(){ if (!S.v || S.v < 2) migrateProto(); if (S.v < 3) migrate3(); if (S.v < 4) migrate4(); if (S.v < 5) migrate5(); if (S.v < 6) migrate6(); if (S.v < 7) migrate7(); if (S.v < 8) migrate8(); if (S.v < 9) migrate9(); if (S.v < 10) migrate10(); }
/* v2 : nouveau protocole. Le carnet fourni est remplacé par la version mise à jour ; les recettes créées par Cat sont conservées.
   Les repas du planning qui venaient de l'ancien carnet sont renouvelés, et un petit-déjeuner est ajouté là où il manque. */
function migrateProto(){
  const oldIds = new Set(S.recipes.filter(r => !r.own).map(r => r.id)), own = S.recipes.filter(r => r.own);
  S.recipes = DEFAULT_RECIPES.map(recipeToState).concat(own);
  const fresh = buildDefaultPlan(S.recipes);
  S.weeks.forEach((w, wi) => w.days.forEach((d, di) => {
    const src = fresh[wi % fresh.length].days[di % 7].meals;
    ["b", "l", "d"].forEach(k => { const m = d.meals[k]; if (!m || (m.recipeId && oldIds.has(m.recipeId))) d.meals[k] = copyMeal(src[k]); });
  }));
  S.v = 2;
}

/* =====================================================================
   v3 : 80 % végétarien, légumes variés, herbes, plats japonais et coréens doux,
   petits-déjeuners légers (sucré / salé), recette visible tout de suite, aperçu des menus
   ===================================================================== */
const NONVEG = ["Poulet", "Sardines"];
const isVegCat = c => NONVEG.indexOf(c) < 0;
const vegRatio = () => S.vegRatio > 0 ? S.vegRatio : 80;
const EGG_PREPS = [/oeufs? (?:durs?|mollets?|poches?|au plat|brouilles?|cocotte)/, /omelette/, /chawan/];
function eggsOK(m){
  const t = norm((m.name || m.n || "") + " " + (m.steps || []).join(" ").replace(/\{\{[^}]*\}\}/g, " ")); let n = 0;
  EGG_PREPS.forEach(re => { if (re.test(t)) n++; }); return n <= 1;
}
/* ---------- variété du planning ----------
   Ingrédients principaux d'un repas : sa protéine (œufs, poulet, tofu, protéine de pois, protéine de soja, sardines, okara) et son féculent.
   Deux repas qui se suivent (petit-déjeuner, déjeuner, dîner, puis petit-déjeuner du lendemain) n'en partagent aucun,
   ce qui interdit aussi le même ingrédient principal midi et soir. Œufs : EGG_MAX repas par semaine au plus, jamais à la suite. */
const EGG_MAX = 3;
const MAIN_RE = [["œufs", /\boeufs?\b/], ["poulet", /poulet/], ["tofu", /\btofu\b/], ["protéine de pois", /pois texturee/], ["protéine de soja", /soja texturee/], ["sardines", /sardine/], ["okara", /okara/]];
function mainKeys(m){
  if (!m) return []; const t = (m.ing || []).map(i => norm(i.n)).join(" | ");
  const k = MAIN_RE.filter(x => x[1].test(t)).map(x => x[0]); if (m.base) k.push("féculent : " + String(m.base).toLowerCase()); return k;
}
function isEgg(m){ return mainKeys(m).indexOf("œufs") >= 0; }
function clash(a, b){ if (!a || !b) return null; const kb = mainKeys(b); return mainKeys(a).find(k => kb.indexOf(k) >= 0) || null; }
/* repas dans l'ordre de la semaine (b, l, d, b, l, d…) : liste des règles non respectées */
function planIssues(seq){
  const out = []; let eggs = 0;
  seq.forEach((m, i) => { if (!m) return; if (isEgg(m)) eggs++; const c = clash(seq[i - 1], m); if (c) out.push("repas " + (i + 1) + " : " + c + " deux repas de suite"); });
  if (eggs > EGG_MAX * Math.max(1, Math.ceil(seq.length / 21))) out.push(eggs + " repas aux œufs (maximum " + EGG_MAX + " par semaine)");
  return out;
}
const FERMENTED_RE = /\b(miso|sauce soja)\b/;
const hasFermented = m => (m.ing || []).some(i => FERMENTED_RE.test(norm(i.n)));

/* ---------- variations : légumes variés, herbes, 80 % végétarien ---------- */
const RECENT_VEG = [];
function pickVeg(f, not){
  const cs = vegCombos(f).filter(c => !not || c.join() !== not.join()); if (!cs.length) return null;
  const ws = cs.map(c => c.reduce((p, k) => p * vegWeight(k) * (RECENT_VEG.indexOf(k) >= 0 ? .25 : 1), 1));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0), res = cs[cs.length - 1];
  for (let i = 0; i < cs.length; i++) { r -= ws[i]; if (r <= 0) { res = cs[i]; break; } }
  RECENT_VEG.push(...res); while (RECENT_VEG.length > 14) RECENT_VEG.shift(); return res;
}
const HERBS_DEFAULT = ["persil", "basilic", "aneth", "cerfeuil", "thym", "estragon"];
["bamboo", "slow", "cocon", "fraicheur", "bol"].forEach(id => { const f = FORMATS.find(x => x.id === id); if (f && !f.herbs) f.herbs = HERBS_DEFAULT; });
function buildGen(g){
  const f = FORMATS.find(x => x.id === g.f);
  if (g.herb === undefined) g.herb = f.herbs && f.herbs.length ? pick(f.herbs) : "";
  const m = buildGen0(g), fin = m.steps.findIndex(s => /^Finition — /.test(s));
  if (g.herb && !m.ing.some(i => norm(i.n).indexOf(norm(g.herb)) >= 0)) {
    m.ing.push({ n: g.herb, q: "", u: H });
    const extra = " Ciseler très finement quelques brins " + de(g.herb) + " frais : un parfum doux, sans aucun piquant.";
    if (fin >= 0) m.steps[fin] += extra; else m.steps.splice(m.steps.length - 1, 0, "Finition —" + extra);
  }
  m.gen = { ...g }; return m;
}
function randomGen(filters = {}, tries = 160){
  const cats = filters.cats || [], bases = filters.bases || [], styles = filters.styles || [];
  const wv = cats.length ? null : Math.random() * 100 < vegRatio();
  for (let t = 0; t < tries; t++){
    const fl = FORMATS.filter(f => (!styles.length || styles.includes(f.st)) && f.s.some(s => !bases.length || bases.includes(STARCHES[s].base)));
    if (!fl.length) return null;
    const f = pick(fl);
    const ps = formatProteins(f).filter(p => PROTEINS[p] && (!cats.length || cats.includes(PROTEINS[p].cat)) && (wv === null || isVegCat(PROTEINS[p].cat) === wv));
    const ss = f.s.filter(s => !bases.length || bases.includes(STARCHES[s].base));
    if (!ps.length || !ss.length) continue;
    const m = buildGen({ f: f.id, p: pick(ps), s: pick(ss), v: pickVeg(f), sa: pick(f.sa) });
    if (!protoCheck(m).bad.length && eggsOK(m) && !(S.sensible && hasFermented(m))) return m;
  }
  return null;
}
function catalogFor(f){
  const bk = slotOf(f) === "b", wv = bk || (f.cats && f.cats.length) ? null : Math.random() * 100 < vegRatio();
  return S.recipes.filter(r => CATS.includes(r.cat) && r.st !== "Douceurs" && ((r.st === "Petit-déjeuner") === bk) && okSens(r) && eggsOK(r) &&
    (!bk || !f.pd || r.go === f.pd) && (wv === null || isVegCat(r.cat) === wv) &&
    (!f.cats || !f.cats.length || f.cats.includes(r.cat)) && (!f.bases || !f.bases.length || f.bases.includes(r.base)) && (!f.styles || !f.styles.length || f.styles.includes(r.st)));
}
/* petits-déjeuners : une fois sur deux sucré, une fois sur deux salé */
function proposeMeals(n, f){
  const out = [], seen = new Set(), bk = slotOf(f) === "b", off = Math.random() < .5 ? 0 : 1;
  for (let i = 0; i < n * 3 && out.length < n; i++){
    const ff = bk && !f.pd ? { ...f, pd: (out.length + off) % 2 === 0 ? "Sucré" : "Salé" } : f;
    const m = oneProposal(ff, seen); if (m && !seen.has(m.name)) { seen.add(m.name); out.push(m); }
  }
  return out;
}
/* une journée : chaque repas évite l'ingrédient principal du repas précédent (ctx.prev : dîner de la veille)
   et le dîner évite celui du petit-déjeuner suivant (ctx.next) ; ctx.eggs : repas aux œufs déjà prévus dans la semaine */
function proposeDay(f, avoid, ctx){
  avoid = new Set(avoid || []); ctx = ctx || {}; f = f || {};
  const out = {}, eggMax = ctx.eggMax != null ? ctx.eggMax : EGG_MAX; let prev = ctx.prev || null, eggs = ctx.eggs || 0;
  SLOTS.forEach((sl, si) => {
    const bk = sl.k === "b", last = si === SLOTS.length - 1; let best = null, bestBad = 1e9;
    for (let t = 0; t < 60; t++){
      const m = oneProposal({ ...f, slot: sl.k }, avoid) || oneProposal({ src: bk ? "book" : "gen", slot: sl.k }, avoid); if (!m) continue;
      const bad = (clash(prev, m) ? 2 : 0) + (last && clash(m, ctx.next) ? 2 : 0) + (isEgg(m) && eggs >= eggMax ? 3 : 0) + (ctx.ok && !ctx.ok(m, sl.k) ? 1 : 0);
      if (bad < bestBad) { best = m; bestBad = bad; } if (!bad) break;
    }
    if (!best) best = oneProposal({ src: "mix", slot: sl.k }, new Set());
    out[sl.k] = best; if (best) { avoid.add(best.name); if (isEgg(best)) eggs++; prev = best; }
  });
  return out;
}
/* une semaine : mêmes règles d'un jour à l'autre, œufs limités, poulet limité (80 % végétarien) */
function proposeWeek(f){
  f = f || {}; const off = Math.random() < .5 ? 0 : 1, limit = f.cats && f.cats.length ? 99 : 5;
  let best = null, bestN = 1e9;
  for (let a = 0; a < 8; a++){
    const days = [], avoid = new Set(), count = {}; let prev = null, eggs = 0;
    for (let i = 0; i < 7; i++){
      const ok = (m, k) => k === "b" || (count[m.cat] || 0) < (limit > 50 ? limit : isVegCat(m.cat) ? 7 : 3);
      const p = proposeDay({ ...f, pd: f.pd || ((i + off) % 2 === 0 ? "Sucré" : "Salé") }, avoid, { prev, eggs, ok });
      SLOTS.forEach(sl => { const m = p[sl.k]; if (!m) return; avoid.add(m.name); if (isEgg(m)) eggs++; if (sl.k !== "b") count[m.cat] = (count[m.cat] || 0) + 1; prev = m; });
      days.push(p);
    }
    const n = planIssues(days.flatMap(p => SLOTS.map(sl => p[sl.k]))).length;
    if (n < bestN) { best = days; bestN = n; } if (!n) break;
  }
  return best;
}
/* contexte d'un jour du planning : dîner de la veille, petit-déjeuner du lendemain, œufs des autres jours */
function dayCtx(w, di){
  const d = w.days, prev = di > 0 ? d[di - 1].meals.d : null, next = di < d.length - 1 ? d[di + 1].meals.b : null;
  let eggs = 0; d.forEach((x, i) => { if (i !== di) SLOTS.forEach(sl => { if (isEgg(x.meals[sl.k])) eggs++; }); });
  return { prev, next, eggs };
}

    <p class="muted small">Légers : 10 minutes au plus, une moitié sucrée, une moitié salée.</p></div>`;

  if (ds.ns === "prop") { PROP.items = proposeMeals(6, PROP); renderPropModal(); } else { INSP.result = null; render(); } };

/* ---------- version 3 : migration ---------- */
const V3_REMOVED = { "pdj-millet-potimarron": "pdj-potimarron-vanille", "p-poulet-millet-haricots": "p-poulet-riz-pakchoi", "p-tofu-millet-potimarron": "p-tofu-quinoa-potimarron" };

  let j = 0;
  S.weeks.forEach((w, wi) => w.days.forEach((d, di) => {
    const src = fresh[wi % fresh.length].days[di % 7].meals;
    ["b", "l", "d"].forEach(k => {
      const m = d.meals[k]; if (!m || !m.recipeId) return;

}

/* ---------- version 9 : catalogue entièrement renouvelé, planning refait ----------
   Toutes les recettes fournies sont remplacées. Chaque repas du planning est refait avec le nouveau planning de départ,
   sauf ceux tirés d'une recette personnelle ou créés à la main (sans recette ni génération). */
function migrate9(){
  const own = S.recipes.filter(r => r.own), ownIds = new Set(own.map(r => r.id));
  S.recipes = DEFAULT_RECIPES.map(recipeToState).concat(own);
  const fresh = buildDefaultPlan(S.recipes);
  S.weeks.forEach((w, wi) => w.days.forEach((d, di) => {
    const src = fresh[wi % fresh.length].days[di % 7].meals;
    ["b", "l", "d"].forEach(k => {
      const m = d.meals[k];
      if (m && ((m.recipeId && ownIds.has(m.recipeId)) || (!m.recipeId && !m.gen))) return;
      const nm = copyMeal(src[k] || src.l); if (m) nm.id = m.id; protoAdaptMeal(nm, k, kT(k)); d.meals[k] = nm;
    });
  }));
  S.v = 9;
}

/* ---------- version 10 : recettes plus savoureuses (petits-déjeuners, poulet, œufs, tofu) ----------
   Les recettes fournies sont remplacées. Seuls les repas du planning issus d'une recette qui n'existe plus sont refaits ;
   les autres repas, les recettes de Cat, ses pesées et ses réglages sont conservés. */
function migrate10(){
  const own = S.recipes.filter(r => r.own), oldIds = new Set(S.recipes.filter(r => !r.own).map(r => r.id));
  S.recipes = DEFAULT_RECIPES.map(recipeToState).concat(own);
  const have = new Set(S.recipes.map(r => r.id));
  const fresh = buildDefaultPlan(S.recipes);
  S.weeks.forEach((w, wi) => w.days.forEach((d, di) => {
    const src = fresh[wi % fresh.length].days[di % 7].meals;
    ["b", "l", "d"].forEach(k => {
      const m = d.meals[k];
      if (!m || !m.recipeId || have.has(m.recipeId) || !oldIds.has(m.recipeId)) return;
      const nm = copyMeal(src[k] || src.l); nm.id = m.id; protoAdaptMeal(nm, k, kT(k)); d.meals[k] = nm;
    });
  }));
  S.v = 10;
}
