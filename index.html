RC({id:"n-s-sundubu-doux", n:"Soupe douce de tofu soyeux façon sundubu (sans piment), épinards & carotte, riz tiède", cat:"Tofu", st:"Cocon & purées", base:"Riz", d:1,
 ing:[["tofu soyeux",100,"g"],["riz cuit",140,"g"],["épinards",70,"g"],["carotte",80,"g"],["bouillon",250,"ml"],["sauce soja",0.5,"c. à café"],["huile de sésame grillé",1,"c. à café"],["ciboulette","",HERBS]],
 steps:[
  introPoele("une casserole à couvercle de 20 cm, une petite casserole à couvercle pour le riz, une cuillère, une louche, une planche et un couteau, un économe, des ciseaux de cuisine, une cuillère à café, un bol profond tiède (rincé à l'eau chaude puis essuyé)") + " Le plat en deux mots : le sundubu est un ragoût coréen de tofu soyeux, d'ordinaire très pimenté. Ici, aucun piment : on garde l'idée d'une soupe veloutée où de gros morceaux de tofu fondent dans la bouche. Le tofu soyeux est un tofu lisse et très tendre, proche d'une crème prise, vendu dans son eau.",
  "Mise en place — Sortir les ingrédients. Éplucher la carotte ({{carotte}}) à l'économe et la couper en demi-rondelles de 3 mm : très fines, elles cuisent vite. Laver les épinards ({{épinards}}) à grande eau en changeant l'eau une fois, puis les égoutter. Ouvrir l'emballage du tofu soyeux ({{tofu soyeux}}) au-dessus de l'évier, le vider de son eau, puis le faire glisser sur la planche et le couper en 4 gros cubes, en appuyant doucement : il se tient, mais reste très fragile. [[sortir; eplucher carotte; couper carotte; laver epinards; egoutter; couper tofu]]",
  "Le bouillon — Verser le bouillon ({{bouillon}}) dans la grande casserole, ajouter la carotte et chauffer à feu moyen jusqu'au frémissement : de petites bulles montent doucement le long de la paroi, sans gros bouillons. Couvrir et cuire 8 minutes à feu doux. Repère de réussite : une rondelle de carotte s'écrase sans effort contre la paroi. [[casserole; cuisson 8]]",
  "Le riz — Pendant ce temps, mettre le riz cuit ({{riz cuit}}), un riz blanc cuit à l'avance, dans la petite casserole avec une cuillère à soupe d'eau. Couvrir et chauffer 3 minutes à feu doux : la vapeur ramollit les grains. Le riz doit être tiède et souple. [[// rechauffer; cuisson 3]]",
  "Le tofu et les épinards — Ajouter les épinards au bouillon et cuire 2 minutes : ils s'affaissent. Éteindre le feu, puis faire glisser les cubes de tofu à la cuillère sur le dessus, couvrir et laisser 3 minutes : le tofu chauffe sans bouillir, ce qui l'empêche de se défaire. Ne pas remuer. [[attente 3]]",
  "Dressage — Verser le riz au fond du bol profond tiède. Prendre le tofu et les légumes à la louche avec leur bouillon, sans casser les cubes. Ajouter la sauce soja ({{sauce soja}}), une sauce salée de soja fermenté, puis un filet d'huile de sésame grillé ({{huile de sésame grillé}}), une huile brune très parfumée ajoutée à froid. Laver la ciboulette ({{ciboulette}}), une herbe fine au goût doux, ne garder que les pointes vertes et les ciseler, c'est-à-dire les hacher aux ciseaux en tout petits morceaux, puis les parsemer. Attendre 2 minutes avant de manger : la soupe doit être tiède. [[assaisonner; laver ciboulette; ciseler; dresser x3; attente 2]]"],
 tip:"Le tofu soyeux se chauffe hors du feu : à l'ébullition il se défait en miettes. Si la soupe est trop salée, ajoutez une louche d'eau chaude."}),

RC({id:"n-s-creme-soyeux-aneth-pdt", n:"Pommes de terre, carotte & épinards à la vapeur, tofu soyeux et crème d'aneth", cat:"Tofu", st:"Vapeur Bamboo", base:"Pommes de terre", d:1,
 ing:[["pommes de terre",130,"g"],["tofu soyeux",100,"g"],["carotte",100,"g"],["épinards",60,"g"],["crème de soja",2,"c. à soupe"],["aneth","",HERBS],["huile d'olive",1,"c. à café"]],
 steps:[
  intro("une planche et un couteau, un économe, des ciseaux, un petit bol, une cuillère à soupe, une fourchette, un bol résistant à la chaleur d'environ 12 cm (porcelaine ou verre), une assiette creuse tiède") + " Le plat en deux mots : un repas tiède cuit en un seul cycle de vapeur. Le tofu soyeux est un tofu lisse et très tendre, proche d'une crème prise, vendu dans son eau ; une fois chaud, il se mange à la cuillère. La crème d'aneth est une sauce de crème de soja, une crème végétale épaisse, parfumée à l'aneth, une herbe fine au goût doux d'anis.",
  "Mise en place — Sortir les ingrédients. Éplucher les pommes de terre ({{pommes de terre}}) à l'économe et les couper en cubes de 3 cm, tous de la même taille. Éplucher la carotte ({{carotte}}) et la couper en bâtonnets de 5 cm de long sur 1 cm de large. Laver les épinards ({{épinards}}) à grande eau et les égoutter. Vider le tofu soyeux ({{tofu soyeux}}) de son eau au-dessus de l'évier et le faire glisser dans le bol résistant à la chaleur, sans le couper. [[sortir; eplucher pommes de terre; couper pommes de terre; eplucher carotte; couper carotte; laver epinards; egoutter]]",
  c1(25, "les cubes de pommes de terre, les bâtonnets de carotte, les épinards et, posé sur le panier, le bol contenant le tofu soyeux entier", "Ne pas remuer le tofu. Au bip, repères de réussite : la pointe d'un couteau entre dans les pommes de terre sans résistance, les épinards sont affaissés et le tofu est chaud."),
  "La crème d'aneth — Pendant la cuisson, laver l'aneth ({{aneth}}), le sécher et le ciseler : le hacher aux ciseaux en tout petits morceaux. Dans le petit bol, mélanger la crème de soja ({{crème de soja}}) avec l'huile d'olive ({{huile d'olive}}), ajoutée telle quelle sans la chauffer, et l'aneth, à la fourchette, jusqu'à une crème lisse et verte. [[// laver aneth; ciseler; delayer]]",
  "Dressage — Au bip, ouvrir le couvercle en éloignant le visage de la vapeur. Presser les épinards entre deux cuillères pour retirer l'eau. Écraser grossièrement la moitié des pommes de terre à la fourchette dans l'assiette creuse tiède, poser le reste autour avec la carotte et les épinards, puis, avec une cuillère, déposer le tofu soyeux en grosses cuillerées. Napper, c'est-à-dire recouvrir d'une fine couche, de crème d'aneth et attendre 2 minutes avant de manger. [[presser epinards; ecraser; dresser x4; attente 2]]"],
 tip:"Le tofu soyeux cuit dans son bol reste entier et tendre ; on le prend à la cuillère. La crème de soja apporte de l'onctuosité sans produit laitier."}),

RC({id:"n-s-veloute-panais-soyeux", n:"Velouté de panais & pommes de terre au tofu soyeux et lait d'avoine, croûtons de carotte tendre", cat:"Tofu", st:"Cocon & purées", base:"Pommes de terre", d:1,
 ing:[["panais",100,"g"],["pommes de terre",130,"g"],["tofu soyeux",100,"g"],["carotte",60,"g"],["bouillon",200,"ml"],["lait d'avoine",80,"ml"],["huile d'olive",1,"c. à café"],["thym","",HERBS]],
 steps:[
  introPoele("une casserole à couvercle de 20 cm, un mixeur plongeant (ou un presse-purée), une louche, une planche et un couteau, un économe, une cuillère, une assiette creuse tiède (passée sous l'eau chaude puis essuyée)") + " Le plat en deux mots : un velouté est une soupe lisse et épaisse. Le panais est une racine blanc crème, proche de la carotte, au goût doux et sucré. Le tofu soyeux, lisse et très tendre, remplace la crème : mixé avec les légumes, il rend la soupe onctueuse.",
  "Mise en place — Sortir les ingrédients. Éplucher le panais ({{panais}}), les pommes de terre ({{pommes de terre}}) et la carotte ({{carotte}}) à l'économe. Retirer le cœur du panais s'il est dur et ligneux. Couper le panais et les pommes de terre en cubes de 2 cm, et la carotte en petits dés de 5 mm. Vider le tofu soyeux ({{tofu soyeux}}) de son eau au-dessus de l'évier. Effeuiller le thym ({{thym}}) : faire glisser les doigts le long de la tige pour détacher les petites feuilles. [[sortir; eplucher panais; eplucher pommes de terre; eplucher carotte; couper panais; couper pommes de terre; couper carotte; egoutter]]",
  "La cuisson — Mettre le panais, les pommes de terre et le thym dans la casserole avec le bouillon ({{bouillon}}). Couvrir, chauffer jusqu'au frémissement puis cuire 18 minutes à feu doux. Ajouter les petits dés de carotte dans un coin de la casserole pour les 8 dernières minutes. Repère de réussite : un cube de pommes de terre s'écrase sans effort. [[casserole; cuisson 18]]",
  "Le velouté — Retirer les dés de carotte avec une cuillère et les garder dans l'assiette creuse tiède. Éteindre le feu, ajouter le tofu soyeux et le lait d'avoine ({{lait d'avoine}}), une boisson végétale douce, puis mixer 1 minute jusqu'à un velouté lisse et sans grain. Si le velouté est trop épais, ajouter une cuillère de bouillon chaud ; il doit napper le dos de la cuillère. Attendre quelques minutes qu'il soit tiède. [[mixer; attente 3]]",
  "Dressage — Verser le velouté tiède sur les dés de carotte, puis ajouter l'huile d'olive ({{huile d'olive}}) en filet, sans la chauffer. [[verser; dresser x2]]"],
 tip:"Le tofu soyeux et le lait d'avoine ajoutés hors du feu donnent un velouté onctueux sans crème ni beurre. Mixez-le tiède, jamais bouillant."})
);

/* ============ DÉJEUNERS ET DÎNERS : PROTÉINES TEXTURÉES, OKARA, SARDINES ============
   Protéine de pois texturée ou de soja texturée : 30 g secs par repas (comptés 90 g une fois réhydratés), dans quelques plats seulement.
   La réhydratation (10 minutes dans du bouillon chaud) est comptée dans la durée ; la mise en place se fait pendant ce temps.
   Recettes détaillées : chaque mot technique est expliqué à sa première apparition dans la recette (consigne d'Olivier, 8 octobre 2026). */
const PST_DEF = "La protéine texturée est un produit sec, vendu en petits morceaux ou en granulés, fabriqué à partir de pois ou de soja : plongée dans un liquide chaud, elle gonfle et prend la texture d'une viande hachée.";
/* réhydratation : « réhydrater » = faire regonfler un produit sec dans un liquide */
const REHYD_TXT = (nom, ref) => "Chauffer le bouillon ({{bouillon}}) dans une petite casserole jusqu'au frémissement, c'est-à-dire quand de toutes petites bulles montent doucement sans que l'eau bouillonne. Pendant ce temps, peser les 30 g de " + nom + " ({{" + ref + "}}) et les mettre dans un bol. Verser le bouillon chaud dessus, mélanger avec une cuillère et couvrir d'une assiette : on laisse gonfler 10 minutes sans y toucher. " + PST_DEF + " Au bout de 10 minutes, elle a environ triplé de volume et se pince sans effort entre deux doigts. La presser alors contre la paroi du bol avec le dos de la cuillère pour chasser le bouillon en trop : elle doit être humide, pas détrempée.";
const REHYD = (nom, ref) => "Réhydratation — Réhydrater veut dire faire regonfler un aliment sec dans un liquide. " + REHYD_TXT(nom, ref) + " [[sortir; casserole; peser " + ref + "; attente 3; verser; attente 10; presser]]";
const REHYD2 = (nom, ref) => "Pendant le cycle, réhydrater la protéine — Réhydrater veut dire faire regonfler un aliment sec dans un liquide ; on le fait pendant que la vapeur travaille, pour ne pas perdre de temps. " + REHYD_TXT(nom, ref) + " [[// sortir; casserole; peser " + ref + "; attente 3; verser; attente 10; presser]]";
const BOUILLON_TIP = " Choisir un bouillon de légumes doux et vérifier sur l'étiquette qu'il ne contient ni ail, ni oignon, ni poivre, ni piment.";
const PAPIER = "le papier sulfurisé est un papier de cuisine qui résiste à la chaleur et à l'humidité : on le perce de quelques trous avec la pointe d'un couteau pour que la vapeur passe, et il empêche les petits morceaux de glisser entre les barreaux du panier";
LUNCH.push(
RC({id:"l-hachis-pois-panais", n:"Hachis de protéine de pois au thym, purée pomme de terre–panais & haricots verts", cat:"Protéines végétales", st:"Cocon & purées", base:"Pommes de terre", d:1,
 ing:[["protéine de pois texturée (sèche)",30,"g"],["bouillon",100,"ml"],["pommes de terre",140,"g"],["panais",80,"g"],["haricots verts",70,"g"],["crème de soja",1,"c. à soupe"],["huile d'olive",1,"c. à café"],["thym","",HERBS],["persil","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("une petite casserole (pour chauffer le bouillon), un bol et une assiette qui le recouvre, une cuillère, un économe (couteau à lame fixe pour éplucher), une planche et un couteau, une fourchette, un presse-purée (ou une fourchette), un cercle à pâtisserie de 10 cm (un anneau sans fond ; à défaut, un petit bol qu'on retournera), une assiette creuse tiède ; " + PAPIER) +
   " Le plat en deux mots : un hachis est une préparation de viande hachée recouverte de purée, comme le hachis parmentier. Ici, la « viande » est de la protéine de pois texturée assaisonnée au thym (une herbe douce et parfumée), recouverte d'une purée de pommes de terre et de panais (le panais est une racine blanc crème, au goût doux et légèrement sucré). Le tout se mange tiède, avec des haricots verts à côté.",
  "Mise en place — Éplucher les pommes de terre ({{pommes de terre}}) et le panais ({{panais}}) avec l'économe, puis les couper en cubes de 2 cm de côté : des morceaux réguliers cuisent à la même vitesse. Peser les haricots verts ({{haricots verts}}), les équeuter (c'est-à-dire couper les deux petits bouts) et les couper en tronçons de 3 cm. La limite du protocole est de 75 g de haricots verts par repas. [[sortir; eplucher pommes de terre; couper pommes de terre; eplucher panais; couper panais; peser haricots verts; couper haricots verts]]",
  c1(25, "les pommes de terre, le panais et les haricots verts", "Pendant ce temps, passer à l'étape suivante. À la fin du cycle, les haricots verts sont mous et les cubes de pommes de terre et de panais s'écrasent sans résistance à la fourchette ; s'il reste un cœur ferme, relancer 5 minutes."),
  REHYD2("protéine de pois texturée", "protéine de pois texturée (sèche)"),
  "Le hachis et la purée — Effeuiller le thym ({{thym}}) : faire glisser les doigts le long de la tige pour détacher les petites feuilles, et les mêler à la protéine de pois pressée ; ce sera le hachis. Sortir les pommes de terre et le panais du panier, les mettre dans un bol et les écraser au presse-purée (ou à la fourchette) avec la crème de soja ({{crème de soja}}, une crème végétale liquide), le sel ({{sel}}) et une cuillère à soupe d'eau de la cuve. Écraser jusqu'à obtenir une purée lisse, sans morceaux : si elle est trop épaisse, ajouter encore une cuillère d'eau. [[ecraser]]",
  "Dressage — Poser le cercle sur l'assiette creuse tiède. Y tasser le hachis avec le dos de la cuillère, puis couvrir de purée et lisser le dessus à la cuillère. Retirer le cercle en le soulevant doucement. Disposer les haricots verts autour, verser sur le tout le filet d'huile d'olive ({{huile d'olive}}) ajouté à la fin, sans la chauffer, et parsemer de persil ciselé ({{persil}}), c'est-à-dire coupé très finement avec un couteau ou des ciseaux. [[ciseler; dresser x3]]"],
 tip:"Réhydratée dans le bouillon pendant que les légumes cuisent, la protéine de pois est prête sans une minute de plus. Si le hachis semble sec, l'humidifier d'une cuillère de bouillon tiède." + BOUILLON_TIP}),

RC({id:"l-bol-pois-butternut", n:"Bol de quinoa tiède, protéine de pois au bouillon, butternut & brocoli, sauce persillée", cat:"Protéines végétales", st:"Vapeur Bamboo", base:"Quinoa", d:1,
 ing:[["protéine de pois texturée (sèche)",30,"g"],["bouillon",100,"ml"],["quinoa cuit",140,"g"],["butternut",100,"g"],["brocoli",80,"g"],["huile d'olive",1,"c. à café"],["persil","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("une petite casserole (pour chauffer le bouillon), un bol et une assiette qui le recouvre, un petit bol pour la sauce, un bol pour réchauffer le quinoa, une cuillère, une fourchette, un économe (couteau à lame fixe pour éplucher), une planche et un couteau, un grand bol tiède pour servir ; " + PAPIER) +
   " Le plat en deux mots : un bol composé, où chaque aliment a sa place. Le quinoa est une petite graine ronde, cuite à l'avance, qui se mange comme une céréale. La butternut est une courge allongée à chair orange, très douce. La protéine de pois texturée remplace la viande, et une sauce au persil, tiède et sans acidité, relie le tout.",
  "Mise en place — Éplucher la butternut ({{butternut}}) avec l'économe, retirer les graines et les filaments du centre avec une cuillère, puis la couper en cubes de 2 cm. Détacher les têtes du brocoli ({{brocoli}}) en petits bouquets de la taille d'une bouchée (on n'utilise que les têtes, la tige est trop fibreuse). Mettre le quinoa cuit ({{quinoa cuit}}) dans un bol avec une cuillère d'eau : la vapeur le réchauffera sans le dessécher. [[sortir; eplucher butternut; couper butternut; couper brocoli]]",
  c1(20, "la butternut, le brocoli et le quinoa ({{quinoa cuit}}) mouillé d'une cuillère d'eau " + bol, "À la fin du cycle, la butternut s'écrase facilement à la fourchette et le brocoli, d'un vert tendre, est très mou. Le quinoa est chaud et gonflé. Sinon, relancer 5 minutes."),
  REHYD2("protéine de pois texturée", "protéine de pois texturée (sèche)"),
  "La sauce persillée — Ciseler le persil ({{persil}}) : le hacher très finement avec un couteau ou des ciseaux. Dans le petit bol, le mélanger à l'huile d'olive ({{huile d'olive}}), 2 cuillères à soupe d'eau tiède et au sel ({{sel}}), en battant à la fourchette jusqu'à ce que le mélange soit vert et un peu trouble. L'huile n'est jamais chauffée : elle est ajoutée tiède, à la fin. [[ciseler; delayer]]",
  "Dressage — Verser le quinoa au fond du grand bol tiède. Poser la protéine de pois au centre, ranger la butternut et le brocoli de chaque côté, puis verser la sauce persillée en filet sur l'ensemble. Servir tiède, jamais brûlant. [[dresser x4]]"],
 tip:"Le bouillon de réhydratation parfume la protéine, donc le choisir doux." + BOUILLON_TIP}),

RC({id:"l-soja-miso-soba", n:"Soja texturé au miso doux, nouilles de sarrasin tièdes, épinards & daikon fondants", cat:"Protéines végétales", st:"Fraîcheur tiède", base:"Sarrasin", d:1,
 ing:[["protéine de soja texturée (sèche)",30,"g"],["bouillon",100,"ml"],["soba cuites",140,"g"],["épinards",80,"g"],["daikon",90,"g"],["miso blanc",1,"c. à café"],["huile de sésame grillé",1,"c. à café"],["graines de sésame",1,"c. à café"]],
 steps:[
  intro("une petite casserole (pour chauffer le bouillon), un bol et une assiette qui le recouvre, une casserole moyenne pour les nouilles, une passoire, une cuillère, un économe (couteau à lame fixe pour éplucher), une planche et un couteau, un petit bol, un grand bol tiède ; " + PAPIER) +
   " Le plat en deux mots : un bol de style japonais. Les soba sont des nouilles japonaises à base de grains de sarrasin moulus (une céréale sans blé, au goût de noisette). Le miso blanc est une pâte de soja fermenté au goût doux et salé, qui sert ici d'assaisonnement. Le daikon est un gros radis blanc japonais : cuit, il devient fondant et perd tout son piquant. Le soja texturé joue le rôle de la viande hachée.",
  "Mise en place — Éplucher le daikon ({{daikon}}) avec l'économe, le couper en deux dans la longueur puis en demi-rondelles de 5 mm d'épaisseur. Laver les épinards ({{épinards}}) à grande eau en les changeant deux fois, pour retirer la terre. Vérifier sur le paquet que les soba sont faites à 100 % de sarrasin, sans farine de blé. [[sortir; eplucher daikon; couper daikon; laver epinards]]",
  c1(20, "le daikon et les épinards", "À la fin du cycle, les demi-rondelles de daikon sont translucides, presque transparentes, et se coupent à la fourchette ; les épinards sont très tendres et d'un vert foncé."),
  REHYD2("protéine de soja texturée", "protéine de soja texturée (sèche)"),
  "Les nouilles — Pendant le cycle, remplir la casserole moyenne d'eau, la porter à frémissement et y plonger les soba (il en faut environ 60 g sèches pour obtenir les 140 g de soba cuites, {{soba cuites}}). Les cuire 6 minutes à petits bouillons, en les remuant une fois au début pour qu'elles ne collent pas, dans une eau non salée. Les verser dans la passoire, les rincer à l'eau tiède pour retirer l'amidon qui les rendrait collantes, puis bien les égoutter. [[// casserole; cuisson 6; rincer; egoutter]]",
  "La sauce miso — Presser les épinards cuits entre les mains ou contre la passoire pour chasser l'eau, puis les séparer en petites mèches. Dans le petit bol, délayer le miso ({{miso blanc}}) dans 3 cuillères à soupe d'eau tiède, en l'aplatissant à la cuillère jusqu'à ce que la pâte soit entièrement dissoute. Ajouter l'huile de sésame grillé ({{huile de sésame grillé}}, une huile parfumée à la saveur de noisette) et mêler la protéine de soja pressée à cette sauce. Ne jamais chauffer le miso : la chaleur détruit son goût délicat. [[presser epinards; delayer]]",
  "Dressage — Enrouler les soba en nid au fond du grand bol tiède. Poser le soja au miso au centre, disposer les épinards et le daikon autour, puis parsemer des graines de sésame ({{graines de sésame}}) en pluie. Servir tiède. [[dresser x4]]"],
 tip:"Le soja texturé se garde en petite quantité : 30 g secs suffisent pour un repas complet. Le miso étant déjà salé, ne pas ajouter de sel." + BOUILLON_TIP}),

RC({id:"l-soja-donburi-aubergine", n:"Bol de riz tiède, soja texturé sauce douce, aubergine pelée & courgette fondantes", cat:"Protéines végétales", st:"Vapeur Bamboo", base:"Riz", d:1,
 ing:[["protéine de soja texturée (sèche)",30,"g"],["bouillon",100,"ml"],["riz cuit",140,"g"],["aubergine",90,"g"],["courgette épluchée",60,"g"],["sauce soja",1,"c. à café"],["sirop d'érable",1,"c. à café"],["huile de sésame grillé",1,"c. à café"]],
 steps:[
  intro("une petite casserole (pour chauffer le bouillon), un bol et une assiette qui le recouvre, un petit bol pour la sauce, un bol pour réchauffer le riz, une cuillère, une fourchette, un économe (couteau à lame fixe pour éplucher), une planche et un couteau, un grand bol tiède ; " + PAPIER) +
   " Le plat en deux mots : un donburi est un plat japonais servi dans un grand bol, avec du riz au fond et une garniture cuite par-dessus, nappée d'une sauce douce. Ici, la garniture est du soja texturé et deux légumes très tendres. Le sirop d'érable, un sirop sucré tiré de la sève de l'érable, adoucit la sauce soja salée.",
  "Mise en place — Éplucher entièrement l'aubergine ({{aubergine}}) avec l'économe : sa peau est difficile à digérer. La couper en dés de 1,5 cm. Éplucher la courgette ({{courgette épluchée}}), la couper en deux, retirer le cœur et les graines avec une petite cuillère, puis la couper en dés. Ne pas dépasser 60 g de courgette. Mettre le riz cuit ({{riz cuit}}) dans un bol avec une cuillère d'eau pour qu'il se réchauffe sans sécher. [[sortir; eplucher aubergine; couper aubergine; eplucher courgette; couper courgette]]",
  c1(25, "l'aubergine, la courgette et le riz ({{riz cuit}}) mouillé d'une cuillère d'eau " + bol, "À la fin du cycle, l'aubergine est presque en purée, translucide et très molle, et la courgette s'écrase sans effort : l'aubergine est toujours servie très cuite. Le riz est chaud et moelleux."),
  REHYD2("protéine de soja texturée", "protéine de soja texturée (sèche)"),
  "La sauce — Dans le petit bol, mélanger la sauce soja ({{sauce soja}}), le sirop d'érable ({{sirop d'érable}}) et 2 cuillères à soupe d'eau tiède, en battant à la fourchette jusqu'à ce que le sirop soit dissous. Y mêler le soja pressé : il absorbe la sauce et devient brun clair et brillant. Napper veut dire recouvrir d'une fine couche de sauce. [[delayer]]",
  "Dressage — Verser le riz dans le grand bol tiède. Étaler le soja à la sauce au centre, ranger l'aubergine et la courgette de chaque côté, puis verser l'huile de sésame grillé ({{huile de sésame grillé}}) en filet à la fin, sans la chauffer. Servir tiède. [[dresser x4]]"],
 tip:"L'aubergine pelée et très cuite devient fondante : c'est elle qui donne la douceur du plat. Le soja texturé est toléré en petite quantité, donc ne pas dépasser 30 g secs." + BOUILLON_TIP}),

RC({id:"l-galettes-okara-pois", n:"Galettes vapeur d'amande et de pois texturé, riz tiède, carotte & haricots verts", cat:"Protéines végétales", st:"Vapeur Bamboo", base:"Riz", d:1,
 ing:[["protéine de pois texturée (sèche)",30,"g"],["bouillon",100,"ml"],["okara d'amande",50,"g"],["riz cuit",140,"g"],["carotte",100,"g"],["haricots verts",60,"g"],["crème de soja",1,"c. à soupe"],["huile d'olive",1,"c. à café"],["thym","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("une petite casserole (pour chauffer le bouillon), un bol et une assiette qui le recouvre, un second bol pour le mélange, un bol pour réchauffer le riz, une cuillère, une fourchette, un économe (couteau à lame fixe pour éplucher), une planche et un couteau, une assiette tiède ; " + PAPIER) +
   " Le plat en deux mots : des galettes sont de petits palets plats, ici cuits à la vapeur et non à la poêle. L'okara est la pulpe qui reste quand on fait de la boisson d'amande : une sorte de farine humide, douce, qui sert ici de liant à la place de l'œuf. Le mélange donne des galettes tendres, à poser sur du riz.",
  REHYD("protéine de pois texturée", "protéine de pois texturée (sèche)"),
  "Mise en place — Pendant que la protéine gonfle, éplucher la carotte ({{carotte}}) et la couper en rondelles de 5 mm d'épaisseur. Peser les haricots verts ({{haricots verts}}), les équeuter (couper les deux petits bouts) et les couper en tronçons de 3 cm. Mettre le riz cuit ({{riz cuit}}) dans un bol avec une cuillère d'eau. [[// sortir; eplucher carotte; couper carotte; peser haricots verts; couper haricots verts]]",
  "Les galettes — Dans le bol de mélange, réunir la protéine pressée, l'okara ({{okara d'amande}}), la crème de soja ({{crème de soja}}), le thym effeuillé ({{thym}}) (glisser les doigts le long de la tige pour détacher les feuilles) et le sel ({{sel}}). Mélanger à la fourchette puis à la main jusqu'à obtenir une pâte souple qui tient quand on la serre ; si elle s'effrite, mouiller légèrement les doigts. Former 4 galettes plates de 6 cm de diamètre et de 1 cm d'épaisseur, et les poser sur un carré de papier sulfurisé percé de trous. [[delayer; former x4]]",
  c1(20, "les galettes (sur leur papier), la carotte, les haricots verts et le riz ({{riz cuit}}) mouillé d'une cuillère d'eau " + bol, "À la fin du cycle, les galettes sont fermes au toucher et se détachent du papier sans coller ; la carotte et les haricots verts sont très tendres. Les soulever avec une spatule, car elles sont fragiles."),
  "Dressage — Verser le riz au centre de l'assiette tiède, poser les galettes en ligne dessus, ranger la carotte et les haricots verts autour, puis verser l'huile d'olive ({{huile d'olive}}) en filet à la fin, sans la chauffer. [[dresser x4]]"],
 tip:"L'okara lie la protéine : les galettes tiennent sans œuf et cuisent à la vapeur, sans friture." + BOUILLON_TIP}),

RC({id:"l-minestrone-pois", n:"Soupe-repas italienne sans tomate : quinoa, protéine de pois, carotte, courgette & haricots verts", cat:"Protéines végétales", st:"Cocon & purées", base:"Quinoa", d:1,
 ing:[["protéine de pois texturée (sèche)",30,"g"],["bouillon",400,"ml"],["quinoa cuit",140,"g"],["carotte",80,"g"],["courgette épluchée",55,"g"],["haricots verts",40,"g"],["huile d'olive",1,"c. à café"],["basilic","",HERBS]],
 steps:[
  introPoele("une casserole moyenne avec couvercle, une louche, une cuillère en bois, un économe (couteau à lame fixe pour éplucher), une planche et un couteau, un grand bol tiède") +
   " Le plat en deux mots : un minestrone est une soupe italienne épaisse, remplie de légumes coupés en petits dés et de céréales. Ici, il n'y a pas de tomate, et la protéine de pois texturée remplace la viande : en cuisant dans le bouillon, elle gonfle et devient tendre, sans étape à part. " + PST_DEF + " Le quinoa est une petite graine ronde, déjà cuite, qui épaissit la soupe. Le basilic est une herbe fraîche au parfum doux.",
  "Mise en place — Éplucher la carotte ({{carotte}}) avec l'économe et la couper en petits dés de 1 cm. Éplucher la courgette ({{courgette épluchée}}), la couper en deux, retirer le cœur et les graines à la petite cuillère, puis la couper en dés de 1 cm. Peser les haricots verts ({{haricots verts}}), les équeuter (couper les deux petits bouts) et les couper en petits tronçons de 1 cm. Des morceaux petits et réguliers cuisent vite et uniformément. [[sortir; eplucher carotte; couper carotte; eplucher courgette; couper courgette; peser haricots verts; couper haricots verts]]",
  "Le bouillon — Verser le bouillon ({{bouillon}}) dans la casserole, le porter au frémissement (de toutes petites bulles qui montent doucement, sans grosse ébullition) puis ajouter la protéine de pois ({{protéine de pois texturée (sèche)}}), la carotte et les haricots verts. Couvrir et laisser cuire 12 minutes à feu doux, en remuant de temps en temps à la cuillère en bois. La protéine gonfle et la carotte devient tendre : elle cède sous la pression d'une cuillère contre la paroi de la casserole. [[casserole; cuisson 12]]",
  "Le quinoa et la courgette — Ajouter la courgette et le quinoa cuit ({{quinoa cuit}}) et laisser frémir 3 minutes de plus, à feu doux et sans laisser bouillir. La courgette est prête quand elle devient translucide et molle, et que le quinoa a réchauffé la soupe. [[cuisson 3]]",
  "Dressage — Verser la soupe dans le grand bol tiède et la laisser tiédir quelques minutes, car on la sert tiède. Ajouter l'huile d'olive ({{huile d'olive}}) en filet à la fin, sans la chauffer, et parsemer de basilic ciselé ({{basilic}}), c'est-à-dire coupé en fines lanières avec un couteau ou des ciseaux. [[ciseler; dresser x2]]"],
 tip:"Sans tomate, le minestrone tient par le basilic frais et le bouillon : une soupe-repas complète dans une seule casserole." + BOUILLON_TIP}),

RC({id:"x-boulettes-pois-brocoli", n:"Boulettes de protéine de pois et pomme de terre, brocoli & carotte, crème de soja persillée", cat:"Protéines végétales", st:"Vapeur Bamboo", base:"Pommes de terre", d:1,
 ing:[["protéine de pois texturée (sèche)",30,"g"],["bouillon",100,"ml"],["pommes de terre",140,"g"],["brocoli",90,"g"],["carotte",70,"g"],["crème de soja",1,"c. à soupe"],["huile d'olive",1,"c. à café"],["persil","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("une petite casserole (pour chauffer le bouillon), un bol et une assiette qui le recouvre, un grand bol pour écraser, une cuillère, une fourchette, un petit bol pour la sauce, un économe (couteau à lame fixe pour éplucher), une planche et un couteau, une assiette creuse tiède ; " + PAPIER) +
   " Le plat en deux mots : les boulettes sont de petites boules de la taille d'une noix. Ici, elles sont faites de protéine de pois texturée mélangée à des pommes de terre écrasées, qui servent de liant. Elles ne sont ni frites ni passées au feu : elles se mangent tièdes et tendres, avec une sauce à la crème de soja (une crème végétale liquide) et au persil.",
  "Mise en place — Éplucher les pommes de terre ({{pommes de terre}}) avec l'économe et les couper en cubes de 2 cm. Éplucher la carotte ({{carotte}}) et la couper en rondelles de 5 mm. Détacher les têtes du brocoli ({{brocoli}}) en petits bouquets, sans garder la tige, trop fibreuse. [[sortir; eplucher pommes de terre; couper pommes de terre; eplucher carotte; couper carotte; couper brocoli]]",
  c1(25, "les pommes de terre, la carotte et le brocoli", "À la fin du cycle, les pommes de terre s'écrasent sans résistance à la fourchette, la carotte est tendre et le brocoli très mou. Sinon, relancer 5 minutes."),
  REHYD2("protéine de pois texturée", "protéine de pois texturée (sèche)"),
  "Les boulettes — Mettre les pommes de terre chaudes dans le grand bol et les écraser à la fourchette en une purée grossière (quelques petits morceaux sont normaux). Ajouter la protéine pressée et le sel ({{sel}}), puis mélanger à la fourchette. Prélever de petites quantités avec la cuillère et les rouler entre les paumes pour former 6 boulettes de la taille d'une noix. Si la pâte colle aux mains, les mouiller légèrement ; si elle s'effrite, la serrer plus fort. Aucune autre cuisson n'est nécessaire. [[ecraser pommes de terre; former x6]]",
  "La crème persillée — Ciseler le persil ({{persil}}), c'est-à-dire le hacher très finement. Dans le petit bol, le mélanger à la crème de soja ({{crème de soja}}) et à l'huile d'olive ({{huile d'olive}}) en battant à la fourchette jusqu'à ce que la crème soit légèrement verte. [[ciseler; delayer]]",
  "Dressage — Poser les boulettes dans l'assiette creuse tiède, ranger le brocoli et la carotte autour, puis verser la crème persillée en filet par-dessus. Servir tiède. [[dresser x3]]"],
 tip:"La pomme de terre écrasée lie la protéine sans œuf ni friture : les boulettes sont tendres et gardent leur forme." + BOUILLON_TIP}),

RC({id:"x-bol-pois-potimarron", n:"Bol de riz tiède, protéine de pois au thym, potimarron & épinards", cat:"Protéines végétales", st:"Vapeur Bamboo", base:"Riz", d:1,
 ing:[["protéine de pois texturée (sèche)",30,"g"],["bouillon",100,"ml"],["riz cuit",140,"g"],["potimarron",100,"g"],["épinards",60,"g"],["huile d'olive",1,"c. à café"],["thym","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("une petite casserole (pour chauffer le bouillon), un bol et une assiette qui le recouvre, un bol pour réchauffer le riz, une cuillère, un économe (couteau à lame fixe pour éplucher), une planche et un couteau, une passoire, un grand bol tiède ; " + PAPIER) +
   " Le plat en deux mots : un bol composé, avec du riz au fond et trois garnitures. Le potimarron est une petite courge orange à la chair douce, au goût de châtaigne ; les épinards sont des feuilles vertes très tendres une fois cuites ; la protéine de pois texturée remplace la viande, et le thym, une herbe parfumée, lui donne du goût.",
  "Mise en place — Éplucher le potimarron ({{potimarron}}) avec l'économe, le couper en deux, retirer les graines et les filaments avec une cuillère, puis le couper en cubes de 2 cm. Laver les épinards ({{épinards}}) à grande eau en les changeant deux fois, pour retirer la terre. Mettre le riz cuit ({{riz cuit}}) dans un bol avec une cuillère d'eau. [[sortir; eplucher potimarron; couper potimarron; laver epinards]]",
  c1(20, "le potimarron, les épinards et le riz ({{riz cuit}}) mouillé d'une cuillère d'eau " + bol, "À la fin du cycle, le potimarron s'écrase sous la pointe d'un couteau, les épinards sont affaissés et d'un vert foncé, et le riz est chaud et moelleux."),
  REHYD2("protéine de pois texturée", "protéine de pois texturée (sèche)"),
  "Dressage — Presser les épinards cuits dans la passoire avec le dos d'une cuillère pour chasser l'eau, puis les séparer en petites mèches. Effeuiller le thym ({{thym}}) en glissant les doigts le long de la tige et le mêler à la protéine de pois pressée. Verser le riz dans le grand bol tiède, poser la protéine au thym au centre, ranger le potimarron et les épinards autour, puis verser l'huile d'olive ({{huile d'olive}}) en filet à la fin, sans la chauffer, et saler d'une pincée de sel ({{sel}}). [[presser epinards; dresser x4]]"],
 tip:"Le thym parfume la protéine de pois, le potimarron lui apporte sa douceur sucrée." + BOUILLON_TIP}),

RC({id:"s-sardines-pdt-haricots", n:"Salade tiède de pommes de terre, sardines en boîte au naturel, haricots verts & carotte, sauce persillée", cat:"Sardines", st:"Fraîcheur tiède", base:"Pommes de terre", d:1,
 ing:[["sardines au naturel",90,"g"],["pommes de terre",140,"g"],["haricots verts",75,"g"],["carotte",90,"g"],["huile d'olive",1,"c. à café"],["persil","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("une passoire, du papier absorbant, une assiette creuse, une fourchette, un petit bol, un économe (couteau à lame fixe pour éplucher), une planche et un couteau ; " + PAPIER) +
   " Le plat en deux mots : une salade tiède de légumes cuits à la vapeur, avec des sardines en boîte. « Au naturel » veut dire que les sardines sont conservées dans l'eau (avec un peu de sel), sans huile piquante ni épices : c'est la seule version à choisir. Les sardines sont un plat occasionnel, à manger plutôt au déjeuner et en dehors des phases sensibles, c'est-à-dire quand les symptômes sont vifs : le poisson en conserve contient de l'histamine, qui peut les réveiller.",
  "Mise en place — Éplucher les pommes de terre ({{pommes de terre}}) avec l'économe et les couper en cubes de 2 cm. Peser les haricots verts ({{haricots verts}}), les équeuter (couper les deux petits bouts) et les couper en tronçons de 3 cm ; la limite du protocole est de 75 g. Éplucher la carotte ({{carotte}}) et la couper en rondelles de 5 mm. [[sortir; eplucher pommes de terre; couper pommes de terre; peser haricots verts; couper haricots verts; eplucher carotte; couper carotte]]",
  c1(25, "les pommes de terre, les haricots verts et la carotte", "À la fin du cycle, les haricots verts sont mous, la carotte est tendre et les cubes de pommes de terre s'écrasent sans résistance à la fourchette. Sinon, relancer 5 minutes."),
  "Les sardines — Pendant le cycle, ouvrir la boîte et verser les sardines ({{sardines au naturel}}) dans la passoire pour retirer tout le liquide, puis les poser sur du papier absorbant et les tamponner pour les sécher. Les arêtes très fines des sardines en boîte sont ramollies par la stérilisation : elles s'écrasent sous la fourchette et se mangent sans danger. Retirer seulement l'arête centrale, plus épaisse, en l'écartant avec la pointe d'un couteau. Écraser ensuite la chair en gros morceaux à la fourchette, sans en faire une purée. [[// egoutter; presser sardines; ecraser]]",
  "Sauce et dressage — Ciseler le persil ({{persil}}), c'est-à-dire le hacher très finement. Dans le petit bol, le mélanger à l'huile d'olive ({{huile d'olive}}), 2 cuillères à soupe d'eau tiède et au sel ({{sel}}) en battant à la fourchette. Ranger les légumes tièdes en couronne dans l'assiette creuse, poser les sardines émiettées au centre et napper l'ensemble de la sauce persillée (verser un voile de sauce). Servir tiède. [[ciseler; delayer; dresser x2]]"],
 tip:"Les sardines au naturel, bien égouttées, restent légères ; la sauce persillée les rafraîchit sans acidité. Garder ce plat pour le déjeuner, en dehors des phases sensibles."}),

RC({id:"s-sardines-vapeur-fenouil", n:"Filets de sardines fraîches à la vapeur, riz tiède, fenouil & courgette fondants", cat:"Sardines", st:"Vapeur Bamboo", base:"Riz", d:2,
 ing:[["sardines fraîches",90,"g"],["riz cuit",140,"g"],["fenouil",60,"g"],["courgette épluchée",55,"g"],["carotte",50,"g"],["huile d'olive",1,"c. à café"],["aneth","",HERBS],["sel","","1 pincée"]],
 steps:[
  intro("une pince à épiler de cuisine (pince à arêtes), du papier absorbant, un bol pour réchauffer le riz, une cuillère, une fourchette, un économe (couteau à lame fixe pour éplucher), une planche et un couteau, une assiette creuse tiède ; " + PAPIER + ", mais ici rien n'est posé sous les filets de poisson : ils vont directement sur la grille du panier") +
   " Le plat en deux mots : des filets de sardines fraîches cuits à la vapeur avec leurs légumes, dans un seul cycle. La vapeur cuit en douceur, sans matière grasse : le poisson reste tendre. Le fenouil est un bulbe blanc-vert au goût léger d'anis, qui devient très doux une fois cuit ; l'aneth est une herbe fraîche aux fines feuilles, au parfum frais. Les sardines sont un plat occasionnel, à manger plutôt au déjeuner et en dehors des phases sensibles, c'est-à-dire quand les symptômes sont vifs : le poisson contient de l'histamine, qui peut les réveiller.",
  "Les filets — Demander au poissonnier de lever les filets des sardines fraîches ({{sardines fraîches}}) : c'est-à-dire de retirer la tête, les entrailles et l'arête centrale pour ne garder que deux filets par poisson. À la maison, les éponger avec du papier absorbant. Passer le doigt sur la chair, de la queue vers la tête, pour sentir les très fines arêtes qui restent, et les retirer une à une avec la pince, en tirant dans le sens où elles pointent. Les plus fines se ramollissent à la cuisson, mais mieux vaut en retirer le maximum. Les filets ne doivent pas dépasser 3,5 cm d'épaisseur. [[sortir; presser sardines fraîches]]",
  "Mise en place des légumes — Retirer les parties dures du fenouil ({{fenouil}}) : couper la base et les tiges vertes, puis enlever la première couche, souvent fibreuse, et le cœur dur. Émincer le reste en lamelles de 3 mm, c'est-à-dire en tranches fines. Éplucher la carotte ({{carotte}}) et la couper en rondelles de 5 mm. Éplucher entièrement la courgette ({{courgette épluchée}}), la couper en deux, retirer le cœur et les graines, puis la couper en dés. Mettre le riz cuit ({{riz cuit}}) dans un bol avec une cuillère d'eau. [[emincer fenouil; eplucher carotte; couper carotte; eplucher courgette; couper courgette]]",
  c1(25, "le fenouil, la carotte, la courgette, les filets de sardines posés directement sur la grille du panier, sans papier dessous, et le riz ({{riz cuit}}) mouillé d'une cuillère d'eau " + bol, "Le guide du fabricant donne 25 minutes pour le poisson. À la fin du cycle, les filets sont devenus opaques (ils ne sont plus translucides) et se détachent à la fourchette sans effort, sans trace rosée au cœur ; le fenouil et la carotte sont très tendres."),
  "Dressage — Verser le riz en dôme au centre de l'assiette creuse tiède, ranger les légumes autour, puis poser délicatement les filets de sardines dessus avec une cuillère large. Si l'on sent une arête sous la fourchette, la retirer. Ajouter l'huile d'olive ({{huile d'olive}}) en filet à la fin, sans la chauffer, parsemer d'aneth ciselé ({{aneth}}), c'est-à-dire coupé très finement, puis saler d'une pincée de sel ({{sel}}). [[ciseler; dresser x3]]"],
 tip:"Un seul cycle vapeur pour tout le plat : poisson et légumes cuisent ensemble. Une fois cuit, manger rapidement, car le poisson refroidi perd son moelleux."})
);

/* ============ COLLATIONS (environ 80 à 160 kcal) : 6 sucrées, 4 salées ============
   Une petite chose tiède, prête en 6 minutes au plus, entre le déjeuner et le dîner (ou quand la faim vient).
   Même protocole que les repas : tout est cuit ou très doux, tiède, sans friture ni coloration, sans ail, oignon, citron ni vinaigre.
   Les collations ne comptent pas dans les règles de variété des repas (ingrédient principal, œufs) : elles n'en contiennent pas.
   Réécriture détaillée (guide docs/style-recettes.md) : ustensiles, mots expliqués, repères de réussite, erreurs à éviter. */
const SNACK_MAX = 6;   /* minutes, étapes comprises */
const COLLATIONS = [
/* ---------- sucrées ---------- */
RC({id:"n-col-banane-yaourt-vanille", n:"Banane tiède écrasée, yaourt de soja & vanille", cat:"Collation", st:"Collation", base:"Aucun", d:1, go:"Sucré",
 ing:[["banane",60,"g"],["eau",1,"c. à soupe"],["yaourt de soja nature",70,"g"],["vanille naturelle",1,"pincée"],["sirop d'érable",0.5,"c. à café"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole, une fourchette, une cuillère à café, un petit bol. Le plat en deux mots : une banane réchauffée, écrasée en crème, sous un yaourt de soja (un yaourt végétal, sans lait de vache) bien frais. Le chaud et le frais se répondent.",
  "La banane tiède — Sortir les ingrédients. Retirer la peau de la banane ({{banane}}) et l'écraser à la fourchette dans la casserole, avec l'eau ({{eau}}) et la vanille ({{vanille naturelle}}), jusqu'à obtenir une purée épaisse. La chauffer 1 minute à feu très doux en remuant. Repère : elle est tiède (pas bouillante) et crémeuse comme une compote. Trop chauffée, elle devient pâteuse : la retirer du feu dès qu'elle fume légèrement. [[sortir; ecraser banane; casserole; cuisson 1]]",
  "Dressage — Verser la banane dans le petit bol, déposer le yaourt de soja ({{yaourt de soja nature}}) par-dessus, puis un demi-filet de sirop d'érable ({{sirop d'érable}}), le sirop sucré tiré de la sève de l'érable, au goût de caramel doux. Ne pas mélanger tout de suite : on goûte d'abord le contraste. [[dresser x3]]"],
 tip:"La banane bien mûre (peau tachetée de brun) est déjà très sucrée : plus elle est mûre, moins il faut de sirop."}),

RC({id:"n-col-compote-myrtilles", n:"Compote tiède de myrtilles & yaourt de soja", cat:"Collation", st:"Collation", base:"Aucun", d:1, go:"Sucré",
 ing:[["myrtilles",60,"g"],["eau",1,"c. à soupe"],["yaourt de soja nature",70,"g"],["sirop d'érable",0.5,"c. à café"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole, une fourchette, une cuillère à café, un petit bol. Le plat en deux mots : une compote est un fruit cuit doucement jusqu'à devenir fondant. Ici, des myrtilles chaudes sur un yaourt de soja (un yaourt végétal, sans lait de vache) frais.",
  "Les myrtilles — Sortir les ingrédients. Mettre les myrtilles ({{myrtilles}}), fraîches ou surgelées, dans la casserole avec l'eau ({{eau}}) et le sirop d'érable ({{sirop d'érable}}), le sirop sucré tiré de la sève de l'érable. Chauffer 3 minutes à feu doux, jusqu'à ce que les fruits éclatent et rendent un jus brillant, puis en écraser quelques-uns à la fourchette. Repère : un jus violet épais, avec des fruits entiers. Avec des myrtilles surgelées, compter 1 minute de plus. [[sortir; casserole; ecraser myrtilles; cuisson 3]]",
  "Dressage — Verser le yaourt de soja ({{yaourt de soja nature}}) dans le petit bol, recouvrir de compote tiède et de son jus. Servir tout de suite : le contraste entre le chaud et le frais disparaît si on attend. [[dresser x2]]"],
 tip:"Le contraste chaud et frais est ce qui rend cette collation gourmande : verser la compote au dernier moment."}),

RC({id:"n-col-tartine-sarrasin-banane", n:"Tartine de pain de sarrasin tiède, banane écrasée & vanille", cat:"Collation", st:"Collation", base:"Sarrasin", d:1, go:"Sucré",
 ing:[["pain de sarrasin",35,"g"],["banane",50,"g"],["vanille naturelle",1,"pincée"],["sirop d'érable",0.5,"c. à café"]],
 steps:[
  "Avant de commencer — Ustensiles : une poêle sèche, une fourchette, un petit bol, un couteau à tartiner, une cuillère à café, une assiette. Le plat en deux mots : une tartine douce. Le pain de sarrasin est un pain sans blé, fait à partir de sarrasin (une graine au goût de noisette), vendu en magasin bio ; il est tartiné d'une crème de banane écrasée.",
  "Le pain — Sortir les ingrédients. Poser le pain de sarrasin ({{pain de sarrasin}}) dans la poêle sèche à feu doux et le réchauffer 1 minute de chaque côté, juste assez pour qu'il soit tiède et souple. Ne jamais le laisser durcir ou brunir : il devient dur comme un biscuit. [[sortir; casserole; cuisson 2]]",
  "La crème de banane — Pendant ce temps, retirer la peau de la banane ({{banane}}) et l'écraser à la fourchette dans le petit bol avec la vanille ({{vanille naturelle}}), jusqu'à obtenir une crème épaisse sans gros morceau. [[// ecraser banane]]",
  "Dressage — Poser le pain tiède sur l'assiette, étaler la banane écrasée avec le couteau à tartiner, puis finir d'un petit filet de sirop d'érable ({{sirop d'érable}}), le sirop sucré tiré de la sève de l'érable. [[dresser x3]]"],
 tip:"Le pain de sarrasin reste tendre s'il est seulement tiédi : un pain trop chauffé durcit."}),

RC({id:"n-col-riz-lait-vanille", n:"Petit riz au lait de riz vanillé", cat:"Collation", st:"Collation", base:"Riz", d:1, go:"Sucré",
 ing:[["riz cuit",50,"g"],["lait de riz",80,"ml"],["vanille naturelle",1,"pincée"],["sirop d'érable",0.5,"c. à café"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole, une cuillère en bois, une cuillère à café, un petit bol. Le riz est celui cuit la veille au Bamboo et conservé au frais. Le plat en deux mots : un petit riz au lait express. Le riz déjà cuit se réchauffe dans du lait de riz (une boisson végétale douce et légèrement sucrée) et devient crémeux en quelques minutes.",
  "Le riz au lait — Sortir les ingrédients. Mettre le riz cuit ({{riz cuit}}) dans la casserole, l'émietter du bout de la cuillère (froid, il forme un bloc), ajouter le lait de riz ({{lait de riz}}) et la vanille ({{vanille naturelle}}), puis chauffer à feu doux 4 minutes en remuant souvent. Repère : le riz a bu presque tout le lait et l'ensemble est épais et crémeux. Si cela accroche au fond, baisser le feu et ajouter une cuillère de lait. [[sortir; casserole; cuisson 4]]",
  "Dressage — Verser dans le petit bol et finir d'un demi-filet de sirop d'érable ({{sirop d'érable}}), le sirop sucré tiré de la sève de l'érable. Servir tiède. [[dresser x2]]"],
 tip:"Un reste de riz suffit : le même riz que celui des repas, réchauffé dans du lait de riz, devient un dessert."}),

RC({id:"n-col-avoine-minute-banane", n:"Avoine minute au lait d'avoine & rondelles de banane", cat:"Collation", st:"Collation", base:"Avoine", d:1, go:"Sucré",
 ing:[["flocons d'avoine",20,"g"],["eau",80,"ml"],["lait d'avoine",100,"ml"],["banane",30,"g"],["vanille naturelle",1,"pincée"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole, une cuillère en bois, une planche et un couteau, un petit bol. Le plat en deux mots : un mini-porridge. Les flocons d'avoine sont des grains d'avoine aplatis en fines pétales (vendus en paquet au rayon des céréales) ; cuits quelques minutes, ils forment une bouillie crémeuse. Le lait d'avoine est une boisson végétale douce, légèrement sucrée.",
  "L'avoine à l'eau — Sortir les ingrédients. Mettre les flocons d'avoine ({{flocons d'avoine}}) et l'eau ({{eau}}) dans la casserole et cuire à feu doux 2 minutes en remuant : l'avoine se cuit toujours à l'eau d'abord, car dans du lait elle fait mousser et déborde. Ajouter ensuite le lait d'avoine ({{lait d'avoine}}) et la vanille ({{vanille naturelle}}), et laisser épaissir 1 minute en remuant. Repère : une bouillie crémeuse qui nappe la cuillère (elle la recouvre d'une couche lisse). [[sortir; casserole; cuisson 3]]",
  "La banane — Pendant ce temps, retirer la peau de la banane ({{banane}}) et la couper en fines rondelles d'environ 3 mm sur la planche. [[// couper banane]]",
  "Dressage — Poser les rondelles de banane au fond du petit bol et verser l'avoine tiède par-dessus : la chaleur les attendrit. Servir tiède, jamais bouillant. [[dresser x2]]"],
 tip:"Jamais de lait pour cuire l'avoine : il déborde. L'eau d'abord, le lait ensuite."}),

RC({id:"n-col-creme-tofu-soyeux-vanille", n:"Crème de tofu soyeux à la vanille & myrtilles tièdes", cat:"Collation", st:"Collation", base:"Aucun", d:1, go:"Sucré",
 ing:[["tofu soyeux",100,"g"],["myrtilles",30,"g"],["eau",1,"c. à soupe"],["vanille naturelle",1,"pincée"],["sirop d'érable",1,"c. à café"]],
 steps:[
  "Avant de commencer — Ustensiles : un mixeur plongeant avec son verre (ou une fourchette si le tofu est très tendre), une petite casserole, un petit bol, une cuillère. Le plat en deux mots : une crème dessert sans lait ni œuf. Le tofu soyeux est un tofu à la texture de flan, très tendre, vendu en barquette ; une fois mixé avec de la vanille, il devient une crème lisse et brillante.",
  "La crème — Sortir les ingrédients. Mettre le tofu soyeux ({{tofu soyeux}}), égoutté de son eau, dans le verre du mixeur avec la vanille ({{vanille naturelle}}) et le sirop d'érable ({{sirop d'érable}}), le sirop sucré tiré de la sève de l'érable. Mixer environ 30 secondes, jusqu'à une crème lisse, sans aucun grumeau. Puis la verser dans le petit bol. [[sortir; mixer; verser]]",
  "Les myrtilles — Mettre les myrtilles ({{myrtilles}}), fraîches ou surgelées, dans la casserole avec l'eau ({{eau}}) et les chauffer 2 minutes à feu doux, jusqu'à ce qu'elles éclatent et rendent un jus brillant. [[casserole; cuisson 2]]",
  "Dressage — Déposer les myrtilles tièdes et leur jus sur la crème de tofu, sans attendre. [[dresser x2]]"],
 tip:"Le tofu soyeux bien mixé n'a aucun goût de soja : ce sont la vanille et le sirop qui parlent."}),

/* ---------- salées ---------- */
RC({id:"n-col-tofu-soyeux-sesame", n:"Tofu soyeux tiède, huile de sésame grillé & ciboulette", cat:"Collation", st:"Collation", base:"Aucun", d:1, go:"Salé",
 ing:[["tofu soyeux",120,"g"],["eau",1,"c. à soupe"],["sauce soja",0.5,"c. à café"],["huile de sésame grillé",0.5,"c. à café"],["ciboulette","",HERBS]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole, une grande cuillère, des ciseaux de cuisine, un petit bol. Le plat en deux mots : un petit plat japonais tout simple. Le tofu soyeux est un tofu à la texture de flan, très tendre, vendu en barquette ; on le sert tiède avec quelques gouttes de sauce.",
  "Le tofu tiède — Sortir les ingrédients. Verser l'eau ({{eau}}) dans la casserole et y déposer le tofu soyeux ({{tofu soyeux}}) en gros morceaux prélevés à la grande cuillère. Chauffer 2 minutes à feu très doux, sans remuer : il se réchauffe sans se défaire. Repère : il est tiède à cœur, sans bouillir. Remuer le ferait s'émietter. [[sortir; casserole; cuisson 2]]",
  "Dressage — Déposer délicatement le tofu dans le petit bol à l'aide de la grande cuillère, en laissant l'eau dans la casserole. Verser la sauce soja ({{sauce soja}}), puis l'huile de sésame grillé ({{huile de sésame grillé}}), une huile parfumée au sésame torréfié, versée à la fin et jamais chauffée. Avec les ciseaux, ciseler la ciboulette ({{ciboulette}}), une herbe fine au goût frais et doux, en pointes vertes seulement, par-dessus. [[ciseler; dresser x3]]"],
 tip:"Chauffé à peine, le tofu soyeux garde sa texture de flan : le servir tiède, jamais bouillant."}),

RC({id:"n-col-onigiri-nori", n:"Boulettes de riz japonaises (onigiri) tièdes, au nori & sésame grillé", cat:"Collation", st:"Collation", base:"Riz", d:1, go:"Salé",
 ing:[["riz cuit",80,"g"],["eau",1,"c. à soupe"],["nori",1,"pièce"],["huile de sésame grillé",0.5,"c. à café"],["sel",1,"pincée"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole avec son couvercle, une cuillère, un petit bol d'eau pour mouiller les mains, une assiette. Le riz est celui cuit la veille au Bamboo et conservé au frais. Le plat en deux mots : un onigiri est une boulette de riz japonaise que l'on mange avec les doigts. Elle est enveloppée de nori, une algue séchée en feuille fine, comme celle qui entoure les sushis.",
  "Le riz tiède — Sortir les ingrédients. Mettre le riz cuit ({{riz cuit}}) dans la casserole avec l'eau ({{eau}}), l'émietter du bout de la cuillère, couvrir et réchauffer 2 minutes à feu doux. Le mélanger ensuite avec l'huile de sésame grillé ({{huile de sésame grillé}}), une huile parfumée au sésame torréfié, et le sel ({{sel}}), en remuant jusqu'à ce que les grains soient bien enrobés. Repère : le riz est chaud et collant, il tient quand on le serre. [[sortir; casserole; cuisson 2; delayer]]",
  "Les boules — Mouiller légèrement les mains dans le petit bol d'eau, pour que le riz ne colle pas aux doigts. Prélever la moitié du riz, le serrer dans les paumes en boule de la taille d'une grosse noix, et faire de même avec l'autre moitié. Déchirer la feuille de nori ({{nori}}) en deux et envelopper chaque boule dans une moitié. Le riz tiède fait adhérer l'algue ; trop chaud, il la ramollit. [[former x2]]"
  ,
  "Dressage — Poser les deux onigiri sur l'assiette, sans les empiler. À manger tièdes, avec les doigts. [[dresser x2]]"],
 tip:"Mouiller les mains avant de façonner : le riz ne colle plus aux doigts."}),

RC({id:"n-col-tartine-tofu-soyeux", n:"Tartine de sarrasin, tofu soyeux écrasé & ciboulette", cat:"Collation", st:"Collation", base:"Sarrasin", d:1, go:"Salé",
 ing:[["pain de sarrasin",35,"g"],["tofu soyeux",60,"g"],["huile d'olive",0.5,"c. à café"],["ciboulette","",HERBS],["sel",1,"pincée"]],
 steps:[
  "Avant de commencer — Ustensiles : une poêle sèche, une fourchette, un petit bol, des ciseaux de cuisine, un couteau à tartiner, une assiette. Le plat en deux mots : une tartine salée. Le pain de sarrasin est un pain sans blé, fait à partir de sarrasin (une graine au goût de noisette), vendu en magasin bio. Le tofu soyeux, un tofu à la texture de flan, très tendre, est écrasé en une crème douce qui remplace le fromage frais.",
  "Le pain — Sortir les ingrédients. Poser le pain de sarrasin ({{pain de sarrasin}}) dans la poêle sèche à feu doux et le réchauffer 1 minute de chaque côté, juste assez pour qu'il soit tiède et souple. Ne pas le laisser durcir. [[sortir; casserole; cuisson 2]]",
  "La crème de tofu — Pendant ce temps, dans le petit bol, écraser le tofu soyeux ({{tofu soyeux}}) à la fourchette avec le sel ({{sel}}) et l'huile d'olive ({{huile d'olive}}) jusqu'à une crème épaisse et lisse. Avec les ciseaux, ciseler la ciboulette ({{ciboulette}}), une herbe fine au goût frais et doux, en pointes vertes seulement, et la mêler. [[// ecraser tofu soyeux; ciseler]]",
  "Dressage — Poser le pain tiède sur l'assiette et étaler la crème de tofu dessus avec le couteau à tartiner. À manger sans attendre. [[dresser x2]]"],
 tip:"Le tofu soyeux écrasé fait une crème douce qui remplace le fromage frais."}),

RC({id:"n-col-soupe-miso-wakame", n:"Petite soupe miso, tofu soyeux & algue wakame", cat:"Collation", st:"Collation", base:"Aucun", d:1, go:"Salé",
 ing:[["bouillon",200,"ml"],["tofu soyeux",50,"g"],["wakame",5,"g"],["miso blanc",0.5,"c. à café"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole, une louche, une cuillère, un petit bol, un bol à soupe. Le plat en deux mots : la soupe miso est la soupe japonaise du matin. Le miso est une pâte de soja fermenté, salée et parfumée ; le wakame est une algue séchée qui se déploie dans le bouillon ; le tofu soyeux est un tofu à la texture de flan, très tendre.",
  "Le bouillon — Sortir les ingrédients. Verser le bouillon ({{bouillon}}), un bouillon doux de légumes ou de volaille, sans épice forte, dans la casserole avec le wakame ({{wakame}}) et chauffer à feu doux 3 minutes, jusqu'à ce que l'algue se déploie et devienne souple. Éteindre le feu. [[sortir; casserole; cuisson 3]]",
  "Le miso — Prélever une louche de bouillon tiède dans le petit bol et y délayer le miso blanc ({{miso blanc}}) à la cuillère jusqu'à ce qu'il n'y ait plus de grumeau, puis le verser dans la casserole. Le miso ne doit jamais bouillir : sa saveur serait perdue. Ajouter le tofu soyeux ({{tofu soyeux}}) en petits morceaux prélevés à la cuillère, sans remuer. [[delayer; verser]]",
  "Dressage — Verser la soupe dans le bol à soupe, en vérifiant qu'elle soit tiède. [[dresser x1]]"],
 tip:"Le miso se délaye hors du feu : bouilli, il perd son parfum. À éviter pendant une phase de sensibilité aiguë."})
];

/* ============ BANCHAN : petits plats coréens servis avec du riz ============
   Un banchan est un petit accompagnement coréen : on en sert plusieurs autour du riz, chacun avec une texture et un goût différents.
   Ils sont traités à part (rubrique « Banchan » du Carnet) :
   - 17 banchan à protéine (80 à 100 g de protéine : tofu, œufs, poulet ou sardines) ;
   - 23 banchan de légumes (60 à 100 g de légumes cuits).
   Un REPAS CORÉEN complet = riz cuit 140 g + 1 banchan à protéine + 2 banchan de légumes (voir composeKorean).
   Version douce du protocole : ni ail, ni piment, ni oignon, ni vinaigre ; sauce soja et miso en toute petite quantité
   (les banchan avec sauce soja ou miso disparaissent en phase de sensibilité aiguë) ; légumes toujours cuits, tièdes ; huile de sésame grillé ajoutée à la fin.
   Les mots coréens sont toujours expliqués dans la première étape (« Le plat en deux mots »).
   Dans les étapes, les assaisonnements sont écrits en toutes lettres (pas de {{ }}) : deux banchan réunis dans un même repas ne partagent aucune quantité.
   go = "Protéine" ou "Légume" ; cat et st = "Banchan". */
const KR_STEP_MAX = 15;   /* minutes par banchan, étapes comprises */
const BANCHAN = [
/* ---------- à protéine : tofu ---------- */
RC({id:"n-bc-dubu-jorim", n:"Dubu-jorim : tofu braisé à la sauce soja sucrée", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["tofu ferme",90,"g"],["sauce soja",0.5,"c. à café"],["sirop d'érable",0.5,"c. à café"],["huile de sésame grillé",0.5,"c. à café"],["ciboulette","",HERBS],["eau",60,"ml"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole avec son couvercle, une planche et un couteau, du papier absorbant, un petit bol, une cuillère. Le plat en deux mots : « dubu » veut dire tofu et « jorim » veut dire braisé, c'est-à-dire cuit doucement, à couvert, dans un peu de liquide parfumé. En fin de cuisson ce liquide a réduit et forme un sirop brillant qui enrobe le tofu. Le tofu ferme est le tofu en bloc, assez compact pour être coupé en tranches sans se défaire. Il reste clair et tendre : il n'y a ni poêle, ni dorure.",
  "Le tofu — Sortir le tofu ferme ({{tofu ferme}}) de son emballage, le poser entre deux épaisseurs de papier absorbant et appuyer doucement avec la main : il rend un peu d'eau, qui sinon diluerait la sauce. Le couper en tranches régulières de 1 cm d'épaisseur : des tranches égales cuisent au même rythme. [[sortir; presser tofu ferme; couper tofu ferme]]",
  "La sauce — Dans le petit bol, verser 60 ml d'eau, 1/2 c. à café de sauce soja et 1/2 c. à café de sirop d'érable, puis mélanger à la cuillère. Cette sauce doit être à peine salée : le sirop n'est là que pour le brillant. [[delayer]]",
  "La braise — Verser la sauce dans la casserole, y ranger les tranches de tofu sur une seule couche et couvrir. Chauffer à feu très doux : dès que de petites bulles apparaissent sur les bords, compter 6 minutes en retournant délicatement les tranches à mi-cuisson avec la cuillère. Repère : les tranches sont brun clair, la sauce a diminué de moitié et colle à la cuillère. [[casserole; cuisson 6]]",
  "Dressage — Poser les tranches dans un petit bol, verser le reste de sauce par-dessus et finir de 1/2 c. à café d'huile de sésame grillé (huile de sésame au parfum de noisette, ajoutée seulement à la fin pour ne pas la chauffer). Parsemer de la ciboulette ({{ciboulette}}) ciselée, pointes vertes seulement. [[ciseler; dresser x3]]"],
 tip:"Une cuisson très douce et couverte suffit : la sauce réduit d'elle-même et le tofu garde un cœur tendre. Servi tiède, il a plus de goût que brûlant."}),

RC({id:"n-bc-dubu-muchim", n:"Dubu-muchim : tofu écrasé, carotte tendre & sésame", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["tofu ferme",90,"g"],["carotte",25,"g"],["graines de sésame",1,"c. à café"],["huile de sésame grillé",0.5,"c. à café"],["sel",1,"pincée"],["ciboulette","",HERBS]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole avec son couvercle, une râpe, un bol, une fourchette, du papier absorbant. Le plat en deux mots : « muchim » veut dire assaisonné à la main, c'est-à-dire mélangé avec les doigts ou une fourchette plutôt que cuit dans une sauce. Ici le tofu est écrasé grossièrement, un peu comme une salade d'œufs mimosa sans œuf, et parfumé au sésame. Les graines de sésame sont utilisées telles quelles, à l'état naturel, sans les faire revenir.",
  "La carotte — Éplucher la carotte ({{carotte}}) et la râper très finement. La mettre dans la casserole avec 2 cuillères d'eau, couvrir et cuire à feu doux 3 minutes : elle devient tendre et ne craque plus sous la dent. L'égoutter et la laisser tiédir. [[eplucher carotte; raper carotte; casserole; cuisson 3; egoutter]]",
  "Le tofu — Éponger le tofu ferme ({{tofu ferme}}) dans du papier absorbant, puis l'écraser dans le bol avec la fourchette : on cherche des petits morceaux irréguliers, pas une purée. Ajouter la carotte tiède. [[sortir; presser tofu ferme; ecraser tofu ferme]]",
  "L'assaisonnement — Écraser les graines de sésame ({{graines de sésame}}) du dos de la cuillère contre la paroi d'un bol pour libérer leur parfum (entières, elles traversent l'intestin sans être digérées), les verser sur le tofu avec 1/2 c. à café d'huile de sésame grillé et une pincée de sel, puis mélanger du bout de la fourchette. Goûter : le goût doit être rond, jamais salé. [[ecraser graines de sesame; delayer]]",
  "Dressage — Faire un petit dôme dans un bol, parsemer de la ciboulette ({{ciboulette}}) ciselée, pointes vertes seulement, et servir tiède. [[ciseler; dresser x2]]"],
 tip:"Le tofu écrasé à la fourchette garde du relief : le passer au mixeur lui ôterait tout son charme. Il est encore meilleur le lendemain."}),

RC({id:"n-bc-sundubu-doux", n:"Sundubu doux : tofu soyeux au bouillon de kombu", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["tofu soyeux",100,"g"],["bouillon",150,"ml"],["kombu",3,"g"],["sauce soja",0.5,"c. à café"],["huile de sésame grillé",0.5,"c. à café"],["ciboulette","",HERBS]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole, une cuillère, un petit bol creux, des ciseaux. Le plat en deux mots : « sundubu » est un tofu très mou, presque une crème prise, qui se mange à la cuillère ; en Corée on le sert souvent dans une soupe brûlante et pimentée, ici dans un bouillon doux et tiède. Le tofu soyeux est le tofu le plus fragile : on le manipule sans le serrer. Le kombu est une algue brune séchée : elle donne du goût au bouillon (un goût de mer rond, appelé umami) puis elle est retirée.",
  "Le bouillon — Verser le bouillon ({{bouillon}}) dans la casserole avec le kombu ({{kombu}}). Chauffer à feu très doux 5 minutes : de minuscules bulles se forment au fond, mais le bouillon ne bout pas, sinon l'algue le rendrait amer. Retirer le kombu avec la cuillère et le jeter. [[sortir; casserole; cuisson 5]]",
  "Le tofu — Ajouter la sauce soja (1/2 c. à café), puis faire glisser le tofu soyeux ({{tofu soyeux}}) à la cuillère, en 3 ou 4 gros morceaux. Ne pas remuer : laisser tiédir 2 minutes à feu éteint, le tofu se réchauffe sans se défaire. [[// verser; cuisson 2]]",
  "Dressage — Verser délicatement dans le bol creux avec le bouillon, ajouter 1/2 c. à café d'huile de sésame grillé et la ciboulette ({{ciboulette}}) coupée aux ciseaux, pointes vertes seulement. [[ciseler; dresser x2]]"],
 tip:"Un bouillon qui ne bout jamais reste limpide et doux ; le kombu lui donne sa profondeur sans aucun piment."}),

RC({id:"n-bc-dubu-jjim", n:"Dubu-jjim : tofu à la vapeur, sauce sésame & ciboulette", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["tofu ferme",90,"g"],["sauce soja",0.5,"c. à café"],["huile de sésame grillé",0.5,"c. à café"],["graines de sésame",1,"c. à café"],["ciboulette","",HERBS]],
 steps:[
  "Avant de commencer — Ustensiles : une casserole avec son couvercle, une planche et un couteau, du papier absorbant, un petit bol, une cuillère. Le plat en deux mots : « jjim » veut dire cuit à la vapeur. Ici la vapeur est celle de 4 cuillères d'eau qui chauffent dans la casserole fermée : le tofu se réchauffe en douceur, gonfle un peu et reste blanc, sans aucune matière grasse chaude. La sauce se prépare à froid et se verse à la fin.",
  "Le tofu — Éponger le tofu ferme ({{tofu ferme}}) dans du papier absorbant en appuyant doucement, puis le couper en tranches de 1 cm. Verser 4 cuillères d'eau dans la casserole, y ranger les tranches côte à côte, couvrir et chauffer à feu doux 5 minutes : le tofu est chaud, gonflé de vapeur et tendre à cœur. [[sortir; presser tofu ferme; couper tofu ferme; casserole; cuisson 5]]",
  "La sauce — Pendant ce temps, mélanger dans le petit bol 1/2 c. à café de sauce soja, 1/2 c. à café d'huile de sésame grillé, une cuillère d'eau et les graines de sésame ({{graines de sésame}}) légèrement écrasées du dos de la cuillère. [[// delayer]]",
  "Dressage — Égoutter le tofu, le ranger en rosace (comme les pétales d'une fleur) dans une petite assiette, napper de sauce et parsemer de la ciboulette ({{ciboulette}}) ciselée, pointes vertes seulement. [[egoutter; ciseler; dresser x3]]"],
 tip:"La vapeur douce de la casserole couverte garde le tofu blanc et fondant. Plus il est chaud en sortant, plus il boit la sauce."}),

RC({id:"n-bc-sundubu-muchim", n:"Sundubu-muchim : tofu soyeux tiède, sauce soja & sésame", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["tofu soyeux",100,"g"],["sauce soja",0.5,"c. à café"],["huile de sésame grillé",0.5,"c. à café"],["graines de sésame",1,"c. à café"],["ciboulette","",HERBS]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole avec son couvercle, une cuillère, un petit bol creux, des ciseaux. Le plat en deux mots : « sundubu » est le tofu très mou, presque une crème prise ; « muchim » veut dire assaisonné. On le réchauffe à peine, puis on le nappe d'une sauce soja-sésame. C'est la version la plus rapide et la plus légère de tous les banchan à protéine.",
  "Le tofu — Verser 2 cuillères d'eau dans la casserole, y poser le tofu soyeux ({{tofu soyeux}}) en 3 ou 4 gros morceaux, couvrir et chauffer à feu très doux 3 minutes, sans remuer : il se réchauffe sans se défaire et devient tiède au toucher. [[sortir; casserole; cuisson 3]]",
  "La sauce — Dans le petit bol, mélanger 1/2 c. à café de sauce soja, 1/2 c. à café d'huile de sésame grillé et les graines de sésame ({{graines de sésame}}) écrasées du dos de la cuillère : ainsi elles libèrent leur parfum. [[// delayer]]",
  "Dressage — Soulever le tofu avec la cuillère en laissant l'eau dans la casserole, le poser dans le bol creux, napper de sauce et parsemer de la ciboulette ({{ciboulette}}) coupée aux ciseaux, pointes vertes seulement. [[ciseler; dresser x3]]"],
 tip:"Servi tiède, le tofu soyeux est presque une crème : la sauce n'est là que pour lui donner du relief."}),

RC({id:"n-bc-dubu-soboro", n:"Dubu-soboro : tofu émietté mijoté, façon « petite viande hachée »", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["tofu ferme",90,"g"],["carotte",20,"g"],["sauce soja",0.5,"c. à café"],["sirop d'érable",0.5,"c. à café"],["huile de sésame grillé",0.5,"c. à café"],["eau",40,"ml"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole avec son couvercle, une râpe, une fourchette, du papier absorbant, une cuillère. Le plat en deux mots : « soboro » est un mot japonais pour des miettes mijotées dans une sauce sucrée-salée ; on le prépare d'habitude avec de la viande hachée. Ici le tofu ferme est émietté à la fourchette en petits grains, et mijote doucement dans la sauce jusqu'à l'absorber. C'est moelleux, légèrement sucré, et chaque miette se mêle bien aux autres plats du repas.",
  "La carotte — Éplucher la carotte ({{carotte}}) et la râper finement : des petits filaments colorés qui cuiront en même temps que le tofu. [[eplucher carotte; raper carotte]]",
  "Le tofu — Éponger le tofu ferme ({{tofu ferme}}) dans du papier absorbant, puis l'émietter à la fourchette dans la casserole : on cherche de petites miettes de 3 à 5 mm, comme de la chapelure grossière. [[sortir; presser tofu ferme; ecraser tofu ferme]]",
  "Le mijotage — Ajouter 40 ml d'eau, 1/2 c. à café de sauce soja, 1/2 c. à café de sirop d'érable et la carotte râpée. Couvrir et chauffer à feu doux 6 minutes en remuant à la cuillère à mi-cuisson. Repère : le liquide a été absorbé, les grains sont brun clair et brillants, tendres mais encore séparés. [[casserole; cuisson 6]]",
  "Dressage — Hors du feu, ajouter 1/2 c. à café d'huile de sésame grillé, mélanger et servir tiède en petit monticule. [[dresser x2]]"],
 tip:"Plus le tofu est émietté finement, mieux il absorbe la sauce. Le reste se garde au frais, bien couvert, jusqu'au lendemain."}),

/* ---------- à protéine : œufs ---------- */
RC({id:"n-bc-gyeran-jjim", n:"Gyeran-jjim : œuf soufflé à la coréenne, au bouillon", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["oeuf",2,"pièce"],["bouillon",100,"ml"],["huile de sésame grillé",0.5,"c. à café"],["ciboulette","",HERBS],["sel",1,"pincée"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole épaisse avec son couvercle, un bol, une fourchette, une cuillère, des ciseaux. Le plat en deux mots : « gyeran » veut dire œuf et « jjim » cuit à la vapeur. C'est un flan d'œuf léger, gonflé comme un soufflé, qui tremble quand on bouge le plat. Un seul œuf préparé de cette façon par plat.",
  "Le mélange — Casser les œufs ({{oeuf}}) dans le bol et les battre à la fourchette avec le bouillon ({{bouillon}}) tiède et le sel, jusqu'à obtenir un liquide homogène et jaune pâle, sans mousse ni filaments blancs. Plus on bat doucement, plus le résultat est lisse. [[sortir; ecaler x2; battre]]",
  "La cuisson — Verser dans la casserole, couvrir et cuire à feu très doux 8 minutes. Remuer doucement une seule fois après 3 minutes, avec la cuillère, en ramenant les bords vers le centre. Repère : l'œuf gonfle au-dessus des bords, devient jaune pâle et tremblotant ; au centre, il n'est plus liquide. [[casserole; cuisson 8]]",
  "Dressage — Servir dans la casserole même ou dans un bol, avec un filet de 1/2 c. à café d'huile de sésame grillé et la ciboulette ({{ciboulette}}) coupée aux ciseaux, pointes vertes seulement. [[ciseler; dresser x2]]"],
 tip:"Le secret du gonflé : un feu minuscule et un couvercle. Plus le feu est fort, plus l'œuf se rétracte et devient caoutchouteux."}),

RC({id:"n-bc-gyeran-mari", n:"Gyeran-mari : omelette roulée coréenne à la carotte", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["oeuf",2,"pièce"],["carotte",25,"g"],["huile de sésame grillé",0.5,"c. à café"],["sel",1,"pincée"],["ciboulette","",HERBS]],
 steps:[
  "Avant de commencer — Ustensiles : une petite poêle antiadhésive, une spatule fine, une râpe, un bol, une fourchette, une planche et un couteau. Le plat en deux mots : « gyeran » veut dire œuf et « mari » roulé. On cuit l'omelette en trois fines couches, chacune roulée sur la précédente, puis on la tranche en rondelles qui montrent la spirale. Cuisson très douce, sans matière grasse : l'omelette reste jaune pâle, jamais colorée. Une seule préparation d'œuf par plat.",
  "La carotte — Éplucher la carotte ({{carotte}}) et la râper très finement : de fins filaments qui cuiront dans l'œuf sans rester durs. [[eplucher carotte; raper carotte]]",
  "Les œufs — Casser les œufs ({{oeuf}}) dans le bol, ajouter la carotte, le sel et la ciboulette ({{ciboulette}}) coupée en petits morceaux, pointes vertes seulement. Battre à la fourchette jusqu'à un mélange homogène. [[sortir; ecaler x2; ciseler; battre]]",
  "L'omelette — Chauffer la poêle à feu très doux, sans matière grasse : une goutte d'eau doit y rester sans grésiller. Verser un tiers du mélange en fine couche. Laisser prendre sans colorer environ 1 minute, jusqu'à ce que le dessus ne soit plus liquide. Rouler l'omelette sur elle-même avec la spatule, la pousser sur le côté, verser le deuxième tiers dans l'espace libre en soulevant le rouleau pour que l'œuf passe dessous, et rouler de nouveau autour du premier. Recommencer avec le dernier tiers. [[casserole; cuisson 3]]",
  "Dressage — Laisser reposer 1 minute pour que le rouleau se raffermisse, puis le trancher en rondelles de 2 cm avec un couteau bien affûté. Ajouter 1/2 c. à café d'huile de sésame grillé et dresser les rondelles en rond. [[trancher; dresser x3]]"],
 tip:"Une poêle très douce et peu de mélange à la fois donnent un rouleau tendre, sans aucune coloration. Les rondelles se mangent tièdes."}),

RC({id:"n-bc-gyeran-guk", n:"Gyeran-guk : soupe d'œuf en rubans, bouillon de kombu", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["oeuf",2,"pièce"],["bouillon",250,"ml"],["kombu",3,"g"],["huile de sésame grillé",0.5,"c. à café"],["ciboulette","",HERBS]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole, une fourchette, un bol, une cuillère, un bol à soupe. Le plat en deux mots : « gyeran » veut dire œuf et « guk » soupe. L'œuf battu est versé en filet dans un bouillon qui frémit : il se fige aussitôt en longs rubans soyeux, un peu comme dans la soupe chinoise « à l'œuf filé ». Le kombu est une algue séchée qui parfume le bouillon puis est retirée. Un seul œuf préparé de cette façon par plat.",
  "Le bouillon — Chauffer le bouillon ({{bouillon}}) avec le kombu ({{kombu}}) à feu très doux 5 minutes, sans bouillir (il bouillirait à gros bouillons, l'algue deviendrait amère), puis retirer le kombu. [[sortir; casserole; cuisson 5]]",
  "Les œufs — Casser les œufs ({{oeuf}}) dans le bol et les battre à la fourchette. Verser en filet fin, en tournant lentement la casserole, dans le bouillon qui frémit à peine. Remuer doucement une seule fois avec la cuillère puis éteindre aussitôt : les œufs finissent de prendre à la chaleur du bouillon. [[ecaler x2; battre; verser; cuisson 1]]",
  "Dressage — Servir dans le bol à soupe, avec 1/2 c. à café d'huile de sésame grillé et la ciboulette ({{ciboulette}}) coupée aux ciseaux, pointes vertes seulement. [[ciseler; dresser x2]]"],
 tip:"Verser l'œuf en filet fin dans un bouillon qui frémit à peine : les rubans restent soyeux et ne se brisent pas."}),

RC({id:"n-bc-gyeran-jangjorim", n:"Gyeran-jangjorim : œufs mollets laqués au soja et à l'érable", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["oeuf",2,"pièce"],["sauce soja",0.5,"c. à café"],["sirop d'érable",0.5,"c. à café"],["huile de sésame grillé",0.5,"c. à café"],["ciboulette","",HERBS],["eau",60,"ml"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite casserole avec son couvercle, une cuillère, un bol, un bol d'eau froide. Le plat en deux mots : « jangjorim » est un plat mijoté dans une sauce soja légèrement sucrée ; en Corée on le prépare avec des œufs durs ou de la viande effilochée. Ici l'œuf est mollet : le blanc est pris et le jaune est encore crémeux. On le trempe dans la sauce : il se colore de brun clair. « Laqués » veut dire enrobés d'une sauce brillante, comme vernie. Un seul œuf préparé de cette façon par plat.",
  "Les œufs mollets — Faire frémir de l'eau dans la casserole, y glisser délicatement les œufs ({{oeuf}}) sortis du frigo 10 minutes avant. Les cuire 6 minutes 30 : le blanc est pris, le jaune coule encore. Les passer ensuite 2 minutes dans un bol d'eau froide pour stopper la cuisson, puis les écaler sous un filet d'eau en les roulant doucement sur le plan de travail. [[sortir; casserole; cuisson 7; ecaler x2]]",
  "La laque — Vider la casserole, y verser 60 ml d'eau, 1/2 c. à café de sauce soja et 1/2 c. à café de sirop d'érable. Faire frémir 1 minute à feu doux en mélangeant, jusqu'à ce que la sauce soit légèrement sirupeuse. Éteindre. [[casserole; cuisson 1]]",
  "L'enrobage — Remettre les œufs dans la sauce tiède et les rouler doucement avec la cuillère 1 minute pour qu'ils prennent une jolie couleur. Les ouvrir en deux au dernier moment, d'un coup de couteau mouillé : le jaune reste en place. [[attente 1; trancher]]",
  "Dressage — Poser les demi-œufs dans un petit bol, napper de sauce, ajouter 1/2 c. à café d'huile de sésame grillé et la ciboulette ({{ciboulette}}) ciselée, pointes vertes seulement. [[ciseler; dresser x3]]"],
 tip:"Le trempage dans la sauce doit rester bref : plus longtemps, les œufs deviennent trop salés. Le jaune crémeux fait office de sauce pour le riz."}),

RC({id:"n-bc-gyeran-gim-mari", n:"Gyeran-gim-mari : omelette tendre roulée dans une feuille de nori", cat:"Banchan", st:"Banchan", base:"Aucun", d:1, go:"Protéine",
 ing:[["oeuf",2,"pièce"],["nori",0.5,"pièce"],["epinards",15,"g"],["sel",1,"pincée"],["huile de sésame grillé",0.5,"c. à café"]],
 steps:[
  "Avant de commencer — Ustensiles : une petite poêle antiadhésive avec son couvercle, une spatule fine, un bol, une fourchette, une planche et un couteau bien affûté. Le plat en deux mots : « gim » est le nom coréen de l'algue nori, ces feuilles fines et séchées qui roulent les sushis ; « mari » veut dire roulé. On cuit une omelette plate, très mince, on la couvre d'une demi-feuille de nori et d'épinards tendres, on roule le tout, puis on tranche pour voir la spirale verte et noire. Une seule préparation d'œuf par plat.",
  "Les épinards — Laver les épinards ({{epinards}}), les poser dans la poêle avec une cuillère d'eau, couvrir et chauffer à feu doux 1 minute : ils tombent et deviennent tendres. Les presser dans la paume pour retirer l'eau et les hacher finement au couteau. [[sortir; laver epinards; casserole; cuisson 1; presser epinards; couper epinards]]",
  "Les œufs — Casser les œufs ({{oeuf}}) dans le bol avec le sel, battre à la fourchette jusqu'à un mélange homogène et jaune pâle. [[ecaler x2; battre]]",
