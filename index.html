/* ---------- PLANNING ---------- */
function viewPlan(){
  const w = curWeek();
  const tabs = S.weeks.map((wk, i) => `<button class="wtab" data-act="week" data-i="${i}" aria-current="${i === S.ui.week}">${esc(wk.name)}</button>`).join("");
  if (!w) return `<div class="weekbar">${tabs}<button class="wtab add" data-act="newWeek">＋ Créer une nouvelle semaine</button></div>
    <div class="empty-state"><p class="display-s">Aucune semaine pour l'instant.</p><button class="btn primary" data-act="newWeek">＋ Créer une nouvelle semaine</button></div>`;
  const days = w.days.map((d, di) => dayBlock(d, di)).join("");
  return `
  <div class="weekbar" role="tablist">${tabs}<button class="wtab add" data-act="newWeek">＋ Créer une nouvelle semaine</button></div>
  <header class="weekhead">
    <div>
      <input class="title-input" data-bind="weekName" value="${esc(w.name)}" aria-label="Nom de la semaine">
      <p class="muted">${w.days.length} jour${w.days.length > 1 ? "s" : ""}, trois repas par jour, environ ${fmtK(weekAvg(w))} kcal par jour (indicatif, sans objectif de régime)</p>
    </div>
    ${weekActions(w)}
  </header>
  ${protocolPanel()}<div class="days">${days}</div>
  <div class="add-day"><button class="btn" data-act="newDay">＋ Créer un nouveau jour</button></div>`;
}
function dayBlock(d, di){
  const meals = SLOTS.map(sl => mealCell(d.meals[sl.k], sl, di)).join("");
  return `<article class="day">
    <div class="day-head">
      <input class="day-name" data-bind="dayName" data-d="${di}" value="${esc(d.name)}" aria-label="Nom du jour">
      ${kcalBar(d)}
      ${dayTools(d, di)}
    </div>
    <div class="meals">${meals}</div>
  </article>`;
}
function mealCell(m, sl, di){
  const at = `data-d="${di}" data-s="${sl.k}"`;
  if (!m) return `<div class="meal empty slot-${sl.k}"><div class="slot">${sl.label}</div>
    <button class="create" data-act="createMeal" ${at}>＋ ${sl.create}</button></div>`;
  const cls = CAT_KEY[m.cat] ? " has-cat" : "";
  const meta = [m.st || "", kcalOf(m) ? "≈ " + fmtK(kcalOf(m)) + " kcal" : ""].filter(Boolean).join(", ");
  return `<div class="meal slot-${sl.k}${cls}" ${catSt(m.cat)}><div class="slot">${sl.label}</div>
    <button class="dish" data-act="openMeal" ${at}><span class="dish-name">${esc(m.name || "Repas sans nom")}</span>
    ${m.sub ? `<span class="dish-sub">${esc(m.sub)}</span>` : ""}<span class="dish-meta">${catTag(m.cat)}${seasonChip(m)}<span>${esc(meta)}</span></span>${mealBadges(m)}${protoDot(m)}</button>
    ${mealTools(at)}</div>`;
}

/* ============ MODALE ============ */
let MODAL = null; // { target, kind }
function openModal(html, opts = {}){
  const m = $("#modal");
  m.querySelector(".sheet").className = "sheet" + (opts.wide ? " wide" : "");
  m.querySelector(".sheet-body").innerHTML = html;
  m.hidden = false; document.body.classList.add("locked");
  requestAnimationFrame(() => { m.classList.add("open"); fitTitle(); });
  if (opts.focus) { const f = m.querySelector(opts.focus); if (f) f.focus(); }
}
function closeModal(){
  const m = $("#modal"); m.classList.remove("open"); m.hidden = true; document.body.classList.remove("locked");
  if (MODAL && MODAL.kind === "meal") { const o = getMeal(MODAL.t); if (o && !o.name.trim()) o.name = "Repas sans nom"; }
  MODAL = null; save(); render();
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });

function getMeal(t){ const w = S.weeks[t.w]; return w && w.days[t.d] ? w.days[t.d].meals[t.s] : null; }
function setMeal(t, m){ S.weeks[t.w].days[t.d].meals[t.s] = m; }
function slotLabel(k){ return SLOTS.find(s => s.k === k).label; }

/* ---------- ÉDITEUR (repas / recette / brouillon) ---------- */
function edObj(){
  if (!MODAL) return null;
  if (MODAL.kind === "meal") return getMeal(MODAL.t);
  if (MODAL.kind === "recipe") return recipeById(MODAL.id);
  if (MODAL.kind === "draft" || MODAL.kind === "temp") return MODAL.obj;
  return null;
}
function nameKey(){ return MODAL.kind === "meal" || MODAL.kind === "temp" ? "name" : "n"; }
const DIFF = ["Facile","Intermédiaire","Élaboré"];
/* met en valeur les repères, points de contrôle et erreurs à éviter */
const fmtStep = t => esc(t).replace(/(Repères|Point de contrôle|À éviter) :/g, '<span class="lab">$1&nbsp;:</span>');
function stepsHTML(steps, ings){
  if (!steps || !steps.length) return `<li class="muted">Aucune étape pour l'instant.</li>`;
  return steps.map(raw => { const p = parseStep(ings ? renderQ(raw, ings) : raw);
    return p.h ? `<li><span class="step-h">${esc(p.h)}</span><p>${fmtStep(p.body)}</p></li>` : `<li><p>${fmtStep(p.body)}</p></li>`; }).join("");
}
function metaLine(o){ return [o.t ? o.t + " min" : "", o.d ? DIFF[+o.d - 1] : ""].filter(Boolean).join(" · "); }

function openEditorEdit(kind, ref){
  MODAL = kind === "meal" ? { kind, t: ref } : kind === "recipe" ? { kind, id: ref } : { kind, obj: ref };
  const o = edObj(); if (!o) return; MODAL.mode = "edit";
  const isRecipe = kind === "recipe" || kind === "draft";
  const title = isRecipe ? o.n : o.name;
  const where = kind === "meal" ? `${esc(S.weeks[ref.w].name)}, ${esc(S.weeks[ref.w].days[ref.d].name)}, ${slotLabel(ref.s).toLowerCase()}`
    : kind === "draft" ? "Nouvelle recette" : kind === "temp" ? (o.gen ? "Idée proposée, à modifier librement avant de l'ajouter" : "Recette du carnet") : "Carnet de recettes";
  const withCur = (list, v) => v && !list.includes(v) ? [...list, v] : list;
  const sel = (key, list, val) => `<label class="field"><span>${{cat:"Catégorie",st:"Style",base:"Féculent"}[key]}</span>
    <select data-ed="${key}">${withCur(list, val).map(x => `<option ${x === val ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>`;
  const recipeFields = isRecipe ? `<div class="fields">
      ${sel("cat", CATS, o.cat)}${sel("st", STYLES, o.st)}${sel("base", [...BASES, "Aucun"], o.base)}
      <label class="field"><span>Temps (min)</span><input data-ed="t" inputmode="numeric" value="${esc(o.t || "")}"></label>
      <label class="field"><span>Difficulté</span><select data-ed="d">${[1,2,3].map(n => `<option value="${n}" ${+o.d === n ? "selected" : ""}>${DIFF[n-1]}</option>`).join("")}</select></label>
    </div>` : "";
  const variation = (kind === "meal" || kind === "temp") && o.gen ? genPanel(o.gen) : "";
  const footer = kind === "meal" ? `
      <button class="btn" data-act="proposeMeal" data-w="${ref.w}" data-d="${ref.d}" data-s="${ref.s}">Autres idées pour ce repas</button>
      <button class="btn" data-act="pickRecipe" data-w="${ref.w}" data-d="${ref.d}" data-s="${ref.s}">Choisir dans le carnet</button>
      <button class="btn" data-act="mealToBook">Enregistrer dans le carnet</button>
      ${o.recipeId && recipeById(o.recipeId) ? `<button class="btn ghost" data-act="resetMeal">Rétablir la recette d'origine</button>` : ""}
      <button class="btn ghost danger" data-act="clearMeal">Retirer ce repas</button>
      <button class="btn primary push" data-act="close">Terminé</button>`
    : kind === "recipe" ? `
      <button class="btn" data-act="recipeToPlan" data-id="${o.id}">Ajouter au planning</button>
      <button class="btn ghost danger" data-act="delRecipe" data-id="${o.id}">Supprimer la recette</button>
      <button class="btn primary push" data-act="close">Terminé</button>`
    : kind === "temp" ? `
      <button class="btn primary" data-act="tempPlace">Ajouter au planning</button>
      <button class="btn" data-act="tempSave">Enregistrer dans le carnet</button>
      <button class="btn ghost push" data-act="close">Fermer</button>`
    : `<button class="btn ghost" data-act="close">Annuler</button><button class="btn primary push" data-act="saveDraft">Enregistrer la recette</button>`;
  openModal(`<div id="edWrap" ${catSt(o.cat)}>
    <p class="eyebrow">${where}</p>
    ${kind !== "draft" ? `<p class="ed-modes"><button class="link" data-act="toCook">← Voir en mode cuisine</button>${kind === "recipe" && o.own ? ` <button class="link" data-act="toCreator">Ouvrir dans le panneau de création</button>` : ""}</p>` : ""}
    <textarea class="ed-title" data-ed="name" rows="1" placeholder="${isRecipe ? "Nom de la recette" : "Nom du repas"}" aria-label="Nom">${esc(title)}</textarea>
    ${o.sub ? `<p class="ed-sub">${esc(o.sub)}</p>` : ""}
    <div id="edPc">${protoBanner(o)}</div><p class="ed-kcal">${catTag(o.cat)} ${metaLine(o) ? `<span>${esc(metaLine(o))}</span><span class="sep"></span>` : ""}Environ <strong id="edKcal">${fmtK(kcalOf(o))}</strong> kcal <span class="muted">(indicatif, recalculé à chaque modification)</span></p>
    ${recipeFields}${variation}
    <section class="ed-sec"><h3>Ingrédients</h3><ol class="ing-list" id="ingList">${ingRows(o)}</ol>
      <button class="btn" data-act="ingAdd">＋ Ajouter un ingrédient</button></section>
    <section class="ed-sec"><div class="sec-head"><h3>Préparation</h3><button class="link" data-act="editSteps" id="stepsBtn">${o.steps && o.steps.length ? "Modifier la préparation" : "Voir la recette"}</button></div>
      <ol class="steps" id="stepsRead" ${o.steps && o.steps.length ? "" : "hidden"}>${stepsHTML(o.steps, o.ing)}</ol>
      <div id="stepsEditWrap" ${o.steps && o.steps.length ? "hidden" : ""}><p class="muted small">Une étape par ligne. Pour lui donner un titre : « Titre — texte ».</p>
      <textarea data-ed="steps" id="stepsEdit" rows="${Math.max(8, (o.steps || []).length * 2 + 2)}">${esc((o.steps || []).join("\n"))}</textarea></div></section>
    <section class="ed-sec"><h3>Astuce du chef</h3><textarea data-ed="tip" rows="2">${esc(o.tip || "")}</textarea></section>
    <div class="sheet-foot">${footer}</div>
    <datalist id="units">${UNITS.map(u => `<option value="${u}">`).join("")}</datalist></div>`, { focus: kind === "meal" && !o.name ? ".ed-title" : kind === "draft" ? ".ed-title" : null });
}
function fitTitle(){ const t = document.querySelector(".ed-title"); if (t && t.tagName === "TEXTAREA") { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; } }
function ingRows(o){
  if (!o.ing.length) return `<li class="ing-empty muted">Aucun ingrédient pour l'instant.</li>`;
  return o.ing.map((i, k) => `<li class="ing" data-i="${k}">
    <input class="ing-q" data-ing="q" value="${esc(i.q)}" inputmode="decimal" placeholder="Qté" aria-label="Quantité">
    <input class="ing-u" data-ing="u" value="${esc(i.u)}" list="units" placeholder="unité" aria-label="Unité">
    <input class="ing-n" data-ing="n" value="${esc(i.n)}" placeholder="Ingrédient" aria-label="Ingrédient">
    <span class="ing-tools">
      <button class="icon" data-act="ingUp" data-i="${k}" aria-label="Monter" ${k === 0 ? "disabled" : ""}>↑</button>
      <button class="icon" data-act="ingDown" data-i="${k}" aria-label="Descendre" ${k === o.ing.length - 1 ? "disabled" : ""}>↓</button>
      <button class="icon del" data-act="ingDel" data-i="${k}" aria-label="Supprimer">×</button>
    </span></li>`).join("");
}
function refreshIng(focusLast){
  const o = edObj(); $("#ingList").innerHTML = ingRows(o); $("#edKcal").textContent = fmtK(kcalOf(o)); { const pc = $("#edPc"); if (pc) pc.innerHTML = protoBanner(o); }
  if (focusLast) { const r = [...document.querySelectorAll("#ingList .ing-n")].pop(); if (r) r.focus(); }
}
function genPanel(g){
  const f = FORMATS.find(x => x.id === g.f);
  const opt = (arr, cur, lab) => arr.map(k => `<option value="${k}" ${k === cur ? "selected" : ""}>${esc(lab(k))}</option>`).join("");
  return `<section class="gen-panel"><h3>Varier ce plat</h3><p class="muted small">Change un élément, le reste de la recette suit.</p>
    <div class="fields">
      <label class="field"><span>Format</span><select data-gen="f">${opt(FORMATS.map(x => x.id), g.f, k => FORMATS.find(x => x.id === k).n)}</select></label>
      <label class="field"><span>Protéine</span><select data-gen="p">${opt(formatProteins(f), g.p, k => cap(PROTEINS[k].n))}</select></label>
      <label class="field"><span>Féculent</span><select data-gen="s">${opt(f.s, g.s, k => cap(STARCHES[k].n))}</select></label>
      <label class="field"><span>Sauce</span><select data-gen="sa">${opt(f.sa, g.sa, k => cap(SAUCES[k].n))}</select></label>
    </div>
    <button class="link" data-act="genVeg">Changer les légumes</button></section>`;
}

/* saisie en direct dans l'éditeur et ailleurs */
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind === "weekName") { const w = curWeek(); w.name = el.value; saveSoon(); const t = document.querySelector(`.wtab[data-i="${S.ui.week}"]`); if (t) t.textContent = el.value; return; }
  if (el.dataset.bind === "dayName") { curWeek().days[+el.dataset.d].name = el.value; saveSoon(); return; }
  if (el.dataset.bind === "bookSearch") { BOOK.q = el.value; renderBookList(); return; }
  if (el.dataset.bind === "pickSearch") { PICK.q = el.value; renderPickList(); return; }
  if (!MODAL) return;
  const o = edObj(); if (!o) return;
  if (el.dataset.ing) {
    const k = +el.closest(".ing").dataset.i; o.ing[k][el.dataset.ing] = el.value;
    $("#edKcal").textContent = fmtK(kcalOf(o)); { const pc = $("#edPc"); if (pc) pc.innerHTML = protoBanner(o); } saveSoon(); return;
  }
  const key = el.dataset.ed; if (!key) return;
  if (key === "name") { if (/\n/.test(el.value)) el.value = el.value.replace(/\n/g, " "); o[nameKey()] = el.value; fitTitle(); }
  else if (key === "steps") o.steps = el.value.split("\n").map(s => s.trim()).filter(Boolean);
  else if (key === "t" || key === "d") o[key] = el.value;
  else o[key] = el.value;
  if (MODAL.kind !== "draft") saveSoon();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (MODAL && el.dataset.ed && el.tagName === "SELECT") { const o = edObj(); o[el.dataset.ed] = el.dataset.ed === "d" ? +el.value : el.value; if (MODAL.kind !== "draft") saveSoon();
    if (el.dataset.ed === "cat") { const w = $("#edWrap"); if (w) w.style.setProperty("--cc", catVar(el.value)); } }
  if (MODAL && el.dataset.gen && MODAL.kind === "temp") { TEMP = mealFromGen(swapGen(TEMP, el.dataset.gen, el.value)); openEditorEdit("temp", TEMP); return; }
  if (MODAL && el.dataset.gen) { const m = getMeal(MODAL.t); snapshot(); const nm = mealFromGen(swapGen(m, el.dataset.gen, el.value)); nm.id = m.id; setMeal(MODAL.t, nm); save(); openEditorEdit("meal", MODAL.t); toast("Plat modifié", true); }
  if (el.dataset.bind === "shopWeek") { SHOP.w = +el.value; SHOP.days = null; render(); }
  if (el.dataset.bind === "shopDay") { const ds = shopDays(); SHOP.days = ds.map((v, i) => i === +el.dataset.i ? el.checked : v); render(); }
  if (el.dataset.bind === "shopItem") { const w = S.weeks[SHOP.w]; S.checked[w.id] = S.checked[w.id] || {}; S.checked[w.id][el.dataset.key] = el.checked; save(); el.closest("li").classList.toggle("done", el.checked); }
  if (el.dataset.bind === "goal") { S.goal = parseFloat(el.value.replace(",", ".")) || S.goal; save(); render(); }
  if (el.dataset.bind === "importFile") importFile(el.files[0]);
  if (el.dataset.bind === "bookCat") { BOOK.cat = el.value; renderBookList(); }
  if (el.dataset.bind === "bookSt") { BOOK.st = el.value; renderBookList(); }
  if (el.dataset.bind === "bookBase") { BOOK.base = el.value; renderBookList(); }
});

/* ============ ACTIONS (clics) ============ */
const A = {};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { S.ui.view = nav.dataset.nav; save(); render(); window.scrollTo(0, 0); return; }
  if (e.target.id === "modal") { closeModal(); return; }
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return;
  const fn = A[a.dataset.act]; if (fn) { e.preventDefault(); fn(a.dataset, a); }
});
const T = ds => ({ w: ds.w != null ? +ds.w : S.ui.week, d: +ds.d, s: ds.s });

A.undo = () => undo();

/* ---------- moteur de propositions (petit-déjeuner, déjeuner et dîner) ---------- */
function slotOf(f){ return f.slot || (f.t && f.t.s) || (f.to && f.to.s) || "l"; }
const okSens = r => !(S.sensible && (r.ing || []).some(i => /sardine|miso|sauce soja/.test(norm(i.n))));
function catalogFor(f){
  const bk = slotOf(f) === "b";
  return S.recipes.filter(r => CATS.includes(r.cat) && r.st !== "Douceurs" && ((r.st === "Petit-déjeuner") === bk) && okSens(r) &&
    (!f.cats || !f.cats.length || f.cats.includes(r.cat)) && (!f.bases || !f.bases.length || f.bases.includes(r.base)) && (!f.styles || !f.styles.length || f.styles.includes(r.st)));
}
function oneProposal(f, avoid){
  avoid = avoid || new Set();
  const src = f.src || "mix", sl = slotOf(f), bk = sl === "b";
  for (let t = 0; t < 40; t++){
    const useBook = bk || src === "book" || (src === "mix" && Math.random() < 0.4);
    let m = null;
    if (useBook) { const list = catalogFor(f).filter(r => !avoid.has(r.n)); if (list.length) m = mealFromRecipe(pick(list)); else if (bk || src === "book") return null; }
    if (!m) { const g = randomGen({ cats: f.cats, bases: f.bases, styles: f.styles }); if (g) m = mealFromGen(g); }
    if (m && !avoid.has(m.name)) { if (S.autoVeg !== false && !bk) autoSide(m); if (S.autoAdapt !== false) protoAdaptMeal(m, sl, kT(sl)); return m; }
  }
  return null;
}
function proposeMeals(n, f){
  const out = [], seen = new Set();
  for (let i = 0; i < n * 3 && out.length < n; i++){ const m = oneProposal(f, seen); if (m && !seen.has(m.name)) { seen.add(m.name); out.push(m); } }
  return out;
}
function weekUsed(w, skip){ const s = new Set(); w.days.forEach((d, i) => { if (i !== skip) SLOTS.forEach(sl => d.meals[sl.k] && s.add(d.meals[sl.k].name)); }); return s; }
function proposeDay(f, avoid){
  avoid = new Set(avoid || []); const out = {};
  SLOTS.forEach(sl => {
    const bk = sl.k === "b";
    const m = oneProposal({ ...f, slot: sl.k }, avoid) || oneProposal({ src: bk ? "book" : "gen", slot: sl.k }, avoid) || oneProposal({ src: "mix", slot: sl.k }, new Set());
    out[sl.k] = m; if (m) avoid.add(m.name);
  });
  return out;
}
function proposeWeek(f){
  const days = [], avoid = new Set(), count = {};
  const limit = f.cats && f.cats.length ? 99 : 5;
  for (let i = 0; i < 7; i++){
    let best = null;
    for (let t = 0; t < 30; t++){
      const p = proposeDay(f, avoid);
      const ok = [p.l, p.d].every(m => !m || (count[m.cat] || 0) < limit);
      best = p; if (ok) break;
    }
    SLOTS.forEach(sl => { const m = best[sl.k]; if (!m) return; avoid.add(m.name); if (sl.k !== "b") count[m.cat] = (count[m.cat] || 0) + 1; });
    days.push(best);
  }
  return days;
}

  if (INSP.scope === "day") {
    return `<article class="day"><div class="day-head"><span class="day-name static">Journée proposée</span><span class="muted small">≈ ${kc(r)} kcal par jour</span></div>${dayHtml(r, -1)}</article>

    <button class="btn" data-act="applyWeek">Remplacer</button></div>`;

let SHOP = { w: null, days: null, b: true };
function shopDays(){ const w = S.weeks[SHOP.w]; if (!SHOP.days || SHOP.days.length !== w.days.length) SHOP.days = w.days.map(() => true); return SHOP.days; }
function buildShop(){
  const w = S.weeks[SHOP.w], sel = shopDays(), map = new Map();
  w.days.forEach((d, i) => { if (!sel[i]) return; SLOTS.forEach(sl => { const m = d.meals[sl.k]; if (!m) return;
    m.ing.forEach(it => { if (!String(it.n).trim()) return; const e = lookup(it.n);
      const mergeByKey = e && ["Légumes","Volaille","Œufs","Féculents","Tofu & protéines végétales"].includes(e.a);
      const key = mergeByKey ? "k:" + e.k : "n:" + norm(it.n);
      if (!map.has(key)) map.set(key, { key, name: it.n, aisle: e ? e.a : "Divers", parts: {}, names: {} });
      const g = map.get(key); g.names[it.n] = (g.names[it.n] || 0) + 1;
      const q = parseFloat(String(it.q).replace(",", ".")); const uk = unitKind(it.u);
      if (!q || isNaN(q) || uk === "z") { g.parts.z = g.parts.z || { q: 0, u: it.u || "au goût" }; return; }
      const pk = uk === "p" ? "p:" + norm(it.u) : uk;
      g.parts[pk] = g.parts[pk] || { q: 0, u: uk === "c" ? "c. à café" : uk === "s" ? "c. à soupe" : uk === "g" ? (norm(it.u) === "ml" ? "ml" : "g") : it.u };
      g.parts[pk].q += q; }); }); });
  const items = [...map.values()].map(g => { g.name = Object.entries(g.names).sort((a, b) => b[1] - a[1])[0][0];
    const parts = Object.entries(g.parts).filter(([k]) => k !== "z").map(([, p]) => { const q = Math.round(p.q * 10) / 10;
      if (norm(p.u) === "piece" || norm(p.u) === "pieces") return "× " + fmtN(q);
      const pl = q > 1 && ["tranche","feuille","pot","tasse","pincee"].includes(norm(p.u)) ? "s" : ""; return fmtN(q) + " " + p.u + pl; });
    g.qty = parts.length ? parts.join(" + ") : "selon le goût"; return g; });
  (S.shopExtra || []).forEach(x => { const e = lookup(x.n); items.push({ key: "x:" + x.id, id: x.id, extra: true, name: x.n, aisle: e ? e.a : "Divers", qty: qtyStr(x) || "selon le besoin" }); });
  return items;
}

function viewWeight(){

  return `<header class="pagehead"><div><h1 class="display">Suivi du poids</h1><p class="muted">Une pesée par semaine, le même jour et à la même heure, suffit pour suivre la tendance.</p></div></header>

      ${stat(first && last ? (last.kg - first.kg > 0 ? "+" : "") + fmtN(last.kg - first.kg) + " kg" : "—", "Évolution")}
      <div class="stat"><span class="stat-v"><input class="goal" data-bind="goal" value="${fmtN(S.goal)}" inputmode="decimal" aria-label="Objectif en kg"> kg</span><span class="stat-l">Objectif</span></div></div>
    <form class="weight-form" onsubmit="return false"><label class="field"><span>Date</span><input type="date" id="wDate" value="${today}"></label>
      <label class="field"><span>Poids (kg)</span><input id="wKg" inputmode="decimal" placeholder="78,0"></label><button class="btn primary" data-act="addWeight">Enregistrer la pesée</button></form>
    ${leversCard()}
    <div class="chart">${chartSvg(ws)}</div>
    ${ws.length ? `<ul class="wlist">${[...ws].reverse().map((x, i, arr) => { const prev = arr[i + 1]; const d = prev ? x.kg - prev.kg : null;
      return `<li><span>${new Date(x.date + "T12:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long", year: "numeric" })}</span><strong>${fmtN(x.kg)} kg</strong>
      <span class="muted">${d == null ? "" : (d > 0 ? "+" : "") + fmtN(d) + " kg"}</span><button class="icon del" data-act="delWeight" data-date="${x.date}" aria-label="Supprimer">×</button></li>`; }).join("")}</ul>` : ""}`;
}
function chartSvg(ws){
  if (ws.length < 2) return `<p class="muted center">La courbe apparaîtra à partir de deux pesées.</p>`;
  const W = 640, Hh = 220, p = 36, vals = ws.map(x => x.kg).concat([S.goal]);
  const min = Math.floor(Math.min(...vals) - 0.5), max = Math.ceil(Math.max(...vals) + 0.5);
  const t0 = new Date(ws[0].date).getTime(), t1 = new Date(ws[ws.length - 1].date).getTime() || t0 + 1;
  const X = d => p + (W - 2 * p) * ((new Date(d).getTime() - t0) / Math.max(1, t1 - t0));
  const Y = v => Hh - p + -(Hh - 2 * p) * (v - min) / Math.max(0.1, max - min);
  const pts = ws.map(x => `${X(x.date).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(" ");
  const ticks = []; for (let v = min; v <= max; v++) ticks.push(v);
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Courbe de poids">
    ${ticks.map(v => `<line x1="${p}" x2="${W - p}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${p - 8}" y="${Y(v) + 4}" class="axis" text-anchor="end">${v}</text>`).join("")}
    <line x1="${p}" x2="${W - p}" y1="${Y(S.goal)}" y2="${Y(S.goal)}" class="goal-line"/><text x="${W - p}" y="${Y(S.goal) - 6}" class="axis" text-anchor="end">objectif ${fmtN(S.goal)} kg</text>
    <polyline points="${pts}" class="curve"/>${ws.map(x => `<circle cx="${X(x.date)}" cy="${Y(x.kg)}" r="3.5" class="dot"/>`).join("")}</svg>`;
}

/* ============================================================
   PROTOCOLE DE CAT : niveaux d'aliments, portions par repas,
   calories par repas (sans objectif de régime), leviers de poids,
   réintroduction progressive après 90 jours
   ============================================================ */
const num = v => parseFloat(String(v == null ? "" : v).replace(",", ".")) || 0;
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const diffDays = (a, b) => Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 86400000);
const fmtDate = iso => iso ? new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }) : "";

/* ---------- portions par repas (poids cuits) ---------- */
const PORTIONS = { b: { f: [60, 100], fr: [25, 35], p: [40, 60] }, l: { f: [120, 150], fr: [20, 40], p: [80, 100] }, d: { f: [120, 150], fr: [20, 40], p: [80, 100] } };
const RAW_STARCH = ["riz cru", "flocons d'avoine", "avoine", "farine de sarrasin", "flocons de sarrasin"];
const SOLID_PROT = ["tofu ferme", "tofu", "blanc de poulet", "poulet", "sardine"];
const isQty = i => num(i.q) > 0 && unitKind(i.u) === "g";
function starchItems(m){ return (m.ing || []).filter(i => { const e = lookup(i.n); return e && e.a === "Féculents" && isQty(i); }); }
function starchSplit(m){ let c = 0, r = 0; starchItems(m).forEach(i => { const e = lookup(i.n); if (RAW_STARCH.indexOf(e.k) >= 0) r += num(i.q); else c += num(i.q); }); return { c, r }; }
function protItems(m){ return (m.ing || []).filter(i => { const e = lookup(i.n); return e && SOLID_PROT.indexOf(e.k) >= 0 && isQty(i); }); }
const starchKcal = m => starchItems(m).reduce((s, i) => s + ingKcal(i), 0);
const ingTotal = m => (m.ing || []).reduce((s, i) => s + ingKcal(i), 0);
function scaleStarch(m, f){
  starchItems(m).forEach(i => { i.q = Math.max(5, Math.round(num(i.q) * f / 5) * 5); });
  m.adj = Math.round((m.adj || 1) * f * 100) / 100;
}
const kT = k => S.kcalT && num(S.kcalT[k]) > 0 ? Math.round(num(S.kcalT[k])) : null;
const lvlF = m => (m.lf || 0);   /* grammes de féculents ajoutés par le levier 1 (jamais plus de 30 g) */

/* met un repas aux portions du protocole, puis le rapproche de sa cible de calories si elle existe.
   Les protéines ne descendent jamais sous le minimum du repas. */
function protoAdaptMeal(m, k, target){
  if (!m || !m.ing) return false; const R = PORTIONS[k] || PORTIONS.l; let changed = false;
  const sp = starchSplit(m), raw = sp.c === 0 && sp.r > 0, cur = raw ? sp.r : sp.c;
  if (cur > 0) {
    const lo = raw ? R.fr[0] : R.f[0], hi = (raw ? R.fr[1] : R.f[1]) + lvlF(m);
    let x = 1;
    if (target) { const sc = starchKcal(m), tot = ingTotal(m); if (sc > 0) x = (target - (tot - sc)) / sc; }
    let want = Math.max(lo, Math.min(hi, cur * x)); if (!target) want = Math.max(lo, Math.min(hi, cur));
    const f = want / cur; if (Math.abs(f - 1) > .02) { scaleStarch(m, f); changed = true; }
  }
  protItems(m).forEach(i => { const q = num(i.q), lo = R.p[0], hi = R.p[1]; if (protItems(m).length === 1 && (q < lo || q > hi)) { i.q = Math.max(lo, Math.min(hi, q)); changed = true; } });
  return changed;
}
function adaptDay(day, force){
  let n = 0; SLOTS.forEach(sl => { const m = day.meals[sl.k]; if (m && protoAdaptMeal(m, sl.k, kT(sl.k))) n++; }); return n > 0;
}
function slotTarget(t){ return kT(t.s); }
const adaptHint = d => SLOTS.some(sl => { const m = d.meals[sl.k]; if (!m) return false; const c = clone(m); return protoAdaptMeal(c, sl.k, kT(sl.k)); });
function kcalBar(d){
  const k = dayKcal(d); if (!k) return "";
  const ts = SLOTS.map(sl => kT(sl.k)); const all = ts.every(x => x);
  const tg = all ? ts.reduce((a, b) => a + b, 0) : 0;
  const diff = k - tg, cls = !all ? "" : Math.abs(diff) <= tg * .08 ? "ok" : diff > 0 ? "hi" : "lo";
  return `<div class="kbar ${cls}"><div class="kb-top"><span class="kb-v">≈ ${fmtK(k)} kcal par jour</span>${all ? `<span class="kb-t">cible ${fmtK(tg)}</span>` : ""}</div>${all ? `<span class="kb-d">${Math.abs(diff) <= tg * .08 ? "dans la cible" : (diff > 0 ? "+" : "−") + Math.abs(diff) + " kcal"}</span>` : ""}</div>`;
}

/* ---------- contrôle du protocole ---------- */
const L3_RE = /\b(ail|oignons?|echalotes?|poivre|piment|vinaigre|citron|moutarde|pois chiches?|lentilles?|haricots? (?:blancs?|rouges?|secs?)|falafels?|fritur\w*|fruits? a coque brut)\b/;
const RAW_RE = /\b(salade|concombre|radis|crudites?|tomates?|carottes? rapees?)\b/;
function reintOK(key){ const f = S.reint && S.reint.foods && S.reint.foods[key]; return !!f && (f.st === "ok" || f.st === "test"); }
function protoCheck(o){
  const bad = [], warn = [];
  (o.ing || []).forEach(i => {
    const nm = String(i.n || "").trim(); if (!nm) return; const n = norm(nm), q = num(i.q), e = lookup(nm);
    if (L3_RE.test(n)) { bad.push({ n: nm, why: "exclu par le protocole (niveau 3)" }); return; }
    if (RAW_RE.test(n)) { warn.push({ n: nm, why: "cru : à éviter, cuire doucement" }); return; }
    if (!e) return;
    if (e.n === "r") warn.push({ n: nm, why: "non listé dans le protocole : à réintroduire" });
    else if ((e.n === "p2" || e.n === "p3") && !reintOK(e.k)) warn.push({ n: nm, why: "palier de réintroduction : pas encore débloqué" });
    if (e.k === "avocat" && q > 30) warn.push({ n: nm, why: "1/8 d'avocat maximum par repas (30 g)" });
    if (e.k === "sardine") { if (S.sensible) warn.push({ n: nm, why: "phase de sensibilité aiguë : sardines à éviter" }); else warn.push({ n: nm, why: "occasionnelle, de préférence le midi" , soft: true }); }
    if (e.k === "haricots verts" && q > 75) warn.push({ n: nm, why: "75 g maximum cuits (seuil low-FODMAP)" });
    if (e.k === "courgette" && q > 60) warn.push({ n: nm, why: "60 g maximum épluchée (seuil low-FODMAP)" });
    if (e.w && /FODMAP/.test(e.w) && q > 75 && e.k !== "haricots verts" && e.k !== "courgette") warn.push({ n: nm, why: e.w });
  });

}
function protoBanner(o){
  const c = protoCheck(o); if (c.ok && !c.warn.length) return "";

  return `<div class="pc ${c.bad.length ? "bad" : "warn"}"><p class="pc-h">${ic(c.bad.length ? "x" : "gauge")} ${c.bad.length ? "Ne respecte pas le protocole de Cat" : "À surveiller avec le protocole"}</p><ul>${li(c.bad)}${li(c.warn)}</ul></div>`;
}
function protoDot(m){ const c = protoCheck(m); return c.bad.length ? `<span class="mb bad">hors protocole</span>` : c.warn.some(w => !w.soft) ? `<span class="mb warn">à vérifier</span>` : ""; }

function lever1(m){
  if (!m || (m.lf || 0) >= 30) return false; const add = Math.min(20, 30 - (m.lf || 0)), items = starchItems(m); if (!items.length) return false;
  const main = items.slice().sort((a, b) => num(b.q) - num(a.q))[0]; main.q = num(main.q) + add; m.lf = (m.lf || 0) + add; return true;
}

  if (!m || (m.lo || 0) >= .5) return false; const oil = (m.ing || []).find(i => /^huile/.test(norm(i.n)) && unitKind(i.u) === "c");
  if (!oil) return false; oil.q = num(oil.q) + .5; m.lo = (m.lo || 0) + .5; return true;
}

  if (!(S.vegRatio > 0)) S.vegRatio = 80;
  if (!Array.isArray(S.pantry)) S.pantry = [];

  const ks = Object.keys(S.cooked); if (ks.length > 80) ks.slice(0, ks.length - 80).forEach(k => delete S.cooked[k]);

function migrateAll(){ if (!S.v || S.v < 2) migrateProto(); if (S.v < 3) migrate3(); if (S.v < 4) migrate4(); if (S.v < 5) migrate5(); if (S.v < 6) migrate6(); }
/* v2 : nouveau protocole. Le carnet fourni est remplacé par la version mise à jour ; les recettes créées par Cat sont conservées.
   Les repas du planning qui venaient de l'ancien carnet sont renouvelés, et un petit-déjeuner est ajouté là où il manque. */
function migrateProto(){
  const oldIds = new Set(S.recipes.filter(r => !r.own).map(r => r.id)), own = S.recipes.filter(r => r.own);
  S.recipes = DEFAULT_RECIPES.map(recipeToState).concat(own);
  const fresh = buildDefaultPlan(S.recipes);
  S.weeks.forEach((w, wi) => w.days.forEach((d, di) => {
    const src = fresh[wi % fresh.length].days[di % 7].meals;
    ["b", "l", "d"].forEach(k => { const m = d.meals[k]; if (!m || (m.recipeId && oldIds.has(m.recipeId))) d.meals[k] = copyMeal(src[k]); });
  }));
  S.v = 2;
}

function importText(txt){

function closeIfOpen(){}
A.importPaste = () => {

/* =====================================================================
   v3 : 80 % végétarien, légumes variés, herbes, plats japonais et coréens doux,
   petits-déjeuners légers (sucré / salé), recette visible tout de suite, aperçu des menus
   ===================================================================== */
const NONVEG = ["Poulet", "Sardines"];
const isVegCat = c => NONVEG.indexOf(c) < 0;
const vegRatio = () => S.vegRatio > 0 ? S.vegRatio : 80;
const EGG_PREPS = [/oeufs? (?:durs?|mollets?|poches?|au plat|brouilles?|cocotte)/, /omelette/, /chawan/, /\boeufs? mollets?\b/];
function eggsOK(m){
  const t = norm((m.name || m.n || "") + " " + (m.steps || []).join(" ").replace(/\{\{[^}]*\}\}/g, " ")); let n = 0;
  EGG_PREPS.forEach(re => { if (re.test(t)) n++; }); return n <= 1;
}
const FERMENTED_RE = /\b(miso|sauce soja)\b/;
const hasFermented = m => (m.ing || []).some(i => FERMENTED_RE.test(norm(i.n)));

/* ---------- variations : légumes variés, herbes, 80 % végétarien ---------- */
const RECENT_VEG = [];
function pickVeg(f, not){
  const cs = vegCombos(f).filter(c => !not || c.join() !== not.join()); if (!cs.length) return null;
  const ws = cs.map(c => c.reduce((p, k) => p * vegWeight(k) * (RECENT_VEG.indexOf(k) >= 0 ? .25 : 1), 1));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0), res = cs[cs.length - 1];
  for (let i = 0; i < cs.length; i++) { r -= ws[i]; if (r <= 0) { res = cs[i]; break; } }
  RECENT_VEG.push(...res); while (RECENT_VEG.length > 14) RECENT_VEG.shift(); return res;
}
const HERBS_DEFAULT = ["persil", "basilic", "aneth", "cerfeuil", "thym", "estragon"];
["bamboo", "slow", "cocon", "fraicheur", "bol"].forEach(id => { const f = FORMATS.find(x => x.id === id); if (f && !f.herbs) f.herbs = HERBS_DEFAULT; });
function buildGen(g){
  const f = FORMATS.find(x => x.id === g.f);
  if (g.herb === undefined) g.herb = f.herbs && f.herbs.length ? pick(f.herbs) : "";
  const m = buildGen0(g), fin = m.steps.findIndex(s => /^Finition — /.test(s));
  if (g.herb && !m.ing.some(i => norm(i.n).indexOf(norm(g.herb)) >= 0)) {
    m.ing.push({ n: g.herb, q: "", u: H });
    const extra = " Ciseler très finement quelques brins " + de(g.herb) + " frais : un parfum doux, sans aucun piquant.";
    if (fin >= 0) m.steps[fin] += extra; else m.steps.splice(m.steps.length - 1, 0, "Finition —" + extra);
  }
  m.gen = { ...g }; return m;
}
function randomGen(filters = {}, tries = 160){
  const cats = filters.cats || [], bases = filters.bases || [], styles = filters.styles || [];
  const wv = cats.length ? null : Math.random() * 100 < vegRatio();
  for (let t = 0; t < tries; t++){
    const fl = FORMATS.filter(f => (!styles.length || styles.includes(f.st)) && f.s.some(s => !bases.length || bases.includes(STARCHES[s].base)));
    if (!fl.length) return null;
    const f = pick(fl);
    const ps = formatProteins(f).filter(p => PROTEINS[p] && (!cats.length || cats.includes(PROTEINS[p].cat)) && (wv === null || isVegCat(PROTEINS[p].cat) === wv));
    const ss = f.s.filter(s => !bases.length || bases.includes(STARCHES[s].base));
    if (!ps.length || !ss.length) continue;
    const m = buildGen({ f: f.id, p: pick(ps), s: pick(ss), v: pickVeg(f), sa: pick(f.sa) });
    if (!protoCheck(m).bad.length && eggsOK(m) && !(S.sensible && hasFermented(m))) return m;
  }
  return null;
}
function catalogFor(f){
  const bk = slotOf(f) === "b", wv = bk || (f.cats && f.cats.length) ? null : Math.random() * 100 < vegRatio();
  return S.recipes.filter(r => CATS.includes(r.cat) && r.st !== "Douceurs" && ((r.st === "Petit-déjeuner") === bk) && okSens(r) && eggsOK(r) &&
    (!bk || !f.pd || r.go === f.pd) && (wv === null || isVegCat(r.cat) === wv) &&
    (!f.cats || !f.cats.length || f.cats.includes(r.cat)) && (!f.bases || !f.bases.length || f.bases.includes(r.base)) && (!f.styles || !f.styles.length || f.styles.includes(r.st)));
}
/* petits-déjeuners : une fois sur deux sucré, une fois sur deux salé */
function proposeMeals(n, f){
  const out = [], seen = new Set(), bk = slotOf(f) === "b", off = Math.random() < .5 ? 0 : 1;
  for (let i = 0; i < n * 3 && out.length < n; i++){
    const ff = bk && !f.pd ? { ...f, pd: (out.length + off) % 2 === 0 ? "Sucré" : "Salé" } : f;
    const m = oneProposal(ff, seen); if (m && !seen.has(m.name)) { seen.add(m.name); out.push(m); }
  }
  return out;
}
function proposeWeek(f){
  const days = [], avoid = new Set(), count = {}, off = Math.random() < .5 ? 0 : 1;
  const limit = f.cats && f.cats.length ? 99 : 5;
  for (let i = 0; i < 7; i++){
    let best = null;
    for (let t = 0; t < 30; t++){
      const p = proposeDay({ ...f, pd: f.pd || ((i + off) % 2 === 0 ? "Sucré" : "Salé") }, avoid);
      const ok = [p.l, p.d].every(m => !m || (count[m.cat] || 0) < (limit > 50 ? limit : isVegCat(m.cat) ? 7 : 3));
      best = p; if (ok) break;
    }
    SLOTS.forEach(sl => { const m = best[sl.k]; if (!m) return; avoid.add(m.name); if (sl.k !== "b") count[m.cat] = (count[m.cat] || 0) + 1; });
    days.push(best);
  }

}
function bfFilter(ns){
  const st = ns === "prop" ? PROP : INSP;
  return `<div class="filters"><div class="frow"><span class="flabel">Petit-déjeuner</span><div class="chips">
    ${[["", "Sucré et salé"], ["Sucré", "Sucré"], ["Salé", "Salé"]].map(([v, l]) => `<button class="chip" data-act="pdKind" data-ns="${ns}" data-v="${v}" aria-pressed="${(st.pd || "") === v}">${l}</button>`).join("")}</div></div>
    <p class="muted small">Légers : 10 à 20 minutes, une moitié sucrée, une moitié salée.</p></div>`;
}
A.pdKind = ds => { const st = ds.ns === "prop" ? PROP : INSP; st.pd = ds.v;
  if (ds.ns === "prop") { PROP.items = proposeMeals(6, PROP); renderPropModal(); } else { INSP.result = null; render(); } };
A.vegRatio = ds => { S.vegRatio = +ds.v; save(); render(); };

/* ---------- recette visible tout de suite, sans quitter l'écran ---------- */
let NEWSET = new Set();
function mealBadges(m){
  const b = []; if (NEWSET.has(m.id)) b.push("nouveau");
  if (m.go) b.push(m.go.toLowerCase());
  if (m.adj && Math.abs(m.adj - 1) > .02) b.push("portions " + (m.adj > 1 ? "+" : "−") + Math.round(Math.abs(m.adj - 1) * 100) + " %");
  (m.iv || []).slice(0, 2).forEach(v => b.push("+ " + v));
  return b.map(x => `<span class="mb${x === "nouveau" ? " new" : ""}">${esc(x)}</span>`).join("");
}
function mealPeek(m){
  const ings = (m.ing || []).filter(i => String(i.n).trim());
  return `<div class="peek"><p class="muted small">${m.t ? m.t + " min · " : ""}≈ ${fmtK(kcalOf(m))} kcal</p>${protoBanner(m)}
    <h5>Ingrédients</h5><ul class="peek-ing">${ings.map(i => `<li>${hasQ(i) ? `<b>${esc(qtyStr(i))}</b> ` : ""}${esc(i.n)}${!hasQ(i) && i.u ? ` <span class="muted">(${esc(i.u)})</span>` : ""}</li>`).join("")}</ul>
    <h5>Préparation</h5><ol class="steps">${stepsHTML(m.steps, m.ing)}</ol>${m.tip ? `<p class="peek-tip"><b>Astuce du chef :</b> ${esc(m.tip)}</p>` : ""}</div>`;
}
function propCard(m, i, actions){
  const ings = m.ing.filter(x => x.q !== "").slice(0, 5).map(x => x.n).join(", ");
  return `<article class="prop" ${catSt(m.cat)}><p class="prop-tag">${catTag(m.cat)}<span>${m.gen ? "Variation" : "Carnet"}, ${esc(m.st || "")}${m.go ? " · " + esc(m.go.toLowerCase()) : ""}</span></p>
    <h4 class="dish-name">${esc(m.name)}</h4>${m.sub ? `<p class="dish-sub">${esc(m.sub)}</p>` : ""}
    <p class="muted small">${esc(ings)}…</p><p class="dish-meta">≈ ${fmtK(kcalOf(m))} kcal ${protoDot(m)}</p>
    <details class="peek-d"><summary>${ic("book")} Voir la recette complète</summary>${mealPeek(m)}</details>
    <div class="prop-actions">${S.recipes.some(r => r.n === m.name) ? actions.replace(/<button class="btn" data-act="inspSave"[^>]*>[^<]*<\/button>/, '<span class="muted small">✓ Déjà dans tes recettes</span>') : actions}</div></article>`;
}

/* ---------- aperçu des nouveaux menus : rien ne change tant qu'on n'applique pas ---------- */
let PV = null;
function pvMeal(m, di, sk){
  if (!m) return "";
  return `<div class="pv-meal" ${catSt(m.cat)}><details><summary><span class="slot">${slotLabel(sk)}</span><span class="pv-n">${esc(m.name)}</span><span class="pv-k">≈ ${fmtK(kcalOf(m))} kcal</span></summary>${mealPeek(m)}</details>
    <button class="mini" data-act="pvRe" data-di="${di}" data-s="${sk}" aria-label="Autre proposition">${ic("swap")} Autre</button></div>`;
}
function pvBody(){
  const w = curWeek();
  const day = (p, di, name) => `<article class="day pv-day"><div class="day-head"><span class="day-name static">${esc(name)}</span><span class="muted small">≈ ${fmtK(SLOTS.reduce((s, sl) => s + (p[sl.k] ? kcalOf(p[sl.k]) : 0), 0))} kcal par jour</span></div>${SLOTS.map(sl => pvMeal(p[sl.k], di, sl.k)).join("")}</article>`;
  return PV.scope === "week" ? PV.items.map((p, i) => day(p, i, w.days[i].name)).join("") : day(PV.items, 0, w.days[PV.di].name);
}
function openPreview(){
  const w = curWeek(), wk = PV.scope === "week";
  MODAL = { kind: "preview" };
  openModal(`<p class="eyebrow">${esc(w.name)}</p><h2 class="display-s">${wk ? "Nouveaux menus pour la semaine" : "Nouveaux repas pour " + esc(w.days[PV.di].name)}</h2>
    <p class="muted"><b>Rien n'est encore modifié.</b> Touche un repas pour lire sa recette, « Autre » pour le changer, puis applique quand le menu te plaît.</p>
    <div id="pvBody">${pvBody()}</div>
    <div class="sheet-foot"><button class="btn ghost" data-act="close">Annuler</button><button class="btn" data-act="pvAgain">${ic("swap")} Tout refaire</button><button class="btn primary push" data-act="pvApply">${wk ? "Appliquer à la semaine" : "Appliquer à ce jour"}</button></div>`, { wide: true });
}
function pvAvoid(){ const s = new Set(); (PV.scope === "week" ? PV.items : [PV.items]).forEach(p => SLOTS.forEach(sl => p[sl.k] && s.add(p[sl.k].name))); return s; }
function pvNew(){
  const w = curWeek();

  else PV.items = proposeDay({}, weekUsed(w, PV.di));
}
A.proposeWeek = () => { PV = { scope: "week" }; pvNew(); openPreview(); };
A.proposeDay = ds => { PV = { scope: "day", di: +ds.d }; pvNew(); openPreview(); };
A.pvAgain = () => { pvNew(); $("#pvBody").innerHTML = pvBody(); };
A.pvRe = ds => { const p = PV.scope === "week" ? PV.items[+ds.di] : PV.items, m = oneProposal({ slot: ds.s }, pvAvoid()); if (!m) return toast("Pas d'autre idée pour l'instant");
  p[ds.s] = m; $("#pvBody").innerHTML = pvBody(); };
A.pvApply = () => {
  const w = curWeek(); snapshot(); NEWSET = new Set(); let n = 0;
  const put = (d, p) => SLOTS.forEach(sl => { if (p[sl.k]) { d.meals[sl.k] = p[sl.k]; NEWSET.add(p[sl.k].id); n++; } });
  if (PV.scope === "week") w.days.forEach((d, i) => put(d, PV.items[i])); else put(w.days[PV.di], PV.items);
  save(); closeModal(); render(); toast(n + " repas remplacés", true); PV = null;
};

/* ---------- version 3 : migration ---------- */
const V3_REMOVED = { "pdj-millet-potimarron": "pdj-potimarron-vanille", "p-poulet-millet-haricots": "p-poulet-riz-pakchoi", "p-tofu-millet-potimarron": "p-tofu-quinoa-potimarron" };
const V3_OLD_PDJ = ["pdj-porridge-sale", "pdj-galette-sarrasin", "pdj-riz-tiede-sesame", "pdj-puree-oeuf-poulet", "pdj-chawanmushi", "pdj-pouding-avoine", "pdj-crepe-sarrasin-tofu"];
function migrate3(){
  const own = S.recipes.filter(r => r.own); S.recipes = DEFAULT_RECIPES.map(recipeToState).concat(own);
  const fresh = buildDefaultPlan(S.recipes), byId = id => S.recipes.find(r => r.id === id);
  let j = 0;
  S.weeks.forEach((w, wi) => w.days.forEach((d, di) => {
    const src = fresh[wi % fresh.length].days[di % 7].meals;
    ["b", "l", "d"].forEach(k => {
      const m = d.meals[k]; if (!m || !m.recipeId) return;
      if (V3_REMOVED[m.recipeId] && byId(V3_REMOVED[m.recipeId])) d.meals[k] = mealFromRecipe(byId(V3_REMOVED[m.recipeId]));
      else if (V3_OLD_PDJ.indexOf(m.recipeId) >= 0 || (k !== "b" && /millet/.test(norm(m.ing.map(i => i.n).join(" "))))) d.meals[k] = copyMeal(src[k] || src.l);
    });
  }));
  if (!(S.vegRatio > 0)) S.vegRatio = 80;
  S.v = 3;
}

function migrate4(){

      const m = d.meals[k]; if (!m || !m.recipeId || !oldIds.has(m.recipeId)) return;
      const r = byId(m.recipeId), nm = r ? mealFromRecipe(r) : copyMeal(src[k] || src.l);
      nm.id = m.id; protoAdaptMeal(nm, k, kT(k)); d.meals[k] = nm;
    });

}
