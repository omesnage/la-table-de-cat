<!doctype html>
<html lang="fr" data-font="editorial">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Table de Cat · plan doux</title>
<meta name="theme-color" content="#FAFAF7">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFAF7; --card:#FFFFFF; --ink:#1D1C1A; --ink-2:#3A3834; --mute:#7B776F;
  --line:#E5E2DB; --line-2:#CFCAC0; --celadon:#56766A; --wash:#EEF3EF; --danger:#9B4A3C;
  /* une couleur par catégorie de plat */
  --c-poisson:#C4674B; --c-crevettes:#D08A7A; --c-poulet:#C8963E; --c-boeuf:#7E3B3B;
  --c-jambon:#B06A45; --c-oeufs:#D4A93C; --c-veg:#6F8F6A;
  --cc:var(--celadon);
  --serif:"Cormorant Garamond","Cormorant",Garamond,Georgia,serif;
  --sans:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --serif-w:500; --fsa:.47; --title-ls:0;
  --r:999px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--celadon);outline-offset:2px}
.muted{color:var(--mute)} .small{font-size:12.5px} .center{text-align:center;padding:40px 0}
.danger{color:var(--danger)!important}

/* en-tête */
.top{position:sticky;top:0;z-index:20;background:rgba(250,250,247,.94);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:baseline;gap:40px;padding:18px 32px}
.brand{font:italic 400 26px/1 var(--serif);letter-spacing:.01em;white-space:nowrap}
/* menu du bas (smartphone) : pastille colorée par rubrique */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;gap:0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);backdrop-filter:saturate(1.2) blur(8px);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(29,28,26,.06)}
.tabbar button{--nf:#fff;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0;font-size:10.5px;letter-spacing:.02em;color:var(--mute);white-space:nowrap;transition:color .2s;-webkit-tap-highlight-color:transparent}
.tabbar .ico{display:grid;place-items:center;width:46px;height:32px;border-radius:16px;background:color-mix(in srgb,var(--nc) 16%,transparent);transition:background .2s,transform .15s}
.tabbar svg{width:22px;height:22px;fill:none;stroke:var(--nc);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.tabbar button:active .ico{transform:scale(.9)}
.tabbar button[aria-current="page"]{color:color-mix(in srgb,var(--nc) 70%,var(--ink));font-weight:500}
.tabbar button[aria-current="page"] .ico{background:var(--nc);box-shadow:0 4px 10px color-mix(in srgb,var(--nc) 40%,transparent);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.tabbar button[aria-current="page"] svg{stroke:var(--nf)}
@keyframes pop{0%{transform:scale(.8) translateY(3px)}60%{transform:scale(1.12) translateY(-3px)}100%{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:1px solid var(--line-2);border-radius:var(--r);font-size:13.5px;font-weight:500;background:transparent;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{background:var(--ink-2)}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.big{padding:14px 34px;font-size:15px}
.btn.file{cursor:pointer}
.link{color:var(--celadon);font-size:13px;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s}
.link:hover{text-decoration-color:currentColor}
.icon{width:30px;height:30px;border-radius:50%;color:var(--mute);font-size:15px;line-height:1}
.icon:hover:not(:disabled){background:var(--wash);color:var(--ink)}
.icon:disabled{opacity:.25;cursor:default}
.icon.del:hover{color:var(--danger);background:#F6ECEA}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* titres */
.display{font:400 44px/1.08 var(--serif);margin:0 0 8px;letter-spacing:-.005em}
.display-s{font:400 30px/1.15 var(--serif);margin:0 0 10px}
.eyebrow{font-size:12.5px;color:var(--mute);margin:0 0 6px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.pagehead p{max-width:62ch;margin:0}
.group-title{font:italic 400 22px/1.2 var(--serif);margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.book-group .group-title{border-bottom-color:var(--cc);display:flex;align-items:center;gap:10px}
.book-group .group-title::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cc);flex:none}

/* couleur de catégorie */
.cat-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.04em;padding:2px 10px 2px 8px;border-radius:var(--r);
  color:color-mix(in srgb,var(--cc) 68%,var(--ink));background:color-mix(in srgb,var(--cc) 12%,transparent);white-space:nowrap}
.cat-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cc)}

/* semaines */
.weekbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:34px;scrollbar-width:thin}
.wtab{padding:8px 16px;border-radius:var(--r);font-size:13.5px;color:var(--mute);white-space:nowrap;border:1px solid transparent}
.wtab:hover{color:var(--ink)}
.wtab[aria-current="true"]{color:var(--ink);border-color:var(--celadon)}
.wtab.add{color:var(--celadon)}
.weekhead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.weekhead p{margin:4px 0 0}
.title-input{font:400 52px/1.05 var(--serif);border:0;background:transparent;padding:0;width:100%;max-width:560px;border-bottom:1px solid transparent}
.title-input:hover,.title-input:focus{border-bottom-color:var(--line-2);outline:none}

/* jours */
.day{display:grid;grid-template-columns:190px 1fr;gap:28px;padding:30px 0;border-top:1px solid var(--line)}
.day:last-child{border-bottom:1px solid var(--line)}
.day-head{display:flex;flex-direction:column;gap:4px}
.day-name{font:italic 400 28px/1.1 var(--serif);border:0;background:transparent;padding:0;width:100%;border-bottom:1px solid transparent}
.day-name:hover,.day-name:focus{border-bottom-color:var(--line-2);outline:none}
.day-name.static{display:block}
.day-tools{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:10px}
.meals{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.meal{display:flex;flex-direction:column;gap:6px;min-width:0}
.meal.has-cat{border-left:2px solid var(--cc);padding-left:16px}
.slot{font-size:12.5px;color:var(--mute);letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.slot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c-poulet)}
.slot-d .slot::before,.slot.slot-d::before{background:var(--celadon)}
.day-name{color:color-mix(in srgb,var(--celadon) 65%,var(--ink))}
.wtab[aria-current="true"]{background:color-mix(in srgb,var(--celadon) 10%,transparent)}
.group-title{border-bottom-color:color-mix(in srgb,var(--celadon) 35%,var(--line))}
.stat-v{color:color-mix(in srgb,var(--celadon) 60%,var(--ink))}
.meal-tools .link{color:color-mix(in srgb,var(--cc) 70%,var(--ink))}
.dish{text-align:left;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.dish-name{font:400 19px/1.28 var(--serif);color:var(--ink);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:4px;text-decoration-thickness:1px;transition:text-decoration-color .15s}
.dish:hover .dish-name{text-decoration-color:var(--cc)}
.dish-sub{font-size:13px;color:var(--ink-2)}
.dish-meta{font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.meal-tools{display:flex;gap:14px;opacity:0;transition:opacity .15s}
.meal:hover .meal-tools,.meal:focus-within .meal-tools{opacity:1}
@media (hover:none){.meal-tools{opacity:1}}
.meal.empty .create{text-align:left;color:var(--celadon);font-size:14px;padding:12px 0;border-top:1px dashed var(--line-2)}
.meal.empty .create:hover{color:var(--ink)}
.add-day{padding:30px 0}
.empty-state{padding:80px 0;text-align:center}

/* feuille latérale */
.modal{position:fixed;inset:0;z-index:50;background:rgba(29,28,26,0);transition:background .25s}
.modal.open{background:rgba(29,28,26,.3)}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(660px,100%);background:var(--paper);overflow-y:auto;box-shadow:-24px 0 60px rgba(29,28,26,.12);transform:translateX(24px);opacity:0;transition:transform .28s cubic-bezier(.2,.7,.2,1),opacity .2s}
.sheet.wide{width:min(940px,100%)}
.modal.open .sheet{transform:none;opacity:1}
.sheet-close{position:sticky;top:0;display:flex;justify-content:flex-end;padding:14px 18px 0;background:linear-gradient(var(--paper) 70%,transparent)}
.sheet-body{padding:6px 44px 44px}
.sheet-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.push{margin-left:auto}

/* éditeur */
.ed-title{font:400 34px/1.15 var(--serif);border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;width:100%;padding:4px 0 10px;margin:0;resize:none;overflow:hidden;display:block}
.ed-title:focus{outline:none;border-bottom-color:var(--ink)}
.ed-title.static{border:0}
.ed-sub{margin:8px 0 0;color:var(--ink-2)}
.ed-kcal{margin:14px 0 0;font-size:13.5px}
.ed-sec{margin-top:30px}
.ed-sec h3,.gen-panel h3{font:italic 400 20px/1.2 var(--serif);margin:0 0 10px}
.gen-panel{margin-top:26px;padding:20px 22px;background:var(--wash);border-radius:4px}
.gen-panel p{margin:0 0 12px}
.fields{display:flex;flex-wrap:wrap;gap:14px 18px;margin:18px 0 8px}
.gen-panel .fields{margin:0 0 10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mute);min-width:130px}
.field input,.field select,select,.search,textarea{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:9px 11px;color:var(--ink);font-size:14px}
.field input:focus,select:focus,.search:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{width:100%;resize:vertical;line-height:1.6}
.ing-list{list-style:none;margin:0 0 14px;padding:0}
.ing{display:grid;grid-template-columns:64px 118px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ing input{border:0;background:transparent;padding:7px 6px;border-radius:3px;min-width:0;font-size:14.5px}
.ing input:hover{background:var(--card)}
.ing input:focus{outline:none;background:var(--card);box-shadow:inset 0 0 0 1px var(--ink)}
.ing-q{text-align:right}
.ing-empty{padding:12px 0}
.ing-tools{display:flex;gap:2px}
.steps{list-style:none;counter-reset:st;padding:0;margin:0}
.steps li{counter-increment:st;display:grid;grid-template-columns:44px 1fr;column-gap:6px;padding:16px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(st, decimal-leading-zero);grid-row:1 / span 2;font:400 13px/1.9 var(--sans);letter-spacing:.08em;color:var(--cc)}
.steps li.muted::before{content:none}
.step-h{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--cc) 80%,var(--ink));font-weight:500;margin-bottom:4px}
.steps p{margin:0;color:var(--ink-2);line-height:1.7;max-width:68ch}
.steps .lab{font-weight:500;color:var(--ink);font-size:.82em;letter-spacing:.08em;text-transform:uppercase}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:6px}
.sec-head h3{margin:0}
.ed-kcal .sep{display:inline-block;width:18px;height:1px;background:var(--line-2);vertical-align:middle;margin:0 12px}
.font-list{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:6px 0 40px}
.font-opt{text-align:left;padding:22px 22px 20px;border:1px solid var(--line);border-radius:4px;background:var(--card);display:flex;flex-direction:column;gap:10px}
.font-opt:hover{border-color:var(--ink-2)}
.font-opt[aria-pressed="true"]{border-color:var(--celadon);box-shadow:inset 0 0 0 1px var(--celadon)}
.font-opt .fo-t{font-size:26px;line-height:1.15}
.font-opt .fo-s{font-size:13.5px;color:var(--ink-2)}
.font-opt .fo-n{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
@media (max-width:760px){.font-list{grid-template-columns:1fr}.steps li{grid-template-columns:34px 1fr}}

/* choix */
.choice-list{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.choice{text-align:left;display:flex;flex-direction:column;gap:4px;padding:18px 20px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
button.choice:hover{border-color:var(--celadon)}
.choice strong{font:400 20px/1.2 var(--serif)}
.choice span{color:var(--mute);font-size:13.5px}
.choice .row{display:flex;gap:10px;margin-top:8px}

/* recherche / liste de choix */
.search{width:100%;padding:12px 14px;font-size:15px;margin:10px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 13px;border:1px solid var(--line-2);border-radius:var(--r);font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--ink)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--cc);flex:none}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pick-list{list-style:none;padding:0;margin:18px 0 0;columns:2;column-gap:36px}
.pick-list li{break-inside:avoid;margin-bottom:8px}
.pick{display:flex;flex-direction:column;text-align:left;padding:10px 14px;border-left:2px solid var(--cc);border-radius:0 3px 3px 0;
  background:color-mix(in srgb,var(--cc) 7%,transparent);width:100%;gap:2px}
.pick:hover .dish-name{text-decoration-color:var(--cc)}

/* propositions */
.filters{display:flex;flex-direction:column;gap:12px;margin:18px 0 22px}
.frow{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:start}
.flabel{font-size:12.5px;color:var(--mute);padding-top:7px}
.prop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.prop{background:var(--card);background:color-mix(in srgb,var(--cc) 7%,var(--card));border:1px solid var(--line);border-top:2px solid var(--cc);border-radius:4px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:6px}
.prop h4{margin:0}
.prop p{margin:0}
.prop-tag{font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.prop-actions{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:auto;padding-top:12px}

/* inspirations */
.insp-hero{display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:end;padding:10px 0 34px;border-bottom:1px solid var(--line);margin-bottom:30px}
.big-figure{font:400 128px/.82 var(--serif);margin:0;letter-spacing:-.03em;color:var(--celadon)}
.lede{font:400 19px/1.5 var(--serif);max-width:52ch;margin:0 0 6px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);padding:3px}
.seg-b{padding:8px 20px;border-radius:var(--r);font-size:14px;color:var(--mute)}
.seg-b[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.insp-go{margin:6px 0 36px}
.apply{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:24px 0;font-size:14px}

/* carnet */
.book-filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:34px}
.book-filters .search{margin:0}
.book-group{margin-bottom:40px}
.book-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;column-gap:48px;row-gap:8px}
.book-item{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;border-left:2px solid var(--cc);border-radius:0 3px 3px 0;
  background:color-mix(in srgb,var(--cc) 7%,transparent);width:100%}
.book-item:hover .dish-name{text-decoration-color:var(--cc)}

/* courses */
.shop-controls{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end;padding:18px 0 28px;border-bottom:1px solid var(--line);margin-bottom:30px}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink);cursor:pointer}
input[type=checkbox]{accent-color:var(--celadon);width:16px;height:16px}
.shop-cols{columns:3 280px;column-gap:44px}
.shop-group{break-inside:avoid;margin-bottom:30px}
.shop-list{list-style:none;margin:0;padding:0}
.shop-list label{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.si-q{color:var(--mute);font-size:13px;text-align:right}
.shop-list li.done .si-name{text-decoration:line-through;color:var(--mute)}

/* poids */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:28px}
.stat{padding:22px 0;display:flex;flex-direction:column;gap:4px}
.stat-v{font:400 34px/1 var(--serif)}
.stat-l{font-size:12.5px;color:var(--mute)}
.goal{width:3.2em;font:400 34px/1 var(--serif);border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:0}
.weight-form{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:30px}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--mute);font:11px var(--sans)}
.chart .goal-line{stroke:var(--celadon);stroke-dasharray:4 5;stroke-width:1}
.chart .curve{fill:none;stroke:var(--ink);stroke-width:1.6}
.chart .dot{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.wlist{list-style:none;padding:0;margin:30px 0 0;max-width:620px}
.wlist li{display:grid;grid-template-columns:1fr 90px 80px 32px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}

/* données */
.data-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-bottom:30px}
.data-grid p{min-height:3em}

/* toast */
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:var(--r);font-size:14px;display:flex;gap:18px;align-items:center;transition:.25s;z-index:80;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast .link{color:#BFD3C9}

/* responsive */
@media (max-width:1020px){
  .meals{gap:22px 28px}
  .day{grid-template-columns:150px 1fr}
}
@media (max-width:720px){
  .tabbar{gap:0;padding-left:4px;padding-right:4px}
  .tabbar button{min-width:0;flex:1 1 0;padding:7px 2px 6px;font-size:10.5px}
  .top-in{flex-direction:column;gap:8px;padding:14px 18px 6px}
  main{padding:24px 18px 110px}
  .title-input{font-size:38px}
  .day{grid-template-columns:1fr;gap:14px;padding:24px 0}
  .day-head{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
  .day-name{width:auto;flex:1 1 60%;font-size:26px}
  .day-tools{flex-direction:row;gap:16px;margin:0;width:100%}

 "La vapeur, le poulet — Cuve remplie d'eau. Poser le poulet directement sur l'inox, sans papier, pour que le gras s'égoutte. Mode STEAM, 25 min. Repères : la vapeur monte régulière, la chair blanchit uniformément. Point de contrôle : en coupant le plus épais, la chair est blanche à cœur, humide, le jus clair. À éviter : ouvrir trop tôt.",
 "La vapeur, les carottes — Étaler un papier sulfurisé percé dans un second niveau, y poser les carottes et les cuire en même temps que la fin de cuisson du poulet (10 min avant la fin). Point de contrôle : elles s'écrasent entre deux doigts, fondantes.",
 "L'huile crue — Dans un petit bol, mélanger 1 c. à soupe d'huile d'olive et 2 c. à café d'eau tiède, une pincée de sel : l'émulsion enrobe sans graisser. Texture visée : légère, elle nappe à peine la cuillère.",
 "Dressage tiède — Bol large tiède. Riz au fond, carottes en éventail, poulet tranché en biais (5 mm) en appui. Filet d'huile émulsionnée, persil ciselé (2 mm). À éviter : servir brûlant.",
 "Organisation — Riz cuit la veille (24 h au frigo, réchauffé à la vapeur 3 min). Poulet cuit d'avance, 2 jours en boîte en verre. Huile ajoutée crue au moment de servir."],
 "Le papier sulfurisé sous les légumes et l'inox nu sous la viande : deux gestes qui font toute la différence pour un plat léger."],

"poulet-thym-romarin":[75,2,[
 "Avant de commencer — Ustensiles : le rice cooker Yum Asia Bamboo (cuve et panier inox), papier sulfurisé, économe, planche, deux fourchettes, presse-purée ou fourchette. Sortir la cuisse 20 min avant. Prévoir 250 à 300 ml d'eau tiède dans la cuve.",

 "Le montage — Papier sulfurisé percé dans le panier, pommes de terre et carotte dessus. La cuisse à côté, directement sur l'inox sans papier. Eau dans la cuve.",

 "Retirer la peau — Après 5 min de repos, retirer la peau, la jeter avec le jus de la cuve. Effilocher grossièrement.",

 "Le romarin se dose à la pincée : il parfume sans irriter."],

function norm(s){
  return String(s||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").replace(/[’`]/g,"'")
    .normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
}
function lookup(name){ const n = norm(name); return ING_DB.find(e => n.includes(e.k)) || null; }

function unitKind(u){
  const x = norm(u);
  if (!x) return "p";
  if (x === "g" || x === "gr" || x === "grammes") return "g";
  if (x === "kg") return "kg";
  if (x === "ml") return "g";
  if (x === "cl") return "cl";
  if (x === "l") return "l";
  if (/(c\.? ?a ?c|cafe|cac|cuillere a cafe)/.test(x)) return "c";
  if (/(c\.? ?a ?s|soupe|cas)/.test(x)) return "s";
  if (/(pincee|brins|quelques|au gout)/.test(x)) return "z";
  return "p"; // pièce, tranche, feuille, pot, tasse…
}
function ingKcal(i){
  const q = parseFloat(String(i.q).replace(",", "."));
  if (!q || isNaN(q)) return 0;
  const e = lookup(i.n); if (!e) return 0;
  switch (unitKind(i.u)) {
    case "g":  return e.g != null ? e.g * q / 100 : 0;
    case "kg": return e.g != null ? e.g * q * 10 : 0;
    case "cl": return e.g != null ? e.g * q / 10 : 0;
    case "l":  return e.g != null ? e.g * q * 10 : 0;
    case "c":  return e.c != null ? e.c * q : (e.g != null ? e.g * q * 5 / 100 : 0);
    case "s":  return e.c != null ? e.c * 3 * q : (e.g != null ? e.g * q * 15 / 100 : 0);
    case "p":  return e.p != null ? e.p * q : 0;
    default: return 0;
  }
}
function kcalOf(obj){ if (!obj || !obj.ing) return 0; return Math.round(obj.ing.reduce((s,i) => s + ingKcal(i), 0) / 10) * 10; }
function aisleOf(name){ const e = lookup(name); return e ? e.a : "Divers"; }

  {id:"pates",n:"Pâtes douces",st:"Cocon & purées",s:["pates"],p:["pst","tofu","blanc"],v:["carotte","courgette"],k:1,d:2,
   sa:["oliveperslil","soja","cameline"],x:[],
   mat:"un mixeur plongeant, une assiette creuse tiède",
   core:"La sauce de légume. Mixer le légume cuit à la vapeur avec 3 c. à soupe d'eau de cuisson des pâtes jusqu'à obtenir une sauce lisse, puis enrober les pâtes. Repères : la sauce devient veloutée et brillante. Point de contrôle : elle nappe les pâtes sans nager au fond. À éviter : relever la sauce avec un condiment que le protocole exclut.",
   a:"Assiette creuse tiède. Nid de pâtes, protéine posée dessus, filet de sauce crue.",
   fin:"Herbes fraîches ciselées.",
   orga:"Purée de légume prête la veille ; les pâtes se cuisent au dernier moment.",
   tip:"Les pâtes sans gluten se cuisent volontiers plus longtemps : elles deviennent plus digestes."}
];

function combos(arr, k){
  if (k === 1) return arr.map(x => [x]);
  const out = []; for (let i=0;i<arr.length;i++) for (let j=i+1;j<arr.length;j++) out.push([arr[i],arr[j]]); return out;
}
function formatProteins(f){ return f.p || Object.keys(PROTEINS); }
function countVariations(){
  return FORMATS.reduce((t,f) => t + formatProteins(f).length * f.s.length * combos(f.v,f.k).length * f.sa.length, 0);
}
function scaleQ(q, m){ if (q === "" || q == null || !m || m === 1) return q; const r = Math.round(q * m / 5) * 5; return r || q; }

/* texte d'une étape de cuisson : mode, geste, repères, contrôle, erreur */
function cookStep(c){
  return (c.feu ? cap(c.feu) + ". " : "") + c.cook + (c.rep ? " Repères : " + c.rep + "." : "") +
    (c.ctl ? " Point de contrôle : " + c.ctl + "." : "") + (c.err ? " À éviter : " + c.err + "." : "");
}
const de = s => /^[aeiouhéèêœ]/i.test(s) ? "d'" + s : "de " + s;
function qtyList(ing){
  return ing.map(([n, q, u]) => q === "" || q == null ? n + " (" + u + ")"
    : String(q).replace(".", ",") + " " + u + " " + de(n)).join(", ");
}

function buildGen(g){
  const f = FORMATS.find(x => x.id === g.f), P = PROTEINS[g.p], S = STARCHES[g.s], Sa = SAUCES[g.sa];
  const V = g.v.map(v => VEGS[v]);
  const ing = [];
  const add = (arr, m) => arr.forEach(([n,q,u]) => {
    if (norm(n) === "sel") return;
    const ex = ing.find(i => norm(i.n) === norm(n) && norm(i.u) === norm(u) && q !== "");
    if (ex) ex.q = Math.round((parseFloat(ex.q) + parseFloat(q)) * 100) / 100;
    else ing.push({ n, q: m ? scaleQ(q, m) : q, u });
  });
  add(P.ing, f.pm); add(S.ing); V.forEach(v => add(v.ing)); add(Sa.ing); add(f.x);
  const vegNames = V.map(v => v.n);
  const name = `${f.n} : ${P.n}, ${vegNames.join(" & ")}`;
  const uniq = a => [...new Set(a.filter(Boolean))];
  const mats = uniq([P.mat, S.mat, ...V.map(v => v.mat), Sa.mat, f.mat].flatMap(m => m.split(/, /).map(x => x.trim()))).join(", ");
  const outs = uniq([P.out, S.out]).join(", ");
  const steps = [
    "Avant de commencer — Ustensiles : " + mats + ". " + (outs ? "À sortir du frigo : " + outs + ", pour éviter un choc thermique à la cuisson. " : "") + "Préparer une assiette tiède et un torchon propre à portée de main.",
    "Épluchage et découpe, " + low(P.h) + " — " + cap(P.mp) + ".",
    ...V.map(v => "Épluchage et découpe, " + low(v.h) + " — " + cap(v.cut) + "."),
    S.h + " — " + cookStep(S),
    ...V.map(v => v.h + " — " + cookStep(v)),
    P.h + " — " + cookStep(P),
    "La sauce " + Sa.n + " — Quantités : " + qtyList(Sa.ing) + ". " + Sa.prep + " Texture visée : " + Sa.tex + ". À éviter : " + Sa.err + ".",
    "L'assemblage — " + f.core,
    "Dressage tiède — " + f.a,
    "Finition — " + f.fin,
    "Organisation — À l'avance : " + [S.keep, P.keep, f.orga].join(" ")
  ];
  // les cuissons se font en parallèle dans le Bamboo : on retient la plus longue, plus la préparation
  const t = Math.round((15 + Math.max(S.t, P.t, ...V.map(v => v.t))) / 5) * 5;
  return { name, sub: `${cap(S.n)}, sauce ${Sa.n}`, st: f.st, cat: P.cat, base: S.base, t, d: f.d, ing, steps, tip: f.tip, gen: { ...g } };
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function low(s){ return s.charAt(0).toLowerCase() + s.slice(1); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* filtres : {cats:[...], bases:[...], styles:[...]} (vides = tout) */
function randomGen(filters = {}, tries = 80){
  const cats = filters.cats || [], bases = filters.bases || [], styles = filters.styles || [];
  for (let t = 0; t < tries; t++){
    const fl = FORMATS.filter(f => (!styles.length || styles.includes(f.st)) && f.s.some(s => !bases.length || bases.includes(STARCHES[s].base)));
    if (!fl.length) return null;
    const f = pick(fl);
    const ps = formatProteins(f).filter(p => !cats.length || cats.includes(PROTEINS[p].cat));
    const ss = f.s.filter(s => !bases.length || bases.includes(STARCHES[s].base));
    if (!ps.length || !ss.length) continue;
    const g = { f: f.id, p: pick(ps), s: pick(ss), v: pick(combos(f.v, f.k)), sa: pick(f.sa) };
    const m = buildGen(g);
    if (kcalOf(m) <= 850) return m;
  }
  return null;
}
function swapGen(meal, key, value){
  const g = { ...meal.gen }; const f = FORMATS.find(x => x.id === g.f);
  if (key === "p") g.p = value; if (key === "s") g.s = value; if (key === "sa") g.sa = value;
  if (key === "f") {
    const nf = FORMATS.find(x => x.id === value); g.f = value;
    if (!formatProteins(nf).includes(g.p)) g.p = pick(formatProteins(nf));
    if (!nf.s.includes(g.s)) g.s = pick(nf.s);
    if (!nf.sa.includes(g.sa)) g.sa = pick(nf.sa);
    g.v = pick(combos(nf.v, nf.k));
  }
  if (key === "v") g.v = pick(combos(f.v, f.k).filter(c => c.join() !== g.v.join())) || g.v;
  return buildGen(g);
}

function recipeToState(r){ return { ...clone(r), ing: r.ing.map(i => ({ id: uid(), ...i })), own: !!r.own }; }
function mealFromRecipe(r){
  return { id: uid(), name: r.n, recipeId: r.id, cat: r.cat, st: r.st, base: r.base,
    t: r.t, d: r.d, ing: r.ing.map(i => ({ id: uid(), n: i.n, q: i.q, u: i.u })), steps: [...r.steps], tip: r.tip || "" };
}
function mealFromGen(m){
  return { id: uid(), name: m.name, sub: m.sub, recipeId: null, cat: m.cat, st: m.st, base: m.base,
    t: m.t, d: m.d, ing: m.ing.map(i => ({ id: uid(), n: i.n, q: i.q, u: i.u })), steps: [...m.steps], tip: m.tip || "", gen: m.gen };
}
function copyDayMeals(p){ const o = {}; SLOTS.forEach(s => o[s.k] = p[s.k] ? copyMeal(p[s.k]) : null); return o; }
function copyMeal(m){ const c = clone(m); c.id = uid(); c.ing.forEach(i => i.id = uid()); return c; }
function emptyDay(name){ return { id: uid(), name, meals: { l: null, d: null } }; }
function recipeById(id){ return S.recipes.find(r => r.id === id); }

function buildDefaultPlan(recipes){
  const order = ["Poulet","Œufs","Tofu","Protéines végétales","Purées & vapeur","Okara & douceurs"];
  const buckets = order.map(c => recipes.filter(r => r.cat === c && r.st !== "Douceurs"));
  const seq = [];
  while (buckets.some(b => b.length)) buckets.forEach(b => { if (b.length) seq.push(b.shift()); });
  const weeks = []; let k = 0;
  for (let w = 0; w < 4; w++){
    const days = [];
    for (let d = 0; d < 7; d++){
      const day = emptyDay(DAY_NAMES[d]);
      day.meals.l = mealFromRecipe(seq[k++ % seq.length]);
      day.meals.d = mealFromRecipe(seq[k++ % seq.length]);
      days.push(day);
    }
    weeks.push({ id: uid(), name: "Semaine " + (w + 1), days });
  }
  return weeks;
}
function defaultState(){
  const recipes = DEFAULT_RECIPES.map(recipeToState);
  return { v: 1, font: "editorial", recipes, weeks: buildDefaultPlan(recipes), weights: [], goal: 60, checked: {}, ui: { view: "plan", week: 0 } };
}

/* ---------- persistance ---------- */
function load(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { S = JSON.parse(raw); if (!S || !S.weeks || !S.recipes) throw 0; }
    else S = defaultState();
  } catch (e) { S = defaultState(); }
  S.ui = S.ui || { view: "plan", week: 0 }; S.checked = S.checked || {}; S.weights = S.weights || [];
  if (S.goal == null) S.goal = 73;
  S.v = S.v || 1;
  applyFont();
  save();
}
function save(){
  clearTimeout(saveTimer);
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); STORAGE_OK = true; }
  catch (e) { STORAGE_OK = false; }
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(save, 250); }
window.addEventListener("pagehide", save);

function snapshot(){ UNDO = JSON.stringify(S); }

/* ---------- calculs : déjeuner et dîner uniquement ---------- */
function dayKcal(day){ return SLOTS.reduce((s, sl) => s + (day.meals[sl.k] ? kcalOf(day.meals[sl.k]) : 0), 0); }
function weekAvg(week){ const ds = week.days.filter(d => d.meals.l || d.meals.d); if (!ds.length) return 0; return Math.round(ds.reduce((s, d) => s + dayKcal(d), 0) / ds.length / 10) * 10; }
function curWeek(){ if (!S.weeks.length) return null; S.ui.week = Math.max(0, Math.min(S.ui.week, S.weeks.length - 1)); return S.weeks[S.ui.week]; }

function metaLine(o){ return [o.t ? o.t + " min" : "", o.d ? DIFF[+o.d - 1] : ""].filter(Boolean).join(" · "); }

function openEditor(kind, ref){
  MODAL = kind === "meal" ? { kind, t: ref } : kind === "recipe" ? { kind, id: ref } : { kind, obj: ref };
  const o = edObj(); if (!o) return;
  const isRecipe = kind === "recipe" || kind === "draft";
  const title = isRecipe ? o.n : o.name;
  const where = kind === "meal" ? `${esc(S.weeks[ref.w].name)}, ${esc(S.weeks[ref.w].days[ref.d].name)}, ${slotLabel(ref.s).toLowerCase()}`
    : kind === "draft" ? "Nouvelle recette" : kind === "temp" ? (o.gen ? "Idée proposée, à modifier librement avant de l'ajouter" : "Recette du carnet") : "Carnet de recettes";
  const withCur = (list, v) => v && !list.includes(v) ? [...list, v] : list;
  const sel = (key, list, val) => `<label class="field"><span>${{cat:"Catégorie",st:"Style",base:"Féculent"}[key]}</span>
    <select data-ed="${key}">${withCur(list, val).map(x => `<option ${x === val ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></label>`;
  const recipeFields = isRecipe ? `<div class="fields">
      ${sel("cat", CATS, o.cat)}${sel("st", STYLES, o.st)}${sel("base", [...BASES, "Aucun"], o.base)}
      <label class="field"><span>Temps (min)</span><input data-ed="t" inputmode="numeric" value="${esc(o.t || "")}"></label>
      <label class="field"><span>Difficulté</span><select data-ed="d">${[1,2,3].map(n => `<option value="${n}" ${+o.d === n ? "selected" : ""}>${DIFF[n-1]}</option>`).join("")}</select></label>
    </div>` : "";
  const variation = (kind === "meal" || kind === "temp") && o.gen ? genPanel(o.gen) : "";
  const footer = kind === "meal" ? `
      <button class="btn" data-act="proposeMeal" data-w="${ref.w}" data-d="${ref.d}" data-s="${ref.s}">Autres idées pour ce repas</button>
      <button class="btn" data-act="pickRecipe" data-w="${ref.w}" data-d="${ref.d}" data-s="${ref.s}">Choisir dans le carnet</button>
      <button class="btn" data-act="mealToBook">Enregistrer dans le carnet</button>
      ${o.recipeId && recipeById(o.recipeId) ? `<button class="btn ghost" data-act="resetMeal">Rétablir la recette d'origine</button>` : ""}
      <button class="btn ghost danger" data-act="clearMeal">Retirer ce repas</button>
      <button class="btn primary push" data-act="close">Terminé</button>`
    : kind === "recipe" ? `
      <button class="btn" data-act="recipeToPlan" data-id="${o.id}">Ajouter au planning</button>
      <button class="btn ghost danger" data-act="delRecipe" data-id="${o.id}">Supprimer la recette</button>
      <button class="btn primary push" data-act="close">Terminé</button>`
    : kind === "temp" ? `
      <button class="btn primary" data-act="tempPlace">Ajouter au planning</button>
      <button class="btn" data-act="tempSave">Enregistrer dans le carnet</button>
      <button class="btn ghost push" data-act="close">Fermer</button>`
    : `<button class="btn ghost" data-act="close">Annuler</button><button class="btn primary push" data-act="saveDraft">Enregistrer la recette</button>`;
  openModal(`<div id="edWrap" ${catSt(o.cat)}>
    <p class="eyebrow">${where}</p>
    <textarea class="ed-title" data-ed="name" rows="1" placeholder="${isRecipe ? "Nom de la recette" : "Nom du repas"}" aria-label="Nom">${esc(title)}</textarea>
    ${o.sub ? `<p class="ed-sub">${esc(o.sub)}</p>` : ""}
    <p class="ed-kcal">${catTag(o.cat)} ${metaLine(o) ? `<span>${esc(metaLine(o))}</span><span class="sep"></span>` : ""}Environ <strong id="edKcal">${fmtK(kcalOf(o))}</strong> kcal <span class="muted">(indicatif, recalculé à chaque modification)</span></p>
    ${recipeFields}${variation}
    <section class="ed-sec"><h3>Ingrédients</h3><ol class="ing-list" id="ingList">${ingRows(o)}</ol>
      <button class="btn" data-act="ingAdd">＋ Ajouter un ingrédient</button></section>
    <section class="ed-sec"><div class="sec-head"><h3>Préparation</h3><button class="link" data-act="editSteps" id="stepsBtn">${o.steps && o.steps.length ? "Modifier la préparation" : "Voir la recette"}</button></div>
      <ol class="steps" id="stepsRead" ${o.steps && o.steps.length ? "" : "hidden"}>${stepsHTML(o.steps)}</ol>
      <div id="stepsEditWrap" ${o.steps && o.steps.length ? "hidden" : ""}><p class="muted small">Une étape par ligne. Pour lui donner un titre : « Titre — texte ».</p>
      <textarea data-ed="steps" id="stepsEdit" rows="${Math.max(8, (o.steps || []).length * 2 + 2)}">${esc((o.steps || []).join("\n"))}</textarea></div></section>
    <section class="ed-sec"><h3>Astuce du chef</h3><textarea data-ed="tip" rows="2">${esc(o.tip || "")}</textarea></section>
    <div class="sheet-foot">${footer}</div>
    <datalist id="units">${UNITS.map(u => `<option value="${u}">`).join("")}</datalist></div>`, { focus: kind === "meal" && !o.name ? ".ed-title" : kind === "draft" ? ".ed-title" : null });
}
function fitTitle(){ const t = document.querySelector(".ed-title"); if (t && t.tagName === "TEXTAREA") { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; } }
function ingRows(o){
  if (!o.ing.length) return `<li class="ing-empty muted">Aucun ingrédient pour l'instant.</li>`;
  return o.ing.map((i, k) => `<li class="ing" data-i="${k}">
    <input class="ing-q" data-ing="q" value="${esc(i.q)}" inputmode="decimal" placeholder="Qté" aria-label="Quantité">
    <input class="ing-u" data-ing="u" value="${esc(i.u)}" list="units" placeholder="unité" aria-label="Unité">
    <input class="ing-n" data-ing="n" value="${esc(i.n)}" placeholder="Ingrédient" aria-label="Ingrédient">
    <span class="ing-tools">
      <button class="icon" data-act="ingUp" data-i="${k}" aria-label="Monter" ${k === 0 ? "disabled" : ""}>↑</button>
      <button class="icon" data-act="ingDown" data-i="${k}" aria-label="Descendre" ${k === o.ing.length - 1 ? "disabled" : ""}>↓</button>
      <button class="icon del" data-act="ingDel" data-i="${k}" aria-label="Supprimer">×</button>
    </span></li>`).join("");
}
function refreshIng(focusLast){
  const o = edObj(); $("#ingList").innerHTML = ingRows(o); $("#edKcal").textContent = fmtK(kcalOf(o));
  if (focusLast) { const r = [...document.querySelectorAll("#ingList .ing-n")].pop(); if (r) r.focus(); }
}
function genPanel(g){
  const f = FORMATS.find(x => x.id === g.f);
  const opt = (arr, cur, lab) => arr.map(k => `<option value="${k}" ${k === cur ? "selected" : ""}>${esc(lab(k))}</option>`).join("");
  return `<section class="gen-panel"><h3>Varier ce plat</h3><p class="muted small">Change un élément, le reste de la recette suit.</p>
    <div class="fields">
      <label class="field"><span>Format</span><select data-gen="f">${opt(FORMATS.map(x => x.id), g.f, k => FORMATS.find(x => x.id === k).n)}</select></label>
      <label class="field"><span>Protéine</span><select data-gen="p">${opt(formatProteins(f), g.p, k => cap(PROTEINS[k].n))}</select></label>
      <label class="field"><span>Féculent</span><select data-gen="s">${opt(f.s, g.s, k => cap(STARCHES[k].n))}</select></label>
      <label class="field"><span>Sauce</span><select data-gen="sa">${opt(f.sa, g.sa, k => cap(SAUCES[k].n))}</select></label>
    </div>
    <button class="link" data-act="genVeg">Changer les légumes</button></section>`;
}

/* saisie en direct dans l'éditeur et ailleurs */
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.bind === "weekName") { const w = curWeek(); w.name = el.value; saveSoon(); const t = document.querySelector(`.wtab[data-i="${S.ui.week}"]`); if (t) t.textContent = el.value; return; }
  if (el.dataset.bind === "dayName") { curWeek().days[+el.dataset.d].name = el.value; saveSoon(); return; }
  if (el.dataset.bind === "bookSearch") { BOOK.q = el.value; renderBookList(); return; }
  if (el.dataset.bind === "pickSearch") { PICK.q = el.value; renderPickList(); return; }
  if (!MODAL) return;
  const o = edObj(); if (!o) return;
  if (el.dataset.ing) {
    const k = +el.closest(".ing").dataset.i; o.ing[k][el.dataset.ing] = el.value;
    $("#edKcal").textContent = fmtK(kcalOf(o)); saveSoon(); return;
  }
  const key = el.dataset.ed; if (!key) return;
  if (key === "name") { if (/\n/.test(el.value)) el.value = el.value.replace(/\n/g, " "); o[nameKey()] = el.value; fitTitle(); }
  else if (key === "steps") o.steps = el.value.split("\n").map(s => s.trim()).filter(Boolean);
  else if (key === "t" || key === "d") o[key] = el.value;
  else o[key] = el.value;
  if (MODAL.kind !== "draft") saveSoon();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (MODAL && el.dataset.ed && el.tagName === "SELECT") { const o = edObj(); o[el.dataset.ed] = el.dataset.ed === "d" ? +el.value : el.value; if (MODAL.kind !== "draft") saveSoon();
    if (el.dataset.ed === "cat") { const w = $("#edWrap"); if (w) w.style.setProperty("--cc", catVar(el.value)); } }
  if (MODAL && el.dataset.gen && MODAL.kind === "temp") { TEMP = mealFromGen(swapGen(TEMP, el.dataset.gen, el.value)); openEditor("temp", TEMP); return; }
  if (MODAL && el.dataset.gen) { const m = getMeal(MODAL.t); snapshot(); const nm = mealFromGen(swapGen(m, el.dataset.gen, el.value)); nm.id = m.id; setMeal(MODAL.t, nm); save(); openEditor("meal", MODAL.t); toast("Plat modifié", true); }
  if (el.dataset.bind === "shopWeek") { SHOP.w = +el.value; SHOP.days = null; render(); }
  if (el.dataset.bind === "shopDay") { const ds = shopDays(); SHOP.days = ds.map((v, i) => i === +el.dataset.i ? el.checked : v); render(); }
  if (el.dataset.bind === "shopItem") { const w = S.weeks[SHOP.w]; S.checked[w.id] = S.checked[w.id] || {}; S.checked[w.id][el.dataset.key] = el.checked; save(); el.closest("li").classList.toggle("done", el.checked); }
  if (el.dataset.bind === "goal") { S.goal = parseFloat(el.value.replace(",", ".")) || S.goal; save(); render(); }
  if (el.dataset.bind === "importFile") importFile(el.files[0]);
  if (el.dataset.bind === "bookCat") { BOOK.cat = el.value; renderBookList(); }
  if (el.dataset.bind === "bookSt") { BOOK.st = el.value; renderBookList(); }
  if (el.dataset.bind === "bookBase") { BOOK.base = el.value; renderBookList(); }
});

/* ============ ACTIONS (clics) ============ */
const A = {};
document.addEventListener("click", e => {
  const nav = e.target.closest("[data-nav]");
  if (nav) { S.ui.view = nav.dataset.nav; save(); render(); window.scrollTo(0, 0); return; }
  if (e.target.id === "modal") { closeModal(); return; }
  const a = e.target.closest("[data-act]"); if (!a || a.disabled) return;
  const fn = A[a.dataset.act]; if (fn) { e.preventDefault(); fn(a.dataset, a); }
});
const T = ds => ({ w: ds.w != null ? +ds.w : S.ui.week, d: +ds.d, s: ds.s });

A.undo = () => undo();
A.close = () => closeModal();
A.week = ds => { S.ui.week = +ds.i; save(); render(); };
A.goShop = () => { SHOP.w = S.ui.week; SHOP.days = null; S.ui.view = "shop"; render(); window.scrollTo(0, 0); };

/* repas */
A.openMeal = ds => openEditor("meal", T(ds));
A.createMeal = ds => {
  const t = T(ds), sl = SLOTS.find(s => s.k === t.s);
  MODAL = { kind: "create", t };
  openModal(`<p class="eyebrow">${esc(S.weeks[t.w].name)}, ${esc(S.weeks[t.w].days[t.d].name)}</p>
    <h2 class="display-s">${sl.create}</h2>
    <div class="choice-list">
      <button class="choice" data-act="pickRecipe" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Choisir dans le carnet</strong><span>Une des ${S.recipes.length} recettes déjà écrites.</span></button>
      <button class="choice" data-act="proposeMeal" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Me proposer des idées</strong><span>Six suggestions, renouvelables à volonté.</span></button>
      <button class="choice" data-act="freeMeal" data-w="${t.w}" data-d="${t.d}" data-s="${t.s}"><strong>Créer un repas libre</strong><span>Nom, ingrédients, quantités et préparation à saisir.</span></button>
    </div>`);
};
A.freeMeal = ds => {
  const t = T(ds); snapshot();
  setMeal(t, { id: uid(), name: "", recipeId: null, cat: "", st: "", base: "", ing: [{ id: uid(), n: "", q: "", u: "g" }], steps: [], tip: "" });
  save(); openEditor("meal", t);
};
A.clearMeal = () => { const t = MODAL.t; snapshot(); setMeal(t, null); save(); closeModal(); toast("Repas retiré", true); };
A.resetMeal = () => { const t = MODAL.t, m = getMeal(t), r = recipeById(m.recipeId); snapshot(); const nm = mealFromRecipe(r); nm.id = m.id; setMeal(t, nm); save(); openEditor("meal", t); toast("Recette d'origine rétablie", true); };
A.mealToBook = () => {
  const m = getMeal(MODAL.t);
  const r = { id: "r-" + uid(), n: m.name || "Recette sans nom", cat: CATS.includes(m.cat) ? m.cat : (m.cat || "Tofu"), st: m.st || "Cocon & purées",
    base: m.base || "Aucun", t: m.t || "", d: m.d || 1, ing: m.ing.map(i => ({ id: uid(), n: i.n, q: i.q, u: i.u })), steps: [...m.steps], tip: m.tip || "", own: true };
  S.recipes.unshift(r); m.recipeId = r.id; save(); toast("Ajouté au carnet : " + r.n);
};
A.genVeg = () => { if (MODAL.kind === "temp") { TEMP = mealFromGen(swapGen(TEMP, "v")); openEditor("temp", TEMP); return; } const t = MODAL.t, m = getMeal(t); snapshot(); const nm = mealFromGen(swapGen(m, "v")); nm.id = m.id; setMeal(t, nm); save(); openEditor("meal", t); };

/* ingrédients */
A.ingAdd = () => { const o = edObj(); o.ing.push({ id: uid(), n: "", q: "", u: "g" }); if (MODAL.kind !== "draft") save(); refreshIng(true); };
A.ingDel = ds => { const o = edObj(); o.ing.splice(+ds.i, 1); if (MODAL.kind !== "draft") save(); refreshIng(); };
A.ingUp = ds => { const o = edObj(), i = +ds.i; if (i > 0) { [o.ing[i-1], o.ing[i]] = [o.ing[i], o.ing[i-1]]; if (MODAL.kind !== "draft") save(); refreshIng(); } };
A.ingDown = ds => { const o = edObj(), i = +ds.i; if (i < o.ing.length - 1) { [o.ing[i+1], o.ing[i]] = [o.ing[i], o.ing[i+1]]; if (MODAL.kind !== "draft") save(); refreshIng(); } };

/* jours et semaines */
A.newDay = () => { const w = curWeek(); snapshot(); w.days.push(emptyDay(DAY_NAMES[w.days.length % 7])); save(); render(); toast("Jour ajouté", true);
  const days = document.querySelectorAll(".day"); days[days.length - 1].scrollIntoView({ behavior: "smooth", block: "center" }); };
A.delDay = ds => { const w = curWeek(); snapshot(); w.days.splice(+ds.d, 1); save(); render(); toast("Jour supprimé", true); };
A.delWeek = () => { const w = curWeek(); if (!confirm(`Supprimer « ${w.name} » et ses ${w.days.length} jours ?`)) return; snapshot(); S.weeks.splice(S.ui.week, 1); S.ui.week = Math.max(0, S.ui.week - 1); save(); render(); toast("Semaine supprimée", true); };
A.newWeek = () => {
  MODAL = { kind: "newWeek" };
  openModal(`<h2 class="display-s">Créer une nouvelle semaine</h2><p class="muted">7 jours, chacun avec un déjeuner et un dîner.</p>
    <div class="choice-list">
      <button class="choice" data-act="mkWeek" data-mode="auto"><strong>Semaine proposée</strong><span>Menus variés composés automatiquement, modifiables ensuite.</span></button>
      <button class="choice" data-act="mkWeek" data-mode="blank"><strong>Semaine vierge</strong><span>7 jours vides, à remplir depuis le carnet ou les idées.</span></button>
    </div>`);
};
A.mkWeek = ds => {
  snapshot(); const n = "Semaine " + (S.weeks.length + 1); let w;
  if (ds.mode === "auto") { w = { id: uid(), name: n, days: proposeWeek({}).map((p, i) => ({ id: uid(), name: DAY_NAMES[i], meals: p })) }; }
  else { w = { id: uid(), name: n, days: DAY_NAMES.map(dn => emptyDay(dn)) }; }
  S.weeks.push(w); S.ui.week = S.weeks.length - 1; S.ui.view = "plan"; save(); closeModal(); toast(n + " créée", true);
};
A.proposeDay = ds => { const w = curWeek(), d = w.days[+ds.d]; snapshot(); const p = proposeDay({}, weekUsed(w, +ds.d)); d.meals.l = p.l; d.meals.d = p.d; save(); render(); toast(`${d.name} : nouveaux déjeuner et dîner`, true); };
A.proposeWeek = () => { const w = curWeek(); snapshot(); const ps = proposeWeek({});
  w.days.forEach((d, i) => { const p = ps[i % 7]; d.meals.l = p.l; d.meals.d = p.d; });
  save(); render(); toast("Nouveaux menus pour " + w.name, true); };

/* carnet → planning */
let PICK = { t: null, q: "", cat: "" };
A.pickRecipe = ds => {
  const t = T(ds); PICK = { t, q: "", cat: "" }; MODAL = { kind: "pick", t };
  openModal(`<p class="eyebrow">${esc(S.weeks[t.w].name)}, ${esc(S.weeks[t.w].days[t.d].name)}, ${slotLabel(t.s).toLowerCase()}</p>
    <h2 class="display-s">Choisir dans le carnet</h2>
    <input class="search" data-bind="pickSearch" placeholder="Rechercher une recette ou un ingrédient" aria-label="Rechercher">
    <div class="chips" id="pickChips"></div><ul class="pick-list" id="pickList"></ul>`, { wide: true, focus: ".search" });
  renderPickList();
};
A.pickCat = ds => { PICK.cat = ds.v; renderPickList(); };
function recipeMatches(r, q){ if (!q) return true; const n = norm(q); return norm(r.n).includes(n) || r.ing.some(i => norm(i.n).includes(n)) || norm(r.st).includes(n); }
function renderPickList(){
  const cats = ["", ...CATS];
  $("#pickChips").innerHTML = cats.map(c => `<button class="chip" ${catSt(c)} data-act="pickCat" data-v="${esc(c)}" aria-pressed="${PICK.cat === c}">${c ? '<span class="dot"></span>' : ""}${c || "Toutes"}</button>`).join("");
  const list = S.recipes.filter(r => (!PICK.cat || r.cat === PICK.cat) && recipeMatches(r, PICK.q));
  $("#pickList").innerHTML = list.length ? list.map(r => `<li ${catSt(r.cat)}><button class="pick" data-act="choose" data-id="${r.id}">
    <span class="dish-name">${esc(r.n)}</span><span class="dish-meta">${catTag(r.cat)}<span>${esc(r.st)}, ≈ ${fmtK(kcalOf(r))} kcal</span></span></button></li>`).join("")
    : `<li class="muted">Aucune recette ne correspond. Essaie un autre mot ou une autre catégorie.</li>`;
}
A.choose = ds => { const t = PICK.t, r = recipeById(ds.id); snapshot(); setMeal(t, mealFromRecipe(r)); save(); closeModal(); toast(`${slotLabel(t.s)} : ${r.n}`, true); };

/* propositions pour un repas */
let PROP = { t: null, items: [], cats: [], bases: [], src: "mix" };
A.proposeMeal = ds => { const t = T(ds); PROP = { t, items: [], cats: [], bases: [], src: "mix" }; MODAL = { kind: "prop", t }; PROP.items = proposeMeals(6, PROP); renderPropModal(); };
function renderPropModal(){
  const t = PROP.t;
  openModal(`<p class="eyebrow">${esc(S.weeks[t.w].name)}, ${esc(S.weeks[t.w].days[t.d].name)}, ${slotLabel(t.s).toLowerCase()}</p>
    <h2 class="display-s">Idées pour ce ${slotLabel(t.s).toLowerCase()}</h2>
    ${filterBar("prop")}
    <div class="prop-grid">${PROP.items.map((m, i) => propCard(m, i, `<button class="btn primary" data-act="propChoose" data-i="${i}">Choisir</button>`)).join("")}</div>
    <div class="sheet-foot"><button class="btn" data-act="propMore">Autres propositions</button><button class="btn ghost push" data-act="close">Fermer</button></div>`, { wide: true });
}
A.propMore = () => { PROP.items = proposeMeals(6, PROP); renderPropModal(); };
A.propChoose = ds => { const t = PROP.t, m = PROP.items[+ds.i]; snapshot(); setMeal(t, copyMeal(m)); save(); closeModal(); toast(`${slotLabel(t.s)} : ${m.name}`, true); };
function propCard(m, i, actions){
  const ings = m.ing.filter(x => x.q !== "").slice(0, 5).map(x => x.n).join(", ");
  return `<article class="prop" ${catSt(m.cat)}><p class="prop-tag">${catTag(m.cat)}<span>${m.gen ? "Variation" : "Carnet"}, ${esc(m.st || "")}</span></p>
    <h4 class="dish-name">${esc(m.name)}</h4>${m.sub ? `<p class="dish-sub">${esc(m.sub)}</p>` : ""}
    <p class="muted small">${esc(ings)}…</p><p class="dish-meta">≈ ${fmtK(kcalOf(m))} kcal</p>
    <div class="prop-actions">${actions}</div></article>`;
}
function filterBar(ns){
  const st = ns === "prop" ? PROP : INSP;
  const chip = (group, v) => `<button class="chip" ${group === "cats" ? catSt(v) : ""} data-act="flt" data-ns="${ns}" data-g="${group}" data-v="${esc(v)}" aria-pressed="${st[group].includes(v)}">${group === "cats" ? '<span class="dot"></span>' : ""}${esc(v)}</button>`;
  return `<div class="filters">
    <div class="frow"><span class="flabel">Protéine</span><div class="chips">${CATS.map(c => chip("cats", c)).join("")}</div></div>
    <div class="frow"><span class="flabel">Féculent</span><div class="chips">${BASES.map(c => chip("bases", c)).join("")}</div></div>
    ${ns === "insp" ? `<div class="frow"><span class="flabel">Style</span><div class="chips">${STYLES.map(c => chip("styles", c)).join("")}</div></div>` : ""}
    <div class="frow"><span class="flabel">Source</span><div class="chips">
      ${[["mix","Carnet et variations"],["book","Carnet seulement"],["gen","Variations seulement"]].map(([v, l]) => `<button class="chip" data-act="src" data-ns="${ns}" data-v="${v}" aria-pressed="${st.src === v}">${l}</button>`).join("")}
    </div></div></div>`;

/* ---------- moteur de propositions (déjeuner et dîner) ---------- */
function catalogFor(f){
  return S.recipes.filter(r => CATS.includes(r.cat) && r.st !== "Douceurs" &&
    (!f.cats || !f.cats.length || f.cats.includes(r.cat)) && (!f.bases || !f.bases.length || f.bases.includes(r.base)) && (!f.styles || !f.styles.length || f.styles.includes(r.st)));
}
function oneProposal(f, avoid){
  avoid = avoid || new Set();
  const src = f.src || "mix";
  for (let t = 0; t < 40; t++){
    const useBook = src === "book" || (src === "mix" && Math.random() < 0.4);
    let m = null;
    if (useBook) { const list = catalogFor(f).filter(r => !avoid.has(r.n)); if (list.length) m = mealFromRecipe(pick(list)); else if (src === "book") return null; }
    if (!m) { const g = randomGen({ cats: f.cats, bases: f.bases, styles: f.styles }); if (g) m = mealFromGen(g); }
    if (m && !avoid.has(m.name)) return m;
  }
  return null;
}
function proposeMeals(n, f){
  const out = [], seen = new Set();
  for (let i = 0; i < n * 3 && out.length < n; i++){ const m = oneProposal(f, seen); if (m && !seen.has(m.name)) { seen.add(m.name); out.push(m); } }
  return out;
}
function weekUsed(w, skip){ const s = new Set(); w.days.forEach((d, i) => { if (i !== skip) ["l","d"].forEach(k => d.meals[k] && s.add(d.meals[k].name)); }); return s; }
function proposeDay(f, avoid){
  avoid = new Set(avoid || []);
  const l = oneProposal(f, avoid) || oneProposal({ src: "gen" }, avoid); avoid.add(l.name);
  let d = null;
  for (let t = 0; t < 25; t++){ d = oneProposal(f, avoid); if (d && (d.cat !== l.cat || (f.cats && f.cats.length === 1))) break; }
  if (!d) d = oneProposal({ src: "gen" }, avoid);
  return { l, d };
}
function proposeWeek(f){
  const days = [], avoid = new Set(), count = {};
  const limit = f.cats && f.cats.length ? 99 : 4;
  for (let i = 0; i < 7; i++){
    let best = null;
    for (let t = 0; t < 30; t++){
      const p = proposeDay(f, avoid);
      const ok = [p.l, p.d].every(m => (count[m.cat] || 0) < limit);
      best = p; if (ok) break;
    }
    [best.l, best.d].forEach(m => { avoid.add(m.name); count[m.cat] = (count[m.cat] || 0) + 1; });
    days.push(best);
  }
  return days;
}

function shopDays(){ const w = S.weeks[SHOP.w]; if (!SHOP.days || SHOP.days.length !== w.days.length) SHOP.days = w.days.map(() => true); return SHOP.days; }
function buildShop(){
  const w = S.weeks[SHOP.w], sel = shopDays(), map = new Map();
  w.days.forEach((d, i) => { if (!sel[i]) return; SLOTS.forEach(sl => { const m = d.meals[sl.k]; if (!m) return;
    m.ing.forEach(it => { if (!String(it.n).trim()) return; const e = lookup(it.n);
      const mergeByKey = e && ["Légumes","Volaille","Œufs","Féculents","Tofu & protéines végétales"].includes(e.a);
      const key = mergeByKey ? "k:" + e.k : "n:" + norm(it.n);
      if (!map.has(key)) map.set(key, { key, name: it.n, aisle: e ? e.a : "Divers", parts: {}, names: {} });
      const g = map.get(key); g.names[it.n] = (g.names[it.n] || 0) + 1;
      const q = parseFloat(String(it.q).replace(",", ".")); const uk = unitKind(it.u);
      if (!q || isNaN(q) || uk === "z") { g.parts.z = g.parts.z || { q: 0, u: it.u || "au goût" }; return; }
      const pk = uk === "p" ? "p:" + norm(it.u) : uk;
      g.parts[pk] = g.parts[pk] || { q: 0, u: uk === "c" ? "c. à café" : uk === "s" ? "c. à soupe" : uk === "g" ? (norm(it.u) === "ml" ? "ml" : "g") : it.u };
      g.parts[pk].q += q; }); }); });
  const items = [...map.values()].map(g => { g.name = Object.entries(g.names).sort((a, b) => b[1] - a[1])[0][0];
    const parts = Object.entries(g.parts).filter(([k]) => k !== "z").map(([, p]) => { const q = Math.round(p.q * 10) / 10;
      if (norm(p.u) === "piece" || norm(p.u) === "pieces") return "× " + fmtN(q);
      const pl = q > 1 && ["tranche","feuille","pot","tasse","pincee"].includes(norm(p.u)) ? "s" : ""; return fmtN(q) + " " + p.u + pl; });
    g.qty = parts.length ? parts.join(" + ") : "selon le goût"; return g; });
  return items;
}

      <div class="stat"><span class="stat-v"><input class="goal" data-bind="goal" value="${fmtN(S.goal)}" inputmode="decimal" aria-label="Objectif en kg"> kg</span><span class="stat-l">Objectif</span></div></div>
    <form class="weight-form" onsubmit="return false"><label class="field"><span>Date</span><input type="date" id="wDate" value="${today}"></label>
      <label class="field"><span>Poids (kg)</span><input id="wKg" inputmode="decimal" placeholder="78,0"></label><button class="btn primary" data-act="addWeight">Enregistrer la pesée</button></form>
    <div class="chart">${chartSvg(ws)}</div>
    ${ws.length ? `<ul class="wlist">${[...ws].reverse().map((x, i, arr) => { const prev = arr[i + 1]; const d = prev ? x.kg - prev.kg : null;
      return `<li><span>${new Date(x.date + "T12:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "long", year: "numeric" })}</span><strong>${fmtN(x.kg)} kg</strong>
      <span class="muted">${d == null ? "" : (d > 0 ? "+" : "") + fmtN(d) + " kg"}</span><button class="icon del" data-act="delWeight" data-date="${x.date}" aria-label="Supprimer">×</button></li>`; }).join("")}</ul>` : ""}`;
}
function chartSvg(ws){
  if (ws.length < 2) return `<p class="muted center">La courbe apparaîtra à partir de deux pesées.</p>`;
  const W = 640, Hh = 220, p = 36, vals = ws.map(x => x.kg).concat([S.goal]);
  const min = Math.floor(Math.min(...vals) - 0.5), max = Math.ceil(Math.max(...vals) + 0.5);
  const t0 = new Date(ws[0].date).getTime(), t1 = new Date(ws[ws.length - 1].date).getTime() || t0 + 1;
  const X = d => p + (W - 2 * p) * ((new Date(d).getTime() - t0) / Math.max(1, t1 - t0));
  const Y = v => Hh - p + -(Hh - 2 * p) * (v - min) / Math.max(0.1, max - min);
  const pts = ws.map(x => `${X(x.date).toFixed(1)},${Y(x.kg).toFixed(1)}`).join(" ");
  const ticks = []; for (let v = min; v <= max; v++) ticks.push(v);
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Courbe de poids">
    ${ticks.map(v => `<line x1="${p}" x2="${W - p}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${p - 8}" y="${Y(v) + 4}" class="axis" text-anchor="end">${v}</text>`).join("")}
    <line x1="${p}" x2="${W - p}" y1="${Y(S.goal)}" y2="${Y(S.goal)}" class="goal-line"/><text x="${W - p}" y="${Y(S.goal) - 6}" class="axis" text-anchor="end">objectif ${fmtN(S.goal)} kg</text>
    <polyline points="${pts}" class="curve"/>${ws.map(x => `<circle cx="${X(x.date)}" cy="${Y(x.kg)}" r="3.5" class="dot"/>`).join("")}</svg>`;
}
A.addWeight = () => { const d = $("#wDate").value, kg = parseFloat($("#wKg").value.replace(",", "."));
  if (!d || !kg || kg < 30 || kg > 250) return toast("Indique une date et un poids valides (ex. 77,4).");
  S.weights = S.weights.filter(x => x.date !== d); S.weights.push({ date: d, kg }); save(); render(); toast("Pesée enregistrée"); };
A.delWeight = ds => { snapshot(); S.weights = S.weights.filter(x => x.date !== ds.date); save(); render(); toast("Pesée supprimée", true); };

/* ---------- DONNÉES ---------- */
const FONTS = [
  { k: "editorial", n: "Éditoriale", d: "Cormorant Garamond & Jost", serif: "'Cormorant Garamond',serif", sans: "Jost,sans-serif", w: 500 },
  { k: "modern", n: "Contemporaine", d: "Jost, lignes pures", serif: "Jost,sans-serif", sans: "Jost,sans-serif", w: 300 },
  { k: "classic", n: "Classique", d: "Playfair Display & Karla", serif: "'Playfair Display',serif", sans: "Karla,sans-serif", w: 400 }
];
function applyFont(){ document.documentElement.dataset.font = S.font || "editorial"; }
A.setFont = ds => { S.font = ds.k; applyFont(); save(); render(); };
function viewData(){
  return `<header class="pagehead"><div><h1 class="display">Réglages</h1><p class="muted">Typographie de l'application et sauvegarde de tes données.</p></div></header>
    <h2 class="group-title">Typographie</h2>
    <div class="font-list">${FONTS.map(f => `<button class="font-opt" data-act="setFont" data-k="${f.k}" aria-pressed="${(S.font || "editorial") === f.k}">
      <span class="fo-n">${f.n}</span><span class="fo-t" style="font-family:${f.serif};font-weight:${f.w}">Poulet effiloché Bamboo</span>
      <span class="fo-s" style="font-family:${f.sans}">${f.d}</span></button>`).join("")}</div>
    <h2 class="group-title">Sauvegarde</h2>
    <p class="muted">Tout est enregistré automatiquement dans ce navigateur. Exporte régulièrement un fichier de sauvegarde pour ne rien perdre, ou pour retrouver tes données sur un autre appareil.</p>
    <div class="data-grid">
      <section><h2 class="group-title">Exporter</h2><p class="muted">${S.weeks.length} semaines, ${S.recipes.length} recettes, ${S.weights.length} pesées.</p><button class="btn primary" data-act="export">Télécharger la sauvegarde</button></section>
      <section><h2 class="group-title">Importer</h2><p class="muted">Remplace les données actuelles par celles d'un fichier exporté.</p><label class="btn file">Choisir un fichier<input type="file" accept="application/json,.json" data-bind="importFile" hidden></label></section>
      <section><h2 class="group-title">Repartir de zéro</h2><p class="muted">Recharge le mois de départ et le carnet d'origine. Tes données actuelles seront effacées.</p><button class="btn ghost danger" data-act="reset">Réinitialiser</button></section>
    </div>
    <p class="muted small">État du stockage : ${STORAGE_OK ? "actif, les modifications sont conservées après rechargement." : "indisponible dans ce contexte, pense à exporter."}</p>`;
}
A.export = () => { const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }); const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "la-table-sauvegarde-" + new Date().toISOString().slice(0, 10) + ".json"; document.body.appendChild(a); a.click(); a.remove(); toast("Sauvegarde téléchargée"); };
function importFile(f){ if (!f) return; const rd = new FileReader(); rd.onload = () => { try { const d = JSON.parse(rd.result); if (!d.weeks || !d.recipes) throw 0;
  snapshot(); S = d; S.ui = S.ui || { view: "plan", week: 0 }; S.checked = S.checked || {}; S.weights = S.weights || []; S.v = S.v || 1; applyFont(); save(); render(); toast("Données importées", true); }
  catch (e) { toast("Ce fichier n'est pas une sauvegarde valide de La Table."); } }; rd.readAsText(f); }
A.reset = () => { if (!confirm("Effacer toutes tes données et recharger le mois de départ ?")) return; snapshot(); const f = S.font; S = defaultState(); S.font = f; S.ui.view = "data"; save(); render(); toast("Données réinitialisées", true); };

/* ---------- démarrage ---------- */
load(); render();

</script>
</body>
</html>
